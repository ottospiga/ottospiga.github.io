{id:"T11-1", sp:1, src:"T11", n:1,
 enun:`Mulher de 23 anos, sexualmente ativa, com um parceiro fixo, procura atendimento por disúria leve, aumento de secreção vaginal e dor pélvica em cólica há 5 dias. Refere presença de secreção clara, sem odor forte. Nega febre. Relata sangramento intermenstrual ocasional nos últimos dois meses. Ao exame físico: colo uterino hiperemiado e friável ao toque, corrimento mucopurulento discreto, sem dor lombar ou febre. Exames laboratoriais: Parcial de urina – leucócitos 23000, nitrito negativo, flora discreta, células epiteliais 6000. Cultura de urina – ausência de crescimento bacteriano. Bacterioscopia de secreção vaginal – negativo. Considerando o caso e as características das bactérias, assinale a alternativa que apresenta o diagnóstico mais provável (levando em conta que não houve erro em nenhuma etapa dos exames):`,
 alts:["<i>Escherichia coli</i>","<i>Staphylococcus aureus</i>","<i>Chlamydia trachomatis</i>","<i>Enterococcus faecalis</i>"], gab:2,
 com:`Inflamação (piúria, cervicite) <b>sem crescimento na cultura e sem bactéria no Gram</b> = <b>atípica</b>. Chlamydia é intracelular obrigatória: não cora no Gram e não cresce na cultura padrão. E. coli, S. aureus e Enterococcus crescem na cultura padrão e apareceriam na bacterioscopia.`,
 pega:`“Não houve erro em nenhuma etapa” = não é falso-negativo; a cultura negativa é a pista.`},
{id:"T11-2", sp:2, src:"T11", n:2,
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Homem de 42 anos, diabético, apresenta celulite em perna direita com dor, edema e eritema. Há área central com pequena coleção purulenta. Bacterioscopia de amostra da lesão: presença de cocos gram positivos agrupados em cachos. A cultura apresenta crescimento, mas a identificação da bactéria está em andamento.<br><b>Paciente 2:</b> Mulher de 87 anos, apresenta febre alta, infecção urinária de repetição associada ao uso de fraldas. Bacterioscopia com presença de bacilos gram negativos. A cultura apresenta crescimento, mas a identificação da bactéria está em andamento. Considerando os dados e a epidemiologia de acordo com os sítios anatômicos, qual alternativa apresenta a combinação de agentes etiológicos MAIS prováveis para os casos?`,
 alts:["<i>Staphylococcus aureus</i> e <i>Escherichia coli</i>","<i>Streptococcus pyogenes</i> e <i>Escherichia coli</i>","<i>Staphylococcus epidermidis</i> e <i>Pseudomonas aeruginosa</i>","<i>Enterococcus faecalis</i> e <i>Klebsiella pneumoniae</i>"], gab:0,
 com:`Pele + cocos G+ <b>em cachos</b> = <b>Staphylococcus</b>, e na pele predomina o <b>S. aureus</b>. Urina + bacilo G− = enterobactéria, principal <b>E. coli</b>.`,
 pega:`Streptococcus forma <b>cadeia</b>, não cacho — foi a alternativa marcada (errada) pela veterana. S. epidermidis é coagulase-negativo (contaminante de pele); Enterococcus é coco G+, não bate com o paciente 1.`},
{id:"T11-3", sp:3, src:"T11", n:3,
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Mulher de 61 anos, diabética, apresenta febre, dor lombar e disúria intensa. Urocultura – Microrganismo: <i>Klebsiella pneumoniae</i>, Crescimento: &gt;100.000 UFC/mL, com mecanismo de resistência ESBL presente.<br><b>Paciente 2:</b> Homem de 70 anos, entubado há 10 dias, apresenta piora respiratória e secreção purulenta. Cultura de aspirado traqueal com crescimento de <i>Pseudomonas aeruginosa</i> com sensibilidade a todos os antibióticos testados. Considerando o tema, os dados e resultados, qual combinação de antibióticos abaixo <u>teria ação contra as bactérias</u> no caso do paciente 1 e paciente 2?`,
 alts:["Paciente 1: Ceftriaxona; Paciente 2: Imipenem","Paciente 1: Meropenem; Paciente 2: Ceftazidima","Paciente 1: Vancomicina; Paciente 2: Cefepime","Paciente 1: Piperacilina/tazobactam; Paciente 2: Amoxicilina/clavulanato"], gab:1,
 com:`<b>ESBL</b> derruba até 4ª geração + monobactâmico → sobra <b>carbapenêmico</b> (meropenem). <b>Pseudomonas sensível</b> → ceftazidima (3ª com ação antipseudomonas) serve.`,
 pega:`A: ceftriaxona (3ª) cai na ESBL. C: vancomicina não age em G−. D: amoxi-clav nunca age em Pseudomonas (intrínseca); pipe-tazo na ESBL “depende do antibiograma”.`},
{id:"T11-4", sp:4, src:"T11", n:4,
 enun:`Homem, 68 anos, hipertenso e diabético, internado há 3 dias por pneumonia. Nas últimas 12 horas evoluiu com piora respiratória, necessidade de O₂ suplementar, confusão mental e oligúria. Encontra-se taquicárdico (FC 118 bpm), PA 86×54 mmHg.<br>Exames laboratoriais:<br>Hemograma: Leucócitos 25.800/mm³, Bastonetes 8% (2.064/mm³), Segmentados 71% (18.318/mm³), Plaquetas 92.000/mm³<br>Gasometria arterial: pH 7,19; pCO₂ 32,6 mmHg; HCO₃⁻ 17,2 mmol/L<br>Creatinina: 2,60 mg/dL; Bilirrubina total 1,25 mg/dL; Bilirrubina direta 0,35 mg/dL; bilirrubina indireta 0,90 mg/dL; TAP 17,1s; Fibrinogênio 98 mg/dL; D-dímero 618 ng/mL; Lactato 5,7 mmol/L; Glicemia 156 mg/dL; Ureia sérica 6,0 mg/dL.<br>Com base no quadro clínico e laboratorial, assinale a alternativa correta:`,
 alts:["O paciente apresenta uma acidose respiratória parcialmente compensada.","O paciente apresenta hiperglicemia resultante do efeito do cortisol e da insulina.","O paciente apresenta evidências de coagulação intravascular disseminada e evidências de disfunção hepática.","O paciente apresenta leucocitose neutrofílica, injúria renal e pontua 4 pontos no SOFA considerando apenas os exames laboratoriais."], gab:2,
 com:`<b>CIVD</b>: plaquetas ↓, TAP alargado, <b>fibrinogênio 98 ↓</b>, <b>D-dímero ↑</b>. <b>Disfunção hepática</b>: BT 1,25 (≥1,2 já pontua no SOFA).`,
 pega:`A: pH ↓ + HCO₃ ↓ (elevador) = <b>metabólica</b> parcialmente compensada. B: é cortisol e <b>glucagon</b>, não insulina. D: SOFA lab = plaquetas 92 mil (<b>2</b>) + creatinina 2,6 (<b>2</b>) + BT 1,25 (<b>1</b>) = <b>5</b>, não 4.`},
{id:"T11-5", sp:3, src:"T11", n:5,
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Mulher, 54 anos, com abscesso cutâneo drenado. Cultura da secreção com crescimento de <i>Staphylococcus aureus</i>. Antibiograma: Oxacilina – R, Cefoxitina – R, Clindamicina – S, Eritromicina – R.<br><b>Paciente 2:</b> Paciente de 60 anos, em UTI, evolui com choque séptico. Hemocultura com crescimento de <i>Klebsiella pneumoniae</i>. Antibiograma: Amicacina – S, Gentamicina – S, Cefepime – R, Ceftriaxona – R, Ceftazidima – R, Aztreonam – R, Imipenem – R, Meropenem – R, Piperacilina/tazobactam – R.<br>Assinale a alternativa que indica corretamente a resistência, o mecanismo por trás da resistência e o tipo de resistência envolvida nos casos dos pacientes 1 e 2:`,
 alts:["Paciente 1: MRSA adquirido, com produção de beta-lactamases induzida por gene <i>msrA</i>. Paciente 2: Carbapenemase intrínseca com produção de enzimas beta lactamases.","Paciente 1: MRSA adquirido, com alteração de PBPs induzida por gene <i>mecA</i>. Paciente 2: Carbapenemase adquirida com produção de enzimas beta lactamases.","Paciente 1: MLS intrínseco, com modificação do ribossomo induzida por gene <i>erm</i>. Paciente 2: Carbapenemase intrínseca com produção de enzimas beta lactamases.","Paciente 1: MLS adquirido, com modificação de PBPs induzida por gene <i>erm</i>. Paciente 2: Carbapenemase adquirida com produção de enzimas beta lactamases."], gab:1,
 com:`Oxacilina R (+ cefoxitina R) = <b>MRSA</b>: gene <b>mecA</b> → <b>PBP alterada</b>, adquirido. Klebsiella R a todos os β-lactâmicos incluindo carbapenêmicos, S a aminoglicosídeos = <b>carbapenemase adquirida</b> (β-lactamase).`,
 pega:`O paciente 1 também tem MLS por efluxo (Eri R / Cli S = <i>msrA</i>), mas as alternativas com MLS erram: <i>erm</i> = ribossomo (e daria Cli R), e MLS nunca é “PBP”. msrA é efluxo, não β-lactamase. Carbapenemase é sempre <b>adquirida</b>.`},
{id:"T11-6", sp:1, src:"T11", n:6,
 enun:`Homem de 34 anos, previamente hígido, é atendido após sofrer um corte profundo no pé com um arame enferrujado há 10 dias. Nas últimas 48 horas, evoluiu com trismo (contração involuntária dos músculos da mandíbula), rigidez muscular generalizada, espasmos dolorosos desencadeados por estímulos mínimos e arqueamento do dorso (opistótono). Mantém nível de consciência preservado. Hemograma: Leucócitos 9.800/mm³, Plaquetas 210.000/mm³. A bacterioscopia mostrou presença de bacilos gram positivos, mas a cultura ainda está em andamento. Considerando o tema, quadro clínico e resultados dos exames laboratoriais, assinale a alternativa que contém o provável agente etiológico causador da infecção e o tipo de toxina associada às manifestações do paciente:`,
 alts:["<i>Clostridium botulinum</i>, neurotoxina.","<i>Enterococcus</i> sp, Lecitinase.","<i>Clostridium perfringens</i>, lipopolissacarídeo (LPS).","<i>Clostridium tetani</i>, neurotoxina."], gab:3,
 com:`Ferida suja + trismo + opistótono + espasmos = <b>tétano</b>: <i>C. tetani</i> (bacilo G+ anaeróbio), <b>neurotoxina que causa contração</b>.`,
 pega:`Botulínica também é neurotoxina, mas causa <b>paralisia</b> flácida. LPS é de <b>G−</b> (Clostridium é G+). Enterococcus é coco.`},
{id:"T11-7", sp:1, src:"T11", n:7,
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Homem de 59 anos, diabético, chega ao PS com febre alta, calafrios, dor lombar intensa e confusão mental. Evolui rapidamente com hipotensão, taquicardia e extremidades frias. Exames laboratoriais: Hemograma: Leucócitos – 24.600/mm³, Bastonetes – 10%, Plaquetas – 102.000/mm³; Lactato – 5,2 mmol/L; Creatinina: 2,1 mg/dL; Bilirrubina total: 1,4 mg/dL; Hemocultura (resultado parcial): Bacilos Gram-negativos.<br><b>Paciente 2:</b> Lactente de 2 meses é levado ao pronto atendimento com febre alta, irritabilidade e lesões eritematosas difusas que evoluíram rapidamente para descamação da epiderme, principalmente em tronco e face. A mãe relata que, ao tocar a pele, “parece que ela solta”. Hemograma: Leucócitos – 18.200/mm³, Bastonetes – 6%, Plaquetas – 312.000/mm³; Cultura com crescimento e bacterioscopia com presença de cocos gram positivos em cachos.<br>Qual componente bacteriano é o principal responsável pela resposta inflamatória sistêmica e instabilidade hemodinâmica observadas no paciente 1? Qual a toxina responsável pelo quadro do paciente 2? Assinale a alternativa que contém a resposta correta para o paciente 1 e para o paciente 2:`,
 alts:["Paciente 1: Lipopolissacarídeo (LPS); Paciente 2: Esfoliativa.","Paciente 1: Coagulase; Paciente 2: Enterotoxina.","Paciente 1: Hemolisina; Paciente 2: Lecitinase.","Paciente 1: Coagulase; Paciente 2: Esfoliativa."], gab:0,
 com:`Paciente 1: choque por <b>bacilo G−</b> → <b>endotoxina = LPS</b> da parede (resposta inflamatória exacerbada). Paciente 2: S. aureus (cocos G+ em cachos) + pele que solta = <b>toxina esfoliativa</b> (síndrome da pele escaldada).`,
 pega:`A veterana marcou D: coagulase é do <b>S. aureus</b> (capa de fibrina) e não explica choque por <b>G−</b>. Bônus da questão: SOFA lab do paciente 1 = plaquetas 102 mil (1) + Cr 2,1 (2) + BT 1,4 (1) = 4.`},
{id:"T11-8", sp:5, src:"T11", n:8,
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> 72 anos, com infecção urinária causada por <i>Escherichia coli</i>. Implantado catéter venoso central para antibioticoterapia, apresenta febre persistente. São coletadas hemoculturas simultâneas: Hemocultura periférica positiva às 15:02, isolando <i>Escherichia coli</i>; Hemocultura do catéter positiva às 16:36 do mesmo dia, isolando o mesmo microrganismo.<br><b>Paciente 2:</b> Homem, 56 anos, tabagista, chega com febre, tosse produtiva e dispneia progressiva. Evolui com hipotensão e rebaixamento do nível de consciência e é entubado na admissão. Exames laboratoriais (após estabilização inicial e internação): Gasometria arterial: pH – 7,22, pCO₂ – 18,9 mmHg, HCO₃⁻: 7,1 mmol/L; Hemograma: Leucócitos – 18.900/mm³, Bastonetes – 6%, Plaquetas – 156.000/mm³; Creatinina – 1,26 mg/dL; Bilirrubina total – 1,30 mg/dL; Lactato – 2,9 mmol/L.`,
 alts:["Paciente 1: Infecção da corrente sanguínea relacionadas ao cateter, que têm como fonte de infecção o cateter vascular; Paciente 2: Apresenta acidose metabólica parcialmente compensada com elevação de lactato por metabolismo anaeróbio.","Paciente 1: Infecção primária da corrente sanguínea, sem foco infeccioso primário identificável; Paciente 2: Apresenta acidose respiratória parcialmente compensada com elevação de lactato por hipóxia.","Paciente 1: Infecção primária da corrente sanguínea sem relação com infecção urinária; Paciente 2: Apresenta acidose respiratória parcialmente compensada com elevação de lactato por hipóxia.","Paciente 1: Infecção secundárias da corrente sanguínea, que apresenta foco infeccioso primário urinário; Paciente 2: Apresenta acidose metabólica parcialmente compensada com elevação de lactato por metabolismo anaeróbio."], gab:3,
 com:`Paciente 1: a <b>periférica positivou antes</b> (15:02 × 16:36) → <b>não é o cateter</b>; há foco urinário → <b>ICS secundária</b>. Paciente 2: pH ↓ + HCO₃ ↓↓ (elevador) com pCO₂ ↓ (compensando) = <b>acidose metabólica parcialmente compensada</b>, lactato ↑ por metabolismo anaeróbio.`,
 pega:`Para ser “relacionada ao cateter”, o cateter teria que positivar <b>> 2 h antes</b> da periférica. pCO₂ baixo aqui é <b>compensação</b>, não o distúrbio (não é respiratória).`},

/* ======================= SP1 — novas ======================= */
{id:"N1-1", sp:1, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Mulher de 50 anos com placa eritematosa, quente e bem delimitada em face, febre e calafrios. Bacterioscopia de material da lesão: <b>cocos gram positivos em cadeia</b>.<br><b>Paciente 2:</b> Mulher de 24 anos, previamente hígida, com disúria, polaciúria e urgência há 2 dias, sem febre. Bacterioscopia da urina: <b>bacilos gram negativos</b>; urocultura &gt;100.000 UFC/mL, identificação em andamento.<br>Considerando a morfologia e a epidemiologia, assinale os agentes mais prováveis para os pacientes 1 e 2, respectivamente:`,
 alts:["<i>Staphylococcus aureus</i> e <i>Escherichia coli</i>","<i>Streptococcus pyogenes</i> e <i>Escherichia coli</i>","<i>Streptococcus pyogenes</i> e <i>Enterococcus faecalis</i>","<i>Staphylococcus aureus</i> e <i>Pseudomonas aeruginosa</i>"], gab:1,
 com:`Cocos G+ em <b>cadeia</b> = Streptococcus (erisipela clássica: S. pyogenes). Cistite comunitária + BGN = <b>E. coli</b>.`,
 pega:`Espelho da Q2 da T11, invertido: agora é cadeia. Enterococcus é coco G+, não bacilo G−.`},
{id:"N1-2", sp:1, src:"nova",
 enun:`Homem de 45 anos com tosse há 5 semanas, emagrecimento e sudorese noturna. A bacterioscopia pelo Gram do escarro não evidenciou bactérias e a cultura padrão foi negativa em 48 horas. Assinale a alternativa correta sobre o agente mais provável:`,
 alts:["É uma bactéria atípica sem parede celular, por isso não cora pelo Gram.","É um bacilo álcool-ácido resistente, cuja parede rica em lipídios exige coloração de Ziehl-Neelsen e cultura específica e demorada.","É um anaeróbio obrigatório, por isso não cresce na cultura padrão, devendo ser pesquisado em ágar sangue.","É uma bactéria intracelular obrigatória, como as riquétsias, e por isso não cresce em nenhum meio."], gab:1,
 com:`Quadro de tuberculose: <b>Mycobacterium</b>, álcool-ácido resistente (parede rica em lipídios) → <b>Ziehl-Neelsen</b>; multiplica-se muito devagar (cultura ~60 dias).`,
 pega:`“Sem parede” é o Mycoplasma; “intracelular obrigatória” é Chlamydia/Rickettsia.`},
{id:"N1-3", sp:1, src:"nova",
 enun:`Homem de 28 anos, vítima de acidente de moto com fratura exposta contaminada com terra, evolui em 48 h com dor intensa, edema, crepitação à palpação e necrose muscular. A bacterioscopia mostra bacilos gram positivos grandes; a cultura aeróbia padrão não apresenta crescimento. Assinale o agente e os fatores de virulência mais associados à destruição tecidual:`,
 alts:["<i>Clostridium tetani</i> — neurotoxina","<i>Staphylococcus aureus</i> — coagulase","<i>Clostridium perfringens</i> — colagenase e lecitinase","<i>Escherichia coli</i> — lipopolissacarídeo"], gab:2,
 com:`Gangrena gasosa: <b>C. perfringens</b>, anaeróbio G+ (não cresce em aerobiose). Exoenzimas: <b>colagenase</b> (dissolve colágeno) e <b>lecitinase</b> (destrói membranas), além de enzimas necrosantes.`,
 pega:`C. tetani também é anaeróbio G+ de ferida suja, mas a clínica dele é contração/trismo, não necrose com crepitação.`},
{id:"N1-4", sp:1, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Mulher de 40 anos, 18 h após ingerir conserva caseira, apresenta visão dupla, ptose, disfagia e fraqueza muscular descendente <b>flácida</b>, com consciência preservada.<br><b>Paciente 2:</b> Criança de 6 anos com diarreia aquosa abundante 4 h após ingerir salgado recheado mantido fora da geladeira; bacterioscopia do alimento com cocos gram positivos em cachos.<br>Assinale o tipo de toxina envolvido nos pacientes 1 e 2, respectivamente:`,
 alts:["Neurotoxina de <i>C. botulinum</i>; enterotoxina de <i>S. aureus</i>","Neurotoxina de <i>C. tetani</i>; toxina esfoliativa de <i>S. aureus</i>","Endotoxina (LPS); enterotoxina de <i>E. coli</i>","Neurotoxina de <i>C. botulinum</i>; coagulase de <i>S. aureus</i>"], gab:0,
 com:`Paralisia flácida = <b>botulínica</b> (neurotoxina). Diarreia por toxina pré-formada com cocos G+ em cachos = <b>enterotoxina</b> estafilocócica (enterotoxinas afetam o TGI).`,
 pega:`Tétano = contração; botulismo = paralisia. Esfoliativa é pele; coagulase não é toxina.`},
{id:"N1-5", sp:1, src:"nova",
 enun:`Analise as uroculturas:<br><b>Paciente 1:</b> Gestante de 26 semanas, <b>assintomática</b>, urocultura de rotina: <i>E. coli</i> 50.000 UFC/mL.<br><b>Paciente 2:</b> Homem de 35 anos, <b>assintomático</b>, sem leucocitúria, urocultura: <i>E. coli</i> 30.000 UFC/mL.<br>Assinale a interpretação mais adequada para os pacientes 1 e 2, respectivamente:`,
 alts:["Colonização; colonização","Infecção; infecção","Considerar infecção/bacteriúria a tratar (paciente de risco); bacteriúria assintomática/colonização","Contaminação da amostra; infecção"], gab:2,
 com:`10.000–100.000 UFC/mL depende de <b>clínica + leucócitos</b>. Sem clínica = em geral colonização/bacteriúria assintomática, <b>exceto paciente de risco (gestante)</b>.`},
{id:"N1-6", sp:1, src:"nova",
 enun:`Sobre as estruturas bacterianas e a transmissão de resistência, assinale a alternativa correta:`,
 alts:["A resistência codificada no nucleoide pode ser transferida para bactérias de outros gêneros, sem limitação.","O plasmídeo é um DNA circular adicional que se multiplica de forma independente e pode transferir genes de resistência para bactérias de outros gêneros.","As fímbrias são responsáveis pela motilidade, permitindo a ascensão da bactéria no trato urinário.","Os ribossomos bacterianos são responsáveis pela síntese da parede celular e são o alvo dos beta-lactâmicos."], gab:1,
 com:`<b>Plasmídeo</b> = DNA extra, independente, transmite resistência <b>horizontalmente</b>, inclusive entre gêneros. Nucleoide → só para as filhas.`,
 pega:`Fímbria = <b>adesão</b>; flagelo = motilidade. Ribossomo = síntese proteica (alvo de aminoglicosídeos); β-lactâmico age nas <b>PBPs</b>.`},
{id:"N1-7", sp:1, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Pneumonia comunitária em jovem de 19 anos, tosse seca, cultura de escarro padrão sem crescimento; agente suspeito: <i>Mycoplasma pneumoniae</i>.<br><b>Paciente 2:</b> Infecção urinária por bacilo gram negativo; o médico prescreve uma quinolona.<br>Assinale a alternativa correta:`,
 alts:["Um beta-lactâmico seria eficaz no paciente 1, pois atua nas PBPs da parede do Mycoplasma.","Mycoplasma não tem parede celular, logo beta-lactâmicos não têm alvo; a quinolona do paciente 2 inibe a síntese de ácidos nucleicos.","A quinolona do paciente 2 atua inibindo o ácido fólico.","Mycoplasma não cresce na cultura padrão por ser anaeróbio obrigatório."], gab:1,
 com:`Mycoplasma = <b>sem parede</b> → nada para o β-lactâmico atacar. Quinolonas → <b>síntese de DNA/RNA</b>; sulfas → ácido fólico.`},
{id:"N1-8", sp:1, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Líquor de recém-nascido febril com crescimento de 1.000 UFC/mL de <i>Streptococcus agalactiae</i>.<br><b>Paciente 2:</b> Mulher de 30 anos com disúria intensa e piúria (leucócitos 40.000), urocultura com &lt;10.000 UFC/mL.<br>Assinale a alternativa correta:`,
 alts:["Paciente 1: crescimento baixo, provável contaminação; Paciente 2: não é infecção, não investigar.","Paciente 1: qualquer crescimento em material estéril é patogênico; Paciente 2: com clínica, considerar tratamento empírico ou bactéria atípica (ex.: Chlamydia, N. gonorrhoeae).","Paciente 1: só seria infecção acima de 100.000 UFC/mL; Paciente 2: infecção confirmada por E. coli.","Paciente 1: colonização da microbiota normal; Paciente 2: bacteriúria assintomática."], gab:1,
 com:`Sítio estéril (sangue, líquor, pleural…) → <b>qualquer crescimento conta</b>. Urocultura &lt;10 mil <b>com clínica</b> → empírico ou pensar em <b>atípicas</b>.`},
{id:"N1-9", sp:1, src:"nova",
 enun:`Sobre os exames microbiológicos, assinale a alternativa correta:`,
 alts:["A bacterioscopia informa o nome e o sobrenome da bactéria em cerca de 24 horas.","A cultura informa a espécie, mas a identificação completa pode levar 2 a 3 dias; a bacterioscopia sai em 30 min a 2 h e orienta a terapia empírica.","O antibiograma pode ser liberado antes da cultura, pois independe do crescimento bacteriano.","Amostras para cultura devem ser enviadas em formol para preservar as bactérias."], gab:1,
 com:`Bacterioscopia = rápida (Gram + forma). Cultura = “nome e sobrenome” em 2–3 dias. Antibiograma depende da cultura. <b>Formol mata</b> as bactérias.`},

/* ======================= SP2 — novas ======================= */
{id:"N2-1", sp:2, src:"nova",
 enun:`Paciente em UTI com <i>Klebsiella pneumoniae</i> resistente a todos os beta-lactâmicos testados por <b>disco difusão</b>. O laudo não traz resultado para polimixina. Assinale a alternativa correta:`,
 alts:["A polimixina não foi testada porque a bactéria é intrinsecamente resistente a ela.","Polimixina (e vancomicina, para G+) não são testadas por disco difusão por falta de confiabilidade; a polimixina ainda pode ser opção terapêutica.","A ausência de resultado indica que a polimixina deve ser descartada.","O disco difusão testa várias concentrações de cada antibiótico, por isso dispensa a polimixina."], gab:1,
 com:`Disco difusão: <b>1 concentração por disco</b>; vanco (G+) e polimixina (G−) não testadas — use microdiluição (MIC) se precisar. Polimixina segue como opção em G− MDR.`},
{id:"N2-2", sp:2, src:"nova",
 enun:`Antibiograma por microdiluição de <i>E. coli</i>: Ciprofloxacino MIC 0,25 (S); Ceftriaxona MIC 1 (S); Gentamicina MIC 2 (S). Um colega afirma que a melhor opção é ciprofloxacino “porque tem o menor MIC”. Assinale a alternativa correta:`,
 alts:["O colega está certo: menor MIC significa sempre maior eficácia.","O MIC é específico de cada antibiótico e não deve ser comparado entre classes; os três são sensíveis.","A gentamicina deve ser evitada porque tem o maior MIC.","O MIC só tem validade para vancomicina e polimixina."], gab:1,
 com:`Cada antibiótico tem seu ponto de corte. <b>Não se compara MIC entre classes</b> — o que importa é S/I/R.`},
{id:"N2-3", sp:2, src:"nova",
 enun:`Laudo de antibiograma: <i>Pseudomonas aeruginosa</i> — Cefepime: <b>I</b>; Meropenem: S; Ciprofloxacino: R. Sobre o cefepime, assinale a interpretação correta:`,
 alts:["Resistente: não usar em nenhuma situação.","Sensível aumentando a exposição: elevada probabilidade de sucesso se a dose/exposição for aumentada.","Intermediário: resultado inválido, repetir o exame.","Sensível na dose padrão."], gab:1,
 com:`<b>I = sensível aumentando a exposição</b> (ajuste de dose ou maior concentração no sítio).`},
{id:"N2-4", sp:2, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Cistite por <i>Proteus mirabilis</i>; antibiograma sem mecanismo de resistência adquirido. Em uso de nitrofurantoína.<br><b>Paciente 2:</b> Pielonefrite por <i>Klebsiella pneumoniae</i> sem mecanismos adquiridos. Em uso de ampicilina.<br>Considerando a resistência intrínseca, assinale a conduta para os pacientes 1 e 2:`,
 alts:["Manter; manter","Substituir; manter","Manter; substituir","Substituir; substituir"], gab:3,
 com:`<b>Proteus</b> é intrinsecamente R à <b>nitrofurantoína</b>; <b>Klebsiella</b> é intrinsecamente R à <b>ampicilina</b>. Intrínseca = da espécie, não depende do laudo.`,
 pega:`“Sem mecanismo adquirido” não significa que tudo funciona.`},
{id:"N2-5", sp:2, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Celulite por <i>S. aureus</i>: Penicilina R, Oxacilina <b>S</b>.<br><b>Paciente 2:</b> Abscesso por <i>S. aureus</i>: Penicilina R, Oxacilina <b>R</b>.<br>Assinale a alternativa correta:`,
 alts:["Paciente 1: cefalexina (1ª geração) tem ação; Paciente 2: nenhum beta-lactâmico tem ação, exceto ceftarolina.","Paciente 1: só a oxacilina tem ação; Paciente 2: amoxicilina/clavulanato tem ação.","Paciente 1: penicilina pode ser usada pois a oxacilina é S; Paciente 2: cefepime tem ação.","Paciente 1: carbapenêmicos são R; Paciente 2: ceftriaxona tem ação."], gab:0,
 com:`No S. aureus a <b>oxacilina prediz todos os β-lactâmicos</b>: Oxa S → todos servem (menos penicilina/ampicilina, já R pela penicilinase); Oxa R (MRSA) → nenhum, <b>exceto ceftarolina</b>.`},
{id:"N2-6", sp:2, src:"nova",
 enun:`Analise os casos ambulatoriais:<br><b>Paciente 1:</b> Criança de 4 anos com otite média aguda.<br><b>Paciente 2:</b> Adulto com diarreia com sangue e febre após almoço em restaurante.<br>Considerando a epidemiologia por sítio, os grupos predominantes são:`,
 alts:["Gram-negativos; Gram-positivos","Gram-positivos (Streptococcus); enterobactérias (ex.: Salmonella, Shigella)","Anaeróbios; atípicas","Staphylococcus aureus; Pseudomonas"], gab:1,
 com:`Vias aéreas superiores → <b>Streptococcus</b> (+ Moraxella, Haemophilus). TGI → <b>enterobactérias</b> (Salmonella, Shigella) e anaeróbios.`},
{id:"N2-7", sp:2, src:"nova",
 enun:`Paciente com prótese de joelho infectada por <i>S. aureus</i> oxacilina-sensível, em uso de cefazolina em dose adequada, mantém secreção e febre. O antibiograma confirma sensibilidade. A explicação mais provável é:`,
 alts:["Resistência intrínseca do S. aureus à cefazolina.","Formação de biofilme no dispositivo, dificultando a difusão do antibiótico apesar da sensibilidade in vitro.","Erro do laboratório, pois sensibilidade in vitro sempre garante cura.","Aquisição do gene mecA durante o tratamento, que o antibiograma não detecta."], gab:1,
 com:`<b>Biofilme</b>: crescimento organizado em “prédios” sobre próteses/parafusos; não é resistência adquirida, mas reduz a resposta mesmo com antibiograma S.`},
{id:"N2-8", sp:2, src:"nova",
 enun:`Relacione mecanismo e exemplo e assinale a alternativa correta:`,
 alts:["Alteração do sítio de ação: β-lactamases que hidrolisam o anel β-lactâmico.","Alteração da permeabilidade: redução de porinas em Gram-negativos.","Inativação enzimática: modificação da PBP no MRSA.","Bomba de efluxo: espessamento da parede no VISA."], gab:1,
 com:`Enzimas = β-lactamases (e enzimas modificadoras de aminoglicosídeos). Sítio de ação = PBP do MRSA. Permeabilidade = <b>menos porinas</b> em G−. Efluxo = ejeta o ATB (ex.: msrA). Parede espessa = VISA.`},

/* ======================= SP3 — novas ======================= */
{id:"N3-1", sp:3, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Pielonefrite por <i>Enterobacter cloacae</i>, sem mecanismo adquirido reportado.<br><b>Paciente 2:</b> Cistite por <i>E. coli</i> com <b>AmpC adquirida</b> (plasmidial), sensível a amoxicilina/clavulanato.<br>Qual combinação <u>teria ação</u> contra as bactérias dos pacientes 1 e 2?`,
 alts:["Paciente 1: Ceftriaxona; Paciente 2: Cefuroxima","Paciente 1: Cefepime; Paciente 2: Amoxicilina/clavulanato","Paciente 1: Amoxicilina/clavulanato; Paciente 2: Ceftriaxona","Paciente 1: Ampicilina; Paciente 2: Vancomicina"], gab:1,
 com:`Enterobacter = grupo <b>CESP</b> → AmpC intrínseca: até 3ª e clavulanato não salva; sobra <b>4ª (cefepime)</b>, aztreonam, carbapenêmico. AmpC adquirida (como ensinado em aula): <b>clavulanato inibe</b> — e o próprio laudo diz sensível.`,
 pega:`Na literatura, AmpC costuma não ser inibida por clavulanato — na prova, siga o que a professora ensinou (e o S do laudo).`},
{id:"N3-2", sp:3, src:"nova",
 enun:`Analise os antibiogramas:<br><b>Paciente 1 — <i>E. coli</i>:</b> Ampicilina R, Amoxi/clav R, Cefuroxima R, Ceftriaxona R, Ceftazidima R, Cefepime R, Aztreonam R, Ertapenem S, Meropenem S, Amicacina S.<br><b>Paciente 2 — <i>Serratia marcescens</i>:</b> Amoxi/clav R, Ceftriaxona R, Cefepime S, Aztreonam S, Meropenem S.<br>Assinale o perfil de resistência dos pacientes 1 e 2:`,
 alts:["Paciente 1: carbapenemase; Paciente 2: ESBL","Paciente 1: ESBL; Paciente 2: AmpC intrínseca (grupo CESP)","Paciente 1: AmpC adquirida; Paciente 2: carbapenemase","Paciente 1: penicilinase; Paciente 2: ESBL"], gab:1,
 com:`P1: R até 4ª + aztreonam, só carbapenêmicos S = <b>ESBL</b>. P2: R até 3ª (e clavulanato não salva), 4ª/aztreonam/carba S, e é <b>Serratia (CESP)</b> = <b>AmpC intrínseca</b>.`},
{id:"N3-3", sp:3, src:"nova",
 enun:`Analise os antibiogramas de <i>Staphylococcus aureus</i>:<br><b>Paciente 1:</b> Eritromicina R, Clindamicina R, Oxacilina S.<br><b>Paciente 2:</b> Eritromicina R, Clindamicina S, Oxacilina S.<br>Assinale a alternativa correta:`,
 alts:["Paciente 1: MRSA; Paciente 2: MLS por alteração do ribossomo.","Paciente 1: MLS por alteração do ribossomo (gene <i>erm</i>); Paciente 2: MLS por efluxo (gene <i>msrA</i>). Nenhum é MRSA.","Paciente 1: MLS por efluxo; Paciente 2: MLS por alteração de PBP.","Paciente 1: MLS intrínseco; Paciente 2: MRSA."], gab:1,
 com:`<b>erm</b> = ribossomo → Eri R + <b>Cli R</b>. <b>msrA</b> = efluxo → Eri R + <b>Cli S</b>. Oxacilina S = <b>não é MRSA</b>. MLS é adquirida.`},
{id:"N3-4", sp:3, src:"nova",
 enun:`Sobre a resistência de <i>S. aureus</i> aos glicopeptídeos, assinale a alternativa correta:`,
 alts:["No VISA, o terminal D-Ala-D-Ala é substituído, impedindo totalmente a ligação da vancomicina.","No VRSA/GRSA, há alteração do sítio de ligação (D-Ala-D-Ala → outra molécula), geralmente pelo gene <i>vanA</i> adquirido de Enterococcus resistente por plasmídeo.","O VISA é resistência total e contraindica qualquer uso de vancomicina.","O VRSA ocorre por espessamento da parede, e a vancomicina pode ser usada com ajuste de dose."], gab:1,
 com:`<b>VISA</b> = parede espessa, resistência <b>parcial</b> (vanco arriscada, com ajustes). <b>VRSA/GRSA</b> = alvo alterado, resistência <b>total</b>, <i>vanA</i>, vindo do VRE. Opções: linezolida, daptomicina, tigeciclina.`},
{id:"N3-5", sp:3, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Pneumonia associada à ventilação por <i>Acinetobacter baumannii</i> com carbapenemase.<br><b>Paciente 2:</b> Bacteremia por <i>S. aureus</i> resistente à oxacilina (MRSA).<br>Qual combinação <u>teria ação</u> contra as bactérias?`,
 alts:["Paciente 1: Meropenem; Paciente 2: Cefazolina","Paciente 1: Polimixina; Paciente 2: Vancomicina","Paciente 1: Ampicilina/sulbactam + clavulanato; Paciente 2: Oxacilina","Paciente 1: Ceftriaxona; Paciente 2: Ceftazidima"], gab:1,
 com:`Carbapenemase → <b>polimixina</b> (ou novas associações). MRSA → <b>vancomicina/teicoplanina</b> (ou linezolida, dapto, tige).`},
{id:"N3-6", sp:3, src:"nova",
 enun:`Sobre as beta-lactamases de Gram-negativos, assinale a alternativa correta:`,
 alts:["A AmpC é a mais potente e destrói carbapenêmicos.","A ESBL é sempre adquirida e confere resistência até cefalosporinas de 4ª geração e monobactâmicos.","A carbapenemase é inibida por clavulanato, por isso amoxicilina/clavulanato é opção.","A AmpC do grupo CESP é adquirida por plasmídeo e inibida por clavulanato."], gab:1,
 com:`Escada: AmpC (fraca, até 3ª) &lt; <b>ESBL (adquirida, até 4ª + aztreonam)</b> &lt; carbapenemase (tudo; clavulanato não funciona). CESP = AmpC <b>cromossômica/intrínseca</b>.`},
{id:"N3-7", sp:3, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> <i>E. coli</i> em urocultura com resistência <b>apenas à ampicilina</b>; em uso de ceftriaxona.<br><b>Paciente 2:</b> <i>Klebsiella oxytoca</i> com <b>ESBL</b>; em uso de meropenem.<br>Assinale a conduta para os pacientes 1 e 2:`,
 alts:["Manter; manter","Substituir; manter","Manter; substituir","Substituir; substituir"], gab:0,
 com:`P1: resistência só a ampicilina (penicilinase/β-lactamase simples) — ceftriaxona age → <b>manter</b>. P2: ESBL → sobram carbapenêmicos → meropenem age → <b>manter</b>.`},
{id:"N3-8", sp:3, src:"nova",
 enun:`Sobre Enterococcus e Gram-negativos, assinale a alternativa correta:`,
 alts:["O VRE é uma resistência intrínseca de todos os Enterococcus.","O VRE é adquirido e ocorre por alteração do sítio de ligação dos glicopeptídeos (precursores de peptidoglicano de baixa afinidade).","A resistência a aminoglicosídeos em G− ocorre principalmente por espessamento da parede.","A resistência isolada a aminoglicosídeos tem grande impacto terapêutico em todos os casos."], gab:1,
 com:`<b>VRE</b> = adquirido, sítio alterado (fenótipos VanA, VanB…). Aminoglicosídeos: <b>enzimas modificadoras</b> (&gt;50); sozinha, pouca influência na terapêutica.`},

/* ======================= SP4 — novas ======================= */
{id:"N4-1", sp:4, src:"nova",
 enun:`Mulher de 72 anos com pielonefrite chega ao PS: FR 24 irpm, Glasgow 14 (sonolenta), PA 105×60 mmHg, FC 110 bpm. Assinale a alternativa correta:`,
 alts:["qSOFA = 3; diagnóstico de sepse confirmado.","qSOFA = 2 (FR ≥ 22 e alteração mental); sinal de alerta, mas o qSOFA não confirma sepse.","qSOFA = 1, pois taquicardia não é critério; sepse descartada.","qSOFA = 2; trata-se de choque séptico."], gab:1,
 com:`qSOFA: <b>FR ≥ 22</b>, <b>alteração mental</b>, <b>PAS ≤ 100</b>. Aqui: FR e mental = 2 (PAS 105 não pontua). qSOFA <b>triagem</b>; sepse = infecção + <b>SOFA ↑ ≥ 2</b>.`},
{id:"N4-2", sp:4, src:"nova",
 enun:`Paciente internado por pneumonia, previamente sem disfunções, apresenta: plaquetas 45.000/mm³, creatinina 1,5 mg/dL, bilirrubina total 2,4 mg/dL, leucócitos 22.000/mm³, lactato 4,1 mmol/L. Considerando apenas os exames laboratoriais, a pontuação no SOFA é:`,
 alts:["4","5","6","8"], gab:2,
 com:`Plaquetas 45 mil (&lt;50) = <b>3</b>; Cr 1,5 (1,2–1,9) = <b>1</b>; BT 2,4 (2,0–5,9) = <b>2</b> → <b>6</b>. Leucócitos e lactato não pontuam.`},
{id:"N4-3", sp:4, src:"nova",
 enun:`Paciente séptico apresenta plaquetas 60.000/mm³, TP e TTPA alargados e fibrinogênio 110 mg/dL. Qual exame é o melhor parâmetro para confirmar coagulação intravascular disseminada?`,
 alts:["Lactato","D-dímero","Procalcitonina","Bilirrubina indireta"], gab:1,
 com:`<b>D-dímero</b> = produto de degradação da fibrina, mostra a fibrinólise trabalhando → melhor para confirmar <b>CIVD</b>.`},
{id:"N4-4", sp:4, src:"nova",
 enun:`Sobre os conceitos da Sepsis-3, assinale a alternativa correta:`,
 alts:["Sepse é a presença de bactéria na corrente sanguínea.","Choque séptico é sepse com necessidade de vasopressor para manter PAM ≥ 65 mmHg apesar de reposição volêmica adequada.","Sepse só ocorre com bactérias; vírus e fungos não causam sepse.","O SOFA é usado na triagem à beira do leito por dispensar exames laboratoriais."], gab:1,
 com:`Sepse = disfunção orgânica por resposta <b>desregulada</b> a infecção em <b>qualquer sítio</b> e por qualquer agente. Choque = vasopressor p/ PAM ≥ 65 (Sepsis-3: + lactato &gt; 2). SOFA usa exames; qSOFA é a triagem.`},
{id:"N4-5", sp:4, src:"nova",
 enun:`Analise as gasometrias:<br><b>Paciente 1 (choque séptico):</b> pH 7,25; pCO₂ 28 mmHg; HCO₃⁻ 12 mEq/L; lactato 6,0 mmol/L.<br><b>Paciente 2 (DPOC exacerbado):</b> pH 7,30; pCO₂ 62 mmHg; HCO₃⁻ 30 mEq/L.<br>Referências: pH 7,35–7,45; pCO₂ 35–45; HCO₃⁻ 22–26. Assinale a interpretação correta:`,
 alts:["P1: acidose respiratória parcialmente compensada; P2: acidose metabólica parcialmente compensada","P1: acidose metabólica parcialmente compensada; P2: acidose respiratória parcialmente compensada","P1: acidose mista; P2: acidose respiratória descompensada","P1: acidose metabólica descompensada; P2: alcalose metabólica"], gab:1,
 com:`P1: pH ↓ e HCO₃ ↓ (elevador) = metabólica; pCO₂ ↓ compensando → <b>parcialmente compensada</b>. P2: pH ↓ e pCO₂ ↑ (gangorra) = respiratória; HCO₃ ↑ compensando → <b>parcialmente compensada</b>.`},
{id:"N4-6", sp:4, src:"nova",
 enun:`Sobre as alterações metabólicas na sepse, assinale a alternativa correta:`,
 alts:["A hiperglicemia decorre do aumento de insulina e da glicólise aeróbia.","A hiperglicemia decorre de resistência à insulina (IL-1, IL-6, TNF) e de hormônios contrarreguladores como cortisol e glucagon.","O lactato aumenta por excesso de oferta de oxigênio aos tecidos.","O lactato é critério do SOFA atual."], gab:1,
 com:`Glicose ↑: <b>resistência à insulina</b> (citocinas) + <b>cortisol e glucagon</b>, estado catabólico. Lactato ↑: hipóxia → metabolismo anaeróbio; não é critério do SOFA.`},
{id:"N4-7", sp:4, src:"nova",
 enun:`Paciente com suspeita de infecção apresenta leucócitos 8.900/mm³ com 6% de bastonetes. Assinale a alternativa correta:`,
 alts:["Leucócitos normais excluem infecção bacteriana.","Há desvio à esquerda, pois qualquer bastonete indica desvio.","Leucócitos normais não excluem infecção (não se conhece o basal); 6% de bastonetes não caracteriza desvio (&gt; 8%).","Leucocitose é critério de pontuação do SOFA."], gab:2,
 com:`Desvio à esquerda = <b>&gt; 8% de bastonetes</b>/formas imaturas. Valor normal não exclui infecção. Leucócitos não entram no SOFA.`},
{id:"N4-8", sp:4, src:"nova",
 enun:`Paciente com doença renal crônica (creatinina basal 2,2 mg/dL), internado, evolui com nova infecção: creatinina 2,4 mg/dL e plaquetas que caíram de 180.000 para 85.000/mm³ em 24 h. Assinale a alternativa correta:`,
 alts:["Não há sepse, pois a creatinina já estava alterada antes.","Compara-se o SOFA basal com o pós-infecção em 24–48 h: o aumento de ≥ 2 pontos (aqui pelas plaquetas, 0 → 2) com infecção indica provável sepse.","Só se considera sepse se o aumento ocorrer em pelo menos dois órgãos diferentes.","A creatinina subiu de 2,2 para 2,4, portanto o SOFA renal aumentou 2 pontos."], gab:1,
 com:`Em pacientes com disfunção prévia, compare <b>pré × pós</b> (24–48 h). Aumento ≥ 2 pontos, <b>mesmo em um só parâmetro</b>, com infecção = provável sepse. Cr 2,2 → 2,4 continua na faixa 2,0–3,4 (sem mudança).`},

/* ======================= SP5 — novas ======================= */
{id:"N5-1", sp:5, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Pneumonia lobar com hemoculturas positivas para <i>Streptococcus pneumoniae</i>, mesmo agente do escarro.<br><b>Paciente 2:</b> Paciente com CVC, sem outro foco; hemocultura do cateter positiva às 08:10 e periférica às 11:30 (mesmo microrganismo).<br>Assinale a classificação dos pacientes 1 e 2:`,
 alts:["Primária; secundária","Secundária; relacionada ao cateter","Relacionada ao cateter; primária","Secundária; inconclusiva"], gab:1,
 com:`P1: há foco (pulmão) = <b>secundária</b>. P2: cateter positivou <b>3 h 20 antes</b> da periférica (&gt; 2 h) = <b>relacionada ao cateter</b> → trocar o dispositivo.`},
{id:"N5-2", sp:5, src:"nova",
 enun:`Analise os casos abaixo:<br><b>Paciente 1:</b> Duas hemoculturas periféricas positivas para <i>S. aureus</i>; exame físico e imagem sem foco infeccioso identificável; sem cateter.<br><b>Paciente 2:</b> Hemocultura do cateter positiva às 14:00 e periférica às 14:50, mesmo microrganismo.<br>Assinale a alternativa correta:`,
 alts:["P1: ICS secundária; P2: relacionada ao cateter","P1: ICS primária; P2: inconclusivo — não se pode afirmar nem excluir o cateter","P1: contaminação; P2: não é cateter","P1: ICS primária; P2: relacionada ao cateter"], gab:1,
 com:`Sem foco = <b>primária</b>. Cateter primeiro, mas com diferença &lt; 2 h (50 min) = <b>inconclusivo</b> (nova coleta ou troca por garantia).`},
{id:"N5-3", sp:5, src:"nova",
 enun:`Sobre a coleta de hemoculturas, assinale a alternativa correta:`,
 alts:["Em adultos, coleta-se uma única amostra de 20 mL em frasco pediátrico.","Em adultos, 2 a 3 amostras em frasco adulto, 8–10 mL cada, de sítios diferentes, após antissepsia com clorexidina, preferencialmente antes do antibiótico.","Se o acesso for difícil, as duas amostras podem ser colhidas do mesmo sítio no mesmo momento.","Em pacientes com CVC, as duas amostras devem ser colhidas pelo cateter."], gab:1,
 com:`Adulto: <b>2–3 frascos adultos, 8–10 mL</b>; criança: ≥ 1 frasco pediátrico, 1–3 mL. Mesmo sítio só com <b>30 min</b> de intervalo. CVC: <b>1 do cateter + 1 periférica</b>.`},
{id:"N5-4", sp:5, src:"nova",
 enun:`O polianetossulfonato de sódio (SPS) presente nos frascos de hemocultura:`,
 alts:["É um nutriente que acelera o tempo de geração das bactérias.","Atua como anticoagulante, tem atividade anticomplemento e antifagocitária e inibe certos antibióticos, como aminoglicosídeos e polimixinas.","Inativa beta-lactâmicos, dispensando a coleta antes do antibiótico.","É um corante que permite a bacterioscopia direta no frasco."], gab:1,
 com:`<b>SPS</b>: anticoagulante + anticomplemento + antifagocitário + inibe <b>aminoglicosídeos e polimixinas</b>. Por isso o volume é fixo.`},
{id:"N5-5", sp:5, src:"nova",
 enun:`Paciente com suspeita de bacteremia por bactéria aeróbia tem hemoculturas sem crescimento no 3º dia. Sobre o tempo de incubação, assinale a correta:`,
 alts:["Já pode ser liberado como negativo, pois o tempo de descarte é 48 h.","O tempo de descarte para aeróbios é de 5 dias; quando há bactéria, a positividade costuma ocorrer no 1º, no máximo no 2º dia.","Deve-se aguardar 20 a 30 dias para todas as hemoculturas.","Hemoculturas padrão detectam rotineiramente anaeróbios e fungos em até 24 h."], gab:1,
 com:`Aeróbios: descarte em <b>5 dias</b>; positividade em geral no <b>1º–2º dia</b>. Anaeróbios/fungos/atípicas: frascos específicos, até <b>20–30 dias</b>.`},
{id:"N5-6", sp:5, src:"nova",
 enun:`Paciente assintomático, internado, tem cultura de vigilância positiva para <i>Klebsiella pneumoniae</i> produtora de carbapenemase. Assinale a conduta correta:`,
 alts:["Iniciar polimixina para erradicar a colonização.","Iniciar ceftazidima/avibactam e repetir a cultura em 7 dias.","Não tratar; isolar o paciente (precauções de contato) e monitorar evolução para infecção.","Solicitar antibiograma da cultura de vigilância para escolher o antibiótico."], gab:2,
 com:`Colonização (mesmo MDR) <b>não se trata</b> — só traz problema. Conduta: <b>isolar</b>. Vigilância não libera antibiograma.`},
{id:"N5-7", sp:5, src:"nova",
 enun:`Sobre as amostras das culturas de vigilância (conforme a aula), associe e assinale a correta:`,
 alts:["Adulto, pesquisa de carbapenemase: amostra nasal.","Infantil, pesquisa de MRSA: amostra nasal; infantil, Gram-negativo multirresistente: amostra anal/retal.","Infantil, pesquisa de MRSA: amostra anal.","Adulto, pesquisa de carbapenemase: hemocultura."], gab:1,
 com:`Aula: adulto (carbapenemase) → <b>orofaringe</b>; infantil G− MDR → <b>anal/retal</b>; infantil MRSA → <b>nasal</b>.`},
{id:"N5-8", sp:5, src:"nova",
 enun:`Paciente com sepse de foco urinário em uso de ceftriaxona. Dia 1: hemoculturas positivas — bacterioscopia com bacilos Gram-negativos. Dia 3: <i>K. pneumoniae</i> resistente a ceftriaxona e meropenem, sensível a amicacina e gentamicina. Assinale a alternativa correta:`,
 alts:["O resultado parcial (Gram) já identifica a espécie e o perfil de sensibilidade.","O Gram (parcial) permite direcionar o empírico; o resultado final (cultura + antibiograma) indica provável carbapenemase e a troca para um agente sensível, como amicacina.","Como o paciente já está em antibiótico, a hemocultura positiva deve ser desconsiderada.","Deve-se manter ceftriaxona, pois a resistência in vitro não se reproduz in vivo."], gab:1,
 com:`Parcial = Gram/forma (rápido). Final = nome + TSA. R a ceftriaxona e meropenem → <b>provável carbapenemase</b> → trocar pelo <b>S</b> (amicacina/gentamicina), como no caso da aula.`},
{id:"N5-9", sp:5, src:"nova",
 enun:`São indicações de solicitação de hemocultura, EXCETO:`,
 alts:["Febre de origem desconhecida em paciente oncológico em quimioterapia.","Leucocitose com formas imaturas de granulócitos.","Paciente em antibioticoterapia sem melhora clínica.","Cistite não complicada em mulher jovem, sem febre, para confirmar o agente."], gab:3,
 com:`Indicações: bacteremia, sepse, febre de origem desconhecida (incl. oncológico), leucocitose com formas imaturas, ATB sem melhora. Cistite simples → urocultura, não hemocultura.`},
];

<script>
(function(){
const SPN={1:"Bactérias",2:"Antibiograma",3:"Resistências",4:"Sepse e laboratório",5:"Hemocultura"};
const LET="ABCD";
const st={v:"sp1",tab:"resumo"};
try{const s=JSON.parse(localStorage.getItem("lab15")||"{}");if(s.v)st.v=s.v;if(s.tab)st.tab=s.tab;}catch(e){}
const save=()=>{try{localStorage.setItem("lab15",JSON.stringify({v:st.v,tab:st.tab}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s);
const cnt=sp=>QOBJ.filter(q=>q.sp==sp).length+QDISC.filter(q=>q.sp==sp).length;
// rail
$("#navsp").innerHTML=[1,2,3,4,5].map(i=>`<button class="nav" data-v="sp${i}"><span class="n">SP${i}</span><span class="lbl">${SPN[i]}</span><span class="cnt">${cnt(i)}q</span></button>`).join("");
$("#cntall").textContent=(QOBJ.length+QDISC.length)+"q";
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{st.v=b.dataset.v;if(st.v.startsWith("sp")&&!["resumo","video","questoes"].includes(st.tab))st.tab="resumo";render();window.scrollTo(0,0)});
$("#colbtn").onclick=()=>{$("#app").classList.toggle("col");$("#colbtn").textContent=$("#app").classList.contains("col")?"⟩":"⟨ recolher"};
const h=location.hash.replace("#","");if(/^sp[1-5]$|^prova$|^todas$/.test(h))st.v=h;

function render(){
 document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("on",b.dataset.v===st.v));
 save();
 if(st.v.startsWith("sp"))return renderSP(+st.v[2]);
 if(st.v==="prova")return renderProva();
 return renderTodas();
}
function legend(){return `<div class="legend"><span><i class="sw" style="background:var(--t11bg);border:2px solid var(--t11)"></i>caiu na prova T11 (03/06/2026)</span><span><i class="sw" style="background:var(--pegabg);border:2px solid var(--pega)"></i>pegadinha</span></div>`}
function renderSP(sp){
 const tabs=[["resumo","Resumo"],["video","Vídeo"],["questoes",`Questões (${cnt(sp)})`]];
 $("#view").innerHTML=`<div class="kick">SP${sp}</div><h1>${SPN[sp]}</h1>${legend()}
 <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab ${st.tab===k?"on":""}" role="tab" data-t="${k}">${l}</button>`).join("")}</div><div id="tabc"></div>`;
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;renderSP(sp)});
 const c=$("#tabc");
 if(st.tab==="resumo"){c.innerHTML=`<div class="dl"><a class="btn ghost" href="Lab_UC15_Resumo.pdf" target="_blank" rel="noopener">Abrir o resumo em PDF</a></div>`+RESUMO[sp];}
 else if(st.tab==="video"){renderVideo(c,sp)}
 else{startQuiz(c,{sp})}
}
function fmt(t){t=Math.round(t);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function renderVideo(c,sp){
 const ch=(CHAP[sp]||[]);
 if(!ch.length){c.innerHTML=`<div class="novid">Vídeo da SP${sp} em produção.</div>`;return}
 c.innerHTML=`<div class="vid"><video id="vv" controls preload="metadata" playsinline src="videos/lab15_sp${sp}.mp4"></video></div>
 <ol class="chap">${ch.map(x=>`<li><button data-t="${x.t}"><span class="t">${fmt(x.t)}</span><span class="x">${x.title}${x.t11?` <span class="st11">· T11</span>`:""}</span></button></li>`).join("")}</ol>`;
 c.querySelectorAll(".chap button").forEach(b=>b.onclick=()=>{const v=$("#vv");v.currentTime=+b.dataset.t;v.play().catch(()=>{})});
}
/* ---------- quiz engine ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(c,opt){
 const S={mode:opt.mode||"estudo",size:opt.size||10,src:opt.src||"todas",ordered:!!opt.ordered};
 function pool(){
  let o=QOBJ.filter(q=>(!opt.sp||q.sp==opt.sp)&&(S.src==="todas"||(S.src==="T11"?q.src==="T11":q.src!=="T11")));
  let d=QDISC.filter(q=>(!opt.sp||q.sp==opt.sp)&&(S.src==="todas"||(S.src==="T11"?q.src==="T11":q.src!=="T11")));
  let all=o.map(q=>({k:"o",q})).concat(d.map(q=>({k:"d",q})));
  if(!S.ordered)all=shuffle(all);
  if(S.size!=="all")all=all.slice(0,S.size);
  return all;
 }
 let list,idx,ans;
 function setup(){
  const sizes=opt.fixed?[]:[[5,"5"],[10,"10"],[15,"15"],["all","Todas"]];
  c.innerHTML=`<div class="qbar">
   ${opt.fixed?"":`<span>Rodada <span class="seg" id="sz">${sizes.map(([v,l])=>`<button data-v="${v}" class="${S.size==v?"on":""}">${l}</button>`).join("")}</span></span>
   <span>Fonte <span class="seg" id="sr">${[["todas","Todas"],["T11","Prova T11"],["nova","Inéditas"]].map(([v,l])=>`<button data-v="${v}" class="${S.src==v?"on":""}">${l}</button>`).join("")}</span></span>`}
   <span>Modo <span class="seg" id="md">${[["estudo","Estudo"],["prova","Prova"]].map(([v,l])=>`<button data-v="${v}" class="${S.mode==v?"on":""}">${l}</button>`).join("")}</span></span>
  </div><div id="qa"></div>`;
  const bind=(id,key)=>{const g=c.querySelector(id);if(!g)return;g.querySelectorAll("button").forEach(b=>b.onclick=()=>{S[key]=b.dataset.v==="all"?"all":(isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v);setup()})};
  bind("#sz","size");bind("#sr","src");bind("#md","mode");
  list=pool();idx=0;ans=[];
  if(!list.length){c.querySelector("#qa").innerHTML=`<div class="novid">Nenhuma questão com esse filtro.</div>`;return}
  show();
 }
 function head(it){
  const q=it.q;const real=q.src==="T11";
  return `<div class="qhead"><span class="chip ${real?"real":""}">${real?(q.n?"Prova T11 · Q"+q.n:"Prova T11 · "+q.titulo.split("—")[0].trim()):"Inédita"}</span><span class="chip">SP${q.sp}</span><span>${idx+1}/${list.length}</span><span class="prog"><i style="width:${(idx)/list.length*100}%"></i></span></div>`;
 }
 function show(){
  const it=list[idx];const box=c.querySelector("#qa");
  if(it.k==="o")showObj(box,it);else showDisc(box,it);
 }
 function navBtns(done){
  const last=idx===list.length-1;
  return `<div class="qnav"><button class="link" data-a="resumo">Ver no resumo da SP${list[idx].q.sp}</button><span style="display:flex;gap:8px">${idx>0?`<button class="btn ghost" data-a="prev">Anterior</button>`:""}<button class="btn" data-a="next" ${done?"":"disabled"} style="${done?"":"opacity:.45;pointer-events:none"}">${last?"Ver resultado":"Próxima"}</button></span></div>`;
 }
 function wireNav(box){
  box.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
   const a=b.dataset.a;
   if(a==="next"){if(idx===list.length-1)return result();idx++;show();box.scrollIntoView({block:"start",behavior:"smooth"})}
   if(a==="prev"){idx--;show()}
   if(a==="resumo"){st.v="sp"+list[idx].q.sp;st.tab="resumo";render();window.scrollTo(0,0)}
  });
 }
 function showObj(box,it){
  const q=it.q;const a=ans[idx];
  const reveal=a!==undefined&&S.mode==="estudo";
  box.innerHTML=`<div class="qcard">${head(it)}<div class="enun">${q.enun}</div>
   <div class="alts">${q.alts.map((t,i)=>{let cls="";if(a!==undefined){if(reveal){if(i===q.gab)cls="ok";else if(i===a)cls="no"}else if(i===a)cls="sel"}
   return `<button class="alt ${cls}" data-i="${i}" ${reveal?"disabled":""}><span class="L">${LET[i]}</span><span>${t}</span></button>`}).join("")}</div>
   ${reveal?`<div class="fb"><b class="${a===q.gab?"res-ok":"res-no"}">${a===q.gab?"Acertou.":"Errou — gabarito "+LET[q.gab]+"."}</b> ${q.com}${q.pega?`<div class="pg"><b>Pegadinha.</b> ${q.pega}</div>`:""}</div>`:""}
   ${navBtns(a!==undefined)}</div>`;
  box.querySelectorAll(".alt").forEach(b=>b.onclick=()=>{if(reveal)return;ans[idx]=+b.dataset.i;showObj(box,it)});
  wireNav(box);
 }
 const GD=["acidose","alcalose"],GO=["respiratória","metabólica","mista"],GC=["descompensada","parcialmente compensada","compensada"];
 function parseG(s){s=s.toLowerCase();return{d:GD.find(x=>s.includes(x)),o:GO.find(x=>s.includes(x)),c:s.includes("mista")?"—":(s.includes("parcialmente")?"parcialmente compensada":s.includes("descompensada")?"descompensada":"compensada")}}
 function showDisc(box,it){
  const q=it.q;let a=ans[idx]||{v:[],done:false};ans[idx]=a;
  const done=a.done;const reveal=done&&S.mode==="estudo";
  let body="";
  if(!q.gaso){
   body=`<div class="dwrap"><table class="dt"><thead><tr>${q.head.map(x=>`<th>${x}</th>`).join("")}<th>Sua resposta</th></tr></thead><tbody>${q.rows.map((r,i)=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}<td><span class="tg">${q.opts.map((o,j)=>{let cls=a.v[i]===j?"on":"";if(reveal){if(j===q.resp[i])cls="ok";else if(a.v[i]===j)cls="no";else cls=""}return `<button data-r="${i}" data-o="${j}" class="${cls}" ${done?"disabled":""}>${o}</button>`}).join("")}</span>${reveal?`<div class="why">${q.why[i]}</div>`:""}</td></tr>`).join("")}</tbody></table></div>`;
  }else{
   body=`<div class="dwrap"><table class="dt"><thead><tr>${q.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${q.rows.map(r=>`<tr>${r.map((x,k)=>`<td class="${k?"num":""}">${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
   ${q.resp.map((r,i)=>{const v=a.v[i]||{};const g=parseG(r);const ok=v.d===g.d&&v.o===g.o&&(g.o==="mista"?true:v.c===g.c);
    return `<div style="margin:10px 0"><b>Paciente ${i+1}</b>${reveal?` — <span class="${ok?"res-ok":"res-no"}">${ok?"certo":"errado"}</span>: ${r}<div class="why">${q.why[i]}</div>`:""}
    <div class="gs" style="margin-top:6px">
     <select data-p="${i}" data-f="d" ${done?"disabled":""} aria-label="Distúrbio paciente ${i+1}"><option value="">distúrbio…</option>${GD.map(x=>`<option ${v.d===x?"selected":""}>${x}</option>`).join("")}</select>
     <select data-p="${i}" data-f="o" ${done?"disabled":""} aria-label="Origem paciente ${i+1}"><option value="">origem…</option>${GO.map(x=>`<option ${v.o===x?"selected":""}>${x}</option>`).join("")}</select>
     <select data-p="${i}" data-f="c" ${done?"disabled":""} aria-label="Compensação paciente ${i+1}"><option value="">compensação…</option>${GC.concat(["— (mista)"]).map(x=>`<option value="${x.startsWith("—")?"—":x}" ${v.c===(x.startsWith("—")?"—":x)?"selected":""}>${x}</option>`).join("")}</select>
    </div></div>`}).join("")}`;
  }
  box.innerHTML=`<div class="qcard">${head(it)}<div class="enun"><b>${q.titulo}.</b> ${q.enun}</div>${body}
   ${done?"":`<div class="qnav" style="justify-content:flex-end"><button class="btn" id="conf">Conferir</button></div>`}
   ${navBtns(done)}</div>`;
  box.querySelectorAll(".tg button").forEach(b=>b.onclick=()=>{a.v[+b.dataset.r]=+b.dataset.o;showDisc(box,it)});
  box.querySelectorAll("select").forEach(s=>s.onchange=()=>{const p=+s.dataset.p;a.v[p]=a.v[p]||{};a.v[p][s.dataset.f]=s.value;});
  const cf=box.querySelector("#conf");if(cf)cf.onclick=()=>{a.done=true;showDisc(box,it)};
  wireNav(box);
 }
 function scoreDisc(it,a){const q=it.q;if(!q.gaso)return q.resp.reduce((s,r,i)=>s+(a.v[i]===r?1:0),0)/q.resp.length;
  return q.resp.reduce((s,r,i)=>{const v=a.v[i]||{};const g=parseG(r);return s+((v.d===g.d&&v.o===g.o&&(g.o==="mista"||v.c===g.c))?1:0)},0)/q.resp.length}
 function result(){
  let pts=0;const rows=list.map((it,i)=>{let sc;if(it.k==="o")sc=ans[i]===it.q.gab?1:0;else sc=ans[i]?scoreDisc(it,ans[i]):0;pts+=sc;
   const lbl=it.q.src==="T11"?(it.q.n?"T11 · Q"+it.q.n:"T11 · "+it.q.titulo.split("—")[0].trim()):"Inédita · SP"+it.q.sp;
   return `<li><span class="${sc===1?"res-ok":"res-no"}">${sc===1?"✓":sc>0?Math.round(sc*100)+"%":"✗"}</span><span>${lbl}${it.k==="o"&&ans[i]!==it.q.gab?` — gabarito ${LET[it.q.gab]}, você marcou ${ans[i]===undefined?"—":LET[ans[i]]}`:""}</span></li>`});
  const box=c.querySelector("#qa");
  box.innerHTML=`<div class="qcard"><div class="kick">Resultado</div><div class="score">${Math.round(pts/list.length*100)}%</div><p>${pts.toFixed(1).replace(".0","").replace(".",",")} de ${list.length} (discursivas contam por paciente).</p><ul class="revlist">${rows.join("")}</ul>
   <div class="qnav"><button class="btn ghost" id="rev">Revisar com gabarito</button><button class="btn" id="again">Nova rodada</button></div></div>`;
  box.querySelector("#again").onclick=()=>setup();
  box.querySelector("#rev").onclick=()=>{S.mode="estudo";list.forEach((it,i)=>{if(it.k==="d"&&ans[i])ans[i].done=true});idx=0;show()};
 }
 setup();
}
/* ---------- prova ---------- */
function renderProva(){
 const sps=[["SP1 · Bactérias",3.0],["SP2 · Antibiograma",1],["SP3 · Resistências",3],["SP4 · Sepse/lab",2.5],["SP5 · Hemocultura",0.5]];
 const mx=3;
 $("#view").innerHTML=`<div class="kick">Prova real · T11 · 03/06/2026</div><h1>Raio-X da prova de Lab UC15</h1>${legend()}
 <div class="tabs"><button class="tab ${st.tab!=="fazer"?"on":""}" data-t="rx">Raio-X</button><button class="tab ${st.tab==="fazer"?"on":""}" data-t="fazer">Fazer a prova T11</button></div><div id="tabc"></div>`;
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;renderProva()});
 const c=$("#tabc");
 if(st.tab==="fazer"){c.innerHTML=`<p class="cap">Na ordem da prova: 8 objetivas + 2 discursivas. Modo prova = gabarito só no fim.</p><div id="qz"></div>`;startQuiz(c.querySelector("#qz"),{fixed:true,ordered:true,src:"T11",size:"all",mode:"prova"});return}
 c.innerHTML=`
 <div class="rx">
  <div><b class="big">10 × 10%</b>8 objetivas A–D + 2 discursivas (A: manter/substituir em 6 casos; B: 5 gasometrias). Cada questão vale 10%.</div>
  <div><b class="big">Paciente 1 e 2</b>5 das 8 objetivas trazem dois casos; a alternativa errada acerta um e erra o outro.</div>
  <div><b class="big">Sem correção parcial</b>Na gasometria, um item faltando (distúrbio, origem ou compensação) zera aquele paciente.</div>
 </div>
 <h3 style="font:800 20px var(--f-disp)">Peso de cada SP (questões-equivalentes)</h3>
 <div class="bars">${sps.map(([n,v])=>`<div class="r"><b>${n}</b><i style="width:${v/mx*100}%"></i><span>${String(v).replace(".",",")}</span></div>`).join("")}</div>
 <p class="cap">Q7 e Q8 misturam SPs (toxina + SOFA; hemocultura + gasometria) e foram divididas. SP3 e SP4 juntas = mais da metade da prova, contando as discursivas.</p>
 <h3 style="font:800 20px var(--f-disp)">Gabarito</h3>
 <div class="gab">${QOBJ.filter(q=>q.src==="T11").map(q=>`<div><b>Q${q.n} ${LET[q.gab]}</b>${["","atípica (Chlamydia)","S. aureus + E. coli","ESBL→mero · Pseudo→ceftaz.","CIVD + disf. hepática","MRSA mecA + carbapenemase","C. tetani neurotoxina","LPS + esfoliativa","ICS secundária + acidose met."][q.n]}</div>`).join("")}
 <div><b>Disc A</b>S · S · M · S · S · M</div><div><b>Disc B</b>alc met PC · mista · ac resp desc · ac met comp · alc resp PC</div></div>
 <h3 style="font:800 20px var(--f-disp)">O estilo dela</h3>
 <ul>
  <li><b>Caso clínico + exame</b> em toda questão; nada de pergunta seca de definição.</li>
  <li><b>Distratores que trocam uma palavra</b>: “cortisol e <i>insulina</i>”, “MLS com <i>PBP</i>”, “carbapenemase <i>intrínseca</i>”, “4 pontos” em vez de 5.</li>
  <li><b>Morfologia decide</b>: cachos × cadeia, bacilo G− × G+, cultura que não cresce.</li>
  <li><b>Contas no enunciado</b>: SOFA laboratorial e gasometria com valores-limite (BT 1,25; pH 7,38).</li>
  <li><b>Resistência intrínseca escondida</b>: “nenhum mecanismo adquirido” com bactéria CESP.</li>
 </ul>
 <h3 style="font:800 20px var(--f-disp)">Onde a veterana errou</h3>
 <ul>
  <li><b>Q2:</b> marcou <i>S. pyogenes</i> para cocos em <b>cachos</b> (é S. aureus).</li>
  <li><b>Q7:</b> marcou coagulase como causa do choque por <b>G−</b> (é LPS).</li>
 </ul>
 <div class="dl"><button class="btn" id="go">Fazer a prova T11 agora</button></div>`;
 c.querySelector("#go").onclick=()=>{st.tab="fazer";renderProva()};
}
function renderTodas(){
 $("#view").innerHTML=`<div class="kick">Banco completo</div><h1>Todas as questões</h1>${legend()}<p class="cap">${QOBJ.length} objetivas (8 da prova T11 + ${QOBJ.length-8} inéditas no estilo dela) e ${QDISC.length} discursivas interativas. Uma por vez.</p><div id="qz"></div>`;
 startQuiz($("#qz"),{size:10});
}
render();
})();
</script>
