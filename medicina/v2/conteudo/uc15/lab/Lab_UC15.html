<script>
window.RESUMO = {"1": "<section class=\"res\">\n<h2>SP1 · Bactérias</h2>\n<p class=\"lede\">O laboratório raciocina em camadas: primeiro a <b>forma e o Gram</b> (rápido), depois <b>onde a bactéria cresce</b>, depois o <b>nome</b> e o <b>antibiograma</b>. Cada camada já estreita a lista de suspeitos e orienta o antibiótico empírico.</p>\n\n<h3>Forma e arranjo</h3>\n<p>Cocos são esféricos; bacilos, bastões; espirilos e vibriões, curvos. O arranjo dos cocos é a pista mais cobrada: <mark class=\"t11\" data-q=\"Q2\">em <b>cadeia</b> é <i>Streptococcus</i>; em <b>cacho</b> (de uva) é <i>Staphylococcus</i></mark>; os dois são Gram-positivos. Bacilos costumam ser Gram-negativos e ficam soltos.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 190\" role=\"img\" aria-label=\"Morfologia bacteriana\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"40\" cy=\"64\" r=\"11\" class=\"gp st\"/><circle cx=\"61\" cy=\"76\" r=\"11\" class=\"gp st\"/><circle cx=\"82\" cy=\"64\" r=\"11\" class=\"gp st\"/><circle cx=\"103\" cy=\"76\" r=\"11\" class=\"gp st\"/><circle cx=\"124\" cy=\"64\" r=\"11\" class=\"gp st\"/><circle cx=\"145\" cy=\"76\" r=\"11\" class=\"gp st\"/>\n<text x=\"92\" y=\"122\" class=\"tc b\">Cocos em cadeia</text><text x=\"92\" y=\"140\" class=\"tc s\">Streptococcus · G+</text>\n<circle cx=\"250\" cy=\"72\" r=\"11\" class=\"gp st\"/><circle cx=\"270\" cy=\"66\" r=\"11\" class=\"gp st\"/><circle cx=\"232\" cy=\"64\" r=\"11\" class=\"gp st\"/><circle cx=\"260\" cy=\"88\" r=\"11\" class=\"gp st\"/><circle cx=\"240\" cy=\"86\" r=\"11\" class=\"gp st\"/><circle cx=\"280\" cy=\"84\" r=\"11\" class=\"gp st\"/><circle cx=\"252\" cy=\"50\" r=\"11\" class=\"gp st\"/><circle cx=\"224\" cy=\"80\" r=\"11\" class=\"gp st\"/><circle cx=\"272\" cy=\"48\" r=\"11\" class=\"gp st\"/>\n<text x=\"252\" y=\"122\" class=\"tc b\">Cocos em cacho</text><text x=\"252\" y=\"140\" class=\"tc s\">Staphylococcus · G+</text>\n<rect x=\"377.0\" y=\"51.0\" width=\"46\" height=\"18\" rx=\"9.0\" class=\"gn st\" transform=\"rotate(0 400 60)\"/><rect x=\"417.0\" y=\"79.0\" width=\"46\" height=\"18\" rx=\"9.0\" class=\"gn st\" transform=\"rotate(20 440 88)\"/><rect x=\"369.0\" y=\"87.0\" width=\"46\" height=\"18\" rx=\"9.0\" class=\"gn st\" transform=\"rotate(-15 392 96)\"/>\n<text x=\"415\" y=\"122\" class=\"tc b\">Bacilos</text><text x=\"415\" y=\"140\" class=\"tc s\">maioria G− · soltos</text>\n<path d=\"M500 72 q12 -18 24 0 t24 0 t24 0 t24 0\" class=\"ln\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M520 104 q20 -20 46 -6\" class=\"ln\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/>\n<text x=\"560\" y=\"122\" class=\"tc b\">Espirilo · vibrião</text>\n<rect x=\"160\" y=\"158\" width=\"320\" height=\"26\" rx=\"13\" class=\"hl\"/>\n<text x=\"320\" y=\"176\" class=\"tc s\">“cocos G+ em <tspan class=\"b\">cachos</tspan>” = S. aureus (não S. pyogenes)</text>\n</svg></figure>\n\n<h3>A parede decide a cor do Gram</h3>\n<p>O <b>Gram-positivo</b> tem parede grossa de peptidoglicano e retém o cristal violeta: fica <b>roxo</b>. O <b>Gram-negativo</b> tem peptidoglicano fino e uma <b>membrana externa</b> (onde está o LPS): perde o corante e fica <b>rosa</b>. O peptidoglicano é montado pelas <b>PBPs</b> (proteínas ligadoras de penicilina), os “pedreiros” da parede, que são o alvo dos β-lactâmicos.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 240\" role=\"img\" aria-label=\"Parede Gram-positiva e Gram-negativa\" xmlns=\"http://www.w3.org/2000/svg\">\n<text x=\"160\" y=\"22\" class=\"tc b\">Gram-positivo · ROXO</text>\n<rect x=\"40\" y=\"40\" width=\"240\" height=\"70\" class=\"gp\"/>\n<text x=\"160\" y=\"80\" class=\"tc wt b\">peptidoglicano GROSSO</text>\n<rect x=\"40\" y=\"114\" width=\"240\" height=\"22\" class=\"mem\"/>\n<text x=\"160\" y=\"130\" class=\"tc s\">membrana plasmática</text>\n<text x=\"480\" y=\"22\" class=\"tc b\">Gram-negativo · ROSA</text>\n<rect x=\"360\" y=\"40\" width=\"240\" height=\"22\" class=\"mem\"/>\n<text x=\"480\" y=\"56\" class=\"tc s\">membrana externa (LPS)</text>\n<rect x=\"360\" y=\"66\" width=\"240\" height=\"20\" class=\"gn\"/>\n<text x=\"480\" y=\"81\" class=\"tc s\">peptidoglicano fino</text>\n<rect x=\"360\" y=\"114\" width=\"240\" height=\"22\" class=\"mem\"/>\n<text x=\"480\" y=\"130\" class=\"tc s\">membrana plasmática</text>\n<g transform=\"translate(110 168)\"><rect width=\"420\" height=\"56\" rx=\"12\" class=\"card2\"/>\n<circle cx=\"34\" cy=\"28\" r=\"17\" class=\"acc\"/><text x=\"34\" y=\"33\" class=\"tc wt b\">PBP</text>\n<text x=\"64\" y=\"23\" class=\"b\">PBP = “pedreiro” que liga os tijolos da parede</text>\n<text x=\"64\" y=\"43\" class=\"s\">alvo do β-lactâmico · alterada no MRSA (gene mecA)</text></g>\n</svg></figure>\n\n<h3>Estruturas que importam para resistência e virulência</h3>\n<p>O <b>nucleoide</b> guarda o DNA principal: resistência que nasce ali passa só para as filhas (transmissão vertical). O <b>plasmídeo</b> é DNA circular extra, replica sozinho e transfere genes de resistência até para <b>outros gêneros</b> (horizontal), por isso preocupa mais. Os <b>ribossomos</b> fazem proteína e são alvo de antibióticos. Por fora, o <b>flagelo</b> dá motilidade (a bactéria sobe pelo trato urinário) e as <b>fímbrias/pili</b> dão adesão.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Estruturas da célula bacteriana\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"170\" y=\"60\" width=\"300\" height=\"110\" rx=\"55\" class=\"gn st\"/>\n<path d=\"M230 110 q30 -30 60 0 t60 0 t40 -6\" class=\"ln\" stroke-width=\"3\" fill=\"none\"/>\n<circle cx=\"400\" cy=\"140\" r=\"14\" class=\"none st2\"/><circle cx=\"246\" cy=\"146\" r=\"9\" class=\"none st2\"/>\n<circle cx=\"210\" cy=\"90\" r=\"3\" class=\"ink\"/><circle cx=\"330\" cy=\"140\" r=\"3\" class=\"ink\"/><circle cx=\"300\" cy=\"86\" r=\"3\" class=\"ink\"/><circle cx=\"360\" cy=\"96\" r=\"3\" class=\"ink\"/><circle cx=\"260\" cy=\"128\" r=\"3\" class=\"ink\"/><circle cx=\"420\" cy=\"92\" r=\"3\" class=\"ink\"/>\n<path d=\"M470 115 q30 -20 50 0 t50 0 t40 -4\" class=\"ln\" stroke-width=\"2.5\" fill=\"none\"/>\n<line x1=\"230\" y1=\"60\" x2=\"224\" y2=\"44\" class=\"ln\" stroke-width=\"2\"/><line x1=\"260\" y1=\"60\" x2=\"254\" y2=\"44\" class=\"ln\" stroke-width=\"2\"/><line x1=\"290\" y1=\"60\" x2=\"284\" y2=\"44\" class=\"ln\" stroke-width=\"2\"/><line x1=\"320\" y1=\"60\" x2=\"314\" y2=\"44\" class=\"ln\" stroke-width=\"2\"/><line x1=\"350\" y1=\"60\" x2=\"344\" y2=\"44\" class=\"ln\" stroke-width=\"2\"/><line x1=\"380\" y1=\"60\" x2=\"374\" y2=\"44\" class=\"ln\" stroke-width=\"2\"/><line x1=\"410\" y1=\"60\" x2=\"404\" y2=\"44\" class=\"ln\" stroke-width=\"2\"/><line x1=\"440\" y1=\"60\" x2=\"434\" y2=\"44\" class=\"ln\" stroke-width=\"2\"/>\n<text x=\"250\" y=\"36\" class=\"tc s\">fímbrias/pili → ADESÃO</text>\n<text x=\"590\" y=\"96\" class=\"tc s\">flagelo →</text><text x=\"590\" y=\"112\" class=\"tc s\">MOVIMENTO</text>\n<text x=\"290\" y=\"200\" class=\"tc b\">nucleoide (DNA)</text><text x=\"290\" y=\"218\" class=\"tc s\">resistência só p/ as filhas (vertical)</text>\n<line x1=\"290\" y1=\"186\" x2=\"300\" y2=\"122\" class=\"ln\" stroke-dasharray=\"3 3\"/>\n<text x=\"500\" y=\"200\" class=\"tc b\">plasmídeo</text><text x=\"500\" y=\"218\" class=\"tc s\">pula até p/ outros gêneros (horizontal)</text>\n<line x1=\"490\" y1=\"186\" x2=\"408\" y2=\"150\" class=\"ln\" stroke-dasharray=\"3 3\"/>\n<text x=\"90\" y=\"200\" class=\"tc b\">ribossomos</text><text x=\"90\" y=\"218\" class=\"tc s\">síntese proteica</text>\n<line x1=\"100\" y1=\"186\" x2=\"208\" y2=\"94\" class=\"ln\" stroke-dasharray=\"3 3\"/>\n</svg></figure>\n\n<h3>As quatro “gavetas” do laboratório</h3>\n<p>Juntando Gram e necessidade de oxigênio: <b>G+ e G− aeróbios</b> coram e crescem na cultura padrão. As <b>atípicas</b> não coram no Gram e <b>não crescem</b> na cultura padrão: <i>Treponema</i> (flexível), <i>Mycoplasma/Ureaplasma</i> (sem parede), <i>Chlamydia</i> e riquétsias (intracelulares obrigatórias). Os <b>anaeróbios</b> coram, mas não crescem na cultura comum porque não toleram O₂: <i>Clostridium</i> (G+), <i>Bacteroides</i> e <i>Fusobacterium</i> (G−). <i>Mycobacterium</i> é <b>álcool-ácido resistente</b>: a parede rica em lipídios não cora bem no Gram, exige <b>Ziehl-Neelsen</b>, e a bactéria se divide muito devagar (cultura de ~60 dias).</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Quatro grupos laboratoriais\" xmlns=\"http://www.w3.org/2000/svg\">\n<g transform=\"translate(20 14)\"><rect width=\"290\" height=\"96\" rx=\"12\" class=\"card2\"/>\n<rect width=\"8\" height=\"96\" rx=\"4\" class=\"gp\"/>\n<text x=\"22\" y=\"26\" class=\"b\">Gram-positivos (aeróbios)</text>\n<text x=\"22\" y=\"48\" class=\"s\">Gram: <tspan class=\"b\">roxo</tspan> · cultura padrão: <tspan class=\"b\">cresce</tspan></text>\n<text x=\"22\" y=\"72\" class=\"s it\">Staphylococcus, Streptococcus, Enterococcus</text></g>\n<g transform=\"translate(330 14)\"><rect width=\"290\" height=\"96\" rx=\"12\" class=\"card2\"/>\n<rect width=\"8\" height=\"96\" rx=\"4\" class=\"gn\"/>\n<text x=\"22\" y=\"26\" class=\"b\">Gram-negativos (aeróbios)</text>\n<text x=\"22\" y=\"48\" class=\"s\">Gram: <tspan class=\"b\">rosa</tspan> · cultura padrão: <tspan class=\"b\">cresce</tspan></text>\n<text x=\"22\" y=\"72\" class=\"s it\">E. coli, Klebsiella, Proteus, Pseudomonas</text></g>\n<g transform=\"translate(20 122)\"><rect width=\"290\" height=\"96\" rx=\"12\" class=\"card2\"/>\n<rect width=\"8\" height=\"96\" rx=\"4\" class=\"warnf\"/>\n<text x=\"22\" y=\"26\" class=\"b\">Atípicas</text>\n<text x=\"22\" y=\"48\" class=\"s\">Gram: <tspan class=\"b\">não cora</tspan> · cultura padrão: <tspan class=\"b\">NÃO cresce</tspan></text>\n<text x=\"22\" y=\"72\" class=\"s it\">Chlamydia, Mycoplasma (sem parede), Treponema</text></g>\n<g transform=\"translate(330 122)\"><rect width=\"290\" height=\"96\" rx=\"12\" class=\"card2\"/>\n<rect width=\"8\" height=\"96\" rx=\"4\" class=\"ink\"/>\n<text x=\"22\" y=\"26\" class=\"b\">Anaeróbios</text>\n<text x=\"22\" y=\"48\" class=\"s\">Gram: <tspan class=\"b\">G+ ou G−</tspan> · cultura padrão: <tspan class=\"b\">NÃO cresce (O₂)</tspan></text>\n<text x=\"22\" y=\"72\" class=\"s it\">Clostridium (G+), Bacteroides (G−)</text></g>\n</svg></figure>\n<aside class=\"pega t11b\"><b>Caiu na T11 · Q1.</b> Cervicite + piúria (23.000 leucócitos), nitrito negativo, <b>urocultura sem crescimento</b> e <b>bacterioscopia negativa</b>, “sem erro nos exames”. Inflamou mas nada cresce nem cora → <b>atípica: <i>Chlamydia trachomatis</i></b>.</aside>\n\n<h3>Fatores de virulência</h3>\n<p><b>Exoenzimas</b> facilitam a invasão: <b>coagulase</b> (<i>S. aureus</i>) forma uma capa de fibrina que esconde a bactéria; <b>hialuronidase e colagenase</b> dissolvem a matriz (colagenase: <i>C. perfringens</i>); <b>hemolisinas</b> lisam hemácias (halo translúcido no ágar sangue); <b>lecitinase</b> destrói membranas (<i>C. perfringens</i>); enzimas necrosantes (proteases, lipases) destroem tecido.</p>\n<p><mark class=\"t11\" data-q=\"Q7\"><b>Endotoxina = LPS</b>, componente da parede do Gram-negativo, que desencadeia a resposta inflamatória exacerbada e a instabilidade hemodinâmica</mark>. <b>Exotoxinas</b> são liberadas: <mark class=\"t11\" data-q=\"Q6\">neurotoxinas — <i>C. tetani</i> causa <b>contração</b> (trismo, opistótono)</mark> e <i>C. botulinum</i> causa <b>paralisia</b>; enterotoxinas causam diarreia; <mark class=\"t11\" data-q=\"Q7\">a <b>esfoliativa</b> do <i>S. aureus</i> descola a epiderme (síndrome da pele escaldada)</mark>.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 250\" role=\"img\" aria-label=\"Toxinas e exoenzimas\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"250\" y=\"8\" width=\"140\" height=\"34\" rx=\"17\" class=\"acc\"/><text x=\"320\" y=\"30\" class=\"tc wt b\">Virulência</text>\n<line x1=\"320\" y1=\"42\" x2=\"140\" y2=\"70\" class=\"ln\"/><line x1=\"320\" y1=\"42\" x2=\"320\" y2=\"70\" class=\"ln\"/><line x1=\"320\" y1=\"42\" x2=\"510\" y2=\"70\" class=\"ln\"/>\n<g transform=\"translate(30 70)\"><rect width=\"220\" height=\"170\" rx=\"12\" class=\"card2\"/>\n<text x=\"14\" y=\"24\" class=\"b\">Exoenzimas</text>\n<text x=\"14\" y=\"50\" class=\"s\"><tspan class=\"b\">Coagulase</tspan> — S. aureus (fibrina)</text>\n<text x=\"14\" y=\"74\" class=\"s\"><tspan class=\"b\">Colagenase · lecitinase</tspan></text>\n<text x=\"14\" y=\"92\" class=\"s\">— C. perfringens</text>\n<text x=\"14\" y=\"116\" class=\"s\"><tspan class=\"b\">Hemolisinas</tspan> — halo no ágar</text>\n<text x=\"14\" y=\"140\" class=\"s\"><tspan class=\"b\">Necrosantes</tspan> — proteases</text></g>\n<g transform=\"translate(262 70)\"><rect width=\"116\" height=\"170\" rx=\"12\" class=\"hlbox\"/>\n<text x=\"58\" y=\"24\" class=\"tc b\">Endotoxina</text>\n<text x=\"58\" y=\"56\" class=\"tc b big\">LPS</text>\n<text x=\"58\" y=\"84\" class=\"tc s\">parede do G−</text>\n<text x=\"58\" y=\"112\" class=\"tc s\">resposta</text><text x=\"58\" y=\"128\" class=\"tc s\">inflamatória</text><text x=\"58\" y=\"144\" class=\"tc s\">→ choque</text></g>\n<g transform=\"translate(390 70)\"><rect width=\"230\" height=\"170\" rx=\"12\" class=\"card2\"/>\n<text x=\"14\" y=\"24\" class=\"b\">Exotoxinas (liberadas)</text>\n<text x=\"14\" y=\"50\" class=\"s\"><tspan class=\"b\">Neuro:</tspan> C. tetani → CONTRAÇÃO</text>\n<text x=\"14\" y=\"70\" class=\"s\">C. botulinum → PARALISIA</text>\n<text x=\"14\" y=\"98\" class=\"s\"><tspan class=\"b\">Entero:</tspan> TGI → diarreia</text>\n<text x=\"14\" y=\"126\" class=\"s\"><tspan class=\"b\">Esfoliativa:</tspan> S. aureus</text>\n<text x=\"14\" y=\"146\" class=\"s\">→ pele escaldada</text></g>\n</svg></figure>\n<aside class=\"pega\"><b>Pegadinhas.</b> Choque com hemocultura de <b>bacilo G−</b> → LPS, e não coagulase (a veterana errou essa). Clostridium é <b>G+</b>, então não tem LPS. Tétano contrai; botulismo paralisa.</aside>\n\n<h3>Onde cada antimicrobiano age</h3>\n<p>Parede (liga nas PBPs) → <b>β-lactâmicos</b>; membrana → <b>polimixina</b>; ribossomo → <b>aminoglicosídeos</b>; síntese de DNA/RNA → <b>quinolonas</b>; ácido fólico → <b>sulfonamidas</b>. A resistência mais clássica é a bactéria modificar o alvo (como a PBP) para o antibiótico não reconhecê-lo.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Alvos dos antimicrobianos\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"200\" y=\"40\" width=\"240\" height=\"150\" rx=\"75\" class=\"gn st\"/>\n<rect x=\"212\" y=\"52\" width=\"216\" height=\"126\" rx=\"63\" class=\"none st2\"/>\n<path d=\"M260 115 q25 -25 50 0 t50 0\" class=\"ln\" stroke-width=\"3\" fill=\"none\"/>\n<circle cx=\"250\" cy=\"80\" r=\"4\" class=\"ink\"/><circle cx=\"380\" cy=\"150\" r=\"4\" class=\"ink\"/><circle cx=\"390\" cy=\"84\" r=\"4\" class=\"ink\"/>\n<circle cx=\"300\" cy=\"150\" r=\"10\" class=\"none st2\"/>\n<line x1=\"200\" y1=\"80\" x2=\"120\" y2=\"50\" class=\"ln\"/><text x=\"110\" y=\"40\" class=\"te b\">PAREDE (PBP)</text><text x=\"110\" y=\"58\" class=\"te s\">β-lactâmicos</text>\n<line x1=\"212\" y1=\"150\" x2=\"120\" y2=\"180\" class=\"ln\"/><text x=\"110\" y=\"176\" class=\"te b\">MEMBRANA</text><text x=\"110\" y=\"194\" class=\"te s\">polimixina</text>\n<line x1=\"390\" y1=\"84\" x2=\"510\" y2=\"50\" class=\"ln\"/><text x=\"520\" y=\"40\" class=\"b\">RIBOSSOMO</text><text x=\"520\" y=\"58\" class=\"s\">aminoglicosídeos</text>\n<line x1=\"340\" y1=\"115\" x2=\"510\" y2=\"128\" class=\"ln\"/><text x=\"520\" y=\"122\" class=\"b\">DNA/RNA</text><text x=\"520\" y=\"140\" class=\"s\">quinolonas</text>\n<line x1=\"380\" y1=\"160\" x2=\"510\" y2=\"196\" class=\"ln\"/><text x=\"520\" y=\"192\" class=\"b\">ÁC. FÓLICO</text><text x=\"520\" y=\"210\" class=\"s\">sulfonamidas</text>\n</svg></figure>\n\n<h3>Exames: do mais rápido ao mais completo</h3>\n<p>A <b>bacterioscopia</b> (30 min a 2 h) dá Gram e forma e orienta o empírico. A <b>cultura</b> dá “nome e sobrenome”: cresce em ~24 h e identifica em 2–3 dias. O <b>antibiograma</b> diz sensível ou resistente e é essencial em internados e infecções de repetição. A amostra vem do sítio suspeito, sem contaminação e <b>nunca em formol</b> (mata as bactérias).</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 170\" role=\"img\" aria-label=\"Fluxo dos exames\" xmlns=\"http://www.w3.org/2000/svg\">\n<line x1=\"20\" y1=\"20\" x2=\"620\" y2=\"20\" class=\"ln\"/>\n<text x=\"20\" y=\"14\" class=\"s\">coleta</text><text x=\"620\" y=\"14\" class=\"te s\">2–3 dias</text>\n<g transform=\"translate(10 40)\"><rect width=\"190\" height=\"92\" rx=\"12\" class=\"hlbox\"/>\n<text x=\"95.0\" y=\"26\" class=\"tc s\">30 min – 2 h</text><text x=\"95.0\" y=\"52\" class=\"tc b\">Bacterioscopia</text><text x=\"95.0\" y=\"74\" class=\"tc s\">Gram + forma → empírico</text></g>\n<text x=\"215\" y=\"92\" class=\"tc b\">→</text>\n<g transform=\"translate(225 40)\"><rect width=\"190\" height=\"92\" rx=\"12\" class=\"card2\"/>\n<text x=\"95.0\" y=\"26\" class=\"tc s\">24 h cresce · 2–3 d ID</text><text x=\"95.0\" y=\"52\" class=\"tc b\">Cultura</text><text x=\"95.0\" y=\"74\" class=\"tc s\">“nome e sobrenome”</text></g>\n<text x=\"430\" y=\"92\" class=\"tc b\">→</text>\n<g transform=\"translate(440 40)\"><rect width=\"190\" height=\"92\" rx=\"12\" class=\"card2\"/>\n<text x=\"95.0\" y=\"26\" class=\"tc s\">junto da cultura</text><text x=\"95.0\" y=\"52\" class=\"tc b\">Antibiograma</text><text x=\"95.0\" y=\"74\" class=\"tc s\">S · I · R → ajusta ATB</text></g>\n<text x=\"320\" y=\"158\" class=\"tc s\">Atípicas, anaeróbios e Mycobacterium (Ziehl-Neelsen) pedem culturas/colorações específicas</text>\n</svg></figure>\n\n<h3>Colonização × infecção e a urocultura</h3>\n<p>Colonização é bactéria presente em equilíbrio, sem doença; infecção é o desequilíbrio com sintomas. Em <b>material estéril</b> (sangue, líquor, pleural, pericárdico, sinovial) qualquer crescimento é patogênico. Onde há microbiota (urina, pele, vias aéreas, TGI) o crescimento precisa ser quantificado. ITU alta (pielonefrite) ou baixa (cistite, uretrite, prostatite), principalmente por enterobactérias, com <i>E. coli</i> à frente.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 160\" role=\"img\" aria-label=\"Régua da urocultura\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"30\" y=\"50\" width=\"190\" height=\"40\" rx=\"8\" class=\"okf\"/><rect x=\"220\" y=\"50\" width=\"200\" height=\"40\" class=\"warnf\"/><rect x=\"420\" y=\"50\" width=\"190\" height=\"40\" rx=\"8\" class=\"badf\"/>\n<text x=\"125\" y=\"75\" class=\"tc b wt\">&lt; 10.000</text><text x=\"320\" y=\"75\" class=\"tc b dk\">10.000 – 100.000</text><text x=\"515\" y=\"75\" class=\"tc b wt\">&gt; 100.000 UFC/mL</text>\n<text x=\"125\" y=\"112\" class=\"tc b\">não é ITU</text><text x=\"125\" y=\"130\" class=\"tc s\">com clínica → atípica?</text><text x=\"125\" y=\"146\" class=\"tc s\">(Chlamydia, gonococo)</text>\n<text x=\"320\" y=\"112\" class=\"tc b\">depende</text><text x=\"320\" y=\"130\" class=\"tc s\">clínica + leucócitos</text><text x=\"320\" y=\"146\" class=\"tc s\">gestante: tratar</text>\n<text x=\"515\" y=\"112\" class=\"tc b\">infecção</text><text x=\"515\" y=\"130\" class=\"tc s\">quase certo</text>\n<text x=\"320\" y=\"30\" class=\"tc s\">Sítio ESTÉRIL (sangue, líquor, pleural…): qualquer crescimento = patogênico</text>\n</svg></figure>\n</section>", "2": "<section class=\"res\">\n<h2>SP2 · Antibiograma</h2>\n<p class=\"lede\">O antibiograma avalia a suscetibilidade da bactéria e <b>nunca é pedido sozinho</b>: vem sempre com a cultura. Em internado, sempre; no ambulatório, conforme o caso.</p>\n\n<h3>Disco difusão</h3>\n<p>Discos de papel com uma concentração fixa de antibiótico (a esperada in vivo) sobre a placa semeada. <b>Halo</b> ao redor = a bactéria não cresceu = <b>sensível</b>; sem halo = <b>resistente</b>; halo pequeno = intermediário (o tamanho de corte é definido por comitês). É o método mais barato, mas cada disco testa uma concentração só, e <b>vancomicina (G+) e polimixina (G−) não são testadas</b> por ele, porque o resultado não é confiável.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Disco difusão\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"150\" cy=\"115\" r=\"100\" class=\"agar st\"/>\n<circle cx=\"110\" cy=\"80\" r=\"34\" class=\"halo\"/><circle cx=\"110\" cy=\"80\" r=\"9\" class=\"paper st\"/>\n<circle cx=\"195\" cy=\"85\" r=\"9\" class=\"paper st\"/>\n<circle cx=\"150\" cy=\"160\" r=\"18\" class=\"halo\"/><circle cx=\"150\" cy=\"160\" r=\"9\" class=\"paper st\"/>\n<line x1=\"144\" y1=\"80\" x2=\"300\" y2=\"50\" class=\"ln\"/><text x=\"310\" y=\"46\" class=\"b\">Halo grande → SENSÍVEL</text><text x=\"310\" y=\"64\" class=\"s\">a bactéria não cresceu ao redor</text>\n<line x1=\"204\" y1=\"85\" x2=\"300\" y2=\"110\" class=\"ln\"/><text x=\"310\" y=\"106\" class=\"b\">Sem halo → RESISTENTE</text><text x=\"310\" y=\"124\" class=\"s\">cresceu encostada no disco</text>\n<line x1=\"168\" y1=\"160\" x2=\"300\" y2=\"168\" class=\"ln\"/><text x=\"310\" y=\"164\" class=\"b\">Halo pequeno → intermediário</text><text x=\"310\" y=\"182\" class=\"s\">corte definido por comitês (BrCAST)</text>\n<rect x=\"300\" y=\"196\" width=\"320\" height=\"28\" rx=\"14\" class=\"hl\"/><text x=\"460\" y=\"215\" class=\"tc s\">1 concentração/disco · <tspan class=\"b\">vanco e polimixina não</tspan></text>\n</svg></figure>\n\n<h3>Microdiluição em caldo (MIC)</h3>\n<p>Vários poços com concentrações crescentes, todos com a bactéria. O primeiro poço que fica limpo é a <b>concentração inibitória mínima (MIC)</b>. Se só uma concentração inatingível com segurança inibe a bactéria, ela é resistente. É mais caro e mais preciso, e permite testar vanco e polimixina. O MIC é específico de cada droga: <b>não se compara MIC entre classes</b>.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 200\" role=\"img\" aria-label=\"Microdiluição e MIC\" xmlns=\"http://www.w3.org/2000/svg\">\n<text x=\"320\" y=\"24\" class=\"tc s\">concentração crescente do antibiótico (µg/mL) →</text>\n<circle cx=\"60\" cy=\"80\" r=\"26\" class=\"turb st\"/><text x=\"60\" y=\"130\" class=\"tc s\">0,25</text><circle cx=\"132\" cy=\"80\" r=\"26\" class=\"turb st\"/><text x=\"132\" y=\"130\" class=\"tc s\">0,5</text><circle cx=\"204\" cy=\"80\" r=\"26\" class=\"turb st\"/><text x=\"204\" y=\"130\" class=\"tc s\">1</text><circle cx=\"276\" cy=\"80\" r=\"26\" class=\"clear st\"/><text x=\"276\" y=\"130\" class=\"tc s\">2</text><circle cx=\"348\" cy=\"80\" r=\"26\" class=\"clear st\"/><text x=\"348\" y=\"130\" class=\"tc s\">4</text><circle cx=\"420\" cy=\"80\" r=\"26\" class=\"clear st\"/><text x=\"420\" y=\"130\" class=\"tc s\">8</text><circle cx=\"492\" cy=\"80\" r=\"26\" class=\"clear st\"/><text x=\"492\" y=\"130\" class=\"tc s\">16</text><circle cx=\"564\" cy=\"80\" r=\"26\" class=\"clear st\"/><text x=\"564\" y=\"130\" class=\"tc s\">32</text>\n<path d=\"M276 46 v-6 h0\" class=\"ln\"/>\n<rect x=\"246\" y=\"146\" width=\"80\" height=\"28\" rx=\"14\" class=\"acc\"/><text x=\"286\" y=\"165\" class=\"tc wt b\">MIC = 2</text>\n<line x1=\"276\" y1=\"140\" x2=\"276\" y2=\"108\" class=\"ln\"/>\n<text x=\"110\" y=\"168\" class=\"tc s\">turvo = cresceu</text><text x=\"470\" y=\"168\" class=\"tc s\">limpo = inibiu</text>\n<text x=\"320\" y=\"194\" class=\"tc s\">MIC inatingível com segurança no corpo = R · <tspan class=\"b\">não comparar MIC entre classes</tspan></text>\n</svg></figure>\n\n<h3>Lendo S · I · R</h3>\n<p><b>S</b> = sensível na dose padrão. <b>I</b> = sensível <b>aumentando a exposição</b> (dose maior ou mais concentração no sítio). <b>R</b> = alta chance de falha mesmo com mais exposição. Num G− multirresistente em que a polimixina não foi testada (disco), ela ainda é opção empírica; o mesmo vale para vancomicina no G+ multirresistente.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 130\" role=\"img\" aria-label=\"S, I, R\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"20\" y=\"20\" width=\"190\" height=\"70\" rx=\"12\" class=\"okf\"/><text x=\"115\" y=\"52\" class=\"tc wt big b\">S</text><text x=\"115\" y=\"76\" class=\"tc wt s\">dose padrão funciona</text>\n<rect x=\"225\" y=\"20\" width=\"190\" height=\"70\" rx=\"12\" class=\"warnf\"/><text x=\"320\" y=\"52\" class=\"tc big b dk\">I</text><text x=\"320\" y=\"76\" class=\"tc s dk\">sensível ↑ exposição</text>\n<rect x=\"430\" y=\"20\" width=\"190\" height=\"70\" rx=\"12\" class=\"badf\"/><text x=\"525\" y=\"52\" class=\"tc wt big b\">R</text><text x=\"525\" y=\"76\" class=\"tc wt s\">falha mesmo ↑ dose</text>\n<text x=\"320\" y=\"118\" class=\"tc s\">G− MDR com polimixina não testada · G+ MDR com vanco não testada → ainda são opções</text>\n</svg></figure>\n\n<h3>O sítio sugere o agente</h3>\n<p>Vale principalmente para ambulatoriais. <mark class=\"t11\" data-q=\"Q2\">Pele → Gram-positivos, com <i>S. aureus</i> predominando; urina → Gram-negativos, com <i>E. coli</i> à frente</mark>. Vias aéreas → <i>Streptococcus</i> (+ <i>Moraxella</i>, <i>Haemophilus</i>); pneumonia → as mesmas + atípicas (<i>Mycoplasma</i>); TGI → enterobactérias (<i>Salmonella</i>, <i>Shigella</i>) e anaeróbios (<i>Clostridium</i>).</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 280\" role=\"img\" aria-label=\"Sítio e agente\" xmlns=\"http://www.w3.org/2000/svg\">\n<circle cx=\"320\" cy=\"40\" r=\"24\" class=\"paper st\"/>\n<rect x=\"282\" y=\"70\" width=\"76\" height=\"120\" rx=\"30\" class=\"paper st\"/>\n<rect x=\"290\" y=\"190\" width=\"24\" height=\"78\" rx=\"12\" class=\"paper st\"/><rect x=\"326\" y=\"190\" width=\"24\" height=\"78\" rx=\"12\" class=\"paper st\"/>\n<circle cx=\"305\" cy=\"100\" r=\"9\" class=\"gp\"/><circle cx=\"335\" cy=\"100\" r=\"9\" class=\"gp\"/>\n<circle cx=\"320\" cy=\"150\" r=\"9\" class=\"gn\"/><circle cx=\"320\" cy=\"180\" r=\"7\" class=\"gn\"/>\n<line x1=\"296\" y1=\"40\" x2=\"210\" y2=\"40\" class=\"ln\"/><g transform=\"translate(20 10)\"><rect width=\"190\" height=\"62\" rx=\"10\" class=\"card2\"/><text x=\"12\" y=\"22\" class=\"b\">Vias aéreas sup.</text><text x=\"12\" y=\"40\" class=\"s\">Streptococcus (predomina)</text><text x=\"12\" y=\"56\" class=\"s\">+ Moraxella, Haemophilus (G−)</text></g>\n<line x1=\"296\" y1=\"100\" x2=\"210\" y2=\"110\" class=\"ln\"/><g transform=\"translate(20 82)\"><rect width=\"190\" height=\"62\" rx=\"10\" class=\"card2\"/><text x=\"12\" y=\"22\" class=\"b\">Pneumonia</text><text x=\"12\" y=\"40\" class=\"s\">Streptococcus · Moraxella</text><text x=\"12\" y=\"56\" class=\"s\">Haemophilus · atípicas</text></g>\n<line x1=\"330\" y1=\"150\" x2=\"430\" y2=\"150\" class=\"ln\"/><g transform=\"translate(430 120)\"><rect width=\"190\" height=\"62\" rx=\"10\" class=\"card2\"/><text x=\"12\" y=\"22\" class=\"b\">TGI</text><text x=\"12\" y=\"40\" class=\"s\">enterobactérias (Salmonella,</text><text x=\"12\" y=\"56\" class=\"s\">Shigella) + anaeróbios</text></g>\n<line x1=\"320\" y1=\"182\" x2=\"430\" y2=\"214\" class=\"ln\"/><g transform=\"translate(430 190)\"><rect width=\"190\" height=\"62\" rx=\"10\" class=\"card2\"/><text x=\"12\" y=\"22\" class=\"b\">ITU</text><text x=\"12\" y=\"40\" class=\"s\">G− · E. coli (principal)</text><text x=\"12\" y=\"56\" class=\"s\">Proteus: R nitrofurantoína</text></g>\n<line x1=\"300\" y1=\"230\" x2=\"210\" y2=\"214\" class=\"ln\"/><g transform=\"translate(20 190)\"><rect width=\"190\" height=\"62\" rx=\"10\" class=\"card2\"/><text x=\"12\" y=\"22\" class=\"b\">Pele</text><text x=\"12\" y=\"40\" class=\"s\">S. aureus (predomina)</text><text x=\"12\" y=\"56\" class=\"s\">anaeróbios no abscesso</text></g>\n</svg></figure>\n<aside class=\"pega t11b\"><b>Caiu na T11 · Q2.</b> Celulite com pus e <b>cocos G+ em cachos</b> + idosa com ITU de fralda e <b>BGN</b> → <b><i>S. aureus</i> e <i>E. coli</i></b>. A armadilha era <i>S. pyogenes</i> (cadeia).</aside>\n\n<h3>Gram-positivos: a oxacilina prediz os β-lactâmicos</h3>\n<p>No <i>S. aureus</i>, penicilina e ampicilina quase sempre são resistentes (penicilinase), e o laboratório pode nem reportar. A <b>oxacilina</b> decide o resto: <b>oxa S</b> → amoxi-clav, cefalosporinas e carbapenêmicos funcionam; <b>oxa R</b> → nenhum β-lactâmico funciona, exceto a <b>ceftarolina</b> (5ª geração, “o unicórnio”, cara). Em <i>S. pneumoniae</i> a oxacilina também prediz os β-lactâmicos, e o Streptococcus costuma ser bem sensível.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Oxacilina prediz beta-lactâmicos\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"230\" y=\"10\" width=\"180\" height=\"40\" rx=\"20\" class=\"gp\"/><text x=\"320\" y=\"35\" class=\"tc wt b\">S. aureus</text>\n<line x1=\"320\" y1=\"50\" x2=\"320\" y2=\"66\" class=\"ln\"/>\n<rect x=\"210\" y=\"66\" width=\"220\" height=\"36\" rx=\"10\" class=\"card2\"/><text x=\"320\" y=\"89\" class=\"tc s\">penicilina/ampicilina: quase sempre <tspan class=\"b\">R</tspan></text>\n<line x1=\"320\" y1=\"102\" x2=\"320\" y2=\"116\" class=\"ln\"/>\n<rect x=\"250\" y=\"116\" width=\"140\" height=\"34\" rx=\"17\" class=\"acc\"/><text x=\"320\" y=\"138\" class=\"tc wt b\">OXACILINA?</text>\n<line x1=\"270\" y1=\"150\" x2=\"160\" y2=\"172\" class=\"ln\"/><line x1=\"370\" y1=\"150\" x2=\"480\" y2=\"172\" class=\"ln\"/>\n<g transform=\"translate(30 172)\"><rect width=\"260\" height=\"54\" rx=\"10\" class=\"okbox\"/><text x=\"130\" y=\"22\" class=\"tc b\">S → todos os β-lactâmicos S</text><text x=\"130\" y=\"42\" class=\"tc s\">amoxi-clav, cefalosporinas, carbapenêmicos</text></g>\n<g transform=\"translate(350 172)\"><rect width=\"260\" height=\"54\" rx=\"10\" class=\"badbox\"/><text x=\"130\" y=\"22\" class=\"tc b\">R (MRSA) → nenhum β-lactâmico</text><text x=\"130\" y=\"42\" class=\"tc s\">exceto ceftarolina (5ª, “unicórnio”)</text></g>\n</svg></figure>\n\n<h3>Gram-negativos: cada antibiótico por si</h3>\n<p>Como os mecanismos variam muito, <b>não há predição</b>: lê-se cada droga (S/I/R). Para enterobactérias testam-se ampicilina, amoxi-clav, pipe-tazo, cefalosporinas de 2ª a 4ª, monobactâmico, carbapenêmicos, além de polimixina, quinolonas, aminoglicosídeos, sulfa-trimetoprima e nitrofurantoína. <i>Pseudomonas</i> tem opções limitadas pela resistência intrínseca: pipe-tazo, ceftazidima/cefepime, carbapenêmicos, aztreonam, cipro, polimixina, amicacina, tobramicina (cheiro de “uva verde” na placa). <b>Atípicas e anaeróbios não têm antibiograma</b> (não crescem na cultura padrão); trata-se pelos padrões conhecidos.</p>\n\n<h3>Intrínseca × adquirida</h3>\n<p><b>Intrínseca</b>: comum a toda a espécie, previsível, herdada pelo cromossomo (ausência de receptor ou enzima própria). Exemplos: <b><i>Proteus</i> → nitrofurantoína</b>; <b><i>Klebsiella</i> → ampicilina</b>. <b>Adquirida</b>: mutação cromossômica ou, mais frequentemente, <b>plasmídeo</b> (vertical ou horizontal); só o antibiograma revela. É ampliada pela prescrição indevida, UTI e transmissão por profissionais e animais.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 210\" role=\"img\" aria-label=\"Intrínseca versus adquirida\" xmlns=\"http://www.w3.org/2000/svg\">\n<text x=\"160\" y=\"22\" class=\"tc b\">Intrínseca (vertical)</text>\n<rect x=\"137.0\" y=\"49.0\" width=\"46\" height=\"18\" rx=\"9.0\" class=\"gn st\" transform=\"rotate(0 160 58)\"/><line x1=\"160\" y1=\"68\" x2=\"110\" y2=\"110\" class=\"ln\"/><line x1=\"160\" y1=\"68\" x2=\"210\" y2=\"110\" class=\"ln\"/>\n<rect x=\"87.0\" y=\"111.0\" width=\"46\" height=\"18\" rx=\"9.0\" class=\"gn st\" transform=\"rotate(0 110 120)\"/><rect x=\"187.0\" y=\"111.0\" width=\"46\" height=\"18\" rx=\"9.0\" class=\"gn st\" transform=\"rotate(0 210 120)\"/>\n<text x=\"160\" y=\"160\" class=\"tc s\">toda a espécie · previsível</text>\n<text x=\"160\" y=\"180\" class=\"tc s\">Proteus → R nitrofurantoína</text><text x=\"160\" y=\"198\" class=\"tc s\">Klebsiella → R ampicilina</text>\n<text x=\"480\" y=\"22\" class=\"tc b\">Adquirida (mutação/plasmídeo)</text>\n<rect x=\"377.0\" y=\"61.0\" width=\"46\" height=\"18\" rx=\"9.0\" class=\"gn st\" transform=\"rotate(0 400 70)\"/><circle cx=\"560\" cy=\"70\" r=\"11\" class=\"gp st\"/><rect x=\"460.0\" y=\"111.0\" width=\"40\" height=\"18\" rx=\"9.0\" class=\"gn st\" transform=\"rotate(30 480 120)\"/>\n<circle cx=\"400\" cy=\"70\" r=\"5\" class=\"none st2\"/>\n<path d=\"M410 66 Q480 30 548 64\" class=\"ln\" stroke-dasharray=\"4 3\" fill=\"none\"/>\n<path d=\"M408 80 Q440 110 470 116\" class=\"ln\" stroke-dasharray=\"4 3\" fill=\"none\"/>\n<text x=\"480\" y=\"160\" class=\"tc s\">qualquer bactéria, a qualquer hora</text>\n<text x=\"480\" y=\"180\" class=\"tc b\">só o antibiograma descobre</text>\n</svg></figure>\n\n<h3>Os 4 mecanismos e o biofilme</h3>\n<p>1) <b>Inativação enzimática</b> (principal): β-lactamases hidrolisam o anel β-lactâmico; os <b>inibidores</b> (clavulanato, tazobactam, sulbactam, avibactam) são “guarda-costas”, mas nem todo inibidor funciona contra toda β-lactamase. 2) <b>Alteração do sítio de ação</b> (PBP no MRSA). 3) <b>Menor permeabilidade</b> (menos porinas no G−). 4) <b>Bomba de efluxo</b>. O <b>biofilme</b> (próteses, parafusos) não é resistência adquirida, mas dificulta a difusão do antibiótico e a resposta, mesmo com antibiograma sensível.</p>\n</section>", "3": "<section class=\"res\">\n<h2>SP3 · Resistências</h2>\n<p class=\"lede\">A SP mais cobrada na T11 (Q3, Q5 e a discursiva A inteira). O raciocínio é sempre: <b>qual bactéria → qual resistência intrínseca → qual adquirida → o antibiótico ainda age?</b></p>\n\n<h3>Gram-negativos: a escada das β-lactamases</h3>\n<p>As β-lactamases dos G− têm potência crescente. <b>AmpC</b>, a mais fraca, derruba cefalosporinas até a <b>3ª geração</b>; sobram 4ª, monobactâmico e carbapenêmicos. <mark class=\"t11\" data-q=\"Q3\"><b>ESBL</b>, sempre adquirida (E. coli, Klebsiella), derruba até a <b>4ª geração e o monobactâmico</b>: sobram os carbapenêmicos</mark>; amoxi-clav depende do antibiograma. <mark class=\"t11\" data-q=\"Q5\"><b>Carbapenemase</b> (KPC, NDM, OXA, IMI), adquirida, derruba <b>todos os β-lactâmicos</b></mark>; inibidores comuns não funcionam; restam <b>polimixina</b>, associações novas (<b>ceftazidima-avibactam</b>) e aminoglicosídeos quando S.</p>\n<figure class=\"fig wide\"><svg viewBox=\"0 0 640 250\" role=\"img\" aria-label=\"Escada das beta-lactamases\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"176\" y=\"30\" class=\"tc s xs\">Ampi</text><text x=\"234\" y=\"30\" class=\"tc s xs\">Amoxi-clav</text><text x=\"292\" y=\"30\" class=\"tc s xs\">Cef 1ª/2ª</text><text x=\"350\" y=\"30\" class=\"tc s xs\">Cef 3ª</text><text x=\"408\" y=\"30\" class=\"tc s xs\">Cef 4ª</text><text x=\"466\" y=\"30\" class=\"tc s xs\">Aztreonam</text><text x=\"524\" y=\"30\" class=\"tc s xs\">Carbapen.</text><text x=\"582\" y=\"30\" class=\"tc s xs\">Polimixina</text><text x=\"12\" y=\"69\" class=\"b\">AmpC adquirida</text><rect x=\"150\" y=\"44\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"176\" y=\"66\" class=\"tc b wt\">R</text><rect x=\"208\" y=\"44\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"234\" y=\"66\" class=\"tc b wt\">S*</text><rect x=\"266\" y=\"44\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"292\" y=\"66\" class=\"tc b wt\">R</text><rect x=\"324\" y=\"44\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"350\" y=\"66\" class=\"tc b wt\">R</text><rect x=\"382\" y=\"44\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"408\" y=\"66\" class=\"tc b wt\">S</text><rect x=\"440\" y=\"44\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"466\" y=\"66\" class=\"tc b wt\">S</text><rect x=\"498\" y=\"44\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"524\" y=\"66\" class=\"tc b wt\">S</text><rect x=\"556\" y=\"44\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"582\" y=\"66\" class=\"tc b wt\">S</text><text x=\"12\" y=\"109\" class=\"b\">AmpC CESP</text><rect x=\"150\" y=\"84\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"176\" y=\"106\" class=\"tc b wt\">R</text><rect x=\"208\" y=\"84\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"234\" y=\"106\" class=\"tc b wt\">R</text><rect x=\"266\" y=\"84\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"292\" y=\"106\" class=\"tc b wt\">R</text><rect x=\"324\" y=\"84\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"350\" y=\"106\" class=\"tc b wt\">R</text><rect x=\"382\" y=\"84\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"408\" y=\"106\" class=\"tc b wt\">S</text><rect x=\"440\" y=\"84\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"466\" y=\"106\" class=\"tc b wt\">S</text><rect x=\"498\" y=\"84\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"524\" y=\"106\" class=\"tc b wt\">S</text><rect x=\"556\" y=\"84\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"582\" y=\"106\" class=\"tc b wt\">S</text><text x=\"12\" y=\"149\" class=\"b\">ESBL</text><rect x=\"150\" y=\"124\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"176\" y=\"146\" class=\"tc b wt\">R</text><rect x=\"208\" y=\"124\" width=\"52\" height=\"34\" rx=\"6\" class=\"warnf\"/><text x=\"234\" y=\"146\" class=\"tc b dk\">dep.</text><rect x=\"266\" y=\"124\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"292\" y=\"146\" class=\"tc b wt\">R</text><rect x=\"324\" y=\"124\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"350\" y=\"146\" class=\"tc b wt\">R</text><rect x=\"382\" y=\"124\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"408\" y=\"146\" class=\"tc b wt\">R</text><rect x=\"440\" y=\"124\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"466\" y=\"146\" class=\"tc b wt\">R</text><rect x=\"498\" y=\"124\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"524\" y=\"146\" class=\"tc b wt\">S</text><rect x=\"556\" y=\"124\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"582\" y=\"146\" class=\"tc b wt\">S</text><text x=\"12\" y=\"189\" class=\"b\">Carbapenemase</text><rect x=\"150\" y=\"164\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"176\" y=\"186\" class=\"tc b wt\">R</text><rect x=\"208\" y=\"164\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"234\" y=\"186\" class=\"tc b wt\">R</text><rect x=\"266\" y=\"164\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"292\" y=\"186\" class=\"tc b wt\">R</text><rect x=\"324\" y=\"164\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"350\" y=\"186\" class=\"tc b wt\">R</text><rect x=\"382\" y=\"164\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"408\" y=\"186\" class=\"tc b wt\">R</text><rect x=\"440\" y=\"164\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"466\" y=\"186\" class=\"tc b wt\">R</text><rect x=\"498\" y=\"164\" width=\"52\" height=\"34\" rx=\"6\" class=\"badf\"/><text x=\"524\" y=\"186\" class=\"tc b wt\">R</text><rect x=\"556\" y=\"164\" width=\"52\" height=\"34\" rx=\"6\" class=\"okf\"/><text x=\"582\" y=\"186\" class=\"tc b wt\">S</text>\n<text x=\"12\" y=\"222\" class=\"s\">AmpC derruba até 3ª → ESBL até 4ª + aztreonam → carbapenemase derruba todos.</text>\n<text x=\"12\" y=\"242\" class=\"s\">* como na aula: clavulanato inibe a AmpC adquirida · CESP = Citrobacter, Enterobacter, Serratia, Providencia</text>\n</svg></figure>\n\n<h3>AmpC: adquirida × CESP</h3>\n<p>A AmpC <b>adquirida</b> (plasmídeo) aparece em <i>E. coli</i>, <i>K. pneumoniae</i>, <i>K. oxytoca</i>, <i>P. mirabilis</i> e, como ensinado em aula, pode ser inibida pelo clavulanato (amoxi-clav funciona; o laudo mostra S). A AmpC <b>constitutiva/cromossômica</b> é <b>intrínseca</b> do grupo <b>CESP</b>: <i>Citrobacter freundii</i>, <i>Enterobacter</i>, <i>Serratia marcescens</i>, <i>Providencia</i>; nelas o clavulanato <b>não</b> funciona e a 3ª geração não serve.</p>\n<aside class=\"pega t11b\"><b>Caiu na T11 · Disc. A, caso 1.</b> Ceftriaxona × <i>Citrobacter freundii</i> com “nenhum mecanismo adquirido” → <b>SUBSTITUIR</b>. A AmpC é intrínseca (CESP) e não aparece na coluna do adquirido.</aside>\n\n<h3>Carbapenemase e os não fermentadores</h3>\n<p><i>Klebsiella pneumoniae</i>, <i>Acinetobacter baumannii</i> e <i>Pseudomonas aeruginosa</i> são as campeãs de carbapenemase (no <i>Acinetobacter</i> é quase regra, e é pior que na <i>Klebsiella</i>); conduta: <b>polimixina (colistina)</b>. Serinocarbapenemases têm serina no sítio ativo; metalo-β-lactamases dependem de cátion. A <i>Pseudomonas</i> pode ter AmpC intrínseca, mas <mark class=\"t11\" data-q=\"Q3\">a <i>Pseudomonas</i> sensível a tudo aceita <b>ceftazidima</b> (3ª com ação antipseudomonas)</mark>; amoxi-clav nunca é opção para ela.</p>\n<p><b>Aminoglicosídeos</b> (gentamicina, amicacina): resistência principalmente por <b>enzimas modificadoras</b> (&gt; 50 descritas); pode ser de alto grau, mas sozinha pesa pouco na terapêutica.</p>\n\n<h3>Staphylococcus: penicilinase, MRSA e MLS</h3>\n<p><b>Penicilinase</b>: β-lactamase que derruba penicilina e ampicilina (R a uma = R à outra); quase universal no <i>Staphylococcus</i>, resistência “tranquila”. <mark class=\"t11\" data-q=\"Q5\"><b>MRSA</b>: gene <b>mecA</b> altera a <b>PBP</b> e o β-lactâmico não reconhece mais o alvo; é <b>adquirida</b>. Oxacilina R (a prova também trouxe cefoxitina R) = todos os β-lactâmicos R</mark>, exceto ceftarolina. Tratamento clássico: <b>vancomicina ou teicoplanina</b>; mais novos: linezolida, daptomicina, tigeciclina.</p>\n<p><b>MLS</b> (macrolídeos, lincosamidas, estreptograminas), adquirida, por dois mecanismos: <b>efluxo (msrA)</b> → eritro R, <b>clinda S</b>; <b>alteração do ribossomo (erm)</b> → eritro R e <b>clinda R</b>. Nada a ver com PBP.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 190\" role=\"img\" aria-label=\"Resistência MLS\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect x=\"230\" y=\"10\" width=\"180\" height=\"38\" rx=\"19\" class=\"gp\"/><text x=\"320\" y=\"34\" class=\"tc wt b\">Eritromicina R</text>\n<line x1=\"320\" y1=\"48\" x2=\"320\" y2=\"64\" class=\"ln\"/>\n<rect x=\"250\" y=\"64\" width=\"140\" height=\"34\" rx=\"17\" class=\"acc\"/><text x=\"320\" y=\"86\" class=\"tc wt b\">Clindamicina?</text>\n<line x1=\"270\" y1=\"98\" x2=\"170\" y2=\"118\" class=\"ln\"/><line x1=\"370\" y1=\"98\" x2=\"470\" y2=\"118\" class=\"ln\"/>\n<g transform=\"translate(40 118)\"><rect width=\"260\" height=\"62\" rx=\"10\" class=\"card2\"/><text x=\"130\" y=\"24\" class=\"tc b\">Cli S → EFLUXO</text><text x=\"130\" y=\"46\" class=\"tc s\">gene msrA (bomba joga ATB fora)</text></g>\n<g transform=\"translate(340 118)\"><rect width=\"260\" height=\"62\" rx=\"10\" class=\"card2\"/><text x=\"130\" y=\"24\" class=\"tc b\">Cli R → RIBOSSOMO alterado</text><text x=\"130\" y=\"46\" class=\"tc s\">gene erm</text></g>\n</svg></figure>\n<aside class=\"pega\"><b>Pegadinhas da Q5 e da disc. A.</b> Oxa R + Eri R + Cli S: é MRSA (mecA, PBP) <i>e</i> MLS por efluxo; a alternativa certa nomeia o MRSA. “MLS com PBP” e “msrA produzindo β-lactamase” estão sempre errados. Oxacilina contra <i>S. aureus</i> só com MLS → <b>MANTER</b>.</aside>\n\n<h3>Vancomicina: VISA, VRSA e VRE</h3>\n<p>A vanco se liga ao terminal <b>D-Ala-D-Ala</b> e impede a montagem da parede. <b>VISA/GISA</b>: a parede <b>espessa</b> e a vanco não alcança todos os sítios (resistência parcial; uso arriscado, com ajustes se não houver opção). <mark class=\"t11\" data-q=\"DA\"><b>VRSA/GRSA</b>: o alvo vira D-Ala-D-X e a vanco não reconhece mais (resistência total, gene <b>vanA</b>); não se usa vanco nem teico</mark>. O <i>S. aureus</i> recebe essa resistência, por plasmídeo, de um <b>Enterococcus resistente (VRE)</b>, e os MRSA são os mais prováveis de adquiri-la. O <b>VRE</b> é adquirido, por precursores de peptidoglicano de baixa afinidade (fenótipos VanA, VanB, VanC…). Opções para VISA/VRSA: linezolida, daptomicina, tigeciclina.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 220\" role=\"img\" aria-label=\"Resistência aos glicopeptídeos\" xmlns=\"http://www.w3.org/2000/svg\">\n<g transform=\"translate(20 20)\"><rect width=\"190\" height=\"180\" rx=\"12\" class=\"okbox\"/>\n<text x=\"95\" y=\"24\" class=\"tc b\">VSSA (normal)</text>\n<rect x=\"30\" y=\"60\" width=\"130\" height=\"18\" class=\"gp\"/>\n<rect x=\"72\" y=\"80\" width=\"46\" height=\"18\" rx=\"4\" class=\"paper st\"/><text x=\"95\" y=\"93\" class=\"tc xs b\">D-Ala-D-Ala</text>\n<circle cx=\"95\" cy=\"122\" r=\"16\" class=\"acc\"/><text x=\"95\" y=\"127\" class=\"tc wt xs b\">vanco</text>\n<text x=\"95\" y=\"160\" class=\"tc s\">encaixa → parede</text><text x=\"95\" y=\"174\" class=\"tc s\">desaba</text></g>\n<g transform=\"translate(225 20)\"><rect width=\"190\" height=\"180\" rx=\"12\" class=\"warnbox\"/>\n<text x=\"95\" y=\"24\" class=\"tc b\">VISA / GISA</text>\n<rect x=\"30\" y=\"44\" width=\"130\" height=\"42\" class=\"gp\"/>\n<rect x=\"72\" y=\"88\" width=\"46\" height=\"18\" rx=\"4\" class=\"paper st\"/><text x=\"95\" y=\"101\" class=\"tc xs b\">D-Ala-D-Ala</text>\n<circle cx=\"95\" cy=\"66\" r=\"16\" class=\"acc\"/><text x=\"95\" y=\"71\" class=\"tc wt xs b\">vanco</text>\n<text x=\"95\" y=\"140\" class=\"tc s\">parede ESPESSA</text><text x=\"95\" y=\"156\" class=\"tc s\">resistência parcial</text><text x=\"95\" y=\"172\" class=\"tc s\">vanco arriscada</text></g>\n<g transform=\"translate(430 20)\"><rect width=\"190\" height=\"180\" rx=\"12\" class=\"badbox\"/>\n<text x=\"95\" y=\"24\" class=\"tc b\">VRSA / GRSA</text>\n<rect x=\"30\" y=\"60\" width=\"130\" height=\"18\" class=\"gp\"/>\n<rect x=\"72\" y=\"80\" width=\"46\" height=\"18\" rx=\"4\" class=\"badf\"/><text x=\"95\" y=\"93\" class=\"tc xs wt b\">D-Ala-D-X</text>\n<circle cx=\"95\" cy=\"132\" r=\"16\" class=\"acc\"/><text x=\"95\" y=\"137\" class=\"tc wt xs b\">vanco</text>\n<text x=\"95\" y=\"166\" class=\"tc s\">alvo trocado · total</text><text x=\"95\" y=\"180\" class=\"tc s\">vanA (vindo do VRE)</text></g>\n</svg></figure>\n\n<h3>Como resolver “manter ou substituir”</h3>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 190\" role=\"img\" aria-label=\"Manter ou substituir\" xmlns=\"http://www.w3.org/2000/svg\">\n<g transform=\"translate(20 20)\"><rect width=\"140\" height=\"96\" rx=\"12\" class=\"card2\"/><text x=\"70\" y=\"26\" class=\"tc b\">1. Bactéria</text><text x=\"70\" y=\"50\" class=\"tc s\">G+ ou G−?</text><text x=\"70\" y=\"70\" class=\"tc s\">vanco só G+</text></g><g transform=\"translate(175 20)\"><rect width=\"140\" height=\"96\" rx=\"12\" class=\"card2\"/><text x=\"70\" y=\"26\" class=\"tc b\">2. Intrínseca</text><text x=\"70\" y=\"50\" class=\"tc s\">CESP, Proteus,</text><text x=\"70\" y=\"70\" class=\"tc s\">Klebsiella, Pseudo</text></g><g transform=\"translate(330 20)\"><rect width=\"140\" height=\"96\" rx=\"12\" class=\"card2\"/><text x=\"70\" y=\"26\" class=\"tc b\">3. Adquirida</text><text x=\"70\" y=\"50\" class=\"tc s\">AmpC, ESBL, carba,</text><text x=\"70\" y=\"70\" class=\"tc s\">MRSA, MLS, GRSA</text></g><g transform=\"translate(485 20)\"><rect width=\"140\" height=\"96\" rx=\"12\" class=\"hlbox\"/><text x=\"70\" y=\"26\" class=\"tc b\">4. Decide</text><text x=\"70\" y=\"50\" class=\"tc s\">o ATB ainda age?</text><text x=\"70\" y=\"70\" class=\"tc s\">MANTER / SUBST.</text></g>\n<text x=\"160\" y=\"74\" class=\"tc b\">→</text><text x=\"315\" y=\"74\" class=\"tc b\">→</text><text x=\"470\" y=\"74\" class=\"tc b\">→</text>\n<text x=\"320\" y=\"150\" class=\"tc s\">Disc. T11: Citrobacter+ceftriaxona = SUBST · GRSA+vanco = SUBST · Pseudo+ceftazidima = MANTER</text>\n<text x=\"320\" y=\"170\" class=\"tc s\">E. coli ESBL+cefepime = SUBST · Klebs. carba+vanco/cefepime = SUBST · S. aureus MLS+oxa = MANTER</text>\n</svg></figure>\n<table class=\"tb\"><thead><tr><th>Grupo</th><th>Resistência</th><th>Derruba</th></tr></thead><tbody>\n<tr><td>G+</td><td>Penicilinase</td><td>penicilina, ampicilina</td></tr>\n<tr><td>G+</td><td>MLS</td><td>eritro e/ou clinda</td></tr>\n<tr class=\"hlr\"><td>G+</td><td>MRSA</td><td>todos os β-lactâmicos (exceto ceftarolina)</td></tr>\n<tr class=\"hlr\"><td>G+</td><td>VRSA/GRSA</td><td>vanco, teico</td></tr>\n<tr><td>G−</td><td>Aminoglicosídeos</td><td>amica, genta</td></tr>\n<tr><td>G−</td><td>AmpC</td><td>até cefalosporina de 3ª</td></tr>\n<tr class=\"hlr\"><td>G−</td><td>ESBL</td><td>até 4ª + monobactâmico</td></tr>\n<tr class=\"hlr\"><td>G−</td><td>Carbapenemase</td><td>todos os β-lactâmicos</td></tr>\n</tbody></table>\n</section>", "4": "<section class=\"res\">\n<h2>SP4 · Sepse e alterações laboratoriais</h2>\n<p class=\"lede\"><b>Sepse</b> (Sepsis-3) é disfunção orgânica com risco de vida causada por <b>resposta desregulada</b> do hospedeiro a uma infecção em <b>qualquer sítio</b> (não só corrente sanguínea), por bactéria, vírus, fungo ou parasita. <b>Choque séptico</b> = sepse com necessidade de <b>vasopressor para PAM ≥ 65 mmHg</b> apesar de volume adequado (no Sepsis-3, também lactato &gt; 2 mmol/L).</p>\n\n<h3>SOFA confirma, qSOFA faz triagem</h3>\n<p>Diagnóstico = <b>infecção + aumento agudo ≥ 2 pontos no SOFA</b>. Em quem já tinha disfunção, compara-se o basal com o pós-infecção (24–48 h); 2 pontos a mais, mesmo num só parâmetro, com infecção = provável sepse. O <b>qSOFA</b> (FR ≥ 22, alteração mental, PAS ≤ 100; ≥ 2 = alerta) é triagem à beira do leito e <b>não confirma</b> sepse. Na aula: SOFA 0–4 risco baixo, 5–6 médio, ≥ 7 alto.</p>\n<table class=\"tb\"><thead><tr><th>SOFA (lab)</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody>\n<tr class=\"hlr\"><td>Plaquetas (mil/mm³)</td><td>&lt; 150</td><td>&lt; 100</td><td>&lt; 50</td><td>&lt; 20</td></tr>\n<tr class=\"hlr\"><td>Creatinina (mg/dL)</td><td>1,2–1,9</td><td>2,0–3,4</td><td>3,5–4,9</td><td>≥ 5,0</td></tr>\n<tr class=\"hlr\"><td>Bilirrubina (mg/dL)</td><td>1,2–1,9</td><td>2,0–5,9</td><td>6,0–11,9</td><td>≥ 12</td></tr>\n</tbody></table>\n<p class=\"cap\">Demais itens do SOFA: PaO₂/FiO₂, PAM/vasopressor e Glasgow. <b>Leucócitos, lactato e glicose não pontuam.</b></p>\n<aside class=\"pega t11b\"><b>Caiu na T11 · Q4 (alternativa D).</b> Plaquetas 92 mil = <b>2</b>; creatinina 2,6 = <b>2</b>; BT 1,25 = <b>1</b> → SOFA lab = <b>5</b>, não 4. Na Q7, paciente 1: 102 mil (1) + Cr 2,1 (2) + BT 1,4 (1) = 4.</aside>\n\n<h3>Por que os exames mudam</h3>\n<p>A resposta sistêmica causa vasodilatação e aumento da permeabilidade: hipotensão, edema e <b>hipoperfusão</b>. O problema é a <b>distribuição</b> do O₂, não a entrada. A célula sem O₂ vira para o metabolismo anaeróbio (com disfunção mitocondrial) e produz <b>ácido lático</b>.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 250\" role=\"img\" aria-label=\"Fisiopatologia da sepse\" xmlns=\"http://www.w3.org/2000/svg\">\n<g transform=\"translate(230 6)\"><rect width=\"180\" height=\"40\" rx=\"10\" class=\"card2\"/><text x=\"90.0\" y=\"25.0\" class=\"tc b\">Infecção (qualquer sítio)</text></g>\n<line x1=\"320\" y1=\"46\" x2=\"320\" y2=\"58\" class=\"ln\"/>\n<g transform=\"translate(200 58)\"><rect width=\"240\" height=\"40\" rx=\"10\" class=\"acc wtbox\"/><text x=\"120.0\" y=\"25.0\" class=\"tc b\">Resposta DESREGULADA</text></g>\n<line x1=\"320\" y1=\"98\" x2=\"320\" y2=\"110\" class=\"ln\"/>\n<g transform=\"translate(150 110)\"><rect width=\"340\" height=\"40\" rx=\"10\" class=\"card2\"/><text x=\"170.0\" y=\"25.0\" class=\"tc b\">Vasodilatação + ↑ permeabilidade</text></g>\n<line x1=\"320\" y1=\"150\" x2=\"200\" y2=\"166\" class=\"ln\"/><line x1=\"320\" y1=\"150\" x2=\"440\" y2=\"166\" class=\"ln\"/>\n<g transform=\"translate(60 166)\"><rect width=\"250\" height=\"40\" rx=\"10\" class=\"card2\"/><text x=\"125.0\" y=\"25.0\" class=\"tc b\">Hipotensão · edema · hipoperfusão</text></g>\n<g transform=\"translate(340 166)\"><rect width=\"240\" height=\"40\" rx=\"10\" class=\"card2\"/><text x=\"120.0\" y=\"25.0\" class=\"tc b\">Consumo da coagulação → CIVD</text></g>\n<line x1=\"185\" y1=\"206\" x2=\"185\" y2=\"214\" class=\"ln\"/><line x1=\"460\" y1=\"206\" x2=\"460\" y2=\"214\" class=\"ln\"/>\n<text x=\"185\" y=\"232\" class=\"tc s\">anaeróbio → <tspan class=\"b\">lactato ↑</tspan>, acidose</text>\n<text x=\"460\" y=\"232\" class=\"tc s\">plaq ↓ · TP ↑ · fibrinog. ↓ · <tspan class=\"b\">D-dímero ↑</tspan></text>\n</svg></figure>\n<table class=\"tb\"><thead><tr><th>Exame</th><th>Na sepse</th><th>SOFA?</th><th>Por quê</th></tr></thead><tbody>\n<tr><td>Leucócitos</td><td>leucocitose neutrofílica</td><td>não</td><td>resposta à infecção; normal <b>não exclui</b></td></tr>\n<tr><td>Desvio à esquerda</td><td>&gt; 8% bastonetes</td><td>não</td><td>medula acelerada</td></tr>\n<tr class=\"hlr\"><td>Plaquetas</td><td>↓</td><td>sim</td><td>consumo (CIVD)</td></tr>\n<tr class=\"hlr\"><td>TP / TTPA</td><td>alargados</td><td>não</td><td>consumo de fatores</td></tr>\n<tr class=\"hlr\"><td>Fibrinogênio</td><td>↓</td><td>não</td><td>consumido</td></tr>\n<tr class=\"hlr\"><td>D-dímero</td><td>↑</td><td>não</td><td>fibrinólise; <b>melhor p/ confirmar CIVD</b></td></tr>\n<tr><td>Lactato</td><td>↑</td><td>não</td><td>metabolismo anaeróbio</td></tr>\n<tr class=\"hlr\"><td>Glicose</td><td>↑</td><td>não</td><td>resistência à insulina (IL-1, IL-6, TNF) + <b>cortisol e glucagon</b></td></tr>\n<tr class=\"hlr\"><td>Bilirrubina</td><td>↑</td><td>sim</td><td>disfunção hepática</td></tr>\n<tr><td>Creatinina/ureia</td><td>↑</td><td>sim</td><td>lesão renal aguda</td></tr>\n</tbody></table>\n<aside class=\"pega t11b\"><b>Caiu na T11 · Q4.</b> Correta: <mark class=\"t11\" data-q=\"Q4\">plaquetas ↓, TAP alargado, fibrinogênio 98 e D-dímero ↑ = <b>CIVD</b>; BT 1,25 = <b>disfunção hepática</b></mark>. Errada: hiperglicemia “por cortisol e <b>insulina</b>” (é glucagon).</aside>\n\n<h3>Gasometria</h3>\n<p>Referências: <b>pH 7,35–7,45 · pCO₂ 35–45 mmHg · HCO₃⁻ 22–26 mEq/L</b>. Truque da aula: pH e pCO₂ em <b>gangorra</b> (direções opostas) = distúrbio <b>respiratório</b>; pH e HCO₃ em <b>elevador</b> (mesma direção) = <b>metabólico</b>.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 220\" role=\"img\" aria-label=\"Gangorra e elevador\" xmlns=\"http://www.w3.org/2000/svg\">\n<g transform=\"translate(20 0)\"><text x=\"140\" y=\"22\" class=\"tc b\">GANGORRA → respiratório</text>\n<polygon points=\"140,150 125,180 155,180\" class=\"ink\"/>\n<line x1=\"40\" y1=\"122\" x2=\"240\" y2=\"178\" class=\"ln\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n<rect x=\"40\" y=\"88\" width=\"60\" height=\"30\" rx=\"8\" class=\"gn\"/><text x=\"70\" y=\"108\" class=\"tc b\">pCO₂ ↑</text>\n<rect x=\"190\" y=\"150\" width=\"56\" height=\"30\" rx=\"8\" class=\"gp\"/><text x=\"218\" y=\"170\" class=\"tc wt b\">pH ↓</text>\n<text x=\"140\" y=\"206\" class=\"tc s\">direções OPOSTAS</text></g>\n<g transform=\"translate(340 0)\"><text x=\"140\" y=\"22\" class=\"tc b\">ELEVADOR → metabólico</text>\n<rect x=\"80\" y=\"36\" width=\"120\" height=\"150\" rx=\"6\" class=\"none st\"/>\n<line x1=\"140\" y1=\"36\" x2=\"140\" y2=\"70\" class=\"ln\"/>\n<rect x=\"88\" y=\"120\" width=\"104\" height=\"60\" rx=\"6\" class=\"card2\"/>\n<text x=\"140\" y=\"146\" class=\"tc b\">pH ↓</text><text x=\"140\" y=\"168\" class=\"tc b\">HCO₃ ↓</text>\n<path d=\"M220 110 v50 M212 150 l8 12 l8 -12\" class=\"ln\" fill=\"none\"/>\n<text x=\"140\" y=\"206\" class=\"tc s\">MESMA direção</text></g>\n</svg></figure>\n<p>Grau de compensação: só o primário alterado = <b>descompensada</b>; primário e compensador alterados com pH fora = <b>parcialmente compensada</b>; pH normal com os dois alterados = <b>compensada</b>; respiratório e metabólico empurrando o pH para o mesmo lado = <b>mista</b> (sempre descompensada). Com pH normal, calcule a <b>distância</b> de cada um até o limite de referência mais próximo: quem estiver mais longe é o primário; o lado do 7,40 diz se é acidose ou alcalose.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 250\" role=\"img\" aria-label=\"Fluxograma da gasometria\" xmlns=\"http://www.w3.org/2000/svg\">\n<g transform=\"translate(240 6)\"><rect width=\"160\" height=\"36\" rx=\"10\" class=\"acc wtbox\"/><text x=\"80.0\" y=\"23.0\" class=\"tc b\">1. Olhe o pH</text></g>\n<line x1=\"280\" y1=\"42\" x2=\"140\" y2=\"60\" class=\"ln\"/><line x1=\"320\" y1=\"42\" x2=\"320\" y2=\"60\" class=\"ln\"/><line x1=\"360\" y1=\"42\" x2=\"500\" y2=\"60\" class=\"ln\"/>\n<g transform=\"translate(40 60)\"><rect width=\"200\" height=\"34\" rx=\"10\" class=\"card2\"/><text x=\"100.0\" y=\"22.0\" class=\"tc b\">< 7,35 acidose</text></g><g transform=\"translate(250 60)\"><rect width=\"140\" height=\"34\" rx=\"10\" class=\"card2\"/><text x=\"70.0\" y=\"22.0\" class=\"tc b\">normal</text></g><g transform=\"translate(400 60)\"><rect width=\"200\" height=\"34\" rx=\"10\" class=\"card2\"/><text x=\"100.0\" y=\"22.0\" class=\"tc b\">> 7,45 alcalose</text></g>\n<text x=\"320\" y=\"118\" class=\"tc s\">2. Quem explica o pH? pCO₂ oposto = <tspan class=\"b\">respiratório</tspan> · HCO₃ mesmo lado = <tspan class=\"b\">metabólico</tspan> · os dois = <tspan class=\"b\">mista</tspan></text>\n<text x=\"320\" y=\"142\" class=\"tc s\">pH normal + os dois alterados → maior DISTÂNCIA da referência manda (lado do 7,40 = ácido/alcalino)</text>\n<g transform=\"translate(20 158)\">\n<g transform=\"translate(0 0)\"><rect width=\"144\" height=\"78\" rx=\"10\" class=\"card2\"/><text x=\"72\" y=\"24\" class=\"tc b\">Descompensada</text><text x=\"72\" y=\"46\" class=\"tc s\">primário alterado</text><text x=\"72\" y=\"64\" class=\"tc s\">compensador normal</text></g><g transform=\"translate(152 0)\"><rect width=\"144\" height=\"78\" rx=\"10\" class=\"card2\"/><text x=\"72\" y=\"24\" class=\"tc b\">Parcialmente</text><text x=\"72\" y=\"46\" class=\"tc s\">os dois alterados</text><text x=\"72\" y=\"64\" class=\"tc s\">pH ainda fora</text></g><g transform=\"translate(304 0)\"><rect width=\"144\" height=\"78\" rx=\"10\" class=\"card2\"/><text x=\"72\" y=\"24\" class=\"tc b\">Compensada</text><text x=\"72\" y=\"46\" class=\"tc s\">os dois alterados</text><text x=\"72\" y=\"64\" class=\"tc s\">pH 7,35–7,45</text></g><g transform=\"translate(456 0)\"><rect width=\"144\" height=\"78\" rx=\"10\" class=\"badbox\"/><text x=\"72\" y=\"24\" class=\"tc b\">Mista</text><text x=\"72\" y=\"46\" class=\"tc s\">resp + met</text><text x=\"72\" y=\"64\" class=\"tc s\">sempre descomp.</text></g>\n</g>\n</svg></figure>\n<p><mark class=\"t11\" data-q=\"Q4 Q8\">Na sepse, o clássico é <b>acidose metabólica parcialmente compensada</b>: lactato gera H⁺, o HCO₃ é consumido no tampão, e o paciente hiperventila (pCO₂ ↓) para compensar</mark>.</p>\n<aside class=\"pega t11b\"><b>Caiu na T11 · Disc. B</b> (sem correção parcial: faltou um item, perde o paciente). P1 7,53/45,8/29,9 = alcalose metabólica parcialmente compensada · P2 7,20/49,6/17,5 = acidose mista · P3 7,31/61,2/24,7 = acidose respiratória descompensada · P4 7,38/33,1/16,5 = acidose metabólica compensada (distância 1,9 × 5,5) · P5 7,47/29,0/20,2 = alcalose respiratória parcialmente compensada.</aside>\n</section>", "5": "<section class=\"res\">\n<h2>SP5 · Hemocultura</h2>\n<p class=\"lede\">Bacteremia, fungemia e viremia = bactéria, fungo e vírus no sangue. A bacteremia é a que mais leva a sepse. A hemocultura responde três perguntas: <b>tem bactéria? qual? de onde veio?</b></p>\n\n<h3>Classificação das infecções da corrente sanguínea</h3>\n<p><mark class=\"t11\" data-q=\"Q8\"><b>Secundária</b> (a mais comum): há foco primário identificável em outro sítio, como a ITU que se espalha para o sangue</mark>. <b>Relacionada ao cateter</b>: o cateter vascular é a fonte; confirmada, o dispositivo precisa ser trocado. <b>Primária</b>: hemocultura positiva <b>sem</b> foco identificável.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 190\" role=\"img\" aria-label=\"Classificação das ICS\" xmlns=\"http://www.w3.org/2000/svg\">\n<g transform=\"translate(220 6)\"><rect width=\"200\" height=\"38\" rx=\"10\" class=\"acc wtbox\"/><text x=\"100.0\" y=\"24.0\" class=\"tc b\">Sangue positivo</text></g>\n<line x1=\"280\" y1=\"44\" x2=\"110\" y2=\"66\" class=\"ln\"/><line x1=\"320\" y1=\"44\" x2=\"320\" y2=\"66\" class=\"ln\"/><line x1=\"360\" y1=\"44\" x2=\"530\" y2=\"66\" class=\"ln\"/>\n<g transform=\"translate(15 66)\"><rect width=\"190\" height=\"110\" rx=\"12\" class=\"hlbox\"/><text x=\"95\" y=\"26\" class=\"tc b\">SECUNDÁRIA</text><text x=\"95\" y=\"50\" class=\"tc s\">foco em outro sítio</text><text x=\"95\" y=\"70\" class=\"tc s\">(porta de entrada)</text><text x=\"95\" y=\"94\" class=\"tc s it\">a mais comum · ex.: ITU</text></g><g transform=\"translate(225 66)\"><rect width=\"190\" height=\"110\" rx=\"12\" class=\"card2\"/><text x=\"95\" y=\"26\" class=\"tc b\">RELAC. AO CATETER</text><text x=\"95\" y=\"50\" class=\"tc s\">cateter = fonte</text><text x=\"95\" y=\"70\" class=\"tc s\">→ trocar o cateter</text><text x=\"95\" y=\"94\" class=\"tc s it\">cateter > 2 h antes</text></g><g transform=\"translate(435 66)\"><rect width=\"190\" height=\"110\" rx=\"12\" class=\"card2\"/><text x=\"95\" y=\"26\" class=\"tc b\">PRIMÁRIA</text><text x=\"95\" y=\"50\" class=\"tc s\">sem foco</text><text x=\"95\" y=\"70\" class=\"tc s\">identificável</text><text x=\"95\" y=\"94\" class=\"tc s it\">“não acho a porta”</text></g>\n</svg></figure>\n\n<h3>Quando pedir e como colher</h3>\n<p>Indicações: bacteremia, sepse, febre de origem desconhecida (inclusive oncológicos em quimioterapia), leucocitose com formas imaturas e paciente em antibiótico <b>sem melhora</b>.</p>\n<table class=\"tb\"><tbody>\n<tr><td>Quando</td><td><b>Antes do antibiótico</b>; se já em uso, antes da próxima dose (senão, falso-negativo), sem atrasar o início do ATB</td></tr>\n<tr><td>Antissepsia</td><td><b>Clorexidina</b> (evita contaminação por flora da pele)</td></tr>\n<tr><td>Adulto</td><td><b>2–3</b> amostras, <b>frasco adulto, 8–10 mL</b> cada, punções de sítios diferentes</td></tr>\n<tr><td>Criança</td><td>≥ 1 amostra, <b>frasco pediátrico, 1–3 mL</b></td></tr>\n<tr><td>Mesmo sítio</td><td>só com <b>≥ 30 min</b> de diferença</td></tr>\n<tr><td>Com CVC</td><td><b>uma do cateter + uma periférica</b></td></tr>\n</tbody></table>\n<p>O volume é fixo porque o frasco contém <b>SPS</b> (polianetossulfonato de sódio): anticoagulante, anticomplemento, antifagocitário e inibidor de <b>aminoglicosídeos e polimixinas</b>. Sangue de menos dilui; de mais, coagula.</p>\n\n<h3>Tempo: geração, incubação e laudo</h3>\n<p>Tempo de geração (dobrar a população) costuma ser 1–3 h; <i>E. coli</i>, 20 min (mais de um milhão em ~7 h); a bactéria da hanseníase, 14 dias. Por isso, quando há bactéria, a garrafa positiva no <b>1º, no máximo 2º dia</b>; para descartar aeróbios, <b>5 dias</b>. Anaeróbios, fungos e atípicas pedem frascos específicos (até 20–30 dias). Mais isolados: <i>S. aureus</i>, SCN, <i>Enterococcus</i>, <i>S. pneumoniae</i>; <i>E. coli</i>, <i>K. pneumoniae</i>, <i>Enterobacter (K. aerogenes)</i>, <i>P. aeruginosa</i>; fungos <i>Candida</i>, <i>Cryptococcus</i>.</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 190\" role=\"img\" aria-label=\"Linha do tempo da hemocultura\" xmlns=\"http://www.w3.org/2000/svg\">\n<line x1=\"40\" y1=\"70\" x2=\"610\" y2=\"70\" class=\"ln\" stroke-width=\"3\"/>\n<line x1=\"40\" y1=\"64\" x2=\"40\" y2=\"76\" class=\"ln\"/><text x=\"40\" y=\"58\" class=\"tc s\">dia 0</text><line x1=\"154\" y1=\"64\" x2=\"154\" y2=\"76\" class=\"ln\"/><text x=\"154\" y=\"58\" class=\"tc s\">dia 1</text><line x1=\"268\" y1=\"64\" x2=\"268\" y2=\"76\" class=\"ln\"/><text x=\"268\" y=\"58\" class=\"tc s\">dia 2</text><line x1=\"382\" y1=\"64\" x2=\"382\" y2=\"76\" class=\"ln\"/><text x=\"382\" y=\"58\" class=\"tc s\">dia 3</text><line x1=\"496\" y1=\"64\" x2=\"496\" y2=\"76\" class=\"ln\"/><text x=\"496\" y=\"58\" class=\"tc s\">dia 4</text><line x1=\"610\" y1=\"64\" x2=\"610\" y2=\"76\" class=\"ln\"/><text x=\"610\" y=\"58\" class=\"tc s\">dia 5</text>\n<rect x=\"154\" y=\"80\" width=\"114\" height=\"30\" rx=\"8\" class=\"hlbox\"/><text x=\"211\" y=\"100\" class=\"tc b xs\">positiva aqui (1º–2º d)</text>\n<rect x=\"500\" y=\"80\" width=\"110\" height=\"30\" rx=\"8\" class=\"card2\"/><text x=\"555\" y=\"100\" class=\"tc b xs\">descarte: 5 dias</text>\n<g transform=\"translate(40 126)\"><rect width=\"270\" height=\"54\" rx=\"10\" class=\"card2\"/><text x=\"135\" y=\"22\" class=\"tc b\">Parcial: Gram + forma</text><text x=\"135\" y=\"42\" class=\"tc s\">→ direciona o empírico</text></g>\n<g transform=\"translate(330 126)\"><rect width=\"270\" height=\"54\" rx=\"10\" class=\"card2\"/><text x=\"135\" y=\"22\" class=\"tc b\">Final: nome + antibiograma</text><text x=\"135\" y=\"42\" class=\"tc s\">→ troca/ajusta o ATB</text></g>\n<text x=\"320\" y=\"24\" class=\"tc s\">E. coli dobra a cada 20 min · maioria 1–3 h · anaeróbios/fungos: frasco próprio, 20–30 dias</text>\n</svg></figure>\n\n<h3>Cateter ou periferia? O corte de 2 horas</h3>\n<p>Se o cateter é a fonte, há muito mais bactéria na luz e o frasco do cateter positiva antes. <b>Cateter &gt; 2 h antes da periférica</b> → infecção relacionada ao cateter. <mark class=\"t11\" data-q=\"Q8\"><b>Periférica positiva primeiro</b> → não é o cateter</mark>. Cateter primeiro mas com diferença <b>&lt; 2 h</b> → inconclusivo (nova coleta ou troca por garantia).</p>\n<figure class=\"fig\"><svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Tempo de positividade\" xmlns=\"http://www.w3.org/2000/svg\">\n<text x=\"20\" y=\"22\" class=\"b\">Tempo de positividade (TP)</text>\n<line x1=\"120\" y1=\"60\" x2=\"610\" y2=\"60\" class=\"ln\"/><line x1=\"120\" y1=\"120\" x2=\"610\" y2=\"120\" class=\"ln\"/><line x1=\"120\" y1=\"180\" x2=\"610\" y2=\"180\" class=\"ln\"/>\n<text x=\"20\" y=\"48\" class=\"s\">Caso A</text><circle cx=\"200\" cy=\"60\" r=\"9\" class=\"gp\"/><text x=\"200\" y=\"84\" class=\"tc xs\">cateter</text><circle cx=\"450\" cy=\"60\" r=\"9\" class=\"gn\"/><text x=\"450\" y=\"84\" class=\"tc xs\">periférica</text>\n<line x1=\"200\" y1=\"44\" x2=\"450\" y2=\"44\" class=\"ln\"/><text x=\"325\" y=\"40\" class=\"tc xs b\">&gt; 2 h</text><text x=\"530\" y=\"56\" class=\"b\">É o CATETER</text>\n<text x=\"20\" y=\"108\" class=\"s\">Caso B</text><circle cx=\"230\" cy=\"120\" r=\"9\" class=\"gn\"/><text x=\"230\" y=\"144\" class=\"tc xs\">periférica 15:02</text><circle cx=\"330\" cy=\"120\" r=\"9\" class=\"gp\"/><text x=\"330\" y=\"144\" class=\"tc xs\">cateter 16:36</text><text x=\"530\" y=\"116\" class=\"b\">NÃO é cateter</text><text x=\"530\" y=\"134\" class=\"s\">(Q8 da T11)</text>\n<text x=\"20\" y=\"168\" class=\"s\">Caso C</text><circle cx=\"230\" cy=\"180\" r=\"9\" class=\"gp\"/><text x=\"230\" y=\"204\" class=\"tc xs\">cateter</text><circle cx=\"320\" cy=\"180\" r=\"9\" class=\"gn\"/><text x=\"320\" y=\"204\" class=\"tc xs\">periférica</text>\n<line x1=\"230\" y1=\"164\" x2=\"320\" y2=\"164\" class=\"ln\"/><text x=\"275\" y=\"160\" class=\"tc xs b\">&lt; 2 h</text><text x=\"530\" y=\"176\" class=\"b\">Inconclusivo</text>\n</svg></figure>\n<aside class=\"pega t11b\"><b>Caiu na T11 · Q8.</b> ITU por <i>E. coli</i> com CVC: periférica 15:02, cateter 16:36 → não é o cateter; com foco urinário = <b>ICS secundária</b>. Na mesma questão, o paciente 2 (pH 7,22 · pCO₂ 18,9 · HCO₃ 7,1) é acidose metabólica parcialmente compensada com lactato por metabolismo anaeróbio.</aside>\n\n<h3>Caso da aula: Klebsiella resistente</h3>\n<p>Pneumonia com internação recente de 3 meses, qSOFA 2. Ceftriaxona empírica. D1: hemoculturas com <b>BGN</b>. D2: piora renal, hemodiálise, leucocitose 41.500, plaquetopenia, TAP alargado, hiperglicemia, acidose com hiperlactatemia. D3: <i>K. pneumoniae</i> R a ceftriaxona e meropenem → provável <b>carbapenemase</b>; trocar pelo que está S (amicacina ou gentamicina).</p>\n\n<h3>Colonização e culturas de vigilância</h3>\n<p>Colonizado = microrganismo presente sem dano; <b>não se trata</b>, nem se for multirresistente (polimixina ou ceftazidima-avibactam para colonizado só criam problema). Conduta: <b>isolar</b>. As culturas de vigilância detectam colonização por MDR em assintomáticos de risco e <b>não liberam antibiograma</b>; o paciente pode ter alta colonizado.</p>\n<table class=\"tb\"><thead><tr><th>Vigilância (como na aula)</th><th>Amostra</th></tr></thead><tbody>\n<tr><td>Adulto · carbapenemase</td><td>orofaringe</td></tr>\n<tr><td>Infantil · G− multirresistente</td><td>anal/retal</td></tr>\n<tr><td>Infantil · MRSA</td><td>nasal</td></tr>\n</tbody></table>\n</section>"};
