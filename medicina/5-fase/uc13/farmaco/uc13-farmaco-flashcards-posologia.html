<style>

  #qFront{font-size:20px;font-weight:700}
  #back{display:none;width:100%}

  #fim button.sec{background:var(--accent-soft);color:var(--accent);margin-left:8px}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:16px}

</head>

let filtro="all",fila=[],idx=0,ok=0,err=0,erradas=[],virado=false;
const $=id=>document.getElementById(id);
function buildChips(){
  const chips=[["all","Todas ("+CARDS.length+")"]].concat(Object.keys(CATS).map(k=>[k,CATS[k].n+" ("+CARDS.filter(c=>c.c===k).length+")"]));
  $("chips").innerHTML=chips.map(([k,n])=>`<span class="chip${k===filtro?" on":""}" data-k="${k}">${n}</span>`).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filtro=c.dataset.k;start();});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(soErradas){
  const base=soErradas?erradas.slice():CARDS.filter(c=>filtro==="all"||c.c===filtro);
  fila=shuffle(base.slice());idx=0;ok=0;err=0;erradas=[];
  $("fim").classList.add("hidden");$("card").style.display="flex";
  buildChips();mostra();
}
function mostra(){
  virado=false;
  if(idx>=fila.length){return fim();}
  const c=fila[idx];
  $("cat").textContent=CATS[c.c].n;$("cat").style.background=CATS[c.c].cor;
  $("qFront").textContent=c.q;
  $("qTop").textContent=c.q;
  $("resp").textContent=c.a;
  $("why").textContent=c.w||"";$("why").style.display=c.w?"block":"none";
  $("qFront").style.display="block";$("back").style.display="none";
  $("hint").textContent="toque para ver a resposta";
  $("actions").classList.add("hidden");
  $("pos").textContent=(idx+1)+" / "+fila.length;
  $("nOk").textContent=ok;$("nErr").textContent=err;
}
function vira(){
  if(virado)return;virado=true;
  $("qFront").style.display="none";$("back").style.display="block";
  $("hint").textContent="acertou? marca embaixo 👇";
  $("actions").classList.remove("hidden");
}
function responde(acertou){
  if(!virado)return;
  if(acertou){ok++;}else{err++;erradas.push(fila[idx]);}
  idx++;mostra();
}
function fim(){
  $("card").style.display="none";$("actions").classList.add("hidden");
  $("fim").classList.remove("hidden");
  const total=ok+err;
  $("fimTitulo").textContent=err===0?"🏆 Zerou!":`Rodada: ${ok}/${total}`;
  $("fimTexto").textContent=err===0?"Tudo certo nessa leva.":`${err} para repetir — vai nelas até zerar.`;
  $("btnErradas").style.display=err?"inline-block":"none";
}
$("card").onclick=vira;
$("btnAcertei").onclick=()=>responde(true);
$("btnErrei").onclick=()=>responde(false);
$("btnErradas").onclick=()=>start(true);
$("btnReiniciar").onclick=()=>start(false);
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();vira();}
  if(e.key==="1"&&virado)responde(false);
  if(e.key==="2"&&virado)responde(true);
});
buildChips();start();
</script>
