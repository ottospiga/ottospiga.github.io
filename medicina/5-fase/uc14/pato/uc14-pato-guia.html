<script>window.EXPL=window.EXPL||{};
EXPL.A1={titulo:"Esôfago — um tubo que só sabe empurrar",
blocos:[
{t:"h",x:"Como o esôfago denuncia a doença"},
{t:"p",x:"O esôfago tem um trabalho só: levar o bolo da faringe ao estômago e impedir que o conteúdo do estômago volte. Para isso ele depende de duas coisas — uma luz aberta e uma onda peristáltica coordenada, que termina com o <b>esfíncter esofágico inferior (EEI)</b> relaxando na hora certa. Quase toda doença do esôfago estraga uma dessas duas peças, e é por isso que ela aparece primeiro como sintoma de transporte, muito antes de qualquer exame."},
{t:"p",x:"O sintoma-mestre é a <b>disfagia</b>, a sensação de que o alimento para no caminho. Em volta dela giram a <b>pirose</b> (a azia, que aponta para refluxo), a <b>regurgitação</b> (o alimento volta sem esforço, sem a náusea e a contração abdominal do vômito) e a <b>dor torácica</b>, que pode imitar dor cardíaca porque esôfago e coração dividem a mesma inervação visceral."},
{t:"p",x:"O raciocínio que a professora quer é ler a disfagia pelo seu padrão. Um obstáculo físico — estenose, tumor — deixa passar líquido e segura o sólido; por isso a disfagia <b>mecânica</b> começa pelos sólidos e é <b>progressiva</b>, acompanhando o estreitamento. Um defeito de motor não escolhe o que empurra: na disfagia <b>motora</b> (acalasia) sólidos e líquidos engasgam <b>desde o início</b>. Quando ela é <b>intermitente</b>, com episódios de alimento entalado, pense em motilidade ou em esofagite eosinofílica. E se o que domina é a pirose, com disfagia leve, o nome é DRGE."},
{t:"f",id:"svg:disfagia"},
{t:"k",r:"Regra de bolso do slide",x:"<b>Progressiva = mecânica · desde o início = motora.</b> A questão 8 da T11 foi exatamente isso: disfagia para sólidos e líquidos desde o início + regurgitação sem náusea → o mecanismo pedido era a degeneração dos neurônios inibitórios do plexo mioentérico. As outras alternativas eram o mecanismo da DRGE, da EEo e da estenose."},

{t:"h",x:"Atresia esofágica: o tubo que não se separou"},
{t:"p",x:"No embrião, traqueia e esôfago nascem do mesmo tubo, o intestino anterior, que depois é dividido por um septo. Quando essa separação falha, o esôfago termina em fundo cego — é a <b>atresia</b> — e muitas vezes fica uma comunicação com a traqueia, a <b>fístula traqueoesofágica (FTE)</b>. A forma mais comum (cerca de 86%) é o coto proximal cego com a fístula saindo do segmento distal."},
{t:"p",x:"A clínica decorre direto da anatomia. O recém-nascido não consegue engolir nem a própria saliva, que se acumula no coto: <b>salivação excessiva</b>, engasgos, dificuldade para mamar e <b>cianose nas tentativas de alimentação</b>, porque o que não desce acaba aspirado. Quando a fístula é distal, o ar da traqueia passa para o estômago e o abdome <b>distende</b>. O diagnóstico é simples: a <b>sonda nasogástrica não progride</b> e o RX mostra a sonda enrolada no coto proximal. O tratamento é cirúrgico."},
{t:"f",id:"svg:atresia"},
{t:"k",r:"Como ela corrigiu na T11",x:"No caso do recém-nascido (Q13-C), a veterana escreveu só “atresia esofágica” e a professora completou à caneta: <b>“com fístula”</b>, tirando parte do ponto. Na hipótese diagnóstica, escreva o nome inteiro: <b>atresia de esôfago com fístula traqueoesofágica</b>."},

{t:"h",x:"Estenose: o tubo que estreitou"},
{t:"p",x:"Estenose é o estreitamento da luz. Pode ser <b>congênita</b> (duplicação da mucosa, anéis fibrosos) ou, bem mais frequente, <b>adquirida</b>: toda agressão que inflama a parede por tempo suficiente termina em fibrose, e fibrose retrai. Por isso a lista de causas adquiridas é uma lista de agressões — DRGE crônica (esofagite que cicatriza estreitando), ingestão de cáusticos, radioterapia, cicatriz de anastomose e neoplasias, a causa que mais preocupa no adulto."},
{t:"p",x:"O quadro é a disfagia mecânica típica: <b>progressiva, primeiro para sólidos</b>. Endoscopia e exame contrastado (bário) mostram o estreitamento; o tratamento é a <b>dilatação endoscópica</b>, com cirurgia se necessário."},

{t:"h",x:"Acalasia: o esfíncter que esqueceu de relaxar"},
{t:"p",x:"A parede do tubo digestivo tem dois plexos nervosos. O <b>submucoso (Meissner)</b> cuida de secreção e fluxo sanguíneo; o <b>mioentérico (Auerbach)</b>, entre as camadas musculares, comanda a peristalse. Dentro do mioentérico há neurônios excitatórios, que contraem, e <b>inibitórios</b>, que relaxam liberando <b>óxido nítrico (NO) e VIP</b>. São os inibitórios que abrem o EEI a cada deglutição e que organizam a onda em sequência."},
{t:"p",x:"Na acalasia esses neurônios inibitórios degeneram. Sem NO e VIP, o <b>EEI não relaxa</b> e fica hipertônico, e o corpo do esôfago <b>perde a peristalse</b>. O bolo chega a uma porta fechada, empurrado por uma parede que não se contrai em onda: ele se acumula, o esôfago dilata acima do esfíncter e o alimento volta — <b>regurgitação sem náusea</b>, muitas vezes de comida não digerida, com <b>halitose</b> e <b>perda de peso</b>. Como o problema é o motor, a disfagia é para <b>sólidos e líquidos desde o início</b>."},
{t:"p",x:"Na maioria das vezes ela é <b>primária (idiopática)</b>. A hipótese mais aceita é autoimune: uma infecção viral (HSV-1, por exemplo) desencadearia uma resposta que destrói seletivamente os neurônios inibitórios — já se acharam infiltrado linfocitário e autoanticorpos contra neurônios entéricos. Há casos familiares raros, como a <b>síndrome de Allgrove</b> (acalasia + alacrimia + insuficiência adrenal). A <b>secundária</b> tem na <b>doença de Chagas</b> a principal causa na América Latina: o <i>Trypanosoma cruzi</i> destrói os neurônios do plexo. Outras: neoplasia da junção esofagogástrica que infiltra ou comprime o EEI (<b>pseudoacalasia</b>), amiloidose e sarcoidose, vírus em imunossuprimidos e síndromes paraneoplásicas."},
{t:"p",x:"No diagnóstico, cada exame tem um papel. A <b>esofagografia baritada</b> mostra a imagem clássica: esôfago dilatado que afila no EEI em <b>“bico de pássaro”</b>. A <b>manometria</b> é o <b>padrão-ouro</b>, porque mede o defeito: EEI hipertônico que não relaxa + ausência de peristalse. A <b>endoscopia</b> entra para excluir pseudoacalasia, isto é, um câncer da junção. O tratamento abre a porta: <b>dilatação pneumática</b> (balão), <b>miotomia de Heller</b> (cirurgia) ou <b>toxina botulínica</b> nos pacientes de alto risco cirúrgico."},
{t:"f",id:"img:acal_bario"},
{t:"k",r:"Sua anotação no slide 9",x:"“Plexo nervoso tem dois: glandular e fluxo sanguíneo · plexo mioentérico → função de peristaltismo.” É a peça que explica tudo: na acalasia o que morre é o neurônio <b>inibitório do mioentérico</b>. Se a alternativa falar em submucoso, em neurônio excitatório ou em “aumento de NO”, está errada."},

{t:"h",x:"Esofagites: o nome para qualquer inflamação da mucosa"},
{t:"p",x:"Esofagite é qualquer inflamação da mucosa esofágica. O espectro vai de hiperemia e edema a úlceras e, com o tempo, às complicações de cicatrização — <b>estenose</b> — ou de adaptação — <b>metaplasia intestinal (Barrett)</b>. Os tipos que ela lista: <b>refluxo (o mais comum)</b>, <b>eosinofílica (alérgica)</b>, <b>infecciosa</b> (Candida, HSV, CMV — sobretudo no imunossuprimido), <b>medicamentosa</b> e <b>cáustica</b>."},

{t:"h",x:"Esofagite eosinofílica: alergia que remodela o tubo"},
{t:"p",x:"A EEo é uma doença inflamatória <b>crônica e imunomediada</b>: o esôfago reage a alérgenos, principalmente alimentares (e, em menor grau, aeroalérgenos), com uma resposta do tipo <b>Th2</b>. Por isso ela aparece em quem já tem terreno atópico — asma, rinite, dermatite atópica —, em <b>crianças e adultos jovens</b>, mais no <b>sexo masculino</b>."},
{t:"p",x:"A sequência é bonita de acompanhar. O linfócito Th2 ativado libera <b>IL-5</b>, que faz a medula produzir e ativar eosinófilos, e <b>IL-13</b>, que manda o epitélio esofágico produzir <b>eotaxina-3</b> — a quimiocina que chama os eosinófilos para a mucosa. Lá, eles liberam proteína catiônica eosinofílica, peroxidase eosinofílica e leucotrienos, que lesam o epitélio e mantêm a inflamação. Com o tempo vem o <b>remodelamento</b>: fibrose e disfunção motora. A parede endurece e a luz estreita — daí <b>disfagia</b> e <b>impactação alimentar</b>."},
{t:"p",x:"Clinicamente: disfagia principalmente para <b>sólidos</b>, <b>impactação alimentar</b> (o alimento “entala”, típico do adolescente e do adulto), dor torácica não cardíaca e pirose, menos que na DRGE. Na criança predominam vômitos recorrentes e dor abdominal. O diagnóstico é <b>histológico</b>: biópsia com <b>≥ 15 eosinófilos por campo de grande aumento</b>, em <b>pelo menos duas regiões</b> do esôfago. A endoscopia sugere: <b>anéis</b> concêntricos (“esôfago traqueizado”), <b>sulcos longitudinais</b>, <b>exsudatos esbranquiçados</b> (que são coleções de eosinófilos), edema com perda do padrão vascular e, nos casos avançados, estenoses."},
{t:"f",id:"img:eeo_endo"},
{t:"p",x:"O tratamento segue os <b>“3 Ds”</b>. <b>Dieta</b>: tirar os antígenos — a dieta de exclusão empírica remove os seis principais (leite, trigo, ovo, frutos do mar, nozes e soja) e reintroduz aos poucos com controle endoscópico. <b>Drogas</b>: IBP, corticoide tópico engolido (budesonida, fluticasona) e corticoide sistêmico só nos graves ou refratários. <b>Dilatação</b>: para estenose grave ou impactação recorrente — alivia a mecânica, mas <b>não trata a inflamação</b>."},
{t:"k",r:"EEo × DRGE (slide 20)",x:"EEo → disfagia + impactação, jovem atópico · DRGE → pirose + regurgitação, adulto. Foi o caso Q13-B da T11: 25 anos, atopia, disfagia intermitente para sólidos com impactação, <b>nega pirose</b> → esofagite eosinofílica."},

{t:"h",x:"DRGE: quando a barreira cede"},
{t:"p",x:"O estômago vive sob pressão maior que o esôfago torácico, então o refluxo seria a regra se não houvesse uma <b>barreira anti-refluxo</b>: o <b>EEI</b> (componente interno) somado ao <b>hiato diafragmático</b>, que o abraça por fora. A barreira funciona enquanto mantiver a pressão acima da do estômago. A DRGE é o <b>refluxo crônico</b> que passa dessa barreira e produz sintomas e/ou lesão da mucosa."},
{t:"p",x:"Ela falha de três jeitos. O <b>tônus basal do EEI cai</b> — benzodiazepínicos, anticolinérgicos, tabagismo, gravidez, idade. Aparecem <b>relaxamentos transitórios</b> do esfíncter fora da deglutição — distensão gástrica, chocolate, álcool, café, obesidade (por estímulo vagal). Ou a <b>pressão intra-abdominal sobe</b> e vence a barreira — obesidade, gestação, ascite, esforço. Somam-se a <b>hérnia hiatal</b> (que desmonta a dupla EEI + diafragma), o esvaziamento gástrico lento e a hipersensibilidade esofágica."},
{t:"p",x:"O quadro típico é <b>pirose + regurgitação</b>, às vezes com disfagia leve; as formas <b>atípicas</b> são tosse crônica, rouquidão e dor torácica. As complicações seguem a lógica da agressão repetida: <b>esofagite erosiva</b>, <b>estenose péptica</b>, <b>esôfago de Barrett</b> e, no crônico com Barrett, <b>adenocarcinoma</b>."},
{t:"p",x:"Nos casos típicos o diagnóstico é <b>clínico</b>. A <b>EDA</b> mostra esofagite e complicações; a <b>pHmetria de 24 h</b> é o <b>padrão-ouro</b> para quantificar o refluxo ácido; a <b>manometria</b> avalia a motilidade <b>antes de cirurgia</b>. O tratamento começa pelas medidas — perder peso, elevar a cabeceira, evitar refeições volumosas e alimentos-gatilho, não deitar por 2–3 h depois de comer —, segue com fármacos (IBP, anti-H2, antiácidos e alginatos, procinéticos) e reserva a <b>fundoplicatura de Nissen</b> para refratários, jovens ou quem não quer medicação contínua."},
{t:"f",id:"svg:drge"},

{t:"h",x:"Esôfago de Barrett: a metaplasia que protege e ameaça"},
{t:"p",x:"Barrett é uma <b>metaplasia intestinal adquirida</b> do esôfago distal: o epitélio escamoso normal é substituído por <b>epitélio colunar especializado com células caliciformes</b>. É uma resposta de adaptação à agressão crônica do refluxo — ácido e bile. As células-tronco da mucosa passam a se diferenciar num epitélio mais resistente ao ácido. Protege a curto prazo, mas o preço é caro: a metaplasia é o <b>marcador de risco</b> para displasia e <b>adenocarcinoma</b>."},
{t:"p",x:"A progressão é uma escada: <b>metaplasia → displasia de baixo grau → displasia de alto grau → adenocarcinoma invasivo</b>. Barrett, sozinho, não dá sintoma próprio — o paciente sente a DRGE que o causou (pirose, regurgitação, dor retroesternal, disfagia se houver estenose). Os <b>sinais de alarme</b> apontam complicação: perda de peso, <b>odinofagia</b>, anemia por perda crônica, vômitos persistentes."},
{t:"p",x:"O diagnóstico é <b>EDA com biópsia (padrão-ouro)</b>. Na endoscopia se vê mucosa colunar, <b>avermelhada e aveludada</b>, subindo acima da junção; a confirmação é <b>histológica</b>, pela presença de <b>células caliciformes</b>. A <b>classificação de Praga</b> mede a extensão: <b>C</b> = circunferencial, <b>M</b> = máxima."},
{t:"f",id:"img:barrett_histo"},
{t:"p",x:"Conduta: <b>IBP em dose plena</b> (omeprazol 40–80 mg/dia) + estilo de vida, e <b>vigilância endoscópica</b> conforme a histologia — sem displasia, EDA a cada 3–5 anos; displasia de baixo grau, controle mais frequente ou tratamento endoscópico; <b>displasia de alto grau, tratamento intervencionista</b>. O tratamento endoscópico usa <b>ablação por radiofrequência</b> ou <b>ressecção endoscópica</b> (lesão visível, displasia de alto grau). Cirurgia é rara: jovem com refluxo refratário, complicação estrutural ou hérnia de hiato importante (fundoplicatura)."},
{t:"f",id:"svg:barrett"},
{t:"k",r:"Q11 da T11",x:"58 anos, DRGE crônica, EDA com mucosa distal <b>avermelhada e aveludada</b>, biópsia com <b>células caliciformes</b> → <b>metaplasia intestinal com risco aumentado de adenocarcinoma</b>. Os distratores: “inflamação aguda reversível sem risco”, “displasia de alto grau com cirurgia imediata”, “hiperplasia escamosa”, “colonização bacteriana”."}
]};

EXPL.A2={titulo:"Intestino — quatro jeitos de adoecer",
blocos:[
{t:"h",x:"O mapa da aula"},
{t:"p",x:"A professora fecha a aula com um slide que vale como índice de tudo: dor abdominal, distensão e mudança do hábito intestinal são a apresentação comum, e por trás delas há só <b>quatro mecanismos</b>. <b>Obstrução</b>: a pressão sobe, a alça distende e acaba isquêmica. <b>Vascular</b>: o sangue não chega, falta oxigênio e a parede necrosa. <b>Infecção</b>: toxinas ou invasão fazem o epitélio secretar e o paciente ter diarreia. <b>Inflamação</b>: a resposta imune se volta contra a própria mucosa e a lesão fica crônica. Cada doença da aula é um desses mecanismos com nome próprio."},
{t:"f",id:"svg:mecanismos"},

{t:"h",x:"Obstrução: o trânsito que para"},
{t:"p",x:"Quando o trânsito é interrompido, o que chega continua chegando: <b>líquidos</b> (as secreções do próprio intestino) e <b>gases</b> se acumulam acima do ponto de parada. A alça <b>distende</b>, a <b>pressão intraluminal sobe</b> e, quando essa pressão supera a pressão de perfusão da parede, o sangue deixa de entrar — o risco final da obstrução é a <b>isquemia</b>."},
{t:"p",x:"A dor conta essa história. No início, a musculatura se contrai contra o obstáculo em ondas: <b>dor em cólica</b>. Quando a parede começa a sofrer, a dor vira <b>contínua</b> — o sinal de sofrimento intestinal. As pistas do slide são para memorizar como pares: <b>cólica → obstrução</b>; <b>vômitos precoces → obstrução alta</b>; <b>distensão → obstrução baixa</b>; <b>parada de fezes e gases → obstrução completa</b>; <b>dor contínua + febre → isquemia</b>."},
{t:"p",x:"<b>Aderências (bridas)</b> são bandas fibrosas que ligam alças entre si, cicatriz de <b>cirurgia abdominal (a causa mais comum)</b>, peritonite ou trauma. Dão dor, distensão, vômitos e parada de fezes e gases. O diagnóstico é pela <b>TC de abdome com contraste</b>; o tratamento começa conservador — <b>hidratação + sonda nasogástrica</b> — e vai para <b>adesiólise</b> se a obstrução for completa ou complicar."},
{t:"p",x:"<b>Hérnias</b> são a protrusão do conteúdo abdominal por um defeito da parede — inguinal, umbilical, incisional. O perigo está em duas palavras que a prova adora separar: <b>encarceramento</b> é quando o conteúdo <b>não volta</b>; <b>estrangulamento</b> é quando o anel aperta o pedículo e há <b>isquemia</b>. O diagnóstico é <b>clínico</b> (abaulamento, dor local), com USG/TC só na dúvida. Tratamento: redução manual quando possível e cirurgia — <b>herniorrafia (sem tela)</b> ou <b>hernioplastia (com tela)</b>. Suspeita de estrangulamento é urgência."},

{t:"h",x:"Vólvulo e intussuscepção: quando a alça se enrola"},
{t:"p",x:"No <b>vólvulo</b>, a alça torce sobre o próprio eixo mesentérico. A torção faz duas coisas ao mesmo tempo: fecha a luz (obstrução) e estrangula os vasos do mesentério (isquemia) — por isso a progressão é distensão, necrose e perfuração. Os locais típicos são <b>sigmoide e ceco</b>, e o que predispõe é tudo o que deixa a alça <b>longa, dilatada e móvel</b>: o <b>megacólon chagásico</b> (sigmoide dilatado) e o megacólon idiopático. Quanto maior a dilatação e a mobilidade, maior o risco."},
{t:"p",x:"O quadro é de obstrução baixa: dor intensa e progressiva, distensão importante, parada de fezes e gases e <b>vômitos tardios</b>. O <b>RX</b> mostra a alça em <b>“grão de café”</b>; a <b>TC</b> confirma. Se o paciente está estável, faz-se <b>descompressão endoscópica</b>; se já há isquemia ou necrose, <b>cirurgia de urgência</b>."},
{t:"f",id:"img:volvulo_rx"},
{t:"p",x:"Na <b>intussuscepção</b>, um segmento entra dentro do seguinte como um telescópio, levando junto o mesentério — então também obstrui e isquemia. A etiologia muda com a idade, e isso cai: na <b>criança</b> ela é <b>idiopática</b> na maioria, muitas vezes depois de uma virose; no <b>adulto</b> quase sempre há uma <b>lesão que puxa</b> — tumor, pólipo, doença inflamatória. A clínica junta cólica, <b>massa palpável em “salsicha”</b>, <b>fezes com sangue e muco</b> e vômitos. A <b>USG</b> faz o diagnóstico: <b>“alvo”</b> no corte transversal e <b>“pseudo-rim”</b> no longitudinal; no adulto, TC. Tratamento: na criança, <b>redução por enema</b> (ar ou contraste); no adulto ou se complicado, <b>cirurgia</b>."},
{t:"f",id:"img:intuss_usg"},

{t:"h",x:"Isquemia mesentérica aguda: dor desproporcional"},
{t:"p",x:"A doença vascular do intestino é uma cascata de falta de oxigênio. O fluxo cai, a mucosa — a camada mais exigente — fica hipóxica e passa ao <b>metabolismo anaeróbio</b>: <b>lactato sobe e surge acidose</b>. A mucosa lesada perde a função de barreira e deixa bactérias e toxinas atravessarem (<b>translocação bacteriana</b>). Daí em diante: necrose da parede, inflamação sistêmica, sepse e choque, e no fim <b>perfuração com peritonite</b>."},
{t:"p",x:"A isquemia mesentérica aguda é a redução <b>abrupta</b> desse fluxo, uma emergência. O território principal (cerca de 50%) é o da <b>artéria mesentérica superior (AMS)</b>, que sai da aorta em ângulo agudo e quase paralela a ela — um trajeto perfeito para um êmbolo entrar. As causas, em ordem: <b>embolia arterial (a mais comum)</b>, trombose arterial, trombose venosa e isquemia <b>não oclusiva</b> (choque, vasoconstrição)."},
{t:"p",x:"O sinal precoce-chave é a <b>dor desproporcional ao exame físico</b>: dor súbita e intensa com abdome quase inocente. Isso acontece porque, no início, quem sofre é a mucosa, e a dor é <b>visceral</b>; o peritônio parietal ainda não foi atingido, e é ele que produz defesa e descompressão dolorosa. Há náuseas, vômitos e diarreia. Só na fase <b>tardia</b>, com a parede toda necrosando, aparecem os sinais de <b>peritonite</b>: defesa involuntária (reflexa e persistente), rigidez, <b>Blumberg</b> e íleo paralítico. Febre, taquicardia, leucocitose, <b>lactato elevado e acidose metabólica</b> são sinais de gravidade e sugerem necrose."},
{t:"f",id:"svg:mesenterica"},
{t:"p",x:"No diagnóstico, a professora separa dois papéis: a <b>angiotomografia com contraste é o exame de escolha</b>; a <b>angiografia mesentérica é o padrão-ouro</b>. O USG Doppler é <b>limitado</b> e a laparotomia exploradora fica para os graves. O tratamento reúne suporte hemodinâmico e volêmico, correção de acidose e eletrólitos, <b>anticoagulação com heparina</b> (sobretudo na trombose venosa — a heparina não fracionada potencializa a antitrombina III e inibe principalmente a trombina, IIa, e o fator Xa), revascularização (angioplastia/stent, trombólise), cirurgia (embolectomia/trombectomia e ressecção do que necrosou) e antibiótico + UTI."},
{t:"k",r:"Q7 da T11 · e sua anotação",x:"As falsas foram: <b>“USG Doppler é o exame de escolha”</b> (é a angioTC) e <b>“a dor inicial vem das fibras somáticas do peritônio parietal”</b> (no início ela é visceral — por isso é desproporcional). Verdadeiras: dor súbita com náuseas/vômitos na fase inicial, evolução com necrose/perfuração/peritonite, lactato pelo metabolismo anaeróbio. No slide 18 você anotou: <b>lactato &gt; 2,2</b>."},

{t:"h",x:"Colite isquêmica: a forma leve, no cólon esquerdo"},
{t:"p",x:"A colite isquêmica é a <b>hipoperfusão transitória do cólon</b> — a forma mais leve de isquemia intestinal. Ela prefere o <b>cólon esquerdo</b>, na <b>flexura esplênica</b> e no <b>sigmoide</b>, e o motivo é anatômico: são zonas de divisa entre territórios arteriais (AMS/AMI na flexura; AMI/hipogástricas na junção retossigmoide), as últimas a receber sangue quando a pressão cai. As causas são as que baixam o fluxo: hipotensão/choque, aterosclerose, pós-operatório vascular ou cardíaco, drogas vasoativas (cocaína), vasculites, trauma, obstrução mecânica."},
{t:"p",x:"O paciente tem dor súbita, geralmente no <b>flanco esquerdo</b>, <b>diarreia com sangue</b> e urgência; nos graves, febre e leucocitose. A TC mostra <b>espessamento segmentar da parede</b> e a colonoscopia, edema, úlceras e áreas hemorrágicas. O tratamento é de suporte (hidratação + jejum), antibiótico nos moderados/graves, tratar a causa e cirurgia se perfurar ou necrosar."},
{t:"k",r:"Diarreia com sangue — como diferenciar (slide 21)",x:"<b>Isquêmica</b>: dor súbita + idoso + doença vascular · <b>Infecciosa</b>: início agudo + febre · <b>Inflamatória (DII)</b>: curso crônico + recidivas."},

{t:"h",x:"Enterocolites infecciosas: toxina ou invasão"},
{t:"p",x:"Tudo começa com a <b>ingestão do patógeno</b> e a colonização do intestino. Daí há dois modos de estragar a mucosa: por <b>toxinas</b>, que fazem o epitélio secretar água e eletrólitos (diarreia <b>aquosa</b>), ou por <b>invasão</b>, que lesa a mucosa (diarreia <b>com sangue</b>). A resposta inflamatória acrescenta febre e sintomas sistêmicos."},

{t:"h",x:"Colite pseudomembranosa: o antibiótico abre a porta"},
{t:"p",x:"A flora normal do cólon ocupa o espaço e o alimento que o <i>Clostridioides</i> (antigo <i>Clostridium</i>) <i>difficile</i> precisaria para crescer. O <b>antibiótico</b> — cefalosporinas, fluoroquinolonas, clindamicina, penicilinas — desmonta essa flora (<b>disbiose</b>), o <i>C. difficile</i> prolifera e produz as <b>toxinas A e B</b>. Elas lesam o epitélio e provocam inflamação intensa; o exsudato de fibrina, muco e células inflamatórias forma as <b>pseudomembranas</b> — placas amareladas que não são uma membrana verdadeira, daí o nome."},
{t:"p",x:"Os fatores de risco são o paciente <b>hospitalizado, idoso, imunossuprimido</b> e o uso de <b>IBP</b>. O quadro: <b>diarreia aquosa profusa</b>, cólica, <b>febre e leucocitose</b>; nos graves, <b>megacólon tóxico e perfuração</b>. O diagnóstico é a <b>pesquisa das toxinas A/B (ELISA ou PCR)</b>, com a suspeita dada pela história de <b>diarreia após antibiótico</b>; a endoscopia, que mostra as pseudomembranas, fica para os graves. O tratamento: <b>suspender o antibiótico causal</b> e dar <b>vancomicina oral (1ª escolha)</b> ou fidaxomicina (alternativa); graves, suporte intensivo."},
{t:"f",id:"img:pseudomemb"},
{t:"k",r:"Q5 da T11 — as duas afirmativas falsas",x:"“A confirmação diagnóstica depende <b>exclusivamente de endoscopia</b>, pois testes de toxinas não são úteis” ✗ — o diagnóstico é pela toxina A/B. “A primeira medida é <b>manter o antibiótico inicial</b> e associar antidiarreico” ✗ — a primeira medida é suspender o antibiótico. Verdadeiras: disbiose + proliferação, lesão por toxina com pseudomembranas, megacólon tóxico/perfuração na forma grave."},

{t:"h",x:"Salmonelose: comida, febre e, às vezes, a articulação"},
{t:"p",x:"A <i>Salmonella</i> chega pela <b>via alimentar</b>. Na maioria dá <b>gastroenterite</b> — diarreia, dor abdominal, febre leve —, que se trata com <b>suporte (hidratação)</b>; antibiótico só nos graves ou de risco. A <b>febre tifoide</b> é outra doença: incubação mais longa (<b>5–21 dias</b>), <b>febre prolongada</b> com sintomas sistêmicos, cefaleia, prostração e as <b>rose spots</b> (manchas róseas no tronco). Em <b>imunossuprimidos</b> a bactéria cai no sangue — <b>bacteremia</b> —, podendo semear infecções focais."},
{t:"p",x:"Cada forma tem seu exame: <b>coprocultura</b> na gastroenterite, <b>hemocultura</b> na febre tifoide. Na tifoide e na bacteremia, <b>ciprofloxacino ou ceftriaxona</b> são primeira linha, azitromicina serve nos não complicados, por <b>7–14 dias</b>."},
{t:"p",x:"A <b>artrite reativa</b> é uma complicação imunológica, não infecciosa: a resposta contra a <i>Salmonella</i> reage de forma cruzada com antígenos articulares (<b>mimetismo molecular</b>) e produz uma <b>inflamação articular estéril</b> — não há bactéria na articulação. Surge <b>1–4 semanas</b> depois da infecção, é <b>assimétrica</b>, prefere <b>membros inferiores</b> e pode vir com uretrite + conjuntivite (<b>síndrome de Reiter</b>)."},
{t:"k",r:"Q2 da T11 · e o “???” no seu slide 27",x:"Falsas: “a gastroenterite <b>geralmente requer antibiótico</b>” ✗ (é suporte; antibiótico é para tifoide/bacteremia — foi o que a veterana anotou) e “a artrite reativa ocorre por <b>invasão bacteriana direta</b>” ✗ (é mimetismo molecular, artrite estéril). Verdadeiras: transmissão alimentar, bacteremia no imunossuprimido com infecções focais, tifoide com incubação mais longa e curso sistêmico → <b>I, III e IV</b>."},

{t:"h",x:"DII: a mucosa atacada pela própria imunidade"},
{t:"p",x:"As doenças inflamatórias intestinais são inflamações <b>crônicas, imunomediadas</b>, nascidas da interação entre <b>genética, microbiota e ambiente</b>, com períodos de <b>remissão e exacerbação</b>. São duas, e quase toda questão sobre elas é uma comparação."},
{t:"p",x:"A <b>doença de Crohn</b> é uma ativação imune inadequada, com predomínio <b>Th1/Th17</b>, contra a microbiota. A inflamação é <b>transmural</b> — pega a parede inteira —, e é isso que explica suas complicações: uma úlcera que atravessa a parede abre <b>fístula</b> ou <b>abscesso</b>; uma parede inflamada que cicatriza vira <b>estenose</b>. Pode acometer <b>qualquer ponto do tubo digestivo</b>, de forma <b>salteada</b> (áreas doentes intercaladas com mucosa normal), com <b>úlceras profundas</b> e aspecto de <b>pedra de calçamento</b>; o íleo terminal é o preferido, daí a <b>dor em fossa ilíaca direita (QID)</b>. <b>Granulomas não caseosos</b> são sugestivos, mas <b>não obrigatórios</b>. Fatores de risco: mutações no <b>NOD2</b>, resposta exagerada à microbiota, <b>tabagismo</b> (piora a doença), dieta gordurosa e pobre em fibras, disbiose."},
{t:"f",id:"img:crohn_endo"},
{t:"p",x:"O Crohn dá diarreia crônica (com ou sem sangue), dor em QID, perda de peso, fístulas e abscessos e manifestações <b>extraintestinais</b> — artrite, uveíte, eritema nodoso. Diagnóstico: clínica, laboratório (anemia, PCR/VHS e <b>calprotectina fecal</b> elevadas), colonoscopia (salteado, úlceras profundas, pedra de calçamento), biópsia (transmural ± granulomas) e <b>entero-TC</b>. Tratamento: corticoide nas crises, imunossupressor na manutenção, biológicos (anti-TNF, anti-integrina), nutrição enteral como adjuvante (crianças) e cirurgia só para complicações — e ela <b>não é curativa</b>, porque a doença pode reaparecer em qualquer outro segmento."},
{t:"p",x:"A <b>retocolite ulcerativa (RCU)</b> é o oposto em quase tudo. Fica <b>restrita ao cólon e reto</b>, começa <b>sempre no reto</b> e sobe de forma <b>contínua</b>, e a lesão é <b>superficial</b> (mucosa e submucosa, no slide dela). Superficial, mas ulcerada e sangrante: <b>diarreia com sangue e muco</b>, <b>tenesmo</b> (urgência retal), dor em <b>QIE</b>; nos graves, <b>megacólon tóxico</b>. A colonoscopia mostra inflamação contínua, eritema, úlceras rasas, sangramento espontâneo; a biópsia, <b>criptite e abscessos de cripta</b>. Tratamento: <b>5-ASA (sulfassalazina ou mesalazina)</b> para induzir e manter remissão, corticoide nas crises moderadas/graves, azatioprina/6-mercaptopurina nos refratários, biológicos (infliximabe, adalimumabe, vedolizumabe) e a <b>colectomia total</b>, que pode ser <b>curativa</b> — tirou o cólon, tirou a doença. O tabagismo pode até ter efeito protetor."},
{t:"f",id:"svg:dii"},
{t:"k",r:"Q13-D da T11 · e suas anotações nos slides 35–36",x:"28 anos, diarreia crônica, dor recorrente em <b>QID</b>, perda de peso, melhora e piora, colonoscopia com <b>mucosa normal intercalada com úlceras profundas</b> → <b>doença de Crohn</b>. Você anotou: “granuloma não caseoso” e “cirurgia <b>não é curativa</b>” — as duas frases que viram pegadinha de comparação com RCU."}
]};

EXPL.A3={titulo:"Fígado — hepatites, metais, colestase e CHC",
blocos:[
{t:"w",x:"<b>Aula ainda não dada.</b> Este texto foi montado a partir do resumo da veterana (aula de 2026.1) e das 4 questões de fígado da T11 — todas objetivas, o mesmo peso de cada uma das outras aulas. Quando a professora liberar os slides, confiro frase por frase e marco o que mudou."},
{t:"h",x:"Hepatite: inflamação do fígado — e o relógio dos 6 meses"},
{t:"p",x:"Hepatite é só o nome da inflamação do fígado; a causa vem depois: vírus, álcool, esteato-hepatite não alcoólica, fármacos, autoimunidade, isquemia, outras infecções. O que organiza o raciocínio é o tempo: <b>aguda</b> quando dura <b>menos de 6 meses</b>, <b>crônica</b> quando passa de <b>6 meses</b>. A cronicidade importa porque é ela que leva, ao longo de anos, a fibrose, cirrose e carcinoma hepatocelular."},
{t:"p",x:"Três termos que a prova pode trocar: <b>esteatose hepática</b> é só o acúmulo de gordura no fígado, de qualquer causa. <b>DHGNA</b> (doença hepática gordurosa não alcoólica) é o espectro de alterações por gordura <b>sem consumo significativo de álcool</b> — vai da esteatose simples às formas inflamatórias. <b>EHNA</b> (esteato-hepatite não alcoólica) é a <b>forma inflamatória</b> da DHGNA: gordura + inflamação, que pode evoluir para fibrose e cirrose."},

{t:"h",x:"Hepatites não infecciosas"},
{t:"p",x:"Cada uma é um jeito diferente de agredir o hepatócito. Na <b>alcoólica</b>, o etanol produz esteatose e, no seu metabolismo, estresse oxidativo e inflamação hepatocelular. Na <b>EHNA</b>, a síndrome metabólica é o motor: inflamação hepatocelular que evolui para fibrose. Na <b>medicamentosa</b>, a droga lesa diretamente o hepatócito — inflamação, necrose, disfunção. Na <b>autoimune</b>, linfócitos T e autoanticorpos atacam os hepatócitos; os achados típicos são <b>transaminases elevadas + hipergamaglobulinemia</b>, e sem tratamento ela caminha para fibrose e cirrose."},
{t:"p",x:"A <b>hepatite isquêmica</b> merece atenção à palavra “centrolobular”. O sangue entra no lóbulo pela periferia (tríade portal) e sai pela veia centrolobular; os hepatócitos em volta da veia central são os últimos a receber oxigênio. Quando a perfusão cai — choque, insuficiência cardíaca —, são eles que morrem primeiro: <b>necrose centrolobular</b>. O laboratório é característico, com <b>elevação acentuada e rápida de AST e ALT</b>, e o quadro costuma ser <b>reversível</b> se a perfusão for restaurada."},

{t:"h",x:"Hepatites virais: quem cronifica e quem vai embora"},
{t:"p",x:"Os vírus hepatotrópicos são A, B, C, D e E; no Brasil os mais comuns são A, B e C, e é a <b>C</b> que mais mata (≈ 75% dos óbitos, contra ≈ 22% da B e 1–2% da A). Um jeito de guardar a biologia: <b>as vogais (A e E) entram pela boca e vão embora</b> — transmissão <b>fecal-oral</b>, doença autolimitada, não cronificam; <b>as consoantes (B, C, D) entram pelo sangue e ficam</b> — cronificam e levam a cirrose e carcinoma."},
{t:"p",x:"<b>A</b>: fecal-oral (água, alimento), incubação de 15–50 dias, autolimitada, vacina eficaz. <b>B</b>: sangue, sexo e vertical, incubação de 30–180 dias, <b>pode cronificar</b> (risco de cirrose e CHC), vacina no calendário. <b>C</b>: principalmente sangue (seringas, material não esterilizado), incubação de 14–180 dias, <b>cronifica em ~80%</b> — a cronicidade se define por <b>anti-HCV há mais de 6 meses + RNA detectável</b> —, sem vacina. <b>D</b>: mesma transmissão da B e <b>só existe junto com o HBV</b> (coinfecção ou superinfecção); acelera a cirrose e se previne com a vacina da B. <b>E</b>: fecal-oral (água contaminada), autolimitada, mas <b>grave em gestantes</b>, com risco de forma fulminante."},
{t:"p",x:"A <b>hepatite fulminante</b> tem dois culpados. Na <b>B</b> (a principal), a resposta imune contra os hepatócitos infectados é tão intensa e descontrolada que causa <b>necrose maciça</b> — falência hepática rápida, coagulopatia, encefalopatia. Na <b>E em gestante</b>, é o contrário: a imunidade celular está reduzida pela gestação (estrogênio e progesterona, para proteger o feto) e o organismo não controla o vírus. Cronificam <b>B e C</b> (raramente A e E). Manifestações <b>extra-hepáticas</b> são da <b>B</b>: poliarterite nodosa e glomerulonefrite."},
{t:"p",x:"O curso clínico tem três fases: <b>prodrômica</b> (3–10 dias; febre baixa, fadiga, anorexia, náuseas, mialgia, artralgia, cefaleia, colúria/hipocolia), <b>ictérica</b> (icterícia, prurido, hepatomegalia dolorosa, e os sintomas constitucionais melhoram) e <b>recuperação</b> (semanas a meses)."},
{t:"f",id:"svg:hbv_evol"},

{t:"h",x:"Laboratório: função × lesão, e os marcadores"},
{t:"p",x:"Duas perguntas diferentes, dois grupos de exame. <b>O fígado está funcionando?</b> — bilirrubina (total e frações), <b>TAP</b> e <b>albumina</b>, que dependem da síntese e da excreção hepáticas. <b>O fígado está sendo lesado?</b> — <b>ALT e AST</b> (enzimas que vazam do hepatócito), <b>fosfatase alcalina e GGT</b> (que sobem quando a via biliar sofre), LDH."},
{t:"p",x:"Nos marcadores específicos: <b>A</b> — IgM anti-HAV = infecção aguda. <b>C</b> — anti-HCV + PCR (RNA-HCV). <b>D</b> — anti-HDV ou RNA-HDV, só em quem tem HBV. <b>E</b> — IgM/IgG anti-HEV + PCR quando disponível. A <b>B</b> tem a sorologia mais cobrada: <b>HBsAg</b> = infecção ativa; <b>anti-HBc IgM</b> = infecção recente; <b>anti-HBc IgG</b> = contato prévio com o vírus; <b>HBeAg</b> = alta replicação e infectividade; <b>anti-HBe</b> = replicação caindo. O detalhe que decide questão: o <b>anti-HBc só aparece na infecção natural</b>, nunca depois da vacina (a vacina só contém o antígeno de superfície e gera apenas <b>anti-HBs</b>)."},
{t:"f",id:"svg:hbv_soro"},
{t:"p",x:"Na imagem: a <b>USG</b> avalia fígado, esteatose, hepatomegalia e sinais de cirrose; a <b>elastografia (Fibroscan®)</b> mede a rigidez hepática, marcador de fibrose, útil no seguimento da hepatite crônica (C); <b>TC ou RM</b> caracterizam lesões e investigam complicações, como cirrose e carcinoma."},
{t:"p",x:"Tratamento: <b>A e E</b> — suporte (repouso, hidratação, sintomáticos). <b>B</b> — aguda, suporte; crônica, antivirais (<b>tenofovir, entecavir</b>), que reduzem a replicação e as complicações. <b>C</b> — antivirais de ação direta (<b>sofosbuvir + daclatasvir</b>), cura acima de 95% em 8–12 semanas conforme genótipo e fibrose. <b>D</b> — interferon peguilado (a ligação ao polietilenoglicol aumenta a meia-vida e espaça as aplicações), com resposta limitada."},

{t:"h",x:"Hemocromatose: ferro demais"},
{t:"p",x:"O corpo não tem uma via ativa para eliminar ferro — o controle é todo na <b>absorção intestinal</b>. Na <b>hemocromatose hereditária tipo 1</b>, mutações no gene <b>HFE</b> (cromossomo 6; a mais frequente é a <b>C282Y</b>, cisteína → tirosina na posição 282; outra comum é a <b>H63D</b>) desregulam esse controle: o intestino absorve ferro em excesso, anos a fio, e ele se deposita no <b>fígado, pâncreas, coração e articulações</b>."},
{t:"p",x:"As manifestações são um mapa dos depósitos: fígado — hepatomegalia, cirrose e <b>carcinoma hepatocelular</b>; pâncreas — <b>diabetes</b>; coração — insuficiência cardíaca e arritmias; articulações — artrite, sobretudo nas mãos; pele — pigmentação bronzeada (o <b>“diabetes bronzeado”</b>); gônadas — hipogonadismo no homem; e fadiga. No laboratório, tudo do ferro sobe — <b>ferro sérico, saturação da transferrina (&gt; 45%) e ferritina</b> — enquanto a <b>TIBC fica normal ou reduzida</b> (a transferrina já está saturada). Confirma-se com o <b>teste genético do HFE</b>; RM quantifica o depósito e a biópsia fica para casos selecionados. Tratamento: <b>flebotomias</b> (tirar sangue é tirar ferro), quelantes (deferoxamina, deferasirox) se não bastarem, controle das complicações (diabetes, IC, rastreio de CHC) e aconselhamento genético da família."},

{t:"h",x:"Doença de Wilson: cobre que não sai"},
{t:"p",x:"O cobre segue o caminho inverso do ferro: é eliminado pela <b>bile</b>. No hepatócito, a proteína <b>ATP7B</b> faz duas coisas — joga cobre na bile e o incorpora à <b>ceruloplasmina</b>, a proteína que o transporta no sangue. Na doença de Wilson, mutações no gene <b>ATP7B</b> (<b>cromossomo 13</b>) quebram as duas funções: o cobre não sai pela bile, não entra na ceruloplasmina e se acumula — no <b>fígado</b>, no <b>cérebro</b> (núcleos da base) e na <b>córnea</b>."},
{t:"p",x:"Daí o quadro de adolescente ou adulto jovem com doença hepática + neurológica/psiquiátrica. Os <b>anéis de Kayser-Fleischer</b> — depósito de cobre na periferia da córnea — são <b>patognomônicos</b>. Há manifestações neurológicas (tremores, disfagia, demência, psicose), hepáticas (hepatite, cirrose) e cardiomiopatia. O laboratório espelha o mecanismo: <b>ceruloplasmina baixa</b> (em 95% dos casos) e <b>cobre urinário elevado</b> (&gt; 100 µg/dia); a RM mostra alteração em caudado e putâmen (a “face do panda” no mesencéfalo) e o teste genético confirma. Tratamento: quelantes de cobre — <b>penicilamina</b> (primeira linha) ou <b>trientina</b> —, <b>zinco</b> (inibe a absorção de cobre) e transplante nos graves."},
{t:"f",id:"img:wilson_rm"},
{t:"k",r:"Q4 da T11",x:"22 anos, tremores, alteração de comportamento, enzimas hepáticas elevadas e <b>anel acastanhado na periferia da córnea</b> → <b>ceruloplasmina reduzida + excreção urinária de cobre aumentada</b>. O distrator mais perigoso era o do vizinho: “ferritina alta com saturação de transferrina elevada” é <b>hemocromatose</b>."},

{t:"h",x:"Colestase: a bile que não chega ao duodeno"},
{t:"p",x:"Colestase é a <b>redução ou o bloqueio do fluxo biliar</b>. A bile para — e tudo que ela deveria levar fica para trás: acumula nos hepatócitos e reflui para o sangue. Duas funções se perdem ao mesmo tempo: a <b>digestão de gorduras</b> (sem sais biliares no intestino não se formam micelas; daí a má absorção de gordura e das vitaminas A, D, E e K) e a <b>eliminação de bilirrubina e sais biliares</b>."},
{t:"p",x:"O bloqueio pode estar dentro do fígado ou na via biliar. <b>Intra-hepática</b>: doenças hepáticas crônicas (hepatites B e C, cirrose, DHGNA), metabólicas (Wilson, hemocromatose), medicamentos (anticonvulsivantes, antibióticos, esteroides), autoimunes (hepatite autoimune, colangite biliar primária) e a gravidez (colestase intra-hepática da gestação). <b>Extra-hepática</b>: obstrução das vias biliares (cálculos, tumores, estenoses), pancreatite (compressão extrínseca), colangite."},
{t:"p",x:"A clínica é a da bile fora do lugar: <b>icterícia</b> (bilirrubina), <b>prurido intenso</b> (sais biliares na pele), <b>acolia fecal e colúria</b> (a bilirrubina direta, hidrossolúvel, sai na urina e falta nas fezes), <b>xantomas</b> (colesterol na pele), fadiga — e <b>dor abdominal, mais comum nas extra-hepáticas</b>, porque ali há uma via distendida. O laboratório: <b>bilirrubina total e frações, fosfatase alcalina, GGT e ácidos biliares elevados</b>. A <b>USG é o primeiro exame</b>: via biliar <b>dilatada</b> aponta obstrução <b>extra-hepática</b>; <b>sem dilatação</b>, pense em <b>intra-hepática</b>. CPRM ou CPRE detalham; biópsia só em casos selecionados. Tratamento: tratar a causa (cálculo, hepatite, suspender droga), aliviar o prurido (colestiramina), ácido ursodesoxicólico na colestase gestacional ou autoimune, suplementar vitaminas lipossolúveis."},
{t:"f",id:"svg:colestase"},
{t:"k",r:"Colestase caiu DUAS vezes na T11 (Q9 e Q12)",x:"Falsas usadas: “a principal alteração laboratorial é a <b>redução</b> da bilirrubina” ✗ · “a colestase <b>não interfere</b> na digestão de gorduras” ✗ · “a <b>ausência de dilatação</b> das vias biliares na USG torna improvável a colestase” ✗ (torna provável a <b>intra-hepática</b>) · “a dor abdominal é a manifestação mais constante nas formas <b>intra-hepáticas</b>” ✗ (é das extra)."},

{t:"h",x:"Carcinoma hepatocelular: o tumor que nasce da cirrose"},
{t:"p",x:"O CHC é o <b>tumor primário mais comum do fígado (&gt; 80%)</b>, originado dos hepatócitos, agressivo e quase sempre sobre um fígado <b>cirrótico</b>. Não confundir com metástase hepática, que é secundária. Os fatores de risco são tudo o que lesa o fígado cronicamente: <b>hepatites B e C</b>, álcool e cirrose alcoólica, DHGNA, <b>cirrose de qualquer causa</b>, hemocromatose e Wilson, <b>aflatoxinas</b> (fungos em grãos e nozes), síndrome de Caroli."},
{t:"p",x:"A clínica costuma ser <b>tardia e inespecífica</b>: icterícia, dor em QSD, perda de peso e anorexia, distensão, náuseas, fadiga, febre, cabeça de medusa (hipertensão portal). O caminho diagnóstico é suspeita → exames → confirmação: <b>alfafetoproteína (AFP)</b> elevada em muitos casos, função hepática, sorologias B e C; <b>USG para rastreio</b>; <b>TC ou RM para caracterizar o tumor e a extensão</b>; angiografia para a vascularização; biópsia pode confirmar, mas <b>nem sempre é necessária</b>."},
{t:"p",x:"O tratamento depende do fígado que sobra. <b>Ressecção</b>: primeira escolha se a função hepática está preservada e não há hipertensão portal. <b>Transplante</b>: doença hepática avançada com tumor dentro dos <b>critérios de Milão</b> — <b>1 tumor ≤ 5 cm</b> ou <b>até 3 tumores ≤ 3 cm</b>, sem invasão macrovascular e sem metástase extra-hepática (muitos centros somam <b>AFP &lt; 500 ng/mL</b>). <b>Ablação</b> (radiofrequência, micro-ondas): tumor &lt; 2 cm, paciente sem condição cirúrgica ou em espera de transplante. <b>TACE</b> (quimioembolização: doxorrubicina intra-arterial + embolização) no não ressecável sem invasão da porta principal; <b>radioembolização com ítrio-90</b> quando a TACE não é possível, inclusive com trombose de ramo portal — ambas controlam a doença, mantêm elegibilidade e fazem downstaging para Milão. No avançado, <b>atezolizumabe (anti-PD-L1) + bevacizumabe (anti-VEGF)</b> é o padrão de primeira linha; quimioterapia clássica funciona pouco."},
{t:"f",id:"svg:milao"},
{t:"k",r:"Q1 da T11",x:"60 anos, <b>cirrose</b>, perda de peso, dor em hipocôndrio direito, <b>AFP elevada</b> e lesão focal → a melhor conduta inicial para <b>caracterizar</b> a lesão é <b>TC ou RM</b>. Distratores: colonoscopia, USG seriada apenas, biópsia obrigatória em todos, transaminases isoladas."}
]};

EXPL.A4={titulo:"Pâncreas — a glândula que pode se digerir",
blocos:[
{t:"h",x:"Dois brotos, dois ductos, duas papilas"},
{t:"p",x:"O pâncreas nasce de dois brotos, um <b>ventral</b> e um <b>dorsal</b>, que giram e se fundem. Os ductos também se fundem: o <b>ducto principal (Wirsung)</b> drena quase toda a glândula e desemboca, junto com o colédoco, na <b>papila maior</b>; o resto do ducto dorsal vira o <b>ducto acessório (Santorini)</b>, que abre na <b>papila menor</b>. As três anomalias congênitas da aula são erros dessa montagem."},
{t:"p",x:"No <b>pâncreas divisum</b> — a mais comum, em <b>~10% da população</b> — os ductos ventral e dorsal não se fundem. O dorsal passa a drenar a maior parte do pâncreas pela <b>papila menor, de calibre pequeno</b>: o suco sai com dificuldade, a pressão no ducto sobe e o resultado pode ser <b>pancreatite aguda recorrente</b>, rotulada de “idiopática” (muitos são assintomáticos). No <b>pâncreas anular</b> (incomum), um anel de tecido pancreático envolve o <b>duodeno</b> e pode obstruí-lo — vômitos biliosos/obstrução duodenal. No <b>pâncreas ectópico</b>, há tecido pancreático fora do lugar (estômago, duodeno, jejuno); em geral é assintomático e achado incidental, mas pode ulcerar, sangrar ou obstruir."},
{t:"f",id:"svg:pancreas"},

{t:"h",x:"Pancreatite aguda: a enzima que acorda cedo"},
{t:"p",x:"O pâncreas fabrica enzimas capazes de digerir a si mesmo, e só não o faz porque elas saem <b>inativas</b> (zimogênios, como o tripsinogênio) e só se ativam no duodeno. Pancreatite é a <b>ativação precoce</b> dessas enzimas <b>dentro da glândula</b>. A aguda é súbita e <b>potencialmente reversível</b>, se a causa for removida; pode, porém, desencadear resposta inflamatória sistêmica. Até <b>20%</b> dos casos ficam sem causa definida (idiopáticos)."},
{t:"p",x:"As duas grandes causas somam cerca de 80%: <b>litíase biliar (a 1ª)</b>, com o cálculo obstruindo a ampola de Vater, e <b>álcool</b>, por toxicidade direta e estase do suco pancreático. Outras: <b>hipertrigliceridemia (&gt; 1000)</b>, <b>hipercalcemia</b>, <b>drogas (valproato, furosemida)</b> e <b>pós-CPRE</b>."},
{t:"p",x:"O mecanismo é uma sequência em cinco passos, e a T11 cobrou exatamente ela. (1) A agressão inicial — cálculo, álcool — <b>lesa a célula acinar</b>. (2) Dentro da célula lesada, a organização se perde e os grânulos de zimogênio se fundem com os lisossomos: a <b>co-localização</b>. (3) A <b>catepsina B</b>, enzima lisossomal, <b>ativa o tripsinogênio em tripsina</b>. (4) A tripsina ativa as demais enzimas — a <b>cascata</b>. (5) O resultado é <b>autodigestão + inflamação</b>."},
{t:"f",id:"svg:cascata"},
{t:"p",x:"O que cada enzima destrói explica a morfologia. A <b>lipase</b> digere a gordura peripancreática — a <b>necrose gordurosa</b> (lipólise). A <b>elastase e a fosfolipase A2</b> degradam membranas celulares e a parede dos vasos: é daí que vem a <b>necrose hemorrágica</b>, com hemorragia intra e intersticial. Destruição dos ácinos + lipólise + hemorragia = o pâncreas da pancreatite aguda grave."},
{t:"k",r:"Q3 da T11 — os distratores dela",x:"“A ativação ocorre <b>apenas após necrose vascular extensa</b>” ✗ (a ativação vem primeiro) · “a catepsina B atua como <b>bloqueadora</b> da tripsina, reduzindo a autodigestão” ✗ (ela <b>ativa</b>) · “elastase e fosfolipase A2 explicam a <b>esteatorreia crônica</b>” ✗ (explicam a hemorragia) · “autodigestão é típica da <b>crônica</b>, não da aguda” ✗. Correta: <b>lesão acinar → co-localização de zimogênios e lisossomos → ativação precoce do tripsinogênio</b>."},

{t:"h",x:"Clínica, gravidade e diagnóstico da aguda"},
{t:"p",x:"O quadro típico é <b>dor epigástrica intensa, irradiada para o dorso</b> — o trajeto das fibras esplâncnicas —, com náuseas, vômitos e febre. A gravidade aparece na pele: a hemorragia retroperitoneal disseca os planos e surge como equimose <b>periumbilical (sinal de Cullen)</b> ou nos <b>flancos (sinal de Grey Turner)</b>. As complicações são sistêmicas (choque, insuficiência renal aguda, SIRS) ou locais (abscesso, necrose pancreática)."},
{t:"f",id:"img:cullen_gt"},
{t:"p",x:"O diagnóstico usa os <b>critérios de Atlanta: 2 de 3</b> — dor abdominal típica; <b>lipase ou amilase &gt; 3× o normal</b> (a <b>lipase é mais específica</b>); imagem compatível (TC). O tratamento é, antes de tudo, <b>suporte</b>: hidratação com <b>Ringer lactato</b>, analgesia e <b>dieta enteral precoce</b>. Depois, a causa: <b>litíase → colecistectomia/CPRE</b>; álcool → suspensão. <b>Antibiótico só se houver necrose infectada</b>."},
{t:"k",r:"Casos 1 e 2 da própria aula",x:"Mulher, 45 anos, colelitíase, dor epigástrica irradiada para o dorso, lipase 1200 (VR &lt; 60), cálculos na USG → <b>pancreatite aguda biliar</b>; mecanismo: obstrução da ampola → lesão acinar → ativação precoce do tripsinogênio; conduta: suporte (Ringer, analgesia, dieta enteral precoce) + tratar a litíase. · Homem etilista com pancreatite que evolui com equimoses periumbilicais e em flancos → <b>Cullen e Grey Turner = hemorragia retroperitoneal</b>, quadro grave, associado a <b>necrose hemorrágica</b>."},

{t:"h",x:"Pancreatite crônica: a cicatriz toma o lugar da glândula"},
{t:"p",x:"Na crônica, a agressão se repete e a glândula não volta ao normal: a inflamação persiste e o tecido funcional é <b>substituído por fibrose</b>, com atrofia — um processo <b>irreversível</b>. O preço é duplo: <b>insuficiência exócrina</b> (sem enzimas não há digestão: má digestão e <b>esteatorreia</b>) e <b>insuficiência endócrina</b> (as ilhotas são destruídas: <b>diabetes</b>)."},
{t:"p",x:"Cada etiologia chega à fibrose por um caminho. <b>Alcoolismo crônico</b> (a principal): estresse oxidativo, lesão acinar direta e suco pancreático mais viscoso. <b>Pancreatite hereditária</b>: mutações no <b>PRSS1</b> (o gene do tripsinogênio) fazem a enzima se ativar cedo. <b>Fibrose cística</b>: mutação do <b>CFTR</b> → secreção espessa → obstrução ductal. <b>Autoimune</b>: infiltração linfoplasmocitária. <b>Obstrução crônica dos ductos</b>: tumores, cálculos, anomalias congênitas. A sequência comum: agressão repetida → ativações enzimáticas leves e recorrentes → inflamação persistente → <b>ativação das células estreladas pancreáticas</b> (as fabricantes de colágeno) → fibrose progressiva e destruição do parênquima."},
{t:"p",x:"O paciente tem <b>dor abdominal crônica e progressiva, pior depois das refeições</b>, má absorção com esteatorreia, diabetes e perda de peso. Complicações: <b>pseudocistos</b> (coleções líquidas encapsuladas), obstrução do ducto pancreático e do colédoco e <b>risco aumentado de adenocarcinoma</b>. O diagnóstico: <b>TC com calcificações pancreáticas (o clássico)</b> e <b>elastase fecal baixa</b> — a elastase-1 é produzida só pelo pâncreas e atravessa o intestino sem ser degradada, então sua queda (&lt; 100 µg/g de fezes) indica insuficiência exócrina grave. As enzimas séricas ficam <b>normais ou baixas</b> (não sobrou glândula para vazar). Tratamento: controlar dor e função — analgesia, <b>reposição enzimática</b>, dieta pobre em gordura, controle do diabetes; graves, CPRE ou cirurgia."},
{t:"f",id:"img:pc_tc"},
{t:"k",r:"Q6 da T11 · Caso 4 da aula",x:"Falsas: “a <b>ativação intrapancreática</b> é o principal mecanismo da crônica” ✗ (esse é o da aguda; na crônica o motor é inflamação recorrente → fibrose) e “a crônica é predominantemente <b>aguda e reversível</b>” ✗. Verdadeiras: destruição progressiva do parênquima, insuficiência endócrina nas fases avançadas, insuficiência exócrina por menos enzimas → <b>I, III e V</b>. No Caso 4 (etilista, dor recorrente pós-prandial, fezes volumosas), o exame da insuficiência exócrina é a <b>elastase fecal</b> — você anotou no slide."},

{t:"h",x:"Neoplasias do pâncreas"},
{t:"p",x:"A tabela da aula compara quatro: <b>adenocarcinoma ductal</b> (85–90% dos tumores; maligno; das células ductais; cabeça em 60–70%), <b>tumores neuroendócrinos</b> (5–7%; malignos, podem metastatizar; das células das ilhotas de Langerhans), <b>neoplasia mucinosa papilar intraductal — IPMN</b> (3–5%; benigna ou maligna conforme o grau de displasia; do epitélio dos ductos) e <b>cistoadenocarcinoma mucinoso</b> (&lt; 1%; maligno; do epitélio de cistos mucinosos)."},

{t:"h",x:"Adenocarcinoma ductal: duro, silencioso e tardio"},
{t:"p",x:"O ADP é a <b>7ª causa de morte por câncer no mundo</b>, mais comum em <b>homens acima de 60 anos</b>, com prognóstico ruim porque é descoberto tarde e é agressivo. Fatores de risco: <b>tabagismo (risco 2–3×)</b>, pancreatite crônica, <b>diabetes de início recente (&lt; 3 anos)</b>, síndromes genéticas (BRCA1/2, Lynch) e história familiar (≥ 2 parentes). A patogênese começa com a mutação do <b>KRAS</b> (proliferação) e acumula outras (<b>p53, SMAD4</b>). A marca do tumor é a <b>reação desmoplásica</b>: fibrose intensa e hipóxia em volta das células malignas. Ela deixa o tumor <b>rígido e difícil de ressecar</b>, dificulta a chegada da quimioterapia, faz barreira à imunoterapia e cria um ambiente hipóxico e inflamatório que favorece a progressão."},
{t:"p",x:"A localização decide a clínica. Na <b>cabeça (70%)</b>, o tumor comprime o colédoco que passa por dentro dela: <b>icterícia obstrutiva precoce e indolor</b>, com colúria e acolia. No <b>corpo e cauda (20–30%)</b> não há nada para obstruir, e o diagnóstico é <b>tardio</b>. Em comum: <b>perda de peso e caquexia</b> e <b>dor epigástrica com irradiação dorsal</b>, por infiltração neural. Dois achados associados: <b>tromboflebite migratória (síndrome de Trousseau)</b> e <b>diabetes de início recente</b> (paraneoplásico)."},
{t:"f",id:"svg:adp"},
{t:"p",x:"Diagnóstico: <b>TC de abdome contrastada (protocolo de pâncreas) é a primeira escolha</b>; a <b>RM com colangiorressonância</b> avalia melhor os ductos; a <b>ecoendoscopia com punção aspirativa (PAAF)</b> confirma a histologia. O <b>CA 19-9</b> serve para <b>prognóstico e monitoramento, não para rastreamento</b>; o CEA pode subir, mas é menos sensível."},
{t:"p",x:"A <b>ressecabilidade</b> é julgada por três coisas: envolvimento vascular, extensão do tumor e metástases. <b>Ressecável</b>: sem invasão vascular significativa, sem metástase à distância, sem invasão de estruturas críticas. <b>Irressecável localmente avançado</b> (sem metástase): invasão arterial com contato <b>&gt; 180°</b> da circunferência do <b>tronco celíaco, AMS ou artéria hepática comum</b>, ou invasão venosa com <b>oclusão completa da porta ou da VMS sem possibilidade de reconstrução</b>. <b>Irressecável por doença metastática</b>: metástases hepáticas, peritoneais, pulmonares ou em linfonodos à distância, e <b>ascite maligna</b>. O ângulo de contato é medido na TC/RM: <b>≤ 180°</b>, pode ser ressecável (borderline se extenso); <b>&gt; 180°</b>, irressecável."},
{t:"f",id:"svg:resseca"},
{t:"p",x:"Só <b>15–20%</b> chegam em estágio cirúrgico. <b>Ressecável</b>: cirurgia de <b>Whipple + quimioterapia</b>. <b>Localmente avançado</b>: quimioterapia — <b>FOLFIRINOX</b> (fluoruracil, leucovorin, irinotecano, oxaliplatina), eficaz mas muito tóxico (neutropenia, diarreia, neuropatia, fadiga). <b>Metastático</b>: paliativo — controle da dor e <b>stent biliar</b>. Sobrevida em 5 anos de ~10%; no metastático, 6–12 meses. Melhoram o prognóstico o diagnóstico precoce com ressecção, a ausência de invasão vascular e metástase e a boa resposta à quimioterapia."},
{t:"k",r:"Q10 e Q13-A da T11",x:"Q10 — falsas: tumor sem comprometimento arterial e com oclusão venosa reconstruível é ressecável “<b>independentemente de outros critérios</b>” ✗ (metástase derruba) e “no tumor <b>avançado</b> o padrão é Whipple + QT” ✗ (Whipple é do ressecável; avançado = FOLFIRINOX) → <b>I, II e V</b>. · Q13-A — homem de 68 anos, <b>tabagista</b>, icterícia progressiva <b>indolor</b>, colúria, fezes hipocólicas, dor epigástrica <b>irradiada para o dorso</b>, emagrecido: a veterana escreveu “carcinoma hepatocelular” e a professora corrigiu para <b>pâncreas</b> — adenocarcinoma ductal da <b>cabeça</b>. É exatamente o Caso 3 da aula."}
]};

IVA</text><text x=\"62\" y=\"244\" font-size=\"11\" fill=\"#5f6b78\" font-weight=\"400\" text-anchor=\"start\" >tripsinogênio → tripsina</text><line x1=\"185\" y1=\"253\" x2=\"185\" y2=\"261\" stroke=\"#5f6b78\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"20\" y=\"262\" width=\"330\" height=\"44\" rx=\"8\" fill=\"#fff\" stroke=\"#2b62a8\" stroke-width=\"1.4\"/><text x=\"38\" y=\"289\" font-size=\"13\" fill=\"#5f6b78\" font-weight=\"700\" text-anchor=\"start\" >5</text><text x=\"62\" y=\"282\" font-size=\"13\" fill=\"#2b62a8\" font-weight=\"700\" text-anchor=\"start\" >Cascata</text><text x=\"62\" y=\"298\" font-size=\"11\" fill=\"#5f6b78\" font-weight=\"400\" text-anchor=\"start\" >tripsina ativa as outras enzimas</text><line x1=\"352\" y1=\"282\" x2=\"396\" y2=\"282\" stroke=\"#5f6b78\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"398\" y=\"60\" width=\"380\" height=\"120\" rx=\"8\" fill=\"#f9e6e4\" stroke=\"#b0413e\" stroke-width=\"1.2\"/><text x=\"412\" y=\"84\" font-size=\"13\" fill=\"#b0413e\" font-weight=\"700\" text-anchor=\"start\" >Elastase + fosfolipase A2</text><text x=\"412\" y=\"106\" font-size=\"12\" fill=\"#1c2430\" font-weight=\"400\" text-anchor=\"start\"><tspan x=\"412\" dy=\"0\">degradam membranas e paredes vasculares</tspan><tspan x=\"412\" dy=\"15.600000000000001\">→ NECROSE HEMORRÁGICA</tspan><tspan x=\"412\" dy=\"15.600000000000001\">→ Cullen / Grey Turner</tspan></text><rect x=\"398\" y=\"196\" width=\"380\" height=\"64\" rx=\"8\" fill=\"#fbf1e2\" stroke=\"#9a5f0c\" stroke-width=\"1.2\"/><text x=\"412\" y=\"220\" font-size=\"13\" fill=\"#9a5f0c\" font-weight=\"700\" text-anchor=\"start\" >Lipase</text><text x=\"412\" y=\"242\" font-size=\"12\" fill=\"#1c2430\" font-weight=\"400\" text-anchor=\"start\" >→ necrose gordurosa (lipólise)</text><rect x=\"398\" y=\"270\" width=\"380\" height=\"50\" rx=\"8\" fill=\"#eef3f8\" stroke=\"#2b62a8\" stroke-width=\"1.2\"/><text x=\"412\" y=\"300\" font-size=\"12.5\" fill=\"#1c2430\" f 0000000000001\">obstrutiva PRECOCE e INDOLOR,</tspan><tspan x=\"484\" dy=\"15.600000000000001\">colúria, acolia, prurido</tspan></text><rect x=\"470\" y=\"172\" width=\"310\" height=\"90\" rx=\"8\" fill=\"#eef3f8\" stroke=\"#2b62a8\" stroke-width=\"1.2\"/><text x=\"484\" y=\"196\" font-size=\"13\" fill=\"#2b62a8\" font-weight=\"700\" text-anchor=\"start\" >CORPO / CAUDA</text><text x=\"484\" y=\"218\" font-size=\"12\" fill=\"#1c2430\" font-weight=\"400\" text-anchor=\"start\"><tspan x=\"484\" dy=\"0\">nada para obstruir → diagnóstico</tspan><tspan x=\"484\" dy=\"15.600000000000001\">TARDIO, com dor e emagrecimento</tspan></text><rect x=\"20\" y=\"280\" width=\"760\" height=\"58\" rx=\"8\" fill=\"#f3f5f8\" stroke=\"#c3ccd5\" stroke-width=\"1.2\"/><text x=\"36\" y=\"302\" font-size=\"11.8\" fill=\"#1c2430\" font-weight=\"500\" text-anchor=\"start\"><tspan x=\"36\" dy=\"0\">Em comum: perda de peso/caquexia · dor epigástrica irradiada ao dorso (infiltração neural) ·</tspan><tspan x=\"36\" dy=\"15.340000000000002\">Trousseau (tromboflebite migratória) · diabetes de início recente · FR nº 1 = tabagismo</tspan></text></svg>", "cap": "Foi o caso da Q13-A: tabagista + icterícia indolor + dor para o dorso = cabeça do pâncreas."}, "resseca": {"svg": "<svg viewBox=\"0 0 800 338\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ângulo de contato vascular\" font-family=\"IBM Plex Sans,Segoe UI,Arial,sans-serif\"><rect width=\"800\" height=\"338\" fill=\"#ffffff\"/><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#5f6b78\"/></marker></defs><text x=\"20\" y=\"28\" font-size=\"15\" fill=\"#1c2430\" font-weight=\"600\" text-anchor=\"start\" >Ressecabilidade: quanto do vaso o tumor abraça</text><circle cx=\"140\" cy=\"130\" r=\"44\" fill=\"#f0d5d2\" stroke=\"#b0413e\" stroke-width=\"2\"/><text x=\"140\" y=\"135\" font-size=\"11.5\" fill=\"#b0413e\" fo astático</tspan></text></svg>", "cap": "Amarelo = tumor em contato com o vaso (corte transversal na TC)."}};</script>

    '<figcaption>'+esc(IM[k].cap)+'<em>'+esc(IM[k].fonte)+'</em></figcaption></figure>';

}
function zoom(id){
  var p=id.split(":"),k=p[1],inner=p[0]==="svg"?FG[k].svg:'<img src="'+IM[k].src+'" alt="">';
  var m=document.createElement("div");m.id="viamodal";
  m.innerHTML='<button class="mcl">fechar ✕</button><div class="mbox">'+inner+'</div>';
  function close(){m.remove();document.removeEventListener("keydown",ek)}
  function ek(e){if(e.key==="Escape")close()}

}
function wireZoom(root){root.querySelectorAll("[data-zf]").forEach(function(el){el.onclick=function(e){e.stopPropagation();zoom(el.dataset.zf)}})}

function aks(){return S.a==="ALL"?["A1","A2","A3","A4"]:[S.a]}
function dzr(){
  var L=DZ.filter(function(d){return S.a==="ALL"||d.a===S.a});
  if(S.q){var t=S.q.toLowerCase();L=L.filter(function(d){return (d.n+" "+d.sub+" "+d.mec+" "+d.pista+" "+d.ex+" "+d.tx+" "+(d.peg||"")).toLowerCase().indexOf(t)>-1})}
  if(S.sort==="az")L=L.slice().sort(function(a,b){return a.n.localeCompare(b.n,"pt")});
  else if(S.sort==="caiu")L=L.slice().sort(function(a,b){return (b._c*10+b._q.length)-(a._c*10+a._q.length)});
  return L;
}
var SO={OF:0,AU:1,IN:2};Q.forEach(function(q,i){q._o=i});Q.sort(function(a,b){return a.a<b.a?-1:a.a>b.a?1:(SO[a.selo]-SO[b.selo])||(a._o-b._o)});
function qbase(){return S.a==="ALL"?Q:Q.filter(function(q){return q.a===S.a})}
function qr(){var a=qbase();if(S.qdz)a=a.filter(function(q){return (q.dz||[]).indexOf(S.qdz)>-1});
  if(S.qf==="all")return a; if(S.qf==="CA")return a.filter(function(q){return q.tipo==="caso"});

function modes(){

/* ---- RESUMO ---- */
function pResumo(p){
  var secs=[],html="";
  aks().forEach(function(k,ki){
    var x=X[k];if(!x)return;var open=false,a=AUL.filter(function(z){return z.k===k})[0];
    html+='<div class="spblock'+(ki?" sep":"")+'"><p class="ey"><span class="dot" style="background:'+ac(k)+'"></span>'+
      esc(a.s)+' · '+esc(a.n)+(a.pend?'<span class="pend">provisório</span>':'')+'</p><h2>'+esc(x.titulo)+'</h2>';
    x.blocos.forEach(function(b){
      if(b.t==="h"){if(open)html+="</section>";var id="xs"+secs.length;secs.push({k:k,h:b.x,id:id,t:b.x});
        html+='<section class="xs" id="'+id+'"><h3>'+esc(b.x)+'</h3>';open=true}
      else if(b.t==="p"){html+='<p>'+rich(b.x)+'</p>';if(secs.length)secs[secs.length-1].t+=" "+b.x}
      else if(b.t==="k"){html+='<div class="kbox"><b>'+esc(b.r)+'</b><p>'+rich(b.x)+'</p></div>';if(secs.length)secs[secs.length-1].t+=" "+b.x}
      else if(b.t==="w"){html+='<div class="wbox">'+rich(b.x)+'</div>'}
      else if(b.t==="f"){html+=figHTML(b.id)}
    });
    if(open)html+="</section>";html+='</div>';
  });
  p.innerHTML='<div class="read">'+html+'</div>';
  wireZoom(p);
  function track(){var top=p.scrollTop+60,best=0;
    secs.forEach(function(x,i){var n=document.getElementById(x.id);if(n&&n.offsetTop<=top)best=i});
    if(best!==S.sec){S.sec=best;ctxRead(secs[best])}}
  p.onscroll=track;
  if(secs.length)ctxRead(secs[0]);
}

    p.querySelectorAll("tr.row").forEach(function(tr){tr.onclick=function(){var d=L[+tr.dataset.i];S.open=S.open===d.id?null:d.id;pDz(p)}});
    p.querySelectorAll("[data-tr]").forEach(function(el){el.onclick=function(e){e.stopPropagation();var d=DBI[el.dataset.tr];
      S.a=d.a;S.mode="questoes";S.qf="all";S.qdz=d.id;rail();modes();pane()}});
    wireZoom(p);
  } else if(S.view==="compacta"){

      '<div class="czwrap">'+Object.keys(by).sort().map(function(k){

/* ---- QUESTÕES ---- */
function letra(k){return String.fromCharCode(65+k)}
function pQ(p){
  var base=qbase();if(S.qdz)base=base.filter(function(q){return (q.dz||[]).indexOf(S.qdz)>-1});
  var L=qr();
  var F=[["all","Todas"],["OF","Oficial T11"],["AU","Da aula"],["IN","Inédita"],["CA","Casos"]];
  var head='<div class="tools"><div class="seg">'+F.map(function(f){
      var n=f[0]==="all"?base.length:f[0]==="CA"?base.filter(function(q){return q.tipo==="caso"}).length:base.filter(function(q){return q.selo===f[0]}).length;
      return '<button data-f="'+f[0]+'" aria-pressed="'+(S.qf===f[0])+'">'+f[1]+' ('+n+')</button>'}).join("")+'</div>'+
    (S.qdz&&DBI[S.qdz]?'<button class="rv" id="clrdz" style="margin-left:4px">'+esc(DBI[S.qdz].n)+' ✕</button>':'')+
    '<span class="tnote">'+L.length+' questões</span></div>';
  p.innerHTML=head+(L.length?L.map(qHTML).join(""):'<p class="empty"><b>Nenhuma questão com esse filtro.</b></p>');
  p.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){S.qf=b.dataset.f;modes();pane()}});
  var c=document.getElementById("clrdz");if(c)c.onclick=function(){S.qdz=null;modes();pane()};
  p.querySelectorAll(".q").forEach(function(box){wireQ(box,L.filter(function(x){return x.id===box.dataset.id})[0])});
  ctxScore(null);
}
function selo(q){return q.tipo==="caso"&&q.selo==="IN"?'<span class="selo CA">CASO</span>':'<span class="selo '+q.selo+'">'+(q.selo==="OF"?"T11":q.selo==="AU"?"AULA":"INÉD")+'</span>'}
function qHTML(q){
  var a=S.ans[q.id], h='<div class="q" data-id="'+esc(q.id)+'" style="border-left:3px solid '+ac(q.a)+'"><div class="qh">'+selo(q)+
    '<span class="qt">'+esc(q.tema)+'</span><span>'+esc(q.prova)+'</span><span>'+esc(q.tipo)+'</span></div>'+
    '<p class="en">'+esc(q.enun)+'</p>';
  if(q.tipo==="caso"){
    var rv=!!S.rev[q.id];
    h+=(rv?'':'<button class="rv">mostrar resposta</button>')+
      '<div class="resp"'+(rv?'':' hidden')+'><b>Resposta esperada</b><div class="ra">'+esc(q.resp)+'</div>'+
      (q.why?'<div class="rw">'+esc(q.why)+'</div>':'')+'</div>'+
      '<div class="selfg"'+(rv?'':' hidden')+'><span>Você acertou?</span>'+
      '<button data-g="1" class="'+(a===1?"ok":"")+'">acertei</button><button data-g="0" class="'+(a===0?"no":"")+'">errei</button></div>';
  } else {
    h+=(q.itens&&q.itens.length?'<ol class="it">'+q.itens.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+'</ol>':'')+
      q.opts.map(function(o,k){var c=a==null?"":(k===q.ans?" ok":(k===a?" no":""));
        return '<button class="opt'+c+'" data-k="'+k+'"'+(a==null?"":" disabled")+'>'+letra(k)+') '+esc(o)+'</button>'}).join("")+
      '<div class="fb"'+(a==null?" hidden":"")+'><b>'+(a===q.ans?"Certo":"Errado")+' · gabarito '+letra(q.ans)+'</b>'+esc(q.why)+'</div>';
  }
  return h+'</div>';
}
function wireQ(box,q){
  if(!q)return;
  if(q.tipo==="caso"){
    var b=box.querySelector(".rv");
    if(b)b.onclick=function(){S.rev[q.id]=1;save();b.remove();box.querySelector(".resp").hidden=false;box.querySelector(".selfg").hidden=false};
    box.querySelectorAll(".selfg button").forEach(function(g){g.onclick=function(){
      S.ans[q.id]=+g.dataset.g;save();
      box.querySelectorAll(".selfg button").forEach(function(x){x.className=""});
      g.className=S.ans[q.id]===1?"ok":"no";ctxScore(q)}});
    return;
  }
  box.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    if(S.ans[q.id]!=null)return;var k=+b.dataset.k;S.ans[q.id]=k;save();
    box.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(+x.dataset.k===q.ans)x.classList.add("ok")});
    if(k!==q.ans)b.classList.add("no");
    var fb=box.querySelector(".fb");fb.innerHTML='<b>'+(k===q.ans?"Certo":"Errado")+' · gabarito '+letra(q.ans)+'</b>'+esc(q.why);
    fb.hidden=false;ctxScore(q)}});
}
function isOk(q){var a=S.ans[q.id];return q.tipo==="caso"?a===1:a===q.ans}

/* ---- PROVA (raio-X) ---- */

  '<section class="psec" id="pv4"><h3>Radar de pegadinhas</h3><p class="psub">'+PEG.length+' frases no formato em que ela escreve a afirmativa falsa. As marcadas T11 caíram de verdade; as outras são as trocas mais prováveis a partir dos slides.</p>'+
    '<div class="tools"><div class="srch" style="max-width:320px"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" style="color:var(--ink3)">'+
    '<circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg><input id="pqi" type="search" placeholder="filtrar pegadinha…" value="'+esc(S.pq)+'"></div>'+
    '<span class="tnote">'+pgs.length+' de '+PEG.length+'</span></div>'+
    (pgs.length?pgs.map(function(x){return '<div class="pg"><div class="pgp">✗ '+esc(x.p)+'</div><div class="pgv">'+esc(x.v)+'</div><div class="pge">'+esc(x.e)+'</div></div>'}).join(""):'<p class="empty"><b>Nada com esse termo.</b></p>')+'</section>'+
  '<section class="psec" id="pv5"><h3>Divergências</h3><p class="psub">Onde as fontes não batem — e o que responder na prova dela.</p>'+
    DIV.map(function(d){return '<div class="dv"><b>'+esc(d.onde)+'</b><p>'+esc(d.prob)+'</p><p>→ '+esc(d.como)+'</p></div>'}).join("")+'</section>'+
  '<section class="psec" id="pv6"><h3>Suas anotações nos slides</h3><p class="psub">O que você escreveu durante as aulas — é o que ela falou e não estava no slide.</p>'+
    ANOT.map(function(a){return '<div class="frase"><span class="ts">'+esc(a.s.replace("Aula ","A").replace(" · slide ","·s"))+'</span><span class="fx">'+esc(a.x)+'</span></div>'}).join("")+'</section>'+
  '<section class="psec" id="pv7"><h3>A aula que falta</h3><p class="psub">Pela veterana, a aula pendente é a de fígado. O resumo dessa parte está montado com o material dela; quando os slides saírem, conferir estes blocos.</p>'+
    FALTA.map(function(f){return '<div class="chk"><i>□</i><span>'+esc(f)+'</span></div>'}).join("")+'</section>';
  var pi=document.getElementById("pqi");
  if(pi)pi.oninput=function(){S.pq=pi.value;var sc=p.scrollTop;pProva(p);p.scrollTop=sc;var n=document.getElementById("pqi");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
  p.onscroll=function(){var top=p.scrollTop+60,best=0;PSECS.forEach(function(x,i){var n=document.getElementById(x[0]);if(n&&n.offsetTop<=top)best=i});
    if(best!==S.psec){S.psec=best;ctxProva()}};
  ctxProva();
}
function ctxProva(){
  var W=pesos(),counts=[KPI.length,W.length,FMT.length,FAM.length,PEG.length,DIV.length,ANOT.length,FALTA.length];
  cset('<p class="cl">O raio-X da prova</p><div class="cbox" style="padding:6px 4px">'+PSECS.map(function(x,i){
    return '<button class="cidx'+(i===S.psec?" on":"")+'" data-g="'+x[0]+'"><span>'+esc(x[1])+'</span><em>'+counts[i]+'</em></button>'}).join("")+'</div>'+
    '<div class="trap"><b>Como usar</b>Veredito e peso por aula antes de abrir o resumo. O radar de pegadinhas é a última leitura na véspera — ela escreve a falsa trocando uma palavra do slide.</div>');
  document.getElementById("ctx").querySelectorAll(".cidx").forEach(function(b){b.onclick=function(){
    var n=document.getElementById(b.dataset.g),p=document.getElementById("pane");if(n)p.scrollTop=n.offsetTop-8}});
}
/* ---- CONTEXTO ---- */
function cset(h){document.getElementById("ctx").innerHTML=h}
function miniList(ds){return ds.slice(0,5).map(function(d){
  return '<button class="mini" data-d="'+d.id+'"><span class="dot" style="background:'+ac(d.a)+'"></span>'+
  '<span><span class="mn">'+esc(d.n)+'</span><span class="md">'+esc(d.ex)+'</span></span></button>'}).join("")}
function wireMini(){document.getElementById("ctx").querySelectorAll(".mini").forEach(function(b){b.onclick=function(){
  var d=DBI[b.dataset.d];S.a=d.a;S.mode="doencas";S.view="tabela";S.open=d.id;S.q="";rail();modes();pane()}})}
function hitDz(k,txt){var t=(txt||"").toLowerCase();
  return DZ.filter(function(d){if(d.a!==k)return false;var w=d.n.toLowerCase().replace(/\(.*?\)/g,"").split(/[\s—\/,]+/).filter(function(x){return x.length>4});
    return w.some(function(x){return t.indexOf(x)>-1})})}
function ctxRead(sec){
  if(!sec)return;var ds=hitDz(sec.k,sec.h+" "+sec.t);
  if(!ds.length)ds=DZ.filter(function(d){return d.a===sec.k}).sort(function(a,b){return b._c-a._c});
  var qs=Q.filter(function(q){return q.a===sec.k&&q.selo==="OF"&&ds.some(function(d){return (q.dz||[]).indexOf(d.id)>-1})});
  var q=qs[0];
  cset('<p class="cl">Contexto do que você lê</p><p class="cnow"><span class="dot" style="background:'+ac(sec.k)+'"></span>'+esc(sec.h)+'</p>'+
    '<div class="cbox"><h4>Doenças desta parte <em>'+Math.min(ds.length,5)+'</em></h4>'+miniList(ds)+'</div>'+
    (q?'<div class="cbox"><h4>Caiu sobre isto <em>T11</em></h4><p style="margin:0 0 3px;font-size:12.5px;font-weight:600;line-height:1.35">'+esc(q.tema)+'</p>'+
      '<p style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;color:var(--ink3);margin:0 0 9px">'+esc(q.prova)+' · '+esc(q.tipo)+'</p>'+
      '<button class="gq" data-q="1">treinar esta aula →</button></div>':
      '<div class="cbox"><h4>Treinar o que você leu</h4><button class="gq" data-q="1">abrir as questões desta aula →</button></div>'));
  var g=document.getElementById("ctx").querySelector(".gq");
  if(g)g.onclick=function(){S.a=sec.k;S.mode="questoes";S.qf="all";S.qdz=null;rail();modes();pane()};
  wireMini();
}
function ctxRank(){
  var L=dzr().filter(function(d){return d._q.length}).sort(function(a,b){return (b._c*10+b._q.length)-(a._c*10+a._q.length)}).slice(0,8);
  var mx=L.length?Math.max(1,L[0]._q.length):1;
  cset('<p class="cl">O que ela mais cobra</p>'+
    (L.length?'<div class="cbox"><h4>Na T11 e nos casos da aula <em>'+L.length+'</em></h4>'+L.map(function(d){
      return '<button class="rank" data-d="'+d.id+'"><span class="rt">'+esc(d.n)+'</span><span class="track"><i style="width:'+Math.round(d._q.length/mx*100)+'%;background:'+ac(d.a)+'"></i></span>'+
      '<span class="rn">'+d._q.length+'×</span></button>'}).join("")+'</div>':'<p class="empty"><b>Sem histórico nesta seleção.</b></p>')+
    '<div class="trap"><b>Como ela pede o diagnóstico</b>Na questão de casos vale o nome completo e específico: “atresia de esôfago com fístula traqueoesofágica”, “adenocarcinoma ductal da cabeça do pâncreas”.</div>');
  document.getElementById("ctx").querySelectorAll(".rank[data-d]").forEach(function(b){b.onclick=function(){
    var d=DBI[b.dataset.d];S.view="tabela";S.open=d.id;pane()}});
}
function ctxScore(last){
  var L=qr(),done=L.filter(function(q){return S.ans[q.id]!=null});
  var ok=done.filter(isOk).length,err=done.length-ok,byT={};
  done.forEach(function(q){if(!isOk(q))byT[q.tema]=(byT[q.tema]||0)+1});
  var ks=Object.keys(byT).sort(function(a,b){return byT[b]-byT[a]}).slice(0,6),mx=ks.length?byT[ks[0]]:1;
  cset('<p class="cl">Seu desempenho</p><div class="score"><div class="sc g"><b>'+ok+'</b><span>acertos</span></div>'+
    '<div class="sc r"><b>'+err+'</b><span>erros</span></div><div class="sc"><b>'+(done.length?Math.round(ok/done.length*100):0)+'%</b><span>de '+done.length+'</span></div></div>'+
    (ks.length?'<div class="cbox"><h4>Erros por tema <em>'+err+'</em></h4>'+ks.map(function(k){return '<div class="rank" style="cursor:default"><span class="rt">'+esc(k)+'</span>'+
      '<span class="track err"><i style="width:'+Math.round(byT[k]/mx*100)+'%"></i></span><span class="rn">'+byT[k]+'</span></div>'}).join("")+'</div>'
     :'<p class="empty"><b>Responda para alimentar isto.</b>Cada erro entra aqui agrupado por tema. Nos casos, você mesmo marca “acertei” ou “errei”.</p>')+
    (last&&!isOk(last)?'<div class="trap"><b>Acabou de errar</b>'+esc(last.tema)+' — '+esc(last.why||"")+'</div>':'')+
    (done.length?'<button class="gq" id="zer" style="margin-top:10px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line)">zerar respostas desta seleção</button>':''));
  var z=document.getElementById("zer");if(z)z.onclick=function(){L.forEach(function(q){delete S.ans[q.id];delete S.rev[q.id]});save();pane()};
}
rail();modes();pane();
})();
</script>
