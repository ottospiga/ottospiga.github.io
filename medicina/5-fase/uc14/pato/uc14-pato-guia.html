<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patologia UC14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#eef1f4; --panel:#fff; --panel2:#f7f9fb; --line:#dde4ea; --line2:#eaeff3;
  --ink:#16202a; --ink2:#59666f; --ink3:#89939d;
  --rail:#1b232c; --rail2:#141b22; --railink:#aebac6; --railink2:#6e7d8b; --railon:#27313c;
  --acc:#5a3e96; --accink:#fff; --accsoft:#efeaf7;
  --ok:#0f6a46; --okbg:#ecf9f2; --no:#a02a22; --nobg:#fdf0ef;
  --trap:#6f5511; --trapbg:#fdf8ea; --trapline:#e7dcbd;
  --sp1:#0b7f5c; --sp2:#9a5f0c; --sp3:#b0413e; --sp4:#2b62a8; --bandink:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --panel:#181e24; --panel2:#141a20; --line:#28313a; --line2:#212932;
  --ink:#e6ebf0; --ink2:#98a5b2; --ink3:#6f7d8a;
  --rail:#131920; --rail2:#0c1116; --railink:#9fadba; --railink2:#65727f; --railon:#1e2731;
  --acc:#b39ce8; --accink:#150f22; --accsoft:#231c33;
  --ok:#4fbf90; --okbg:#10241d; --no:#e07a6c; --nobg:#2a1715;
  --trap:#d9b86a; --trapbg:#221d10; --trapline:#3d3620;
  --sp1:#1f9f8e; --sp2:#c28a36; --sp3:#e07b6f; --sp4:#6fa0e0; --bandink:#0c1215;
}}
:root[data-theme="dark"]{
  --bg:#0f1317; --panel:#181e24; --panel2:#141a20; --line:#28313a; --line2:#212932;
  --ink:#e6ebf0; --ink2:#98a5b2; --ink3:#6f7d8a;
  --rail:#131920; --rail2:#0c1116; --railink:#9fadba; --railink2:#65727f; --railon:#1e2731;
  --acc:#b39ce8; --accink:#150f22; --accsoft:#231c33;
  --ok:#4fbf90; --okbg:#10241d; --no:#e07a6c; --nobg:#2a1715;
  --trap:#d9b86a; --trapbg:#221d10; --trapline:#3d3620;
  --sp1:#1f9f8e; --sp2:#c28a36; --sp3:#e07b6f; --sp4:#6fa0e0; --bandink:#0c1215;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;
 -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;min-height:560px}

/* topbar */
.top{background:var(--rail2);color:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:0 16px;padding-top:calc(9px + env(safe-area-inset-top,0px));padding-bottom:9px;flex:0 0 auto}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;letter-spacing:.04em;
  text-transform:uppercase;line-height:1}
.brand em{font-style:normal;color:#65727f;font-weight:500}
.ucs{display:flex;gap:4px}
.ucs button{background:none;border:1px solid transparent;color:#8794a1;border-radius:5px;padding:4px 10px;
  font-size:12.5px;font-weight:500;cursor:pointer;line-height:1.3}
.ucs button:hover:not(:disabled){color:#fff;background:#1d252e}
.ucs button[aria-pressed="true"]{background:#242e39;color:#fff;border-color:#33404d}
.ucs button:disabled{opacity:.38;cursor:not-allowed}
.top .gap{flex:1}
.cd{display:flex;align-items:baseline;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:#7d8a97;white-space:nowrap}
.cd b{color:#f0b429;font-size:14px;letter-spacing:.02em;font-weight:600}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:216px minmax(0,1fr) 312px;
  grid-template-rows:minmax(0,1fr)}

/* rail */
.rail{background:var(--rail);color:var(--railink);overflow-y:auto;display:flex;flex-direction:column;
  min-height:0;border-right:1px solid var(--rail2)}
.rhd{padding:14px 14px 12px;border-bottom:1px solid var(--railon)}
.rhd b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600;color:#fff;
  letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.rhd span{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--railink2);margin-top:5px;line-height:1.5}
.rlab{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--railink2);padding:13px 14px 6px}
.rl{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:9px;align-items:center;width:100%;
  background:none;border:0;border-left:2px solid transparent;padding:8px 13px 8px 12px;text-align:left;cursor:pointer;
  color:var(--railink);line-height:1.3}
.rl:hover{background:var(--railon);color:#fff}
.rl[aria-pressed="true"]{background:var(--railon);color:#fff}
.rl .dot{width:9px;height:9px;border-radius:2px;display:block}
.rl .t{font-size:13px;font-weight:500;min-width:0}
.rl .t em{display:block;font-style:normal;font-size:10.5px;color:var(--railink2);font-weight:400;margin-top:1px;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.03em}
.rl[aria-pressed="true"] .t em{color:#8fa0b0}
.rl .c{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--railink2);font-variant-numeric:tabular-nums;
  text-align:right}
.rfoot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--railon);font-size:10.5px;color:var(--railink2);
  font-family:"IBM Plex Mono",monospace;letter-spacing:.05em;line-height:1.6}

/* centro */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
.modes{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto;
  overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 13px 10px;cursor:pointer;
  color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px}
.modes button:hover{color:var(--ink)}
.modes button[aria-pressed="true"]{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.modes button i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10px;background:var(--line2);
  color:var(--ink2);border-radius:9px;padding:1px 6px;font-variant-numeric:tabular-nums}
.modes button[aria-pressed="true"] i{background:var(--acc);color:var(--accink)}
.pane{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 34px;position:relative}

/* barra de ferramentas */
.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{background:none;border:0;border-radius:5px;padding:5px 12px;font-size:12.5px;font-weight:500;
  color:var(--ink2);cursor:pointer;line-height:1.35}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink);font-weight:600}
.srch{flex:1;min-width:150px;max-width:280px;position:relative}
.srch input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:7px 11px 7px 29px;font:inherit;font-size:13px;color:var(--ink)}
.srch input::placeholder{color:var(--ink3)}
.srch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none}
.tnote{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink3);letter-spacing:.04em;margin-left:auto}

/* tabela de fármacos */
.tbwrap{border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.tb{width:100%;border-collapse:collapse;table-layout:fixed}
.tb col.c-nm{width:34%}.tb col.c-ps{width:30%}.tb col.c-us{width:28%}.tb col.c-ca{width:8%}
@media (max-width:700px){.tb col.c-nm{width:36%}.tb col.c-ps{width:30%}}
.tb thead th{position:sticky;top:0;z-index:2;background:var(--panel2);text-align:left;padding:8px 11px;
  font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.tb tbody tr.row{border-bottom:1px solid var(--line2);cursor:pointer}
.tb tbody tr.row:last-child{border-bottom:0}
.tb tbody tr.row:hover{background:var(--panel2)}
.tb tbody tr.row.on{background:var(--accsoft)}
.tb td{padding:9px 11px;vertical-align:top;border-left:0}
.tb td.c1{border-left:3px solid var(--cc);min-width:190px}
.tb .spk{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.11em;
  font-weight:600;color:var(--bandink);background:var(--cc);border-radius:3px;padding:1px 5px;
  vertical-align:middle;margin-right:6px}
.tb .nm{font-weight:600;font-size:13.5px;letter-spacing:-.004em}
.tb .sub{color:var(--ink3);font-size:11px;line-height:1.4;margin-top:1px}
.tb .mec{color:var(--ink2);font-size:11.5px;line-height:1.45;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tb code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);
  border-radius:4px;padding:4px 7px;display:block;line-height:1.5;font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;hyphens:auto}
.tb .usr{font-size:12px;color:var(--ink2);line-height:1.45}
.tb .caiu{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb .caiu.z{color:var(--ink3)}
.tb .warn{color:var(--no);font-weight:700}
.sus{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;font-weight:600;white-space:nowrap;
  border:1.5px solid currentColor;border-radius:3px;padding:1px 5px;display:inline-block}
.sus.y{color:var(--ok)}.sus.n{color:var(--no)}.sus.u{color:var(--ink3)}
tr.fic td{background:var(--panel2);border-left:3px solid var(--cc);padding:12px 13px 14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.fgrid div b{display:block;font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.fgrid div p{margin:0;font-size:12.5px;line-height:1.55}
.fgrid div.al p{color:var(--no)}
.fprov{margin-top:11px;padding-top:10px;border-top:1px dotted var(--line);font-size:11.5px;color:var(--ink2);
  line-height:1.6}
.fprov b{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);display:block;margin-bottom:3px}

/* cartas (com virar) */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{perspective:1100px;height:288px;background:none;border:0;padding:0;cursor:pointer;text-align:left;
  display:block;width:100%}
.card .inner{display:block}
.cdz{display:block}
.back .in>span{display:block}
.card .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.15,.2,1);
  transform-style:preserve-3d}
.card[aria-pressed="true"] .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(16,32,48,.07)}
.face.back{transform:rotateY(180deg)}
.band{background:var(--cc);color:var(--bandink);padding:6px 11px;display:flex;justify-content:space-between;gap:8px;
  font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  flex:0 0 auto;align-items:center}
.band em{font-style:normal;opacity:.85;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:62%;text-align:right}
.face .in{padding:10px 11px 11px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cnm{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:600;line-height:1.06;text-transform:uppercase;
  letter-spacing:.008em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.csub{font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cmec{font-size:11.5px;line-height:1.45;color:var(--ink2);margin:7px 0 0;flex:0 0 auto;max-height:50px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cdz{margin-top:auto;padding-top:7px;border-top:1px dashed var(--line)}
.cdz b{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);display:block;margin-bottom:2px}
.cdz p{margin:0;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;line-height:1.4;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cft{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 11px;
  border-top:1px solid var(--line2);font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;flex:0 0 auto;color:var(--ink3)}
.back h5{margin:0 0 2px;font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3)}
.back .in p{margin:0 0 9px;font-size:12px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.back .al p{color:var(--no)}

/* resumo */
.read{max-width:68ch}
.read .ey{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 4px;display:flex;gap:7px;align-items:center}
.read .ey .dot{width:8px;height:8px;border-radius:2px}
.read h2{font-family:"IBM Plex Serif",Georgia,serif;font-size:27px;font-weight:600;line-height:1.16;margin:0 0 20px;
  letter-spacing:-.012em;text-wrap:balance}
.xs{margin-bottom:26px;scroll-margin-top:10px}
.spblock.sep{margin-top:46px;padding-top:30px;border-top:2px solid var(--line)}
.xs h3{font-family:"IBM Plex Serif",Georgia,serif;font-size:19px;font-weight:600;margin:0 0 10px;line-height:1.3;
  letter-spacing:-.006em;text-wrap:balance}
.xs p{font-family:"IBM Plex Serif",Georgia,serif;font-size:16.5px;line-height:1.72;margin:0 0 13px;color:var(--ink)}
.xs p b{font-weight:600}
.kbox{border-left:3px solid var(--trap);background:var(--trapbg);border-radius:0 6px 6px 0;padding:11px 14px;
  margin:16px 0 18px}
.kbox b{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--trap);margin-bottom:4px}
.kbox p{margin:0;font-size:13.5px;line-height:1.6;color:var(--trap)}
.nsec{margin-bottom:24px;scroll-margin-top:10px;max-width:70ch}
.nsec h3{font-size:16.5px;font-weight:600;margin:0 0 8px;line-height:1.3}
.nsec p{margin:0 0 9px;font-size:14px;line-height:1.66}
.nsec ul{margin:0 0 6px;padding-left:19px}
.nsec li{margin-bottom:6px;font-size:13.5px;line-height:1.6}

/* questões */
.q{border:1px solid var(--line);border-radius:8px;padding:14px 15px;margin-bottom:11px;max-width:80ch}
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.selo{padding:2px 6px;border-radius:3px;font-weight:600;letter-spacing:.09em;color:#fff}
.selo.OF{background:#1f6b4a}.selo.IN{background:#5b6875}.selo.AU{background:#8a5a12}.selo.VE{background:#6d3fb5}
.qt{font-weight:600;color:var(--ink);letter-spacing:.06em}
.q .en{margin:0 0 10px;font-size:14px;line-height:1.6}
.q ol.it{margin:0 0 11px;padding-left:12px;list-style:none;border-left:2px solid var(--line)}
.q ol.it li{font-size:13px;line-height:1.55;margin-bottom:6px;color:var(--ink2)}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:8px 11px;margin-bottom:5px;cursor:pointer;font-size:13.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
.opt.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .fb{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--ink2)}
.q .fb b{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:4px;color:var(--ink)}

/* contexto */
.ctx{background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:14px 14px 26px;
  min-width:0;min-height:0}
.cl{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 9px}
.cnow{font-size:13px;font-weight:600;line-height:1.35;margin:0 0 13px;padding-bottom:11px;
  border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.cnow .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;margin-top:4px}
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 12px;margin-bottom:10px}
.cbox h4{margin:0 0 9px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.cbox h4 em{font-style:normal;color:var(--acc);font-weight:600}
.mini{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;padding:7px 0;border:0;
  border-bottom:1px dotted var(--line);width:100%;text-align:left;cursor:pointer;background:none}
.mini:last-of-type{border-bottom:0}
.mini:hover .mn{color:var(--acc)}
.mini .dot{width:8px;height:8px;border-radius:2px;margin-top:4px}
.mini .mn{font-size:12.5px;font-weight:600;line-height:1.3}
.mini .md{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink2);line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rank{display:grid;grid-template-columns:minmax(0,1fr) 58px 20px;gap:9px;align-items:center;padding:6px 0;
  border-bottom:1px dotted var(--line);font-size:12px;width:100%;background:none;border-left:0;border-right:0;
  border-top:0;text-align:left;cursor:pointer}
.rank:last-of-type{border-bottom:0}
.rank:hover .rt{color:var(--acc)}
.rt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.track{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.track.err i{background:var(--no)}
.rn{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.gq{background:var(--acc);border:0;color:var(--accink);border-radius:5px;padding:6px 11px;font-size:12px;
  font-weight:600;cursor:pointer;width:100%}
.gq:hover{filter:brightness(1.08)}
.score{display:flex;gap:8px;margin-bottom:11px}
.sc{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 10px;text-align:center}
.sc b{display:block;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;line-height:1.1;

<script>window.QS=window.QS||[];
QS.push(
{id:"T11-Q1",a:"A3",prova:"T11 · Q1",selo:"OF",tipo:"caso → conduta",tema:"Carcinoma hepatocelular",dz:["chc"],
 enun:"Paciente de 60 anos, com cirrose hepática, apresenta perda de peso, dor em hipocôndrio direito e fadiga. Exames mostram AFP elevada e imagem hepática com lesão focal. Qual a melhor conduta inicial para caracterização da lesão?",itens:[],
 opts:["Colonoscopia","Ultrassonografia abdominal seriada apenas","Tomografia computadorizada ou ressonância magnética","Biópsia hepática obrigatória em todos os casos","Dosagem isolada de transaminases"],ans:2,
 why:"Cirrótico + AFP ↑ + lesão focal = suspeita de CHC. USG é rastreio; quem CARACTERIZA tumor e extensão é TC/RM. A biópsia pode confirmar, mas não é obrigatória em todos (a imagem típica basta muitas vezes)."},
{id:"T11-Q2",a:"A2",prova:"T11 · Q2",selo:"OF",tipo:"afirmativas I–V",tema:"Salmonelose",dz:["salmonela","artrite_reativa"],
 enun:"Sobre a infecção por Salmonella, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. A transmissão ocorre principalmente por via alimentar, associada à ingestão de alimentos contaminados.","II. A gastroenterite por Salmonella geralmente requer tratamento antibiótico para reduzir a duração dos sintomas.","III. A bacteremia é mais comum em pacientes imunossuprimidos e pode levar a infecções focais.","IV. A febre tifoide apresenta período de incubação mais prolongado e curso sistêmico.","V. A artrite reativa associada à salmonelose ocorre por invasão bacteriana direta das articulações."],
 opts:["I, II e III","II, III e V","I, IV e V","III, IV e V","I, III e IV"],ans:4,
 why:"II é falsa: gastroenterite = suporte; antibiótico só na tifoide/bacteremia ou grave. V é falsa: artrite reativa é estéril, por mimetismo molecular. Sobram I, III e IV."},
{id:"T11-Q3",a:"A4",prova:"T11 · Q3",selo:"OF",tipo:"assinale a correta",tema:"Pancreatite aguda — mecanismo",dz:["pa"],
 enun:"Sobre a fisiopatogênese da pancreatite aguda, assinale a alternativa correta:",itens:[],
 opts:["A ativação enzimática ocorre apenas após necrose vascular extensa, sendo consequência tardia da hemorragia pancreática.","A catepsina B atua como bloqueadora da tripsina, reduzindo a autodigestão pancreática.","A elastase e a fosfolipase A2 explicam a esteatorreia crônica por destruição progressiva das ilhotas pancreáticas.","A lesão inicial da célula acinar favorece a co-localização de zimogênios e lisossomos, permitindo ativação precoce do tripsinogênio.","A autodigestão pancreática é típica da pancreatite crônica, mas não da pancreatite aguda."],ans:3,
 why:"É a sequência do slide: lesão acinar → co-localização → catepsina B ATIVA o tripsinogênio → cascata → autodigestão. Elastase/PLA2 = necrose hemorrágica (não esteatorreia). Autodigestão é a marca da AGUDA."},
{id:"T11-Q4",a:"A3",prova:"T11 · Q4",selo:"OF",tipo:"caso → laboratório",tema:"Doença de Wilson",dz:["wilson"],
 enun:"Paciente de 22 anos apresenta tremores, alterações comportamentais e elevação de enzimas hepáticas. Ao exame, observa-se anel acastanhado na periferia da córnea. Qual alteração laboratorial é mais esperada?",itens:[],
 opts:["Ceruloplasmina reduzida e aumento da excreção urinária de cobre","Aumento da ferritina com saturação de transferrina elevada","Elevação isolada de bilirrubina indireta","Aumento de fosfatase alcalina com GGT normal","Elevação de transaminases com sorologia positiva para hepatite viral"],ans:0,
 why:"Jovem + neuropsiquiátrico + hepatopatia + anel de Kayser-Fleischer = Wilson (ATP7B): cobre não vai para a bile nem para a ceruloplasmina → ceruloplasmina ↓ e cobre urinário ↑. A alternativa B é hemocromatose."},
{id:"T11-Q5",a:"A2",prova:"T11 · Q5",selo:"OF",tipo:"caso + afirmativas I–V",tema:"Colite pseudomembranosa",dz:["cdiff"],
 enun:"Paciente de 65 anos, internado para tratamento de pneumonia, evolui após 5 dias de antibioticoterapia com diarreia aquosa profusa, dor abdominal em cólica e febre. Exames mostram leucocitose. Analise as assertivas. É correto apenas o que se afirma em:",
 itens:["I. O uso de antibióticos pode favorecer disbiose intestinal e proliferação de Clostridioides difficile.","II. A confirmação diagnóstica depende exclusivamente de endoscopia, pois testes de toxinas não são úteis.","III. A lesão intestinal decorre da produção de toxinas bacterianas, associadas a inflamação intensa e pseudomembranas.","IV. A primeira medida terapêutica consiste em manter o antibiótico inicial para garantir término do tratamento e associar antidiarreico.","V. A forma grave pode evoluir com megacólon tóxico e perfuração."],
 opts:["I, II e IV","I, III e V","II, III e IV","I, IV e V","III, IV e V"],ans:1,
 why:"II falsa: diagnóstico = toxinas A/B (ELISA/PCR); endoscopia só nos graves. IV falsa: primeira medida = SUSPENDER o antibiótico causal (e tratar com vancomicina oral)."},
{id:"T11-Q6",a:"A4",prova:"T11 · Q6",selo:"OF",tipo:"afirmativas I–V",tema:"Pancreatite crônica",dz:["pc"],
 enun:"Analise as seguintes afirmativas sobre a pancreatite crônica. É correto apenas o que se afirma em:",
 itens:["I. A pancreatite crônica cursa com destruição progressiva do parênquima pancreático.","II. A ativação intrapancreática de enzimas digestivas é o principal mecanismo fisiopatológico da pancreatite crônica.","III. A insuficiência endócrina pode ocorrer em fases mais avançadas da doença.","IV. A pancreatite crônica caracteriza-se predominantemente por processo inflamatório agudo e reversível.","V. A insuficiência exócrina pancreática está relacionada à redução da secreção de enzimas digestivas."],
 opts:["I, II e III","I, II e IV","II, III e V","I, III e V","III, IV e V"],ans:3,
 why:"II descreve a AGUDA (a veterana riscou “crônica” e escreveu “aguda”). IV é o oposto: crônica = persistente e irreversível (fibrose)."},
{id:"T11-Q7",a:"A2",prova:"T11 · Q7",selo:"OF",tipo:"afirmativas I–V",tema:"Isquemia mesentérica",dz:["ima"],
 enun:"Analise as seguintes afirmativas sobre a isquemia mesentérica. É correto apenas o que se afirma em:",
 itens:["I. A ultrassonografia com Doppler é o exame de escolha inicial para confirmação diagnóstica.","II. Dor abdominal súbita e intensa, associada a náuseas e vômitos, é manifestação clínica típica da fase inicial.","III. A evolução do quadro pode incluir necrose intestinal, com risco de perfuração e peritonite.","IV. A elevação do lactato sérico reflete metabolismo anaeróbio decorrente da hipoperfusão intestinal.","V. A dor abdominal na isquemia mesentérica decorre predominantemente da ativação de fibras somáticas do peritônio parietal nas fases iniciais."],
 opts:["I, II e III","I, II e IV","II, III e IV","I, III e V","III, IV e V"],ans:2,
 why:"I falsa: exame de escolha = angioTC com contraste (Doppler é limitado). V falsa: no início a dor é visceral — por isso desproporcional ao exame; o peritônio parietal só entra na fase tardia."},
{id:"T11-Q8",a:"A1",prova:"T11 · Q8",selo:"OF",tipo:"caso → mecanismo",tema:"Acalasia",dz:["acalasia"],
 enun:"Paciente de 40 anos apresenta disfagia tanto para sólidos quanto para líquidos desde o início, associada à regurgitação sem náuseas e perda de peso. Qual o principal mecanismo fisiopatológico envolvido?",itens:[],
 opts:["Redução do tônus do esfíncter esofágico inferior por refluxo ácido","Inflamação mediada por eosinófilos com liberação de citocinas Th2","Obstrução mecânica por fibrose secundária à esofagite crônica","Aumento da pressão intra-abdominal favorecendo refluxo","Degeneração dos neurônios inibitórios do plexo mioentérico"],ans:4,
 why:"Sólidos + líquidos desde o início = motora = acalasia. Cada distrator é o mecanismo de outra doença da aula: A e D = DRGE, B = EEo, C = estenose."},
{id:"T11-Q9",a:"A3",prova:"T11 · Q9",selo:"OF",tipo:"caso + afirmativas I–V",tema:"Colestase",dz:["colestase_intra","colestase_extra"],
 enun:"Paciente apresenta icterícia, prurido intenso, colúria e fezes claras. Exames laboratoriais mostram elevação de bilirrubina, fosfatase alcalina e GGT. Analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. O quadro sugere comprometimento do fluxo biliar.","II. A colestase pode ter origem intra-hepática ou extra-hepática.","III. A ultrassonografia abdominal é o exame inicial de escolha na investigação.","IV. A principal alteração laboratorial é redução da bilirrubina sérica.","V. A colestase não interfere na digestão de gorduras."],
 opts:["I, II e III","I, III e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: a bilirrubina SOBE. V: sem sais biliares no intestino não há micelas — a digestão de gorduras piora."},
{id:"T11-Q10",a:"A4",prova:"T11 · Q10",selo:"OF",tipo:"afirmativas I–V",tema:"ADP — ressecabilidade",dz:["adp"],
 enun:"Sobre os critérios de ressecabilidade e de tratamento do adenocarcinoma ductal pancreático, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. A ausência de metástases à distância é um dos critérios para que o tumor seja considerado ressecável.","II. O envolvimento arterial superior a 180° do tronco celíaco, artéria mesentérica superior ou artéria hepática comum é considerado critério de irressecabilidade.","III. Tumores sem comprometimento arterial e com oclusão venosa passível de reconstrução são considerados ressecáveis, independentemente de outros critérios.","IV. Para tumores avançados, o tratamento padrão é cirurgia de Whipple associada à quimioterapia.","V. A presença de ascite maligna caracteriza doença metastática e contraindica abordagem cirúrgica com intenção curativa."],
 opts:["I, II e III","I, III e IV","I, II e V","II, III e IV","III, IV e V"],ans:2,
 why:"III cai no “independentemente de outros critérios” (metástase contraindica). IV: Whipple + QT é do RESSECÁVEL; avançado = FOLFIRINOX."},
{id:"T11-Q11",a:"A1",prova:"T11 · Q11",selo:"OF",tipo:"caso → significado",tema:"Esôfago de Barrett",dz:["barrett"],
 enun:"Paciente de 58 anos, com história de refluxo gastroesofágico crônico, realiza endoscopia digestiva alta que evidencia mucosa esofágica distal com aspecto avermelhado e aveludado. Biópsia confirma presença de células caliciformes. Qual o significado dessa alteração?",itens:[],
 opts:["Processo inflamatório agudo reversível sem risco de progressão","Metaplasia intestinal associada a aumento do risco de adenocarcinoma","Displasia de alto grau com indicação imediata de cirurgia","Hiperplasia escamosa benigna sem relevância clínica","Alteração infecciosa associada à colonização bacteriana"],ans:1,
 why:"Células caliciformes no esôfago distal = metaplasia intestinal = Barrett, lesão pré-maligna (metaplasia → displasia → adenocarcinoma). Atenção ao passar para o gabarito: na folha da veterana a marcação estava em B, mas a letra transcrita no gabarito foi outra."},
{id:"T11-Q12",a:"A3",prova:"T11 · Q12",selo:"OF",tipo:"caso + afirmativas I–V",tema:"Colestase intra-hepática",dz:["colestase_intra"],
 enun:"Paciente de 58 anos apresenta, há 10 dias, icterícia progressiva, prurido intenso e fadiga. Nega dor abdominal significativa. Exames mostram elevação de bilirrubina, fosfatase alcalina e GGT. USG inicial não evidencia dilatação das vias biliares. Analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. O quadro sugere colestase, podendo estar relacionada a comprometimento intra-hepático do fluxo biliar.","II. A ausência de dilatação de vias biliares na ultrassonografia torna improvável a hipótese de colestase.","III. A colestase pode estar associada a doenças metabólicas, autoimunes ou uso de medicamentos.","IV. A redução da excreção de sais biliares pode contribuir para prejuízo na digestão de gorduras.","V. A dor abdominal é a manifestação clínica mais constante nas formas intra-hepáticas de colestase."],
 opts:["I, III e IV","I, II e V","II, III e IV","I, IV e V","III, IV e V"],ans:0,
 why:"Sem dilatação = colestase INTRA-hepática (não afasta colestase). Dor abdominal é mais comum nas EXTRA-hepáticas. Causas intra: metabólicas (Wilson, hemocromatose), autoimunes, drogas."},
{id:"T11-Q13A",a:"A4",prova:"T11 · Q13-A",selo:"OF",tipo:"caso",tema:"ADP de cabeça",dz:["adp"],
 enun:"Homem de 68 anos, tabagista, apresenta icterícia progressiva indolor, associada a urina escura e fezes hipocólicas. Refere dor epigástrica com irradiação para o dorso. Ao exame, emagrecido. Hipótese diagnóstica?",
 resp:"Adenocarcinoma ductal da cabeça do pâncreas",
 why:"Tabagista + icterícia obstrutiva indolor + dor irradiada ao dorso (infiltração neural) + emagrecimento. A veterana escreveu “carcinoma hepatocelular” e a professora corrigiu para pâncreas: não há cirrose nem hepatite no caso."},
{id:"T11-Q13B",a:"A1",prova:"T11 · Q13-B",selo:"OF",tipo:"caso",tema:"Esofagite eosinofílica",dz:["eeo"],
 enun:"Paciente masculino, 25 anos, com história de atopia, apresenta disfagia intermitente para sólidos há alguns meses, com episódios de impactação alimentar. Nega pirose predominante. Hipótese diagnóstica?",
 resp:"Esofagite eosinofílica",why:"Jovem atópico + disfagia para sólidos intermitente + impactação, sem pirose (afasta DRGE)."},
{id:"T11-Q13C",a:"A1",prova:"T11 · Q13-C",selo:"OF",tipo:"caso",tema:"Atresia esofágica",dz:["atresia"],
 enun:"Recém-nascido apresenta salivação excessiva, dificuldade para alimentação e episódios de cianose durante as tentativas de amamentação. Hipótese diagnóstica?",
 resp:"Atresia de esôfago com fístula traqueoesofágica",why:"A professora descontou de quem escreveu só “atresia esofágica” e completou “com fístula”. Nome inteiro!"},
{id:"T11-Q13D",a:"A2",prova:"T11 · Q13-D",selo:"OF",tipo:"caso",tema:"Doença de Crohn",dz:["crohn"],
 enun:"Paciente de 28 anos com diarreia crônica há vários meses, dor abdominal recorrente em quadrante inferior direito e perda de peso. Episódios intermitentes de melhora e piora. Colonoscopia com áreas de mucosa normal intercaladas com ulcerações profundas. Hipótese diagnóstica?",
 resp:"Doença de Crohn",why:"QID (íleo terminal) + lesões salteadas + úlceras profundas + curso com remissões."},
{id:"AU-C1",a:"A4",prova:"Aula · Caso 1",selo:"AU",tipo:"caso",tema:"Pancreatite aguda biliar",dz:["pa"],
 enun:"Feminina, 45 anos, colelitíase, dor intensa em epigástrio irradiada para dorso, náuseas e vômitos há 12 h. Lipase 1200 U/L (VR < 60); USG com cálculos na vesícula. (1) Diagnóstico? (2) Mecanismo? (3) Conduta inicial?",
 resp:"(1) Pancreatite aguda de origem biliar · (2) cálculo obstrui a ampola → lesão acinar → co-localização → catepsina B ativa tripsinogênio → autodigestão · (3) suporte: Ringer lactato, analgesia, dieta enteral precoce; depois tratar a litíase (colecistectomia/CPRE)",
 why:"Atlanta: dor típica + lipase > 3× já fecham 2 de 3."},
{id:"AU-C2",a:"A4",prova:"Aula · Caso 2",selo:"AU",tipo:"caso",tema:"Cullen e Grey Turner",dz:["pa"],
 enun:"Masculino, 52 anos, etilista, com pancreatite aguda, evolui com equimoses periumbilicais e em flancos. (1) O que indicam? (2) Gravidade? (3) Complicação associada?",
 resp:"(1) Sinais de Cullen (periumbilical) e Grey Turner (flancos) = hemorragia retroperitoneal · (2) pancreatite grave · (3) necrose hemorrágica (elastase + fosfolipase A2)",
 why:"São achados de gravidade, não de diagnóstico."},
{id:"AU-C3",a:"A4",prova:"Aula · Caso 3",selo:"AU",tipo:"caso",tema:"ADP de cabeça",dz:["adp"],
 enun:"Masculino, 68 anos, tabagista, icterícia progressiva indolor, perda de peso e urina escura. (1) Hipótese? (2) Localização provável? (3) Exame inicial?",
 resp:"(1) Adenocarcinoma ductal do pâncreas · (2) cabeça (comprime o colédoco) · (3) TC de abdome contrastada, protocolo de pâncreas",
 why:"É praticamente a Q13-A da T11 — o caso da aula virou questão de prova."},
{id:"AU-C4",a:"A4",prova:"Aula · Caso 4",selo:"AU",tipo:"caso",tema:"Pancreatite crônica",dz:["pc"],
 enun:"Masculino, 50 anos, etilista crônico, dor abdominal recorrente há anos, pior após refeições, fezes volumosas e perda de peso. (1) Diagnóstico? (2) Alteração funcional principal? (3) Exame que confirma insuficiência exócrina?",
 resp:"(1) Pancreatite crônica alcoólica · (2) insuficiência exócrina (má digestão, esteatorreia) · (3) elastase fecal (↓, < 100 µg/g)",
 why:"Você anotou “elastase” no slide — foi a resposta dada em aula."}
);

window.QS=window.QS||[];
QS.push(
{id:"IN-A1-01",a:"A1",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Disfagia — padrões",dz:["estenose","acalasia","eeo"],
 enun:"Sobre a interpretação da disfagia nas doenças esofágicas, assinale a alternativa correta:",itens:[],
 opts:["Disfagia para sólidos e líquidos desde o início sugere obstrução mecânica por estenose.","Disfagia progressiva, começando pelos sólidos, sugere distúrbio motor como a acalasia.","Disfagia intermitente com episódios de impactação alimentar sugere esofagite eosinofílica.","Pirose predominante com disfagia leve sugere acalasia em fase inicial.","A regurgitação da acalasia costuma ser precedida de náuseas intensas."],ans:2,
 why:"Progressiva = mecânica; desde o início (sólidos + líquidos) = motora; intermitente/impactação = EEo; pirose predominante = DRGE. A regurgitação da acalasia é SEM náusea."},
{id:"IN-A1-02",a:"A1",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Atresia esofágica",dz:["atresia"],
 enun:"Analise as afirmativas sobre a atresia esofágica. É correto apenas o que se afirma em:",
 itens:["I. Decorre da falha na separação do intestino anterior em traqueia e esôfago.","II. No recém-nascido cursa com salivação excessiva, engasgos e cianose durante a alimentação.","III. A distensão abdominal é esperada quando há fístula traqueoesofágica distal.","IV. O diagnóstico é sugerido quando a sonda progride até o estômago sem resistência.","V. O tratamento inicial de escolha é a dilatação endoscópica."],
 opts:["I, II e III","I, II e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: a sonda NÃO progride e aparece enrolada no coto proximal ao RX. V: o tratamento é cirúrgico (dilatação é da estenose). III: pela fístula distal o ar da traqueia chega ao estômago."},
{id:"IN-A1-03",a:"A1",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Acalasia — mecanismo",dz:["acalasia"],
 enun:"Assinale a alternativa que descreve corretamente a fisiopatologia da acalasia:",itens:[],
 opts:["Hiperatividade de neurônios excitatórios do plexo submucoso, com aumento de óxido nítrico e VIP.","Perda de neurônios inibitórios do plexo mioentérico, com redução de óxido nítrico e VIP, falha no relaxamento do EEI e perda da peristalse.","Redução do tônus basal do EEI por anticolinérgicos, com refluxo ácido e esofagite.","Infiltração eosinofílica da mucosa com remodelamento e estreitamento luminal.","Fibrose da submucosa após esofagite crônica, com estenose péptica."],ans:1,
 why:"O plexo é o MIOENTÉRICO (Auerbach, peristalse); os neurônios perdidos são os INIBITÓRIOS; NO e VIP CAEM. C é DRGE, D é EEo, E é estenose."},
{id:"IN-A1-04",a:"A1",prova:"Inédita",selo:"IN",tipo:"caso → exame",tema:"Acalasia — diagnóstico",dz:["acalasia"],
 enun:"Mulher de 38 anos com disfagia para sólidos e líquidos desde o início, regurgitação de alimentos não digeridos e halitose. A esofagografia mostra esôfago dilatado com afilamento distal. Qual exame é o padrão-ouro para confirmar o diagnóstico?",itens:[],
 opts:["Esofagografia baritada","Endoscopia digestiva alta com biópsia","pHmetria esofágica de 24 horas","Manometria esofágica","Tomografia de tórax"],ans:3,
 why:"Manometria = padrão-ouro (EEI hipertônico que não relaxa + aperistalse). O bário mostra o “bico de pássaro”; a EDA serve para excluir pseudoacalasia; pHmetria é padrão-ouro da DRGE."},
{id:"IN-A1-05",a:"A1",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Acalasia — causas",dz:["acalasia"],
 enun:"Sobre as causas de acalasia, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. A doença de Chagas é a principal causa de acalasia secundária na América Latina.","II. Carcinoma da junção esofagogástrica pode produzir pseudoacalasia por infiltração ou compressão do EEI.","III. A síndrome de Allgrove associa acalasia, alacrimia e insuficiência adrenal.","IV. Como a acalasia é doença motora, a endoscopia é dispensável na investigação.","V. A infecção por HSV-1 é a causa comprovada de toda acalasia primária."],
 opts:["I, II e III","I, III e IV","II, IV e V","I, II e V","III, IV e V"],ans:0,
 why:"IV: a EDA é obrigatória para excluir pseudoacalasia (câncer da JEG). V: o vírus é HIPÓTESE (autoimunidade pós-viral), não causa comprovada."},
{id:"IN-A1-06",a:"A1",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"EEo — patogênese",dz:["eeo"],
 enun:"Sobre a patogênese da esofagite eosinofílica, assinale a alternativa correta:",itens:[],
 opts:["Resulta de resposta Th1 com predomínio de interferon-gama.","A IL-5 inibe a diferenciação de eosinófilos, limitando a inflamação.","A IL-13 estimula o epitélio esofágico a expressar eotaxina-3, que atrai eosinófilos para a mucosa.","Os eosinófilos protegem o epitélio e impedem o remodelamento da parede.","A doença é desencadeada principalmente pelo refluxo ácido."],ans:2,
 why:"Th2: IL-5 diferencia/ativa eosinófilos; IL-13 → eotaxina-3 (quimiocina). Os eosinófilos liberam proteína catiônica, peroxidase e leucotrienos → lesão, fibrose e disfunção motora. O gatilho é alérgeno (alimentar > aeroalérgeno)."},
{id:"IN-A1-07",a:"A1",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"EEo — diagnóstico",dz:["eeo"],
 enun:"O critério histológico da esofagite eosinofílica apresentado em aula é:",itens:[],
 opts:["≥ 5 eosinófilos por campo de grande aumento em uma única biópsia","≥ 15 eosinófilos por campo de grande aumento em pelo menos duas regiões do esôfago","≥ 15 neutrófilos por campo em biópsia do esôfago distal","Presença de células caliciformes no esôfago distal","Granulomas não caseosos na submucosa"],ans:1,
 why:"≥ 15 eos/CGA em ≥ 2 regiões. Caliciformes = Barrett; granuloma não caseoso = Crohn."},
{id:"IN-A1-08",a:"A1",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"EEo — tratamento",dz:["eeo"],
 enun:"Sobre o tratamento da esofagite eosinofílica (“3 Ds”), analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. A dieta de exclusão empírica retira leite, trigo, ovos, frutos do mar, nozes e soja.","II. Os inibidores da bomba de prótons fazem parte do tratamento medicamentoso.","III. Corticoides sistêmicos são a primeira linha para todos os pacientes.","IV. A dilatação esofágica trata a inflamação de base e dispensa o tratamento clínico.","V. Corticoides tópicos engolíveis, como budesonida e fluticasona, podem ser usados."],
 opts:["I, II e V","I, III e IV","II, III e V","I, IV e V","II, III e IV"],ans:0,
 why:"III: sistêmico só nos graves/refratários. IV: a dilatação alivia a mecânica, mas NÃO trata a inflamação."},
{id:"IN-A1-09",a:"A1",prova:"Inédita",selo:"IN",tipo:"assinale a INCORRETA",tema:"DRGE — fisiopatologia",dz:["drge"],
 enun:"Sobre a fisiopatologia da DRGE, assinale a alternativa INCORRETA:",itens:[],
 opts:["A barreira anti-refluxo é formada pelo EEI e pelo hiato diafragmático.","Benzodiazepínicos e anticolinérgicos reduzem o tônus basal do EEI.","Distensão gástrica, chocolate, álcool e café favorecem relaxamentos transitórios do EEI.","Obesidade, gestação e ascite aumentam a pressão intra-abdominal e favorecem o refluxo.","O aumento do tônus do EEI é o principal mecanismo do refluxo."],ans:4,
 why:"É a queda do tônus (ou os relaxamentos transitórios) que permite o refluxo. EEI hipertônico é acalasia."},
{id:"IN-A1-10",a:"A1",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"DRGE — diagnóstico",dz:["drge"],
 enun:"Sobre o diagnóstico da DRGE, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. Nos casos típicos, com pirose e regurgitação ácida, o diagnóstico pode ser clínico.","II. A pHmetria de 24 horas é o padrão-ouro para quantificar o refluxo ácido.","III. A manometria esofágica avalia a motilidade antes de cirurgia.","IV. A EDA é obrigatória em todos os pacientes antes de iniciar IBP.","V. Tosse crônica e rouquidão excluem DRGE."],
 opts:["I, II e III","I, II e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: em casos típicos o diagnóstico é clínico (EDA identifica esofagite e complicações). V: tosse crônica, rouquidão e dor torácica são formas ATÍPICAS da DRGE."},
{id:"IN-A1-11",a:"A1",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"DRGE — cirurgia",dz:["drge"],
 enun:"A fundoplicatura de Nissen, segundo a aula, está indicada principalmente em:",itens:[],
 opts:["Todo paciente com pirose há mais de 1 mês","Pacientes refratários ao tratamento clínico, jovens ou que não desejam medicação contínua","Pacientes com acalasia e bico de pássaro","Esofagite eosinofílica com impactação alimentar","Pacientes idosos com displasia de alto grau em Barrett, como primeira escolha"],ans:1,
 why:"Nissen: refratários, jovens ou quem não quer medicação contínua. Acalasia = Heller; EEo = 3 Ds; displasia de alto grau = tratamento endoscópico/intervencionista."},
{id:"IN-A1-12",a:"A1",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Barrett — conduta",dz:["barrett"],
 enun:"Sobre a conduta no esôfago de Barrett, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. O IBP é usado em dose plena, como omeprazol 40–80 mg/dia.","II. Sem displasia, a vigilância endoscópica é feita a cada 3–5 anos.","III. Na displasia de alto grau está indicado tratamento intervencionista.","IV. A ablação por radiofrequência é contraindicada no Barrett.","V. Por ser metaplasia adaptativa, não exige vigilância."],
 opts:["I, II e III","I, II e IV","II, IV e V","I, III e V","III, IV e V"],ans:0,
 why:"IV: a ablação por RF é justamente o tratamento endoscópico para erradicar a metaplasia. V: é lesão pré-maligna — por isso a vigilância."},
{id:"IN-A1-13",a:"A1",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Barrett — progressão",dz:["barrett"],
 enun:"A sequência de progressão maligna do esôfago de Barrett é:",itens:[],
 opts:["Displasia de alto grau → metaplasia → adenocarcinoma","Metaplasia → displasia de baixo grau → displasia de alto grau → adenocarcinoma invasivo","Metaplasia → carcinoma espinocelular","Hiperplasia escamosa → displasia → adenocarcinoma","Esofagite eosinofílica → metaplasia → adenocarcinoma"],ans:1,
 why:"É a escada do slide. O câncer do Barrett é ADENOcarcinoma (epitélio colunar), não espinocelular."},
{id:"IN-A1-14",a:"A1",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Estenose esofágica",dz:["estenose"],
 enun:"Sobre a estenose esofágica, assinale a alternativa correta:",itens:[],
 opts:["É sempre congênita.","Cursa com disfagia para sólidos e líquidos desde o início.","A DRGE crônica pode levar à estenose por esofagite que cicatriza com fibrose.","O tratamento de escolha é a miotomia de Heller.","A radioterapia protege contra estenose."],ans:2,
 why:"Adquirida é mais comum (DRGE, cáusticos, RT, anastomose, neoplasia); disfagia progressiva começando por sólidos; tratamento = dilatação endoscópica."},
{id:"IN-A1-C1",a:"A1",prova:"Inédita",selo:"IN",tipo:"caso",tema:"Acalasia chagásica",dz:["acalasia"],
 enun:"Homem de 52 anos, natural de área endêmica para Chagas, com disfagia para sólidos e líquidos há anos, regurgitação de alimentos não digeridos sem náusea e emagrecimento. Esofagografia: “bico de pássaro”. Hipótese diagnóstica?",
 resp:"Acalasia secundária à doença de Chagas (megaesôfago chagásico)",why:"T. cruzi destrói os neurônios do plexo mioentérico — principal causa secundária na América Latina."},
{id:"IN-A1-C2",a:"A1",prova:"Inédita",selo:"IN",tipo:"caso",tema:"Esôfago de Barrett",dz:["barrett"],
 enun:"Homem de 55 anos, obeso, com pirose e regurgitação há 10 anos. EDA: língua de mucosa avermelhada e aveludada acima da junção esofagogástrica; biópsia com células caliciformes. Hipótese diagnóstica?",
 resp:"Esôfago de Barrett (metaplasia intestinal)",why:"DRGE crônica + mucosa colunar + células caliciformes."},
{id:"IN-A1-C3",a:"A1",prova:"Inédita",selo:"IN",tipo:"caso",tema:"Estenose cáustica",dz:["estenose"],
 enun:"Mulher de 24 anos que ingeriu soda cáustica há 3 meses evolui com disfagia progressiva, primeiro para sólidos. Hipótese diagnóstica?",
 resp:"Estenose esofágica adquirida (cáustica)",why:"Agressão → fibrose → estreitamento; disfagia mecânica progressiva. Tratamento: dilatação endoscópica."},
{id:"IN-A1-C4",a:"A1",prova:"Inédita",selo:"IN",tipo:"caso",tema:"DRGE",dz:["drge"],
 enun:"Gestante de 30 semanas com azia pós-prandial que piora ao deitar, regurgitação ácida e tosse noturna. Hipótese diagnóstica?",
 resp:"Doença do refluxo gastroesofágico",why:"Gestação: ↓ tônus do EEI (progesterona) + ↑ pressão intra-abdominal. Tosse crônica é forma atípica."}
);

window.QS=window.QS||[];
QS.push(
{id:"IN-A2-01",a:"A2",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Obstrução — pistas",dz:["obstrucao"],
 enun:"Sobre as pistas clínicas da obstrução intestinal, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. Vômitos precoces sugerem obstrução alta.","II. Distensão abdominal importante sugere obstrução baixa.","III. Parada de eliminação de fezes e gases sugere obstrução completa.","IV. Dor contínua com febre sugere obstrução parcial sem sofrimento de alça.","V. A dor em cólica é típica da fase tardia, com necrose estabelecida."],
 opts:["I, II e III","I, II e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: dor contínua + febre = suspeitar de ISQUEMIA. V: cólica é do início (peristalse contra o obstáculo); a fase tardia tem dor contínua."},
{id:"IN-A2-02",a:"A2",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Aderências",dz:["aderencias"],
 enun:"Paciente com duas laparotomias prévias apresenta dor abdominal, distensão, vômitos e parada de eliminação de gases. Sobre o quadro, assinale a correta:",itens:[],
 opts:["A causa mais provável é hérnia umbilical estrangulada.","O exame principal é a TC de abdome com contraste e o tratamento inicial pode ser conservador, com hidratação e sonda nasogástrica.","A adesiólise está indicada em todos os casos, mesmo na obstrução parcial.","Aderências são mais comuns após infecções urinárias.","O diagnóstico é exclusivamente clínico, sem papel para imagem."],ans:1,
 why:"Cirurgia abdominal = causa mais comum de bridas. TC com contraste é o principal exame; conservador (hidratação + SNG) e adesiólise se completa ou complicada."},
{id:"IN-A2-03",a:"A2",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Hérnias",dz:["hernias"],
 enun:"Sobre as hérnias abdominais, assinale a alternativa correta:",itens:[],
 opts:["Encarceramento significa isquemia do conteúdo herniado.","Herniorrafia é o reparo com tela e hernioplastia, sem tela.","Estrangulamento significa isquemia do conteúdo e é indicação de urgência.","O diagnóstico depende sempre de TC.","Hérnias incisionais não podem causar obstrução intestinal."],ans:2,
 why:"Encarceramento = não reduz; estrangulamento = isquemia (urgência). Herniorrafia = sem tela; hernioplastia = com tela. Diagnóstico é clínico (imagem só na dúvida)."},
{id:"IN-A2-04",a:"A2",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Vólvulo",dz:["volvulo"],
 enun:"Sobre o vólvulo intestinal, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. Os locais mais comuns são sigmoide e ceco.","II. O megacólon chagásico predispõe ao vólvulo de sigmoide.","III. O RX pode mostrar o sinal do “grão de café”.","IV. Na presença de necrose, a conduta é descompressão endoscópica e observação.","V. Os vômitos costumam ser o primeiro sintoma, por se tratar de obstrução alta."],
 opts:["I, II e III","I, II e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: isquemia/necrose = cirurgia de urgência (descompressão endoscópica é para o estável). V: é obstrução baixa — vômitos tardios."},
{id:"IN-A2-05",a:"A2",prova:"Inédita",selo:"IN",tipo:"caso → conduta",tema:"Intussuscepção",dz:["intuss"],
 enun:"Lactente de 10 meses, após quadro viral, apresenta crises de choro com cólica, vômitos, massa em “salsicha” palpável e fezes com sangue e muco. A USG mostra sinal do alvo. Qual a conduta indicada, se não houver complicação?",itens:[],
 opts:["Laparotomia imediata","Redução por enema com ar ou contraste","Descompressão endoscópica por colonoscopia","Antibiótico e observação","Heparinização plena"],ans:1,
 why:"Na criança, a intussuscepção é idiopática/pós-viral e a redução por enema é o tratamento; cirurgia fica para o adulto (lesão-guia) ou para as complicadas."},
{id:"IN-A2-06",a:"A2",prova:"Inédita",selo:"IN",tipo:"assinale a INCORRETA",tema:"Intussuscepção — adulto",dz:["intuss"],
 enun:"Sobre a intussuscepção, assinale a alternativa INCORRETA:",itens:[],
 opts:["No adulto costuma haver lesão desencadeante, como tumor ou pólipo.","A USG mostra “alvo” no corte transversal e “pseudo-rim” no longitudinal.","A compressão vascular pode levar a isquemia e necrose.","No adulto, a TC de abdome é útil no diagnóstico.","No adulto, a redução por enema é o tratamento definitivo de escolha."],ans:4,
 why:"No adulto (ou se complicada) o tratamento é cirúrgico — há uma lesão-guia a ressecar."},
{id:"IN-A2-07",a:"A2",prova:"Inédita",selo:"IN",tipo:"caso → exame",tema:"Isquemia mesentérica — diagnóstico",dz:["ima"],
 enun:"Homem de 74 anos com fibrilação atrial, sem anticoagulação, apresenta dor abdominal súbita e intensa, desproporcional ao exame físico, com lactato elevado. Qual o exame de escolha para confirmar a suspeita?",itens:[],
 opts:["USG com Doppler","Colonoscopia","Angiotomografia com contraste","Radiografia simples de abdome","Endoscopia digestiva alta"],ans:2,
 why:"AngioTC = exame de escolha; angiografia = padrão-ouro; Doppler é limitado. FA → embolia, a causa mais comum, na AMS."},
{id:"IN-A2-08",a:"A2",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Isquemia mesentérica — mecanismo",dz:["ima"],
 enun:"Sobre as doenças vasculares intestinais, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. A hipóxia leva a metabolismo anaeróbio, com aumento de lactato e acidose.","II. A lesão da mucosa causa perda da barreira e translocação bacteriana.","III. A artéria mesentérica superior é o principal território acometido na isquemia aguda.","IV. A trombose venosa é a causa mais comum de isquemia mesentérica aguda.","V. A heparina é contraindicada na trombose venosa mesentérica."],
 opts:["I, II e III","I, II e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: a mais comum é a EMBOLIA arterial. V: a anticoagulação com heparina é indicada, principalmente na trombose venosa."},
{id:"IN-A2-09",a:"A2",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Colite isquêmica",dz:["colite_isq"],
 enun:"Sobre a colite isquêmica, assinale a alternativa correta:",itens:[],
 opts:["Acomete tipicamente o cólon direito e o íleo terminal.","É a forma mais grave de isquemia intestinal, com necrose em quase todos os casos.","Localiza-se tipicamente na flexura esplênica e no sigmoide, e manifesta-se com dor súbita em flanco esquerdo e diarreia com sangue.","O diagnóstico é feito pela pesquisa de toxinas A/B.","O tratamento inicial é sempre cirúrgico."],ans:2,
 why:"É a forma mais LEVE (hipoperfusão transitória), no cólon esquerdo (zonas de divisa). TC: espessamento segmentar; colonoscopia: edema, úlceras, áreas hemorrágicas. Tratamento de suporte."},
{id:"IN-A2-10",a:"A2",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"C. difficile — fatores de risco",dz:["cdiff"],
 enun:"São fatores de risco para colite pseudomembranosa citados em aula, EXCETO:",itens:[],
 opts:["Hospitalização","Idade avançada","Imunossupressão","Uso de inibidor de bomba de prótons","Vacinação recente contra rotavírus"],ans:4,
 why:"Hospitalizados, idosos, imunossuprimidos e uso de IBP; o gatilho clássico é o antibiótico (cefalosporinas, fluoroquinolonas, clindamicina, penicilinas)."},
{id:"IN-A2-11",a:"A2",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"C. difficile — tratamento",dz:["cdiff"],
 enun:"Na colite pseudomembranosa, o tratamento específico de 1ª escolha apresentado em aula é:",itens:[],
 opts:["Vancomicina endovenosa","Metronidazol + loperamida","Vancomicina oral","Clindamicina oral","Ciprofloxacino"],ans:2,
 why:"Vancomicina ORAL (1ª escolha no slide), fidaxomicina como alternativa, e suspender o antibiótico causal. Vancomicina EV não chega à luz do cólon; antidiarreico piora (retém toxina)."},
{id:"IN-A2-12",a:"A2",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Salmonelose — diagnóstico e tratamento",dz:["salmonela"],
 enun:"Sobre a salmonelose, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. A coprocultura é o exame da gastroenterite.","II. A hemocultura é o exame da febre tifoide.","III. Ciprofloxacino ou ceftriaxona são opções de primeira linha na febre tifoide.","IV. A febre tifoide surge em 24 horas após a ingestão do alimento.","V. Rose spots são manchas róseas nos membros inferiores típicas da gastroenterite."],
 opts:["I, II e III","I, II e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: incubação de 5–21 dias. V: rose spots são no TRONCO e são da febre tifoide."},
{id:"IN-A2-13",a:"A2",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Artrite reativa",dz:["artrite_reativa"],
 enun:"Homem de 26 anos, três semanas após gastroenterite por Salmonella, desenvolve artrite assimétrica de joelho e tornozelo, com uretrite e conjuntivite. Sobre o quadro, assinale a correta:",itens:[],
 opts:["Trata-se de artrite séptica por disseminação hematogênica da Salmonella.","O líquido sinovial deve mostrar a bactéria na cultura.","Trata-se de artrite reativa por mimetismo molecular, com inflamação articular estéril (síndrome de Reiter).","O quadro é típico de febre tifoide.","A artrite costuma ser simétrica e de pequenas articulações das mãos."],ans:2,
 why:"Reação cruzada imunológica → artrite estéril, 1–4 semanas após, assimétrica, MMII; com uretrite + conjuntivite = Reiter."},
{id:"IN-A2-14",a:"A2",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Crohn × RCU",dz:["crohn","rcu"],
 enun:"Sobre a comparação entre doença de Crohn e retocolite ulcerativa, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. A doença de Crohn pode acometer todo o trato digestivo, com lesões em “salteado”.","II. A retocolite ulcerativa é restrita ao cólon e reto, com inflamação contínua a partir do reto.","III. Fístulas e abscessos são frequentes na retocolite ulcerativa.","IV. A cirurgia na doença de Crohn é curativa.","V. O tabagismo piora a doença de Crohn e pode ter efeito protetor na retocolite."],
 opts:["I, II e V","I, III e IV","II, III e V","I, IV e V","II, III e IV"],ans:0,
 why:"III: fístulas/abscessos são do Crohn (transmural). IV: no Crohn a cirurgia NÃO é curativa; na RCU a colectomia total pode ser."},
{id:"IN-A2-15",a:"A2",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Crohn — histologia",dz:["crohn"],
 enun:"Sobre a doença de Crohn, assinale a alternativa correta:",itens:[],
 opts:["A inflamação é restrita à mucosa, com abscessos de cripta como achado principal.","Granulomas não caseosos são obrigatórios para o diagnóstico.","A resposta imune predominante é Th2.","A inflamação é transmural, o que explica fístulas, abscessos e estenoses; granulomas não caseosos são sugestivos, mas não obrigatórios.","A dor abdominal localiza-se tipicamente no quadrante inferior esquerdo."],ans:3,
 why:"Transmural + Th1/Th17 + granulomas sugestivos (não obrigatórios) + dor em QID. Mucosa com abscesso de cripta e dor em QIE = RCU."},
{id:"IN-A2-16",a:"A2",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"RCU — tratamento",dz:["rcu"],
 enun:"Na retocolite ulcerativa, qual classe é usada para indução e manutenção da remissão, segundo a aula?",itens:[],
 opts:["Aminossalicilatos (sulfassalazina ou mesalazina)","Antibióticos de amplo espectro","Anticoagulantes","Inibidores de bomba de prótons","Procinéticos"],ans:0,
 why:"5-ASA para indução e manutenção; corticoide nas crises moderadas/graves; azatioprina/6-MP nos refratários; biológicos; colectomia total pode ser curativa."},
{id:"IN-A2-C1",a:"A2",prova:"Inédita",selo:"IN",tipo:"caso",tema:"Vólvulo de sigmoide",dz:["volvulo"],
 enun:"Idoso chagásico, com constipação crônica, inicia dor abdominal intensa e progressiva, grande distensão, parada de fezes e gases e vômitos tardios. RX com imagem em “grão de café”. Hipótese diagnóstica?",
 resp:"Vólvulo de sigmoide (sobre megacólon chagásico)",why:"Alça dilatada e móvel torce no eixo mesentérico."},
{id:"IN-A2-C2",a:"A2",prova:"Inédita",selo:"IN",tipo:"caso",tema:"Isquemia mesentérica aguda",dz:["ima"],
 enun:"Mulher de 78 anos com fibrilação atrial apresenta dor abdominal súbita, intensíssima, mas abdome flácido e pouco doloroso à palpação. Lactato 4,1 mmol/L. Hipótese diagnóstica?",
 resp:"Isquemia mesentérica aguda (embolia da artéria mesentérica superior)",why:"Dor desproporcional ao exame físico = sinal precoce-chave; FA → embolia."},
{id:"IN-A2-C3",a:"A2",prova:"Inédita",selo:"IN",tipo:"caso",tema:"Colite pseudomembranosa",dz:["cdiff"],
 enun:"Idosa internada há 7 dias recebendo ceftriaxona para pneumonia evolui com diarreia aquosa profusa, cólica, febre e leucocitose de 22.000. Hipótese diagnóstica?",
 resp:"Colite pseudomembranosa por Clostridioides difficile",why:"Antibiótico → disbiose → toxinas A/B. Pedir toxinas; suspender o ATB; vancomicina oral."},
{id:"IN-A2-C4",a:"A2",prova:"Inédita",selo:"IN",tipo:"caso",tema:"Retocolite ulcerativa",dz:["rcu"],
 enun:"Mulher de 30 anos com diarreia com sangue e muco há meses, tenesmo e dor em quadrante inferior esquerdo. Colonoscopia: inflamação contínua desde o reto, úlceras rasas e sangramento espontâneo; biópsia com abscessos de cripta. Hipótese diagnóstica?",
 resp:"Retocolite ulcerativa",why:"Contínua a partir do reto, superficial, criptite/abscesso de cripta."}
);

window.QS=window.QS||[];
QS.push(
{id:"IN-A3-01",a:"A3",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Terminologia — DHGNA/EHNA",dz:["hep_nao_inf"],
 enun:"Sobre a terminologia das doenças hepáticas gordurosas, assinale a correta:",itens:[],
 opts:["Esteatose hepática refere-se exclusivamente à gordura hepática de origem alcoólica.","DHGNA engloba desde esteatose simples até formas inflamatórias, sem consumo significativo de álcool; a EHNA é a sua forma inflamatória.","EHNA é sinônimo de esteatose simples, sem risco de fibrose.","DHGNA exige consumo abusivo de álcool para o diagnóstico.","EHNA não pode evoluir para cirrose."],ans:1,
 why:"Esteatose = só gordura (qualquer causa); DHGNA = espectro sem álcool; EHNA = forma inflamatória, pode fibrosar e cirrosar."},
{id:"IN-A3-02",a:"A3",prova:"Inédita",selo:"IN",tipo:"caso → mecanismo",tema:"Hepatite isquêmica",dz:["hep_isq"],
 enun:"Paciente em choque cardiogênico apresenta, em 24 horas, AST e ALT acima de 3.000 U/L, que caem rapidamente após estabilização hemodinâmica. Qual o achado histológico esperado?",itens:[],
 opts:["Necrose periportal com infiltrado linfoplasmocitário","Necrose centrolobular por hipóxia","Esteatose macrovesicular com corpúsculos de Mallory","Colestase canalicular com proliferação ductal","Depósito de ferro nos hepatócitos"],ans:1,
 why:"Hepatite isquêmica: ↓ fluxo → hipóxia → necrose CENTROLOBULAR (zona mais distante do aporte de O₂); AST/ALT sobem muito e rápido; reversível."},
{id:"IN-A3-03",a:"A3",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Hepatites virais — cronificação",dz:["hav","hbv","hcv","hdv","hev"],
 enun:"Sobre as hepatites virais, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. As hepatites A e E são de transmissão fecal-oral e, em geral, não cronificam.","II. A hepatite C cronifica em cerca de 80% dos casos.","III. A hepatite D só ocorre em pacientes com infecção pelo HBV.","IV. A hepatite E é mais branda em gestantes.","V. Existe vacina eficaz contra a hepatite C."],
 opts:["I, II e III","I, II e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: a E é MAIS GRAVE na gestante (risco de fulminante). V: a C não tem vacina."},
{id:"IN-A3-04",a:"A3",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Hepatite fulminante",dz:["hbv","hev"],
 enun:"Sobre as formas fulminantes das hepatites virais, assinale a correta:",itens:[],
 opts:["A hepatite A é a principal causa de hepatite fulminante.","Na hepatite B, a forma fulminante decorre de resposta imune intensa e descontrolada contra os hepatócitos infectados, com necrose maciça.","Na gestante, a hepatite E é branda porque a imunidade celular está aumentada.","A hepatite C é a principal causa de forma fulminante.","A forma fulminante não cursa com coagulopatia."],ans:1,
 why:"Fulminante: B (principal — resposta imune exagerada → necrose maciça → falência, coagulopatia, encefalopatia) e E em gestantes (imunidade celular REDUZIDA)."},
{id:"IN-A3-05",a:"A3",prova:"Inédita",selo:"IN",tipo:"caso → interpretação",tema:"Sorologia da hepatite B",dz:["hbv"],
 enun:"Estudante de medicina vacinado contra hepatite B, sem história de infecção, faz sorologia. Qual o perfil esperado?",itens:[],
 opts:["HBsAg positivo, anti-HBc IgG positivo","Anti-HBs positivo, anti-HBc negativo","Anti-HBc IgM positivo isolado","HBeAg positivo, anti-HBs negativo","Anti-HBe positivo, HBsAg positivo"],ans:1,
 why:"A vacina contém só o antígeno de superfície → gera apenas anti-HBs. O anti-HBc aparece só na infecção natural."},
{id:"IN-A3-06",a:"A3",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Marcadores da hepatite B",dz:["hbv"],
 enun:"Sobre os marcadores da hepatite B, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. HBsAg indica infecção ativa.","II. Anti-HBc IgM indica infecção recente.","III. HBeAg indica alta replicação e infectividade.","IV. Anti-HBe indica aumento da replicação viral.","V. Anti-HBc aparece após a vacinação."],
 opts:["I, II e III","I, II e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: anti-HBe indica REDUÇÃO da replicação. V: anti-HBc só na infecção natural."},
{id:"IN-A3-07",a:"A3",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Função × lesão hepática",dz:["hbv","hcv"],
 enun:"Qual grupo de exames avalia a FUNÇÃO hepática (e não a lesão), segundo a aula?",itens:[],
 opts:["ALT, AST e LDH","Fosfatase alcalina e GGT","Bilirrubina (total e frações), TAP e albumina","Anti-HCV e HBsAg","Amilase e lipase"],ans:2,
 why:"Função = síntese e excreção (bilirrubina, TAP, albumina). Lesão = ALT, AST, FA, GGT, LDH."},
{id:"IN-A3-08",a:"A3",prova:"Inédita",selo:"IN",tipo:"caso → laboratório",tema:"Hemocromatose",dz:["hemocromatose","wilson"],
 enun:"Homem de 50 anos com diabetes recente, hiperpigmentação cutânea, hepatomegalia, artralgia das mãos e hipogonadismo. Qual perfil laboratorial é esperado?",itens:[],
 opts:["Ferro ↓, ferritina ↓, TIBC ↑","Ferro ↑, saturação de transferrina > 45%, ferritina ↑, TIBC normal ou ↓","Ceruloplasmina ↓ e cobre urinário ↑","Ferritina ↑ com saturação de transferrina ↓ e TIBC ↑","Bilirrubina indireta isolada ↑"],ans:1,
 why:"“Diabetes bronzeado” = hemocromatose (HFE, C282Y): tudo do ferro sobe; a TIBC fica normal/baixa porque a transferrina já está saturada. C é Wilson; A é ferropenia."},
{id:"IN-A3-09",a:"A3",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Hemocromatose × Wilson",dz:["hemocromatose","wilson"],
 enun:"Analise as afirmativas sobre doenças hepáticas de depósito. É correto apenas o que se afirma em:",
 itens:["I. A hemocromatose hereditária tipo 1 está ligada ao gene HFE, no cromossomo 6.","II. A doença de Wilson decorre de mutação no gene ATP7B, no cromossomo 13.","III. O tratamento de base da hemocromatose são as flebotomias.","IV. A penicilamina é quelante de ferro usada na hemocromatose.","V. Na doença de Wilson a ceruloplasmina está elevada."],
 opts:["I, II e III","I, II e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: penicilamina é quelante de COBRE (Wilson); na hemocromatose os quelantes são deferoxamina/deferasirox. V: ceruloplasmina BAIXA no Wilson."},
{id:"IN-A3-10",a:"A3",prova:"Inédita",selo:"IN",tipo:"assinale a INCORRETA",tema:"Colestase — clínica",dz:["colestase_intra","colestase_extra"],
 enun:"Sobre a colestase, assinale a alternativa INCORRETA:",itens:[],
 opts:["O prurido decorre do depósito de sais biliares na pele.","Acolia fecal e colúria refletem a bilirrubina que não chega ao intestino e é eliminada na urina.","Xantomas decorrem do depósito de colesterol na pele.","Há risco de deficiência das vitaminas A, D, E e K.","A fosfatase alcalina e a GGT costumam estar reduzidas."],ans:4,
 why:"FA e GGT SOBEM na colestase (junto com bilirrubina e ácidos biliares)."},
{id:"IN-A3-11",a:"A3",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Colestase — causas",dz:["colestase_intra","colestase_extra"],
 enun:"É causa de colestase EXTRA-hepática:",itens:[],
 opts:["Colestase intra-hepática da gestação","Colangite biliar primária","Hepatite C crônica","Coledocolitíase","Doença de Wilson"],ans:3,
 why:"Extra-hepática = obstrução da via biliar (cálculo, tumor, estenose), pancreatite (compressão), colangite. As demais são intra-hepáticas."},
{id:"IN-A3-12",a:"A3",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"CHC — tratamento",dz:["chc"],
 enun:"Sobre o tratamento do carcinoma hepatocelular, analise as afirmativas. É correto apenas o que se afirma em:",
 itens:["I. A ressecção é a primeira escolha quando a função hepática está preservada e não há hipertensão portal.","II. O transplante é indicado na doença hepática avançada com tumor dentro dos critérios de Milão.","III. A ablação é opção para tumores pequenos (< 2 cm).","IV. A quimioterapia sistêmica clássica é altamente eficaz e é o tratamento de escolha.","V. Metástase extra-hepática não contraindica o transplante."],
 opts:["I, II e III","I, II e IV","II, III e V","I, IV e V","III, IV e V"],ans:0,
 why:"IV: QT clássica tem baixa eficácia; no avançado usa-se atezolizumabe + bevacizumabe. V: Milão exige ausência de metástase extra-hepática e de invasão macrovascular."},
{id:"IN-A3-13",a:"A3",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Critérios de Milão",dz:["chc"],
 enun:"Paciente cirrótico com CHC. Qual cenário está DENTRO dos critérios de Milão?",itens:[],
 opts:["Tumor único de 6 cm","Dois tumores de 4 cm","Três tumores de 2,5 cm, sem invasão macrovascular","Tumor de 3 cm com trombose tumoral da veia porta","Tumor de 2 cm com metástase pulmonar"],ans:2,
 why:"Milão: 1 tumor ≤ 5 cm OU até 3 tumores ≤ 3 cm, sem invasão macrovascular e sem metástase extra-hepática."},
{id:"IN-A3-C1",a:"A3",prova:"Inédita",selo:"IN",tipo:"caso",tema:"Doença de Wilson",dz:["wilson"],
 enun:"Adolescente de 17 anos com queda do rendimento escolar, tremor de mãos, alteração de comportamento e transaminases elevadas. Ao exame com lâmpada de fenda, anel dourado-acastanhado na periferia da córnea. Hipótese diagnóstica?",
 resp:"Doença de Wilson",why:"Anel de Kayser-Fleischer (patognomônico) + neuropsiquiátrico + hepatopatia."},
{id:"IN-A3-C2",a:"A3",prova:"Inédita",selo:"IN",tipo:"caso",tema:"Hemocromatose",dz:["hemocromatose"],
 enun:"Homem de 52 anos com diabetes recém-diagnosticado, pele acinzentada/bronzeada, artropatia de 2ª e 3ª metacarpofalângicas, hipogonadismo e ferritina de 2.400 com saturação de transferrina de 78%. Hipótese diagnóstica?",
 resp:"Hemocromatose hereditária (HFE)",why:"“Diabetes bronzeado” + depósitos em pâncreas, pele, articulações, gônadas."},

 resp:"Hepatite E fulminante na gestação",why:"Fecal-oral (água) + gestante = risco de forma fulminante (imunidade celular reduzida)."},
{id:"IN-A3-C4",a:"A3",prova:"Inédita",selo:"IN",tipo:"caso",tema:"Carcinoma hepatocelular",dz:["chc"],

{id:"IN-A4-01",a:"A4",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Pâncreas divisum",dz:["divisum"],
 enun:"Jovem com episódios recorrentes de pancreatite aguda sem litíase, sem álcool e com triglicerídeos normais. A colangiorressonância mostra que o ducto dorsal drena a maior parte da glândula pela papila menor. Qual a alteração?",itens:[],
 opts:["Pâncreas anular","Pâncreas ectópico","Pâncreas divisum","Pancreatite autoimune","Fibrose cística"],ans:2,

{id:"IN-A4-02",a:"A4",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Anomalias congênitas",dz:["divisum","anular","ectopico"],

{id:"IN-A4-03",a:"A4",prova:"Inédita",selo:"IN",tipo:"assinale a correta",tema:"Pancreatite aguda — etiologia",dz:["pa"],

{id:"IN-A4-04",a:"A4",prova:"Inédita",selo:"IN",tipo:"afirmativas I–V",tema:"Pancreatite aguda — morfologia",dz:["pa"],
