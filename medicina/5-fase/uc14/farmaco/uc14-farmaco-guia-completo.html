e fruta/verdura\"."]},{"spk":"SP2","spn":"Constipação","h":"🎧 O que ela FALOU na aula 2 (19/09, primeiros 25 min — fechamento da SP2)","p":["Transcrição completa: UC14_Farmaco_Transcricao_Aula_19-09.html. O resto dessa aula (antieméticos + hepato) está no guia da SP3."],"l":["[07:23] ✔ Prucaloprida: para quem não responde ao osmótico; estimula 5-HT4 nas fibras colinérgicas do plexo mioentérico → o vago libera ACh → contração. 1–2 mg, só farmácia comercial (não tem no SUS).","[09:37] ✔ 5-HT3 e 5-HT4 são abundantes no TGI (D2 é pouco, e mais central) — por isso o EA da prucaloprida é náusea (5-HT4 no estômago) e diarreia (efeito exagerado, \"o colateral mais comum de laxante\").","[10:48] ✔ Estimulantes na vida real = automedicação. Lactopulga = bisacodil, propaganda de \"desintoxicar o intestino\" (mentira), funciona em 4–5 h; picossulfato de sódio é o das fórmulas de preparo de colonoscopia; docusato também.","[13:53] ✔ Mecanismo: ação direta na mucosa + receptores do músculo liso → contração e inflamação → secreção de muco e água (\"lavar o intestino\") → evacuação com cólica e diarreia aquosa — não é uma evacuação Bristol 3–5.","[15:38] ✔ Indicação legítima: preparo de exame e constipação aguda pontual (viagem sem banheiro, 4 dias sem evacuar)."]},{"spk":"SP2","spn":"Constipação","h":"6. Números para a véspera","p":[],"l":["Água ≥1,5 L (artigo 2–2,5 L) · fibra 25–30 g/dia · formadores ≥24 h · osmóticos 24–48 h · bisacodil VO 6–12 h · glicerina <1 h · supositório CO₂ 5–30 min · prucaloprida 2,5 h · salinos dose alta 1–3 h.","Lactulose 15–30 mL até 4×/dia (crônico 1×) · macrogol sachê 14 g 1–2×/dia · bisacodil 5 mg · policarbofila 500 mg · glicerina 2–3 g / enema 5–15 mL 80% · lubiprostona 8–24 mcg até 2× · prucaloprida 1–2 mg 1×/dia (artigo: 2–4 mg).","Roma IV: ≥2 critérios em >25% das evacuações, 3 meses, início ≥6 meses · Bristol 1–2 constipação, 6–7 diarreia.","SUS: lactulose ✔ · macrogol ✘ · policarbofila ✘ · prucaloprida ✘ · lubiprostona ✘."]},{"spk":"SP2","spn":"Constipação","h":"Descritiva integrativa","p":["Caso. R. M., 29 anos, gestante de 24 semanas, em uso de sulfato ferroso, refere evacuar a cada 4 dias com esforço e fezes em cíbalos (Bristol 1) há 2 meses. Diz que \"toma pouca água\" e que a irmã lhe deu um chá de sene que \"funcionou muito bem\" nas últimas 3 semanas, mas agora \"não faz mais efeito\".","1 (0,5): mista, com componente secundário (ferro oral; progesterona da gestação ↓ motilidade; útero comprimindo) sobre hábito de pouca água/fibra (primária). Explicar 2: ferro/progesterona ↓ peristalse; pouca água → cólon reabsorve → fezes duras (0,25 cada).","2 (0,8): sene = antracênico irritante: inflamação aguda → secreção de água + motilidade → purgação; esvazia TODO o cólon (normal = só descendente) → dias para encher → \"acha que está constipada\" → repete (ciclo/dependência) (0,3); irritação repetida → inflamação crônica → fibrose → dessensibilização/degeneração das terminações mioentéricas → bolo distende mas não dispara reflexo = cólon preguiçoso (+ melanose colônica) (0,4); por isso menor dose/menor tempo; perda de água/eletrólitos (aldosteronismo 2º) (0,1)."],"l":["(0,5) Classifique a constipação (tipo) e explique dois mecanismos que contribuem para ela neste caso.","(0,8) Por que o chá de sene \"parou de funcionar\"? Explique mecanisticamente o que aconteceu no cólon e por que esse tipo de laxante deve ser usado na menor dose e pelo menor tempo.","(0,7) Prescreva o tratamento racional (não farmacológico + fármaco com dose/posologia), justificando a escolha para gestante e citando uma alternativa disponível no SUS.","Cite um laxante que deve ser usado na menor dose eficaz e pelo menor tempo possível e explique por que (ciclo vicioso). T11 QD1","Mecanismo da síndrome do cólon preguiçoso no uso crônico de bisacodil. T6 QD1"]},{"spk":"SP2","spn":"Constipação","h":"Mapa mental — SP2","p":[],"l":["${x}","${L}) ${a}"]},{"spk":"SP3","spn":"Antieméticos / Hepato","h":"1. Fisiologia da êmese — o mapa que explica todos os fármacos","p":["Vômito = expulsão rápida e forçada do conteúdo gástrico por contração sustentada da musculatura torácica/abdominal. Náusea = sensação desagradável da necessidade de vomitar + sinais autonômicos (sudorese fria, sialorreia, hipotonia gástrica, refluxo duodenogástrico). O comando fica no bulbo, perto do núcleo do trato solitário, em duas unidades:","SNC (dentro da barreira hematoencefálica) PERIFERIA / fora da BHE CENTRO DO VÔMITO (CV) NTS + núcleo motor dorsal do vago 5-HT3 · D2 · H1 · M · NK1 · ENK integra tudo → eferentes motores CÓRTEX / límbico dor, cheiro, visão, emoção,antecipatório (GABA) NÚCLEOS VESTIBULARES cinetose, labirintiteH1 · M ZONA DE GATILHO (ZGQ) área postrema — FORA da BHE D2 · 5-HT3 · NK1 · opioide \"prova\" o sangue: toxinas, fármacos, quimio, uremia TGI (estômago/intestino) irritação, distensão, citotóxicos → célula enterocromafim libera 5-HT 5-HT3 no aferente vagal D2 inibe ACh mioentérico (↓ EEI, ↓ esvaziamento) vago → CV ONDE CADA CLASSE \"CORTA\" O CIRCUITO 5-HT3 ondansetrona → aferente vagal + ZGQ + CV citotóxi…","Classificação (Consenso): agudo (<24 h) · tardio (24 h–5 d, pico 2–3 d) · antecipatório (condicionado, antes da quimio → lorazepam) · de escape (breakthrough) · refratário."],"l":[]},{"spk":"SP3","spn":"Antieméticos / Hepato","h":"7. Números para a véspera","p":[],"l":["Ondansetrona 4–8 mg VO/SL 8/8 ou 12/12 h (máx 24 mg/dia) · IV 8 mg/dose · t½ 4–9 h · palonosetrona t½ 40 h, 0,25 mg IV.","Metoclopramida 10 mg cp / 5 mg inj / 4 mg/mL · bromoprida 10–20 mg / 5 mg inj / 1 mg/mL · domperidona 10 mg / 1 mg/mL · dimenidrinato 25–100 mg · aprepitanto 125 mg · dexametasona 4–20 mg.","UDCA 5–10 mg/kg/dia (300–600 mg), cálculo 10 mg/kg/dia 12–24 m, t½ 100 h · silimarina 280–420 mg/dia ÷3 · pancreatina 3→1–2 drágeas/refeição; 20–30.000 UI lipase.","Gengibre ≥1 g/dia 3 dias · CINV: agudo <24 h, tardio 24 h–5 d · risco alto >90%, moderado 30–90%, baixo 10–30%, mínimo <10%.","SUS: ondansetrona ✔ · metoclopramida ✔ · bromoprida ✔ · domperidona ✔ · dimenidrinato ✔ · escopolamina ✔ · aprepitanto ✘ · canabinoides ✘."]},{"spk":"SP3","spn":"Antieméticos / Hepato","h":"8. 🎧 O que ela FALOU na aula (19/09) — o que não está no slide","p":["Transcrição completa e pesquisável (99 min): UC14_Farmaco_Transcricao_Aula_19-09.html."],"l":["[27:55] ✔ A zona de gatilho é a que não se controla — muitas aferências, muitos receptores; os antieméticos agem sobretudo no centro do vômito. Por isso o paciente medicado ainda pode vomitar.","[29:05] ✔ Toxina ativa o CV de dois jeitos: imita o neurotransmissor (agonista direto) ou estimula o neurônio a liberá-lo → por isso às vezes são necessários 2–3 antieméticos.","[36:15] ✔ \"Não adianta tratar labirintite com bloqueador de 5-HT3, nem intoxicação alimentar com Dramin\" — o desencadeante escolhe o receptor.","[37:19 / 75:26] ✔ A náusea matinal da gestante é por SIALORREIA (engole saliva em jejum) → dimenidrinato ao deitar, \"ela acorda de boca seca\". Hiperêmese ≠ náusea matinal.","[39:34] ✔ Gengibre = inibidor competitivo de 5-HT3 e neurocininas, mas estimula secreção ácida → maléfico em gastrite."]},{"spk":"SP3","spn":"Antieméticos / Hepato","h":"Descritiva integrativa","p":["Caso. J. P., 34 anos, iniciou quimioterapia com cisplatina para tumor de testículo. Recebeu ondansetrona 8 mg IV antes da infusão e não vomitou nas primeiras horas, mas no 2º e 3º dias apresentou náusea intensa e vômitos em casa. Na UPA, recebeu metoclopramida 10 mg IV e, 40 minutos depois, desenvolveu torcicolo, desvio dos olhos para cima e inquietação. Nega uso de outros medicamentos.","1 (0,6): fase aguda (<24 h) = liberação de serotonina pelas células enterocromafins → 5-HT3 nos aferentes vagais e ZGQ → ondansetrona bloqueia (0,2). Fase tardia (24 h–5 d) = substância P / NK1 no NTS/área postrema (+ inflamação/PG) → anti-5-HT3 é pouco eficaz (0,2). Cisplatina = alto risco (>90%): anti-5-HT3 + dexametasona + aprepitanto nas primeiras 24 h, com dexa (± aprepitanto) mantidos nos dias 2–3 (0,2).","2 (0,8): metoclopramida cruza a BHE e bloqueia D2 na via nigroestriatal; a dopamina normalmente inibe a liberação de acetilcolina nos terminais colinérgicos; bloqueio D2 → desinibição → excessiva resposta colinérgica → distonia aguda (torcicolo, crise oculógira) + acatisia = síndrome extrapiramidal; mais comum IV, dose alta, jovens/idosos (0,6). Tratamento: biperideno (anticolinérgico central) ou anti-histamínico (prometazina/difenidramina), suspender o fármaco (0,2)."],"l":["(0,6) Explique por que a ondansetrona protegeu da fase aguda mas não da fase tardia, citando o mediador de cada fase e o esquema profilático correto para cisplatina.","(0,8) Descreva mecanisticamente o quadro que apareceu após a metoclopramida (via, neurotransmissores, receptor) e indique o tratamento.","(0,6) A médica considera trocar para domperidona ou bromoprida na alta. Compare os dois quanto a barreira hematoencefálica, risco de SEP e efeito na prolactina, e diga qual seria o antiemético \"seguro\" para esse paciente continuar em casa.","Complete: a SEP por metoclopramida ocorre pelo bloqueio de receptores ___ na via nigroestriatal, que normalmente inibem a liberação de ___. T4/T6/T7 lacunas","Explique a galactorreia induzida por bromoprida/metoclopramida/domperidona. T9 QD / T11"]},{"spk":"SP3","spn":"Antieméticos / Hepato","h":"Mapa mental — SP3","p":[],"l":["${x}","${L}) ${a}"]},{"spk":"SP4","spn":"Dispepsia","h":"Banco SP4 — dispepsia: IBP, H2, antiácidos, citoprotetores (provas antigas)","p":[],"l":["${x}","${L}) ${a}"]}]};</script>
<script>window.EXPL={
"SP1":{titulo:"Diarreia e DII — a balança de água do intestino",
blocos:[
{t:"h",x:"A balança que decide se existe diarreia"},
{t:"p",x:"O intestino não é um cano: é uma superfície que negocia água o tempo todo. Ao longo de um dia chegam ao delgado cerca de nove litros de líquido. Só dois vêm do que você bebeu e comeu; os outros sete são secreção do próprio corpo — saliva, suco gástrico, bile, suco pancreático e o líquido que o epitélio intestinal derrama na luz para diluir o que está digerindo."},
{t:"p",x:"Desses nove litros, o delgado reabsorve por volta de oito. O cólon recupera quase todo o resto e devolve às fezes pouco mais de cem mililitros. Repare no que isso significa: a consistência normal das fezes não depende de o intestino secretar pouco — ele secreta muito —, depende de ele reabsorver quase tudo o que secretou. A margem é apertadíssima."},
{t:"p",x:"É daí que sai a definição que ela cobra. Diarreia é o desequilíbrio entre absorção e secreção de água e eletrólitos. O que muda é o saldo dessa conta, não a frequência das idas ao banheiro. E é a mesma margem apertada que explica por que a diarreia desidrata tão rápido: uma queda percentual pequena na absorção já multiplica o volume que sobra na luz."},
{t:"k",r:"Aula 04/09",x:"“Diarreia não é só número de evacuações.” A definição pela balança absorção × secreção é o que abre a matéria — e é o que sustenta todo o resto."},

{t:"h",x:"Os quatro jeitos de quebrar a balança"},
{t:"p",x:"Se a diarreia é um saldo, existem só quatro maneiras de torná-lo negativo — e cada uma tem um comportamento clínico próprio, o que é justamente o que permite diferenciá-las à beira do leito."},
{t:"p",x:"Na diarreia <b>osmótica</b>, um soluto que não foi absorvido permanece na luz e segura água por osmose. Como o motor é o soluto ingerido, ela para quando o paciente para de comer — é o teste clínico mais simples que existe para esse mecanismo. Lactose em quem não tem lactase, e os próprios laxantes osmóticos, funcionam exatamente assim."},
{t:"p",x:"Na <b>secretora</b>, o epitélio inverte o fluxo: a absorção de sódio cai e a secreção de cloreto aumenta, e a água acompanha o cloreto. Como o problema está na célula e não no que foi ingerido, essa diarreia não cede com jejum, costuma ser volumosa e aquosa, e é a que mais rapidamente leva à desidratação. É o mecanismo das enterotoxinas."},
{t:"p",x:"Na alteração de <b>motilidade</b>, o conteúdo simplesmente passa rápido demais pela superfície absortiva; o epitélio está íntegro, mas não tem tempo de trabalhar. E no mecanismo <b>inflamatório/hidrostático</b>, a mucosa lesada deixa escapar proteína, sangue e líquido, e a pressão hidrostática empurra água para a luz."},
{t:"k",r:"Por que isso importa na prova",x:"Os quatro mecanismos são a chave para ler as questões dela: cada fármaco da SP1 ataca um ponto específico dessa balança, e a alternativa errada quase sempre troca um mecanismo pelo outro."},

{t:"h",x:"Onde cada fármaco entra na balança"},
{t:"p",x:"Antes de qualquer fármaco vem a reidratação. A terapia de reidratação oral é indicada em todos os tipos de diarreia, é custo-efetiva, reduz internação e está no SUS — e a razão de ela funcionar é elegante: o cotransporte de sódio e glicose no enterócito continua íntegro mesmo quando a toxina bloqueou outras vias de absorção, então oferecer sódio junto com glicose reabre uma porta que a doença não fechou. Só se o vômito for intenso a ponto de impedir a via oral é que se passa para a venosa, com soro fisiológico a 20 mL/kg em infusão rápida; o esquema “ultrarrápido” de 60 mL/kg foi associado a mais hipernatremia."},
{t:"p",x:"O zinco entra logo em seguida, e não como reforço vago: ele age como imunomodulador e antissecretor, reduz a gravidade do episódio e diminui os episódios subsequentes em menores de cinco anos. Dez miligramas por dia abaixo dos seis meses, vinte acima, uma vez ao dia, por dez a catorze dias. Qualquer sal de zinco serve."},
{t:"p",x:"A <b>racecadotrila</b> ataca o braço secretor da balança, e o caminho merece atenção porque é a pegadinha número um da UC. O intestino produz encefalinas — peptídeos que são agonistas endógenos e que, ao agirem nos receptores opioides do enterócito, reduzem a secreção de água e eletrólitos. Essas encefalinas são destruídas por uma enzima, a encefalinase. A racecadotrila inibe a encefalinASE; com a enzima inibida, as encefalinAS duram mais e a secreção cai. Ou seja: o fármaco não age no receptor, ele preserva o agonista natural. Cem miligramas de oito em oito horas, ou 1,5 mg/kg três vezes ao dia. Por isso ela repete que “racecadotrila não é antimotilidade”."},
{t:"k",r:"Pegadinha nº 1 · T7 Q12-III · T4 Q2 · T9 Q10 · PM T4 Q1",x:"encefalinAS (os agonistas, peptídeos) × encefalinASES (a enzima que os destrói). A racecadotrila inibe a ENZIMA. Qualquer alternativa que diga que ela “bloqueia receptores” ou que atua na motilidade é falsa."},
{t:"p",x:"A <b>loperamida</b> ataca o outro braço: é agonista dos receptores opioides periféricos. No μ2 reduz a motilidade, no δ reduz a secreção, e ainda aumenta o tônus do esfíncter anal — dá tempo ao epitélio para absorver. Começa com 4 mg e segue com 2 mg a cada evacuação, no máximo 16 mg por dia; o pico vem entre três e cinco horas e ela não cruza a barreira hematoencefálica, o que é o motivo de não ter efeito central nas doses habituais. O lugar dela é a diarreia crônica — síndrome do intestino irritável, pós-colecistectomia refratária à colestiramina, diarreia por estresse — e a aguda leve não infecciosa."},
{t:"k",r:"Onde ela derruba · T11 QD3 · T5 QD5 · T7 QD1",x:"Loperamida é AGONISTA, nunca “bloqueia” receptores — um veterano marcou “bloqueando” e ela corrigiu. E é CONTRAINDICADA na suspeita de infecção ou intoxicação alimentar (retém a toxina → sepse, megacólon tóxico), em menores de 2 anos e na DII ativa de cólon."},
{t:"p",x:"O <b>difenoxilato</b> é o parente que precisa de coleira. Também é agonista opioide, mas é bem absorvido e, em dose alta — quarenta a sessenta miligramas —, cruza a barreira hematoencefálica e produz efeito central, com potencial de abuso. Por isso a apresentação vem com atropina junto: a dose anticolinérgica é pequena demais para tratar qualquer coisa, mas suficiente para tornar o abuso desagradável, com boca seca e visão borrada. O metabólito ativo, a difenoxina, tem meia-vida de umas doze horas. Dois comprimidos no início e depois um a cada três ou quatro horas, no máximo oito por dia. Na prática, pouco usado."},
{t:"p",x:"A <b>alosetrona</b> não é opioide e é a que mais confunde. Ela é antagonista de 5-HT3, e o efeito é o contrário do que o nome sugere a quem lê rápido: bloqueando o 5-HT3 ela <i>reduz</i> a resposta vagal, reduz os reflexos peristálticos e lentifica o trânsito colônico. A indicação é estreita — síndrome do intestino irritável com predomínio de diarreia — na dose de um miligrama por dia, no máximo duas vezes. O efeito adverso previsível é constipação."},
{t:"k",r:"Pegadinha · T4 Q2-I · T9 Q8-V · T11 Q10",x:"“Alosetrona aumenta a atividade vagal” é falso: ela DIMINUI. E não é para “diarreia hipersecretora” — é para SII com diarreia."},
{t:"p",x:"O grupo seguinte não mexe no transporte: mexe no conteúdo. A <b>colestiramina</b> é uma resina que sequestra sais biliares, formando um complexo insolúvel que sai nas fezes — por isso resolve especificamente a diarreia por sais biliares do pós-colecistectomia e da ressecção de íleo distal, e não serve para as outras. Quatro gramas, um sachê, até quatro vezes ao dia antes das refeições, com desmame, por no máximo dois a três meses, porque sequestrar sais biliares por tempo demais leva à hipovitaminose de A, D, E e K — e ela adsorve outros fármacos, que precisam ser dados longe. A <b>policarbofila cálcica</b> é um polímero hidrofílico não fermentável que adsorve de sessenta a cem vezes o próprio peso em água e devolve consistência às fezes. O <b>carvão ativado</b> adsorve toxina na luz, e por isso mesmo não entra na diarreia infecciosa, em que a bactéria está proliferando — e é contraindicado se houver obstrução."},
{t:"p",x:"O <b>bismuto</b> fecha esse grupo com um truque a mais: o subsalicilato se dissocia no intestino e as duas metades tomam rumos diferentes. O bismuto fica no lúmen, onde age como antissecretor, anti-inflamatório e antimicrobiano — é por isso que entra na diarreia do viajante e compõe os esquemas contra <i>H. pylori</i> junto do antibiótico. O salicilato, esse sim, é absorvido, e daí vem o cuidado: em criança com quadro viral, a carga de salicilato carrega o risco de Reye, exatamente a razão pela qual não se dá AAS nessa situação. O efeito que assusta o paciente é inofensivo e cai em prova: fezes e língua ficam pretas. Trinta mililitros ou dois comprimidos."},
{t:"p",x:"A <b>simeticona</b> não trata diarreia nenhuma — ela está aqui porque acompanha o cortejo de gases que vem junto. É um silicone antifisético: reduz a tensão superficial das bolhas de gás presas no muco, as bolhas coalescem e o gás sai. Nada é absorvido, o início é por volta de trinta minutos, e a apresentação vai de gotas a cápsulas de 50 a 125 mg."},
{t:"k",r:"Aula 04/09",x:"A dose usual da simeticona fica em 100–150 mg — e ela avisou que simeticona não resolve o gás da laparoscopia: aquilo é CO₂ insuflado na cavidade, não bolha dentro da luz intestinal."},
{t:"k",r:"Aula 04/09 · o eixo dela",x:"“Exceto zinco e SRO, nada disso tem no SUS.” Eficácia + segurança + ACESSO — na dúvida entre duas alternativas corretas, a que existe na atenção básica costuma ser a resposta."},

{t:"h",x:"A microbiota como alvo — e a fibra certa"},
{t:"p",x:"Há um caminho que não mexe no transporte nem na motilidade: mexe em quem vive ali. Probióticos são microrganismos vivos em quantidade adequada, e na diarreia aguda o efeito vem de três frentes somadas — competem com o patógeno e ocupam o nicho, modulam a resposta imune da mucosa e exercem efeito trófico sobre o epitélio. O que se mede no fim é redução da duração do quadro e da internação. Os mais estudados são o <i>Saccharomyces boulardii</i>, de 250 a 750 mg por dia durante cinco a sete dias, e o <i>Lactobacillus</i> GG, em pelo menos 10¹⁰ UFC por dia."},
{t:"p",x:"Os gêneros não são intercambiáveis. <i>Lactobacillus</i> trabalha acidificando o meio; <i>Bifidobacterium</i> produz ácidos graxos de cadeia curta e é o mais caro; <i>Saccharomyces</i> é uma levedura, barata, que faz o papel de repositor de flora. Prebiótico é outra coisa: é o substrato que essas bactérias comem, tipicamente FOS. Quando os dois vêm no mesmo produto, chama-se simbiótico — e ela foi explícita em aula: probiótico sem prebiótico junto é meia solução, porque as bactérias morrem de fome."},
{t:"p",x:"Essa é também a hora de separar as fibras, que a prova adora confundir. As <b>solúveis</b> — pectina, β-glicanas, gomas de aveia e cevada, psyllium, FOS — não são digeridas mas são fermentadas pela microbiota: retêm água formando gel, baixam lipídeos e glicemia, aumentam a excreção de ácidos biliares e geram ácidos graxos de cadeia curta, que são tróficos e pró-cinéticos. São elas, e só elas, que funcionam como prebiótico. As <b>insolúveis</b> — celulose, lignina, hemiceluloses do trigo — não são digeridas nem fermentadas: aceleram o trânsito, aumentam o peso fecal e dão saciedade, sem mexer no colesterol. Bactéria não fermenta fibra insolúvel, então ela não é prebiótico."},
{t:"k",r:"Aula 04/09",x:"Na RENAME os probióticos entram como isolados — lactobacilos, bifidobactérias e <i>Saccharomyces</i>, este o mais barato. Sempre associar o prebiótico ao probiótico."},

{t:"h",x:"Doença inflamatória intestinal — por que o 5-ASA precisa chegar inteiro"},
{t:"p",x:"A DII muda a pergunta. Aqui não se trata de corrigir uma balança de água: trata-se de apagar uma inflamação crônica da parede, e o tratamento é escalonado por gravidade, numa pirâmide. O AINE comum não serve — agride o trato gastrintestinal e o rim e não controla a inflamação da mucosa. O que serve é um anti-inflamatório que atue topicamente no cólon."},
{t:"p",x:"É isso que o 5-ASA é: ácido salicílico com um grupo amino na posição 5. Ele é primeira linha na retocolite ulcerativa leve a moderada, tanto para induzir quanto para manter a remissão, e no Crohn leve a moderado de cólon e íleo distal — neste com eficácia menos estabelecida. E aqui está o problema que define toda a farmacologia da classe: a eficácia depende de concentração alta no local inflamado, mas cerca de 80% do 5-ASA livre é absorvido já no delgado. Se ele for absorvido antes, não chega. Todas as apresentações que existem são, no fundo, estratégias diferentes para levar a molécula inteira até o cólon."},
{t:"p",x:"A <b>mesalazina</b> resolve pela cápsula: um revestimento que só se abre em pH alto, já no cólon. A <b>sulfassalazina</b> resolve por química: o 5-ASA vem preso a uma sulfapiridina por uma ponte azo que só a bactéria do cólon quebra — o que explica ao mesmo tempo a eficácia e a fama, porque a sulfapiridina liberada é a responsável pela alta incidência de efeitos adversos (náusea, cefaleia, artralgia e mialgia, supressão medular). A <b>olsalazina</b> são duas moléculas de 5-ASA ligadas uma à outra pela mesma ponte azo, o que derruba a absorção proximal para menos de 1 a 2%, ao custo de diarreia como efeito adverso. A absorção conta a história inteira: mesalazina 20 a 30% — e sobe quando a mucosa está inflamada, caindo conforme o paciente melhora —, sulfassalazina 10 a 20%, olsalazina abaixo de 2%."},
{t:"k",r:"Como ela indica cada uma",x:"Mesalazina: inflamação crônica de cólon e reto, e manutenção depois da sulfassalazina — 1,2 g/dia de 12 em 12 h (na T5 QD4 ela aceitou 1 g 1×/dia). Sulfassalazina: quando há colonização bacteriana patogênica ou infecção latente — contraindicada na alergia a sulfa. Olsalazina: alternativa à mesalazina. No SUS: mesalazina sim, sulfassalazina sim (RENAME), olsalazina não."},
{t:"k",r:"Distrator confirmado · Ativ T5",x:"“Mesalazina 500 mg 2×/dia com refeição gordurosa” é FALSO. A refeição gordurosa não faz parte do esquema."}
]}};

window.EXPL["SP2"]={titulo:"Constipação — quando o cólon tira água demais",
blocos:[
{t:"h",x:"O que é constipação — e por que não é só frequência"},
{t:"p",x:"A SP1 terminou mostrando que o cólon recupera quase toda a água que chega a ele. A constipação é essa mesma máquina funcionando a favor de si mesma por tempo demais: quanto mais o bolo fecal fica parado no cólon descendente, mais água é reabsorvida e mais duras as fezes ficam — e fezes duras andam ainda mais devagar. Por isso a definição dela não para na frequência. Esforço para evacuar, consistência das fezes e a sensação de evacuação incompleta contam tanto quanto o número de vezes, e a faixa normal é larga: de duas vezes ao dia até uma vez a cada dois ou três dias. Quem precisa de manobra manual para evacuar já é constipado, mesmo que vá todo dia."},
{t:"p",x:"A motilidade depende de três processos funcionando juntos: a peristalse coordenada, que é músculo liso regido pelo sistema nervoso autônomo e por hormônios; o transporte de água e eletrólitos pela mucosa; e os reflexos evacuatórios, disparados por receptores no canal anal superior e na ampola retal e executados pelo esfíncter interno. Cada classe de laxante que vem a seguir mexe em um desses três pontos — reter água, impedir que ela seja reabsorvida, ou empurrar o conteúdo."},
{t:"p",x:"Para medir, ela usa dois instrumentos validados. A escala de Bristol classifica as fezes pela forma: o tipo 4 é o ideal, 3 e 5 ainda oscilam dentro do normal, 1 e 2 indicam constipação e 6 e 7, diarreia. Os critérios de Roma IV pedem pelo menos dois critérios presentes em mais de 25% das evacuações, durante três meses, com início há pelo menos seis."},
{t:"k",r:"Aula 04/09 · 70:00",x:"“Tipo 4 é o ideal, 3 e 5 oscilam, 6–7 diarreia, 1–2 constipado.” Ela quer a folha de Bristol impressa na UBS e o paciente ensinado a olhar as próprias fezes."},

{t:"h",x:"Primária × secundária — a distinção que escolhe o tratamento"},
{t:"p",x:"A constipação <b>primária</b>, ou funcional, não tem causa orgânica: é pouca água, pouca fibra e sedentarismo. É mais comum em mulheres, porque a progesterona tem efeito antimotilidade. Como a causa é o hábito, o tratamento também é o hábito — fibra, água, movimento —, com formadores de massa como apoio quando necessário."},
{t:"p",x:"A <b>secundária</b> tem uma causa que o hábito não alcança. Pode ser um fármaco — antimuscarínicos como os antidepressivos tricíclicos e os anti-histamínicos, opioides agindo em μ2, ferro, cálcio, alumínio — ou uma doença: hipotireoidismo, diabetes, Parkinson, tetraplegia. Aqui o paciente pode beber toda a água do mundo que o intestino continua freado pelo fármaco ou pela doença. O tratamento passa a ser um laxante contínuo na menor dose possível, e a classe de escolha é o osmótico."},
{t:"k",r:"Aula 04/09 · 69:17",x:"“Na constipação secundária não importa o que o paciente faça — a paciente com amitriptilina vai usar laxante; só escolhemos o tipo.” E o tricíclico constipa por bloqueio MUSCARÍNICO, não por 5-HT3 (Ativ T6 Q3)."},
{t:"p",x:"Há dois pacientes em que ela considera o laxante quase obrigatório, mesmo sem constipação grave: o anginoso, porque o esforço evacuatório aumenta a demanda do coração, e quem tem o plexo hemorroidário inflamado, porque a dor faz o paciente segurar, as fezes endurecem, a evacuação dói mais — e o ciclo se fecha, com sangramento que vira porta de infecção."},

{t:"h",x:"Água e fibra — o tratamento de eleição, e o erro que vira fecaloma"},
{t:"p",x:"Fibra é a parte do alimento que resiste às enzimas digestivas e chega inalterada ao cólon. Lá, ela é fermentada pelas bactérias, e isso tem dois efeitos que parecem se contradizer: a fermentação consome parte da água das fezes, mas produz ácidos graxos de cadeia curta, que nutrem o epitélio e são pró-cinéticos, e multiplica a massa bacteriana — que ela lembra ser perto da metade do bolo fecal. O saldo é um volume maior que distende a parede e dispara a peristalse. As fibras insolúveis e pouco fermentáveis, como a lignina, são as mais eficazes em aumentar o volume e acelerar o trânsito. A meta é 25 a 30 g de fibra por dia, introduzida devagar para não causar inchaço e gases, com pelo menos um litro e meio de água."},
{t:"p",x:"E é aqui que mora o erro mais perigoso da SP. A fibra insolúvel arrasta a água que ela já tem dentro; a solúvel precisa pegar água do meio para entumecer e formar o gel. Se o paciente come fibra solúvel e não bebe água, a fibra puxa a água das próprias fezes — e o que era para amolecer vira fecaloma. Por isso os <b>formadores de massa</b> — psyllium (<i>Plantago</i>), metilcelulose, farelo, policarbofila — são, nas palavras dela, “para quem bebe água mas não come fruta nem verdura”. Levam 24 horas ou mais para agir, servem para a constipação primária, e não funcionam na secundária: o intestino que está freado por um fármaco não responde a mais volume. Não devem ser usados em cólon atônico nem na impactação."},
{t:"k",r:"Pegadinha · T6 QD3 · AVA T11 Q4-I",x:"Formador de massa para constipação SECUNDÁRIA é a resposta errada — ele não tem eficácia ali. E sem água ele piora o quadro."},

{t:"h",x:"Os osmóticos — a única classe segura para uso contínuo"},
{t:"p",x:"O osmótico faz no cólon exatamente o que a diarreia osmótica da SP1 fazia, só que de propósito: um soluto que não é absorvido fica na luz e segura água por osmose, o conteúdo distende a parede e a evacuação acontece. Leva de 24 a 48 horas. É a primeira linha na constipação secundária, serve também para o paciente com constipação primária que não vai mudar a dieta, é o que se dá ao anginoso e ao hemorroidário e é usado no preparo de colonoscopia. Ela resume a classe numa frase: é a única eficaz e segura para uso crônico."},
{t:"p",x:"A <b>lactulose</b> é um dissacarídeo sintético, galactose com frutose, que nenhuma enzima humana quebra. As bactérias do cólon, sim: fermentam a lactulose em ácido lático e ácido acético, que se somam ao efeito osmótico — e, de quebra, baixam o pH do cólon, o que inibe as bactérias produtoras de amônia. É por isso que a mesma lactulose trata a encefalopatia hepática. O preço da fermentação são gases e cólica, dependentes da dose; por isso se começa baixo, ou o paciente abandona. São 15 a 30 mL até quatro vezes ao dia, uma vez no uso crônico. Tem no SUS, tem apresentação líquida com dose pediátrica, e é a escolha para criança abaixo de dez anos e para o idoso. Na gestante serve em dose baixa — com a observação de que o gás pode ser confundido com contração."},
{t:"p",x:"O <b>PEG</b> (polietilenoglicol, o macrogol) resolve o problema da lactulose. É um polímero inerte: não é absorvido e não é fermentado, então mantém a osmose “por todo o tempo” sem gerar gás nem cólica, e a evacuação sai mais natural. Um sachê de 14 g dissolvido em água, uma ou duas vezes ao dia. É a escolha na gestante e na constipação refratária, e não desidrata. A limitação é prática: não tem no SUS e o Muvinlax não tem dose pediátrica, então para criança precisa ser manipulado."},
{t:"k",r:"Pegadinha · T5 Q7-II · T7 Q4",x:"“Macrogol causa desidratação, não usar em idosos e crianças” é FALSO — e ela escreveu na correção: “é recomendado!”. Gestante → macrogol (T7 Q4). Criança <10 anos → lactulose (T7 Q5)."},
{t:"p",x:"Os <b>salinos</b> — hidróxido e sulfato de magnésio (o “sal amargo”), fosfato de sódio — agem rápido, em uma a três horas em dose alta, e ficam para o preparo de cólon. Como laxante do dia a dia ela não recomenda: o magnésio é uma base que neutraliza o ácido do estômago e provoca rebote ácido — o leite de magnésia dos idosos, que volta na SP4."},

{t:"h",x:"Estimulantes — o bisacodil e o ciclo que vira cólon preguiçoso"},
{t:"p",x:"Os estimulantes — bisacodil 5 mg, picossulfato, sene, cáscara-sagrada, ruibarbo — não retêm água nem empurram o bolo: eles agridem. Agem diretamente na mucosa, nos neurônios entéricos e no músculo liso, provocando contração e uma inflamação aguda que faz o epitélio secretar muco e água, como quem “lava o intestino”. Agem em 6 a 12 horas por via oral. O resultado não é uma evacuação Bristol 3 a 5: é cólica com diarreia aquosa. A indicação legítima é estreita — preparo de exame e a constipação aguda e pontual —, sempre na menor dose e pelo menor tempo."},
{t:"p",x:"O problema começa quando vira hábito, e ela quer esse mecanismo escrito na discursiva. O irritante esvazia o cólon inteiro, enquanto a evacuação normal esvazia só o descendente. Um cólon inteiramente vazio demora muito mais para encher de novo, então passam-se três ou quatro dias sem vontade de evacuar — e a paciente “se acha constipada” e repete a dose. Esse é o ciclo vicioso."},
{t:"p",x:"Repetido, ele causa dois danos. O primeiro é a dessensibilização das terminações nervosas, que param de responder ao estímulo como defesa para não morrerem; o laxante perde eficácia e a dose sobe, ou passa a ser diária. O segundo é mais grave: a inflamação aguda repetida vira crônica, com agressão e reparo acontecendo ao mesmo tempo, os fibroblastos substituem a mucosa por tecido fibroso, e o cólon perde função — o bolo distende a parede mas não deflagra mais o reflexo. É o cólon preguiçoso. Entre um estado e outro há uma transição de dez a vinte meses, em que aparece a <b>melanose colônica</b>: a mucosa vermelho-amarronzada, escura, na colonoscopia, sinal de inflamação em curso."},
{t:"k",r:"Discursiva recorrente · T11 QD1 · T6 QD1 · T6 Q7-II",x:"Cólon preguiçoso = inflamação crônica + dessensibilização/degeneração das terminações mioentéricas. “Dependência por receptor opioide” é FALSO. Sene = chá das FOLHAS (T6 Q4); cáscara-sagrada = casca; antracênicos NÃO bloqueiam 5-HT3 (T5 Q7-III)."},

{t:"h",x:"Quando o osmótico não basta — prucaloprida e lubiprostona"},
{t:"p",x:"A <b>prucaloprida</b> é o primeiro fármaco da UC que age pelo vago, e o mecanismo vai reaparecer inteiro na SP3. Ela é agonista seletiva de 5-HT4 nas fibras colinérgicas do plexo mioentérico; o receptor aumenta o AMPc, a fibra libera acetilcolina e o músculo liso se contrai em peristalse propulsora — a ação é indireta, via vago. Dois miligramas uma vez ao dia; o primeiro movimento vem em cerca de duas horas e meia. Os receptores 5-HT3 e 5-HT4 são abundantes em todo o trato gastrintestinal, inclusive no estômago, e por isso os efeitos adversos são náusea e diarreia. A regra dela é taxativa: só para quem não respondeu ao osmótico, associada a ele, nunca para iniciar o tratamento. Também serve ao paciente oncológico em uso de opioide. Não tem no SUS."},
{t:"p",x:"A <b>lubiprostona</b> age em outro ponto da balança. É um ácido graxo derivado de PGE que ativa o canal de cloreto tipo 2 (ClC-2) no delgado; sai cloreto, a água acompanha, e a secreção aumentada acelera o trânsito — é a diarreia secretora da SP1 usada como remédio. De 8 a 24 microgramas até duas vezes ao dia, para a constipação crônica refratária e para a síndrome do intestino irritável com constipação. A linaclotida entra no mesmo grupo. Cara, e sem SUS."},
{t:"k",r:"Pegadinha · T11 Q10 · T11 Q12 · T7 Q6",x:"Prucaloprida = agonista 5-HT4, refratária a laxantes. Lubiprostona = ativa ClC-2, SII com constipação. A alternativa que troca um pelo outro (“prucaloprida ativa canais de cloreto”, “prucaloprida para SII”) é falsa."},

{t:"h",x:"Os que agem no reto — e quem recebe o quê"},
{t:"p",x:"O último grupo age de baixo para cima. A <b>glicerina</b> é higroscópica e lubrificante e só existe por via retal — supositório de 2 a 3 g ou enema de 5 a 15 mL a 80% —, com efeito em menos de uma hora; é o que se dá ao bebê que saiu do aleitamento e travou. Os <b>enemas</b> de fosfato ou de soro fisiológico distendem o reto e disparam o reflexo em minutos; servem para impactação, preparo e para o tetraplégico, o paciente em íleo ou em uso de opioide — mas repetidos causam hipocalcemia, hiperfosfatemia, hipernatremia e hipocalemia. O <b>óleo mineral</b> amolece por emoliência, e tem uma contraindicação que cai: abaixo de 12 anos, no acamado, no refluxo e na disfagia, porque se aspirado causa pneumonia lipídica."},
{t:"p",x:"Com o mecanismo de cada classe na cabeça, a tabela de decisão dela se monta sozinha. Constipação primária em quem aceita beber água: fibra e água, com formador de massa se preciso. Primária em quem não vai mudar a dieta: lactulose. Secundária, a um tricíclico, a um opioide ou a uma doença: osmótico — lactulose na atenção básica, ou macrogol. Gestante: macrogol, com lactulose em dose baixa como alternativa. Criança abaixo de dez anos: lactulose. Idoso: osmótico, evitando óleo mineral e estimulante crônico. Refratária ao osmótico: prucaloprida somada a ele. SII com constipação: lubiprostona. Constipação aguda ou preparo: bisacodil. Impactação: enema. Encefalopatia hepática: lactulose."},
{t:"k",r:"Onde ela troca · T11 Q12 · T5",x:"Glicerina “por via oral” é falso — é só retal. E um aviso de divergência: na T5 ela aceitou policarbofila para a gestante, embora o slide diga macrogol. Na dúvida, macrogol."},
{t:"k",r:"SUS",x:"Lactulose ✓ · macrogol ✗ · policarbofila ✗ · prucaloprida ✗ · lubiprostona ✗. Pelo eixo eficácia + segurança + acesso, a lactulose é a resposta da atenção básica."}
]};

window.EXPL["SP3"]={titulo:"Antieméticos e hepato — o reflexo do vômito e quem o desliga",
blocos:[
{t:"h",x:"O vômito é um reflexo com dois comandos"},
{t:"p",x:"Vomitar é expulsar o conteúdo gástrico de forma rápida e forçada, por uma contração sustentada da musculatura torácica e abdominal. A náusea vem antes e é outra coisa: a sensação desagradável de que se vai vomitar, acompanhada de sinais autonômicos — sudorese fria, sialorreia, hipotonia gástrica, refluxo do duodeno para o estômago. As duas são comandadas do bulbo, perto do núcleo do trato solitário, por duas unidades diferentes."},
{t:"p",x:"A primeira é o <b>centro do vômito</b>, que executa o reflexo. A segunda é a <b>zona de gatilho quimiorreceptora</b>, na área postrema — e o detalhe anatômico que ela cobra é que essa zona fica fora da barreira hematoencefálica. É por isso que ela “sente” toxinas e fármacos circulando no sangue. Chegam ao centro do vômito estímulos da faringe e do esôfago, de toxinas e medicamentos, da dor intensa, de estímulos mecânicos, de visões e odores, da quimioterapia, da emoção, da gravidez e do labirinto; na zona de gatilho, os mediadores são dopamina, serotonina, histamina, prostaglandinas e GABA."},
{t:"p",x:"Dois pontos ela fez questão de explicar em aula. O primeiro: a zona de gatilho é a que não se consegue controlar, porque recebe aferências de muitos lugares e tem muitos tipos de receptor — então os antieméticos agem sobretudo no centro do vômito, e o paciente medicado ainda pode vomitar se o gatilho for forte. O segundo: uma toxina ativa o centro do vômito de dois jeitos, ou imitando o neurotransmissor e agindo direto no receptor, ou estimulando o neurônio a liberá-lo. Como um alimento contaminado traz várias toxinas e a quimioterapia usa dois a quatro fármacos, vários neurotransmissores sobem ao mesmo tempo — e às vezes é preciso associar dois ou três antieméticos."},
{t:"k",r:"Aula 19/09 · 36:15 · a regra de escolha",x:"“Não adianta tratar labirintite com bloqueador de 5-HT3, assim como não adianta tomar Dramin numa intoxicação alimentar.” O desencadeante escolhe o receptor, e o receptor escolhe o fármaco."},
{t:"p",x:"Para a quimioterapia o vômito tem nome por tempo: agudo nas primeiras 24 horas, tardio de 24 horas a cinco dias (com pico no segundo e terceiro dia), antecipatório quando vem antes da sessão, por condicionamento, de escape quando fura a profilaxia, e refratário."},

{t:"h",x:"Serotonina acelera, dopamina freia — o vago explica os pró-cinéticos"},
{t:"p",x:"Antes dos fármacos, uma peça de fisiologia que ela usou para amarrar a aula inteira. O vago controla a motilidade do trato gastrintestinal liberando acetilcolina no músculo liso, e dois neurotransmissores modulam essa liberação em sentidos opostos. A serotonina é o acelerador: agindo em 5-HT3 e 5-HT4 no vago, faz liberar acetilcolina. A dopamina é o freio: agindo em D2 no vago, impede essa liberação."},
{t:"p",x:"Com esse desenho, três coisas que pareciam soltas passam a fazer sentido. Bloquear D2 é tirar o freio: sobe a acetilcolina, e com ela a peristalse do esôfago, a pressão do esfíncter esofágico inferior e o esvaziamento gástrico — é daí que sai o efeito pró-cinético da metoclopramida e da bromoprida, que não chega ao cólon. Os receptores 5-HT3 e 5-HT4 são mais densos no intestino do que no estômago, e por isso bloquear 5-HT3 com ondansetrona quase não muda o esvaziamento gástrico, mas constipa — o mesmo efeito que a alosetrona usa de propósito na SII com diarreia. E estimular 5-HT4 com prucaloprida, na SP2, acelerava o cólon."},

{t:"h",x:"Ondansetrona — a segura"},
{t:"p",x:"A <b>ondansetrona</b> bloqueia de forma competitiva e seletiva os receptores 5-HT3 na periferia, nos aferentes vagais das vísceras, e no centro, na zona de gatilho e no centro do vômito. Inibe a sensação aferente visceral — náusea, dor, distensão. É a escolha para o vômito por quimioterápico, para a hiperêmese gravídica (que não é a náusea matinal comum) e para o pós-operatório, e é a preferida no pronto-socorro: “efetiva e extremamente segura”. Por ser seletiva, não dá boca seca, não seda e não serve para o vômito vestibular."},
{t:"p",x:"Por via venosa, 8 mg por dose no máximo; por via oral ou sublingual, 4 ou 8 mg a cada 8 ou 12 horas, até 24 mg por dia. As apresentações contam: o comprimido comum quase não se usa; o sublingual precisa ficar vinte segundos sob a língua; e o filme orodispersível funciona mesmo com a criança chorando e vomitando. O alimento até ajuda a absorção, a meia-vida varia muito por polimorfismo genético — às vezes precisa ser de 6 em 6 horas — e a excreção é predominantemente biliar. Os efeitos adversos são cefaleia, tontura, constipação e, raramente, prolongamento do QT. Granisetrona e palonosetrona — esta com meia-vida de 40 horas — só existem por via venosa, em clínica oncológica; a vantagem delas é posológica, mas a ondansetrona é mais barata e é a que se usa."},
{t:"k",r:"Pegadinha · T7 Q2-V · T6 QD2 · T7 Q8",x:"Ondansetrona bloqueia SÓ 5-HT3 — não muscarínico, não NK1 — e NÃO serve para vestibular. Dose 4–8 mg (não 40 mg). Quimio grave: dexametasona + ondansetrona."},

{t:"h",x:"Metoclopramida e bromoprida — as eficazes, e o preço delas"},
{t:"p",x:"A <b>metoclopramida</b> (Plasil®) e a <b>bromoprida</b> (Plamet®) bloqueiam D2 na zona de gatilho e no trato gastrintestinal — e, o que muitos livros subestimam, fazem também um antagonismo 5-HT3 expressivo. Somando o bloqueio dos dois receptores, são inegavelmente mais eficazes que a ondansetrona no vômito por toxina, quimioterapia e pós-operatório, e servem para quase todo tipo de vômito, exceto a cinetose. O hospital prefere as duas: mais eficácia, menor preço, e um risco que é controlável e tem antídoto."},
{t:"p",x:"A metoclopramida vem em comprimido de 10 mg, injetável de 5 mg e gotas de 4 mg/mL; a bromoprida, em 10 e 20 mg, injetável de 5 mg e gotas de 1 mg/mL. Como aceleram o estômago e o duodeno, reduzem a absorção de alimentos e de outros fármacos durante as seis ou sete horas de efeito — interação que o laxante estimulante não tem, porque age no cólon, e por isso não derruba a eficácia do anticoncepcional."},
{t:"k",r:"Pegadinha · T6 Q8-III · T5 Q5 · PM Q3",x:"Bromoprida é 10 mg, não 50 mg — e é ANTAGONISTA D2, não agonista. Na associação 1–4 que ela recicla: 1 = bromoprida (efetiva) · 2 = ondansetrona (segura) · 3 = bromoprida/metoclopramida (SEP) · 4 = dimenidrinato (gestante)."},

{t:"h",x:"Síndrome extrapiramidal — a lacuna que volta toda prova"},
{t:"p",x:"O efeito adverso mais cobrado da UC nasce de um detalhe de anatomia. A atividade motora é regulada pelo sistema extrapiramidal e modulada por dois lados: neurotransmissores excitatórios colinérgicos e inibitórios dopaminérgicos. Na via nigroestriatal saem as fibras colinérgicas que vão às placas motoras, e essas fibras são freadas pela dopamina — é o mesmo desenho do vago, agora no cérebro. Bloquear D2 ali tira o freio: as fibras colinérgicas ficam superestimuladas, liberam acetilcolina demais nos receptores nicotínicos da junção neuromuscular, e vêm os espasmos. Mantido, vira parkinsonismo medicamentoso, o mesmo mecanismo dos antipsicóticos."},
{t:"p",x:"O paciente conta de um jeito que engana: “doutor, eu tenho alergia ao Plasil”. Não houve urticária nenhuma — houve a sensação de que ia se arrepiar, de não conseguir ficar quieto, falta de ar, vontade de sair correndo. Isso é acatisia. A ordem de gravidade é agitação, tontura, irritabilidade, insônia e angústia; depois a acatisia; depois torcicolo e crise oculógira, que é o sinal de alerta; e por fim a perda de movimento. O tratamento é o biperideno, um anticolinérgico central. O risco é disparadamente maior por via venosa, porque chega muita droga ao sistema nervoso em pouco tempo — e quem já usou antes sem desenvolver a síndrome dificilmente desenvolve."},
{t:"k",r:"Lacuna reciclada · T6 Q1 · T5 Q12 · T7 Q14 · T11 Q8a",x:"“metoclopramida – dopaminérgicos – colinérgicas – D2 – colinérgicas – acetilcolina”. Tratamento = BIPERIDENO (não atropina). Asserção verdadeira: “modulada por excitatórios colinérgicos e inibitórios dopaminérgicos… reduzem a atividade inibitória da dopamina”. Falsa: “estimulada pela dopamina… bloqueio da resposta colinérgica”."},

{t:"h",x:"Domperidona — a antiemética que ninguém prescreve para vômito"},
{t:"p",x:"A <b>domperidona</b> também bloqueia D2, mas quase não atravessa a barreira hematoencefálica. Consequência direta: praticamente não age no centro do vômito, e só funciona como antiemética se a substância agressora ainda está no estômago, irritando localmente. O que ela faz bem é o efeito periférico — aumenta a pressão do esfíncter esofágico inferior, acelera o esvaziamento gástrico e potencializa a peristalse duodenal. Por isso, na prática, é o fármaco da doença do refluxo, não do vômito."},
{t:"p",x:"Ela deu os dois cenários. O recém-nascido de dois ou três meses, cujo esfíncter só amadurece com o crescimento: até lá, esvaziar o estômago rápido reduz a pressão sobre ele — solução duas ou três vezes ao dia, às vezes até perto de um ano. E o adulto na agudização do refluxo, depois de comer demais ou de bebida gasosa, em que o risco grave é a broncoaspiração ao deitar. Em ambos, a base do tratamento continua sendo o IBP da SP4. São 10 mg ou solução de 1 mg/mL."},
{t:"p",x:"O efeito adverso da domperidona é também uma aula de fisiologia. A dopamina liberada pelo hipotálamo é o fator que inibe a prolactina, e a adeno-hipófise, como a zona de gatilho, fica fora da barreira. A domperidona chega lá, bloqueia D2 e a prolactina sobe: ginecomastia, galactorreia, amenorreia, o “brotinho” mamário no bebê em uso contínuo. O mesmo efeito vira recurso na lactante com pouco leite — “dois, três dias e a mama enche”. Pode prolongar o QT."},
{t:"k",r:"Pegadinha · T5 Q4 · PM Q2 · T9 Q12 · T11 Q6",x:"Galactorreia = bloqueio D2 na ADENO-HIPÓFISE — nunca “no hipotálamo”, nunca “por estimulação”. Domperidona NÃO age no cólon, e não é “mais efetiva que a bromoprida por ser seletiva no SNC”."},

{t:"h",x:"Anti-H1 e antimuscarínicos — o labirinto e a gestante"},
{t:"p",x:"Os antieméticos anti-histamínicos são todos de primeira geração — <b>dimenidrinato</b> (Dramin®, 25, 50 e 100 mg), meclizina, cinarizina, flunarizina, hidroxizina, prometazina — e é justamente por isso que funcionam: atravessam a barreira, bloqueiam H1 central (daí o sono) e também receptores muscarínicos, agindo nos aferentes vestibulares e no tronco. A segunda geração (loratadina, fexofenadina, cetirizina) não cruza a barreira: não seda e não é antiemética. A indicação é o vômito de origem vestibular — cinetose, labirintite — e a náusea matinal da gravidez, em que o dimenidrinato é a primeira escolha."},
{t:"p",x:"E o motivo de ele ser primeira escolha na gestante é o mais bonito da SP. A náusea matinal é causada por sialorreia: a gestante engole saliva durante o jejum da noite. O dimenidrinato é antimuscarínico, os muscarínicos estão na glândula salivar, e o efeito adverso de secar a boca é o próprio tratamento — tomado ao deitar, “ela acorda de boca seca”. Os efeitos adversos da classe são sedação, tontura e aumento do apetite, somados aos antimuscarínicos: boca seca, retenção urinária, constipação."},
{t:"p",x:"A <b>escopolamina</b> (hioscina, Buscopan®) e a diciclomina são antimuscarínicas M3 puras, que quase não atravessam a barreira — por isso são más antieméticas: a náusea central continua. O uso real delas é antiespasmódico, na cólica de qualquer víscera inervada pelo vago: renal, uterina, intestinal, biliar. A seletividade importa: bloquear M2 afetaria o coração. E ela pediu cuidado com a palavra — escreva “antimuscarínico”, não “anticolinérgico”, porque colinérgico inclui o nicotínico, que não está envolvido."},
{t:"k",r:"Pegadinha · T5 Q1 · T7 Q3-IV · T9 Q12 · T6 Q3",x:"Dimenidrinato 25–100 mg (não “5–50”); EA = “boca seca + retenção + sonolência”. Escopolamina NÃO é antiemético de gestante — é antiespasmódico."},

{t:"h",x:"Quimioterapia — quando um antiemético só não basta"},
{t:"p",x:"A quimioterapia é o cenário em que vários neurotransmissores sobem ao mesmo tempo, e a profilaxia é montada pelo risco emetogênico do esquema: alto acima de 90%, moderado de 30 a 90%, baixo de 10 a 30%, mínimo abaixo de 10%. Todo paciente em quimioterapia usa no mínimo uma ondansetrona; nos esquemas de maior risco entram os outros."},
{t:"p",x:"O <b>aprepitanto</b> bloqueia a substância P no receptor NK1 — no centro do vômito, na área postrema e nos aferentes vagais —, e a substância P é justamente o mediador que sobe na quimioterapia. É acréscimo, nunca substituição: entra por via venosa, na clínica oncológica, nos dois ou três dias da sessão, para a quimioterapia altamente emetogênica e a fase tardia. São 125 mg. Inibe o CYP3A4, o que aumenta a dexametasona. Não tem no SUS. A <b>dexametasona</b>, de mecanismo incerto (provavelmente reduzindo prostaglandinas), vale para todos os níveis de risco, com dose mínima de 4 mg e faixa de 4 a 20 mg — e é ela que continua em casa, cobrindo a fase tardia; por via venosa rápida dá prurido perineal e rubor."},
{t:"p",x:"Dois grupos fecham o arsenal. Os benzodiazepínicos (lorazepam, alprazolam) tratam o vômito antecipatório: a partir do segundo ciclo o paciente vomita só de chegar à clínica, por ansiedade, e o fármaco entra nos dias que antecedem a sessão. E os canabinoides — nabilona, sintética, e dronabinol — são agonistas CB1 que modulam secreção e motilidade gástricas e ainda aumentam o apetite, o que os leva também à caquexia grave, como na AIDS; foram liberados no Brasil em janeiro de 2026, mas seguem caros e sem protocolo firmado."},
{t:"k",r:"Pegadinha · T9 QD2 · T7 Q2-II",x:"Quimio altamente emetogênica, fase tardia = aprepitanto + 5-HT3 + dexametasona. Aprepitanto NÃO é “para qualquer êmese”. Nabilona é AGONISTA CB1 — “antagonista” é falso."},
{t:"p",x:"O não farmacológico cai como “cite duas medidas”. No paciente oncológico, que não seja ele a preparar a comida nem coma na cozinha, porque o aroma da cocção dispara a náusea; fracionar as refeições, comer em ambiente tranquilo, não deitar depois de comer, preferir alimentos frios e evitar fritura, gordura, condimentos e odores fortes, beber entre as refeições e não durante. O gengibre é o fitoterápico: gingeróis e shogaóis estimulam as secreções, normalizam a motilidade e bloqueiam 5-HT3 e NK1; pelo menos 1 g por dia durante três dias reduz o vômito agudo da quimioterapia. Mas, justamente por estimular a secreção ácida, piora quem já tem gastrite."},

{t:"h",x:"Fígado e pâncreas — quatro fármacos, quatro indicações que não se trocam"},
{t:"p",x:"O bloco hepato é curto na aula e crescente na prova, e o que ela cobra é não trocar as indicações. O <b>ácido ursodesoxicólico</b> (UDCA, Ursacol®) é um ácido biliar natural, menos de 5% do pool: reduz a secreção hepática e a absorção intestinal de colesterol, aumenta o fluxo biliar e estabiliza a membrana do canalículo. Ela explicou o cálculo assim: é o excesso de colesterol que precipita com cálcio — e o UDCA, diminuindo o colesterol da bile, dissolve cálculos pequenos. São 5 a 10 mg/kg/dia (300 a 600 mg); para cálculo, 10 mg/kg/dia por 12 a 24 meses, dissolvendo até metade dos cálculos pequenos em quem não pode operar naquele momento. A meia-vida é longa, cerca de 100 horas. Não é primeira linha para cálculo — essa é a cirurgia —; a indicação que cai é colangite e doença colestática."},
{t:"p",x:"A <b>silimarina</b> é o nome do conjunto de flavonolignanos extraídos do cardo mariano — prescrever um ou outro dá no mesmo. São antioxidantes e anti-inflamatórios: reduzem a peroxidação dos lipídios, depuram radicais livres, aumentam a glutationa. De 280 a 420 mg por dia em duas ou três tomadas. A indicação que ela deu é exclusiva: esteatose hepática, que ela chamou de “quase uma epidemia em jovens, grau 1 a 2, por questões alimentares” — sempre junto com dieta e zero álcool."},
{t:"p",x:"Os <b>coleréticos e colagogos</b> — boldo, com a boldina, e alcachofra, com a cinarina — são alcaloides amargos que estimulam a produção e sobretudo a secreção de sais biliares, ajudando a digerir gordura. Quase ninguém prescreve, mas é a automedicação clássica do “comi algo gorduroso e estou enjoado”. Não protegem o fígado. Por fim, a <b>pancreatina</b> (pancrelipase, Creon®) é amilase, lipase e proteases em cápsula entérica, para a insuficiência pancreática exócrina — fibrose cística, pancreatite crônica, ressecção, ou o paciente que se recupera de uma pancreatite aguda e ainda precisa digerir. Começa-se com três drágeas por refeição e se reduz para uma ou duas, ou 20 a 30 mil unidades de lipase por refeição. Em dose alta, hiperuricemia."},
{t:"k",r:"Aula 19/09 · 96:24",x:"“Só um detalhe, que eu sei que vai ser cobrado”: enzima pancreática se dosa em UNIDADES (UI ou USP), não em miligramas."},
{t:"k",r:"Sequência que caiu · T11 Q14 · T9 Q4 · PM 2024",x:"Colangite → UDCA · esteatose → silimarina · “boldo é hepatoprotetor” é FALSO · colestase + insuficiência pancreática → UDCA + pancreatina."}
]};

window.EXPL=window.EXPL||{};
window.EXPL["SP4"]={titulo:"Dispepsia — reduzir o ataque, reforçar a defesa",
blocos:[
{t:"h",x:"Três estímulos, uma bomba — como a célula parietal fabrica ácido"},
{t:"p",x:"Toda a farmacologia da SP4 cabe numa célula. A célula parietal secreta H⁺ quando recebe um de três estímulos: a gastrina, pelo receptor CCK-B; a acetilcolina, pelo receptor M3; e a histamina, pelo receptor H2. Qualquer que seja o estímulo, o ácido sai pelo mesmo lugar — a bomba H⁺/K⁺-ATPase, na membrana do canalículo. Três portas de entrada, uma de saída: essa assimetria explica por que o fármaco que desliga a bomba é mais forte do que o que fecha uma das portas."},
{t:"p",x:"Cada estímulo tem sua origem. A gastrina é secretada pelas células G do antro, em resposta aos peptídeos da refeição, cai no sangue e volta ao corpo gástrico para agir na célula parietal e na célula ECL — que, estimulada, libera histamina. O vago libera acetilcolina, que age em M3 na parietal e na ECL, e ainda aumenta a gastrina no antro por dois caminhos: direto na célula G e indiretamente, inibindo a somatostatina. O desligamento é feito pela célula D: quando o H⁺ sobe na luz, ou quando o duodeno recebe gordura e proteína e libera CCK, a célula D secreta somatostatina, que inibe as células G vizinhas. O ácido freia a própria produção."},
{t:"p",x:"Ela adora perguntar qual receptor usa qual segundo mensageiro. O H2 age por AMPc — por isso o anti-H2 “reduz as concentrações de AMPc”, e o misoprostol também mexe no AMPc. O M3 e o CCK-B agem por cálcio."},
{t:"k",r:"O par que ela inverte",x:"Gastrina = célula G do antro · histamina = célula ECL · somatostatina = célula D. H2 → AMPc; M3 e CCK-B → Ca²⁺."},

{t:"h",x:"A mucosa que resiste ao próprio ácido"},
{t:"p",x:"Um estômago saudável não se digere porque tem defesa em camadas: um muco viscoelástico aderido como barreira física, bicarbonato secretado dentro desse muco, junções oclusivas de alta resistência elétrica que tornam a mucosa impermeável ao conteúdo da luz, e um fluxo sanguíneo generoso. Boa parte dessa defesa depende da síntese das prostaglandinas PGE₂ e PGI₂ — e é daqui que saem, ao mesmo tempo, a úlcera por AINE, que corta as prostaglandinas, e todo o racional do misoprostol, que as repõe."},
{t:"p",x:"Dispepsia é a síndrome dessa balança desequilibrada: dor ou desconforto epigástrico persistente ou recorrente, com ou sem má digestão, pirose, regurgitação, náusea, vômito, saciedade precoce, eructação e sensação de digestão lenta. Os objetivos do tratamento, na ordem dela, são aliviar o sintoma, prevenir recidiva e complicações, controlar a acidez e aumentar a resistência da barreira mucosa — e os dois últimos são exatamente as duas metades da farmacologia: reduzir o ataque e reforçar a defesa."},
{t:"p",x:"O não farmacológico é questão garantida. Reduzir álcool, café e chás cafeinados; reduzir o tabaco para menos de dez cigarros por dia; suspender, com avaliação médica, os fármacos ulcerogênicos como AINEs e corticoides; fracionar a dieta em cinco a seis refeições; e evitar o que dá sintoma naquele paciente, sem dieta rigorosa. E a frase que está no slide com todas as letras: leite e derivados não protegem o estômago — o cálcio e as proteínas do leite estimulam a secreção ácida."},
{t:"k",r:"Pegadinha nº 1 da seção · slide",x:"“Recomendar leite para proteger o estômago” é FALSO. Também falsas: “proibir todos os alimentos ácidos” (não precisa dieta rigorosa) e “parar completamente o tabaco” (o slide diz reduzir para <10 cigarros/dia)."},

{t:"h",x:"Anti-H2 — fechar uma das três portas"},
{t:"p",x:"Os <b>anti-H2</b> inibem competitivamente o receptor H2 e reduzem o AMPc da célula parietal. Suprimem a secreção basal e a estimulada pela refeição, de forma linear e dependente da dose, e são particularmente efetivos na secreção noturna; nas doses usuais, mantêm a secreção inibida em mais de 50% por dez horas. A cimetidina, 400 mg duas vezes ao dia, é a problemática: inibe o CYP450 e é a única com ginecomastia, impotência e perda de libido. A nizatidina tem duas posologias — 150 mg duas vezes ou 300 mg ao deitar —, o que a torna alvo fácil de troca de números. A <b>famotidina</b>, 20 a 40 mg ao deitar, é a mais usada: poupa o CYP e é a escolha dela para uso crônico e dispepsia funcional."},
{t:"p",x:"Ela já cobrou em discursiva por que o anti-H2 perde para o IBP, e a resposta é a assimetria da célula. O anti-H2 fecha uma das três portas, de forma competitiva e reversível: a secreção cai por volta de 50%, os outros dois estímulos continuam funcionando, e ainda se desenvolve tolerância. O IBP desliga a etapa final, a bomba, de forma covalente e irreversível, independentemente de qual estímulo chegou — e derruba 90 a 98% da secreção. É por isso que o anti-H2 não cicatriza úlcera de forma confiável e o IBP é primeira linha."},
{t:"k",r:"Pegadinha · T6 QD4 · PM Q9 · T7 Q15-II · T8 QD1",x:"Famotidina 20 mg à noite (não “10 mg”), antagonista competitivo da HISTAMINA (não “ativada pela gastrina”), para uso crônico e dispepsia funcional — não cicatriza úlcera."},

{t:"h",x:"IBP — o pró-fármaco que precisa do ácido que vai desligar"},
{t:"p",x:"O IBP tem um paradoxo elegante: ele depende do próprio ácido que vai bloquear. O omeprazol é um pró-fármaco que se degrada em meio ácido — por isso vem em cápsula de revestimento entérico, para atravessar o estômago intacto e ser absorvido no intestino. Pelo sangue, ele chega à célula parietal e se acumula no canalículo, justamente onde está o H⁺. Ali é protonado, sofre um rearranjo e se transforma em sulfenamida tetracíclica, a forma ativa, que se liga covalentemente aos grupos sulfidrila da bomba e a inativa de forma irreversível. A secreção só volta quando a célula fabrica bombas novas."},
{t:"p",x:"Daí sai a regra de horário, que ela cobra pelo motivo e não só pelo número. O IBP é tomado 60 minutos antes da refeição, em jejum, porque é quando a refeição está prestes a ligar as bombas e há mais H⁺ no canalículo para ativar o fármaco. Não tem nada a ver com melhorar a biodisponibilidade. Em pH 1,2 todos os IBPs se ativam em um a dois minutos; em pH 5,1, o omeprazol e o lansoprazol levam uma hora e meia. O resultado é uma inibição de mais de 90% da secreção por 24 horas, qualquer que seja o estímulo, com efeito pleno em três a quatro dias e o pH acima de 4 por 16 a 18 horas por dia."},
{t:"p",x:"São absorvidos rapidamente, passam por metabolismo hepático intenso e de primeira passagem e não precisam de ajuste de dose na insuficiência renal nem na hepatopatia leve a moderada. Todos são metabolizados por CYP2C19 e CYP3A4, e todos inibem o CYP em algum grau — omeprazol e esomeprazol, fortemente. O <b>pantoprazol</b> é o mais estável em meio ácido e o de menor interação com outros fármacos e com alimentos, o que o torna a escolha na polifarmácia. O <b>esomeprazol</b>, o enantiômero S puro do omeprazol, tem a maior biodisponibilidade (89%) e dá a mesma resposta com dose menor. O <b>omeprazol</b>, 20 a 40 mg uma vez ao dia, é o supressor da atenção básica."},
{t:"k",r:"Pegadinha · T11 Q1 · T7 QD2 · T11 Q3-b",x:"“IBP 1 h antes para melhorar a biodisponibilidade” é FALSO — é para a BIOATIVAÇÃO nos canalículos. “Pantoprazol é o mais potente” é FALSO — ele é o mais estável e o de menor interação; quem dá mais resposta por dose é o esomeprazol."},

{t:"h",x:"O que o IBP crônico cobra — a cadeia da hipocloridria"},
{t:"p",x:"Os efeitos adversos agudos do IBP são banais — náusea, diarreia, cólica, flatulência, boca seca, cefaleia —, mas os do uso crônico são uma discursiva inteira, e todos saem da mesma causa: o estômago sem ácido. Sem ácido, o ferro da dieta não é reduzido de Fe³⁺ para Fe²⁺, a forma absorvível, e vem a anemia ferropriva. A B12 depende do ácido para se soltar das proteínas e do fator intrínseco para ser absorvida no íleo; com os dois reduzidos, anemia megaloblástica. O cálcio é menos absorvido, a hipocalcemia sobe o PTH, o PTH tira cálcio do osso — osteopenia e fratura. O magnésio cai, e a hipomagnesemia dá mialgia e câimbra até em uso não tão longo."},
{t:"p",x:"A pepsina só funciona em pH abaixo de 4, então a digestão de proteínas cai e faltam aminoácidos essenciais — entre eles o triptofano, com ansiedade e insônia. O ácido também era uma barreira antimicrobiana: sem ele aumentam as infecções — pneumonia, diarreia, <i>C. difficile</i>. E o circuito de retroalimentação da primeira seção se vira contra o paciente: sem H⁺ na luz, a célula D não recebe o sinal para liberar somatostatina, a gastrina fica alta, e a hipergastrinemia traz rebote ácido quando o IBP é suspenso e risco de tumor. Para repor cálcio nesse paciente, prefira o citrato: o carbonato depende do pH ácido para ser absorvido."},
{t:"k",r:"Família que recicla · T11 Q2 · T5 Q9 · T7 QD5/QD6 · T9 QD4",x:"“Hipercloridria induzida pela gastrina” é FALSO — é HIPOcloridria que causa hipergastrinemia. A B12 é absorvida no ÍLEO, não no cólon. Ginecomastia no IBP crônico = omeprazol e esomeprazol."},

{t:"h",x:"A interação nº 1 dela — omeprazol e clopidogrel"},
{t:"p",x:"O clopidogrel é um pró-fármaco: só vira antiagregante depois de ativado pelo CYP2C19. O omeprazol e o esomeprazol inibem fortemente justamente o CYP2C19 — então o clopidogrel não é ativado, a antiagregação falha e o risco que aumenta é de trombose e infarto, não de sangramento. É a pegadinha: quem lê rápido associa antiagregante com sangramento. O omeprazol ainda atrapalha o metabolismo de outros fármacos — varfarina, fenitoína, diazepam, ciclosporina —, e ao subir o pH reduz a absorção do AAS. No paciente em clopidogrel, a alternativa é o pantoprazol ou a famotidina."},
{t:"k",r:"Pegadinha · T6 Q11 · T7 Q1 · T8 QD2 · T5 Q8",x:"Omeprazol + clopidogrel = risco TROMBÓTICO (o pró-fármaco não é ativado), não “risco de sangramento”. A enzima é o CYP2C19, não o 2C9."},

{t:"h",x:"Vonoprazana — bloquear a bomba sem precisar de ácido"},
{t:"p",x:"A <b>vonoprazana</b> (Inzelm®, 10 e 20 mg) é de outra classe, os bloqueadores ácidos competitivos de potássio (PCAB), e cada diferença em relação ao IBP é uma questão. Não é pró-fármaco: é uma base forte, com alta afinidade pela bomba, que não precisa de ativação ácida. Inibe a H⁺/K⁺-ATPase de forma reversível, competindo com o potássio — o IBP é irreversível e covalente. E pode ser tomada com alimento, em qualquer horário. A meia-vida é de cerca de 8 horas, liga-se 85% a proteínas, é metabolizada pelo CYP3A4 e excretada 65% pelo rim. Com 10 ou 20 mg por sete dias, mantém o pH acima de 4 por 63% e 83% do dia. Serve para úlcera gástrica e duodenal, esofagite de refluxo e prevenção de úlcera por AINE — com limite de uso de oito semanas."},
{t:"k",r:"Pegadinha · T6 Q14-IV · T7 Q15-III",x:"Vonoprazana NÃO estimula muco nem bicarbonato. Uso máximo de 8 semanas — “uso contínuo por 6 meses” é falso. Não é pró-fármaco e pode ser tomada com alimento."},

{t:"h",x:"Antiácidos — neutralizar não é curar"},
{t:"p",x:"O antiácido não mexe na célula parietal: neutraliza o ácido que já foi secretado, elevando o pH. Por isso alivia a dor, mas não cicatriza úlcera sozinho nem previne a úlcera por AINE. A potência é medida em miliequivalentes de capacidade de neutralização — a quantidade de HCl 1 N que o antiácido leva a pH 3,5 em 15 minutos —, e ele deve neutralizar pelo menos 5 mEq por dose. Eleva o pH urinário em pelo menos uma unidade. E é tomado com o estômago vazio, uma hora depois da refeição."},
{t:"p",x:"Cada sal tem uma personalidade. O hidróxido de magnésio reage rápido e dá diarreia; o de alumínio reage devagar e constipa — e por isso vêm juntos, um compensando o outro, com neutralização equilibrada e mantida. O carbonato de cálcio libera CO₂ e dá eructação, provoca rebote porque o cálcio estimula a gastrina, e pode causar hipercalcemia. O bicarbonato de sódio é muito solúvel e absorvido até pelo estômago: dá eructação, carga de álcali e de sódio, e é contraindicado na hipertensão e na insuficiência renal. O trissilicato de magnésio forma sílica coloidal, com efeito prolongado e adsorção de pepsina. Todos podem prejudicar a absorção de outros fármacos, por ionização e complexação — devem ficar a duas horas de tetraciclinas, fluorquinolonas, itraconazol e ferro."},
{t:"k",r:"Frase falsa do slide",x:"“Sem dor = sem úlcera” — a dor some em 1 a 2 dias, a cicatrização leva semanas."},
{t:"k",r:"Os quatro horários que ela troca todo ano",x:"Antiácido = 1 h DEPOIS da refeição · sucralfato = 1 h ANTES · IBP = 60 min ANTES, em jejum · anti-H2 = ao deitar · vonoprazana = tanto faz."},

{t:"h",x:"Reforçar a defesa — misoprostol, bismuto e sucralfato"},
{t:"p",x:"Os citoprotetores vão pela outra metade da farmacologia: em vez de reduzir o ataque, reforçam a defesa ou colocam uma barreira física sobre a úlcera. O <b>misoprostol</b> é um agonista de receptores de PGE — repõe a prostaglandina que o AINE tirou. Reduz o HCl (diminuindo o AMPc estimulado pela histamina), aumenta muco e bicarbonato e aumenta o fluxo da mucosa. O uso é hospitalar e off-label, na úlcera por AINE e nas complicações. Os efeitos adversos explicam por quê: diarreia, cólica e contrações uterinas — é abortivo, e nunca é a resposta para gestante com pirose."},
{t:"p",x:"O <b>bismuto</b>, que apareceu na SP1, volta aqui como citoprotetor: adsorve pepsina e estimula prostaglandinas, muco e bicarbonato. É muito usado contra o <i>H. pylori</i>, porque é tóxico para o bacilo e impede sua aderência à mucosa. Escurece língua e fezes — e, como é eliminado pelo rim, acumula na insuficiência renal e pode causar encefalopatia."},
{t:"p",x:"O <b>sucralfato</b> é octassulfato de sacarose complexado com hidróxido de alumínio. No meio ácido do estômago, libera alumínio e se polimeriza numa pasta viscosa e firme que se liga seletivamente às úlceras e erosões por até seis horas, além de estimular prostaglandinas e bicarbonato. Como depende do ácido para formar a pasta, é tomado com o estômago vazio, uma hora antes das refeições: 1 g quatro vezes ao dia. Constipa, por causa do alumínio, e adsorve outros fármacos. É o gastroprotetor ambulatorial clássico associado ao IBP."},
{t:"k",r:"Três trocas prováveis · T7 Q9 · T9 Q3 · T4 Q9",x:"“Misoprostol é antagonista de PGE” — é AGONISTA. “Sucralfato neutraliza o ácido” — forma barreira física. “Sucralfato contém hidróxido de cálcio” — é ALUMÍNIO. Úlcera ambulatorial → IBP + sucralfato; precisa manter o AINE → misoprostol (hospitalar) ou IBP."},
{t:"k",r:"Caso hospitalar · T11 Q11",x:"Gastrite erosiva com vômito no hospital → omeprazol IV + bromoprida IV. Misoprostol IV não existe; ondansetrona não é pró-cinética."},

{t:"h",x:"Fitoterapia e o que os artigos dela deixam cair"},
{t:"p",x:"A espinheira-santa, em chá das folhas, reduz a secreção ácida e aumenta muco e bicarbonato — serve para gastrite leve e dispepsia, nunca para úlcera nem para <i>H. pylori</i>. O artigo que ela anexou é sobre a couve, com atividade gastroprotetora em modelos animais. Como carminativos, três infusões no mesmo volume de 150 mL: camomila, 3 g das flores, três a quatro vezes ao dia; hortelã, 1,5 g das folhas, duas a três vezes; erva-cidreira, 4 g das sumidades floridas, duas a três vezes. Ela cobra fitoterápico com dose."},
{t:"p",x:"Dos dois artigos de IBP, saem as frases prontas para alternativa. Os IBPs mantêm o pH acima de 4 por 16 a 18 horas por dia. O pantoprazol foi o mais eficaz em oito semanas — erradicação do <i>H. pylori</i>, esofagite, úlcera duodenal — e o de menos efeitos adversos. Na profilaxia da úlcera de estresse, o IBP é mais efetivo que o anti-H2 para prevenir sangramento, mas o anti-H2 tem menos eventos ligados à supressão ácida (pneumonia associada à ventilação, <i>C. difficile</i>) e custa menos. E no estudo de omeprazol contra pantoprazol em UTI, nenhum desfecho foi diferente."},
{t:"k",r:"O formato dela: troca um número ou um fármaco",x:"“IBP mantém pH > 4 por 6–8 h” — falso (16–18 h). “Omeprazol foi o mais eficaz em 8 semanas” — falso (pantoprazol). “Pantoprazol reduziu a mortalidade em UTI” — falso (30,8% × 24,4%, equivalente)."},
{t:"k",r:"Aula da SP4 ainda não foi dada",x:"Este texto saiu dos slides, dos artigos e das provas antigas. Quando ela der a aula, as frases-lei entram aqui — nas outras SPs, o que ela falou e não estava no slide foi o que mais valeu ponto."}
]};

\">urina (glicuronídeos)</text><text x=\"934\" y=\"114\" font-size=\"10.2\">sene: urina/fezes avermelhadas</text><rect x=\"10\" y=\"202\" width=\"1100\" height=\"38\" rx=\"6\" fill=\"#fff7ed\" stroke=\"#fdba74\"/><text x=\"18\" y=\"217\" font-size=\"11\"><tspan font-weight=\"700\">Fase I:</tspan> hidrólise (desacetilação) do bisacodil por esterases → BHPM; senosídeos → azorredução/hidrólise bacteriana → reína-antrona</text><text x=\"18\" y=\"233\" font-size=\"11\"><tspan font-weight=\"700\">Fase II:</tspan> glicuronidação do BHPM → êntero-hepático / urina</text><defs><marker id=\"v10_a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#64748b\"/></marker></defs></svg>","hay":"bisacodil e antracênicos (sene) — pró-fármacos ativados no intestino boca / via vo cp entérico / retal estômago cp entérico passa íntegro (ph ácido) intestino bisacodil: esterases intestinais/bacterianas → bhpm (desacetil-bisacodil, ativo) → irrita mucosa sene: glicosídeos antracênicos (senosídeos) → bactérias do cólon → reína-antrona (ativo) fígado bhpm absorvido (pouco) → glicuronidação → circulação êntero-hepática (volta ao intestino) sangue → alvo ativo no cólon: irrita enterócitos/neurônios/músculo → pg/ampc, no/gmpc → água + eletrólitos + motilidade (crônico: melanose, degeneração neural → cólon preguiçoso) excreção fezes (maior parte) urina (glicuronídeos) sene: urina/fezes avermelhadas"},{"sp":"SP2","t":"Prucaloprida, lubiprostona e formadores de massa","sub":"prucaloprida 2 mg 1×/dia · lubiprostona 8–24 mcg até 2× · psyllium/metilcelulose/policarbofila com água","svg":"<svg viewBox=\"0 0 1120 188\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui\" font-size=\"11.5\"><rect width=\"1120\" height=\"188\" fill=\"#fff\"/><text x=\"10\" y=\"20\" font-size=\"14\" font-weight=\"700\">Prucaloprida, lubiprostona e formadores de massa</text><text x=\"10\" y=\"37\" font-size=\"11\" fill=\"#5a6a7e\">prucaloprida 2 mg 1×/dia 2\" font-weight=\"700\">~60% excretada INALTERADA</text><text x=\"566\" y=\"129\" font-size=\"10.2\">lubiprostona: metabolizada</text><text x=\"566\" y=\"144\" font-size=\"10.2\">na mucosa (carbonil-redutase)</text><text x=\"566\" y=\"159\" font-size=\"10.2\">→ M3 (ativo fraco)</text><path d=\"M735 109.0 L744 109.0\" stroke=\"#64748b\" stroke-width=\"2\" marker-end=\"url(#v11_a)\"/><rect x=\"744\" y=\"52\" width=\"175\" height=\"114\" rx=\"9\" fill=\"#ede9fe\" stroke=\"#cbd5e1\"/><text x=\"831.5\" y=\"68\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"11.5\">Sangue → alvo</text><text x=\"750\" y=\"84\" font-size=\"10.2\">prucaloprida: agonista 5-HT4</text><text x=\"750\" y=\"99\" font-size=\"10.2\">→ ↑AMPc → ↑ACh → peristalse</text><text x=\"750\" y=\"114\" font-size=\"10.2\">(1º movimento ~2,5 h)</text><text x=\"750\" y=\"129\" font-size=\"10.2\">lubiprostona: ativa ClC-2</text><text x=\"750\" y=\"144\" font-size=\"10.2\">no delgado → secreção Cl-</text><path d=\"M919 109.0 L928 109.0\" stroke=\"#64748b\" stroke-width=\"2\" marker-end=\"url(#v11_a)\"/><rect x=\"928\" y=\"52\" width=\"175\" height=\"114\" rx=\"9\" fill=\"#f1f5f9\" stroke=\"#cbd5e1\"/><text x=\"1015.5\" y=\"68\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"11.5\">Excreção</text><text x=\"934\" y=\"84\" font-size=\"10.2\">prucaloprida: RENAL</text><text x=\"934\" y=\"99\" font-size=\"10.2\">(ajustar na IRC)</text><text x=\"934\" y=\"114\" font-size=\"10.2\">lubiprostona: urina/fezes</text><text x=\"934\" y=\"129\" font-size=\"10.2\">formadores: fezes</text><defs><marker id=\"v11_a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#64748b\"/></marker></defs></svg>","hay":"prucaloprida, lubiprostona e formadores de massa boca / via estômago intestino prucaloprida: absorção alta (&gt;90%), pico 2–3 h lubiprostona: absorção mínima, age local formadores: não absorvidos, retêm água (gel, ≥24 h) fígado prucaloprida: pouco metabolismo (cyp3a4 menor), ~60% excretada inalterada lubiprostona: metabolizada na mucosa (carbonil-redutase) → m3 (ativo fraco) sangue → alvo prucaloprida: agonista 5-ht4 → ↑ampc → ↑ach → peristalse (1º movimento ~2,5 h) lubiprostona: ativa clc-2 no delgado → secreção cl- excreção prucaloprida: renal (ajustar na irc) lubiprostona: urina/fezes formadores: fezes"},{"sp":"SP3","t":"Metoclopramida × domperidona × bromoprida — o mesmo alvo, destinos di…","sub":"10 mg cada (VO); metoclopramida/bromoprida 5 mg inj","svg":"<svg viewBox=\"0 0 1120 261\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui\" font-size=\"11.5\"><rect width=\"1120\" height=\"261\" fill=\"#fff\"/><text x=\"10\" y=\"20\" font-size=\"14\" font-weight=\"700\">Metoclopramida × domperidona × bromoprida — o mesmo alvo, destinos diferentes</text><text x=\"10\" y=\"37\" font-size=\"11\" fill=\"#5a6a7e\">10 mg cada (VO); metoclopramida/bromoprida 5 mg inj</text><rect x=\"8\" y=\"52\" width=\"175\" height=\"129\" rx=\"9\" fill=\"#e0f2f7\" stroke=\"#cbd5e1\"/><text x=\"95.5\" y=\"68\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"11.5\">Boca / via</text><text x=\"14\" y=\"84\" font-size=\"10.2\">VO / IV / gotas</text><path d=\"M183 116.5 L192 116.5\" stroke=\"#64748b\" stroke-width=\"2\" marker-end=\"url(#v12_a)\"/><rect x=\"192\" y=\"52\" width=\"175\" height=\"129\" rx=\"9\" fill=\"#fef9c3\" stroke=\"#cbd5e1\"/><text x=\"279.5\" y=\"68\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"11.5\">Estômago</text><text x=\"198\" y=\"84\" font-size=\"10.2\">—</text><path d=\"M367 116.5 L376 116.5\" stroke=\"#64748b\" stroke-width=\"2\" marker-end=\"url(#v12_a)\"/><rect x=\"376\" y=\"52\" width=\"175\" height=\"129\" rx=\"9\" fill=\"#dcfce7\" stroke=\"#cbd5e1\"/><text x=\"463.5\" y=\"68\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"11.5\">Intestino</text><text x=\"382\" y=\"84\" font-size=\"10.2\">metoclopramida: absorve bem</text><text x=\"382\" y=\"99\" font-size=\"10.2\">(biodisp. ~75%)</text><text x=\"382\" y=\"114\" font-size=\"10.2\" font-weight=\"700\">domperidona: 1ª passagem</text><text x=\"382\" y=\"129\" font-size=\"10.2\">intensa → biodisp. ~15%</text><text x=\"382\" y=\"144\" font-size=\"10.2\">bromoprida: absorve bem</text><path d=\"M551 116.5 L560 116.5\" stroke=\"#64748b\" stroke-width=\"2\" marker-end=\"url(#v12_a)\"/><rect x=\"560\" y=\"52\" width=\"175\" height=\"129\" rx=\"9\" fill=\"#fee2e2\" stroke=\"#cbd5e1\"/><text x=\"647.5\" y=\"68\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"11.5\">Fígado</text><text x=\"566\" y=\"84\" font-size=\"10.2\">metoclopramida: *CYP2D6</text><text x=\"566\" y=\"99\" font-size=\"10.2\">(+ sulfatação/glicuronidação)</text><text x=\"566\" y=\"114\" font-size=\"10.2\">t½ 5–6 h</text><text x=\"566\" y=\"129\" font-size=\"10.2\" font-weight=\"700\">domperidona: CYP3A4</text><text x=\"566\" y=\"144\" font-size=\"10.2\">(inibidores 3A4 ↑ nível → QT)</text><text x=\"566\" y=\"159\" font-size=\"10.2\">bromoprida: hepático (CYP)</text><path d=\"M735 116.5 L744 116.5\" stroke=\"#64748b\" stroke-width=\"2\" marker-end=\"url(#v12_a)\"/><rect x=\"744\" y=\"52\" width=\"175\" height=\"129\" rx=\"9\" fill=\"#ede9fe\" stroke=\"#cbd5e1\"/><text x=\"831.5\" y=\"68\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"11.5\">Sangue → alvo</text><text x=\"750\" y=\"84\" font-size=\"10.2\" font-weight=\"700\">metoclopramida e bromoprida</text><text x=\"750\" y=\"99\" font-size=\"10.2\">CRUZAM a BHE → D2 no</text><text x=\"750\" y=\"114\" font-size=\"10.2\">tronco (antiemético) + nigro-</text><text x=\"750\" y=\"129\" font-size=\"10.2\">estriatal (SEP) + hipófise</text><text x=\"750\" y=\"144\" font-size=\"10.2\" font-weight=\"700\">domperidona NÃO cruza →</text><text x=\"750\" y=\"159\" font-size=\"10.2\">só periférico + hipófise</text><text x=\"750\" y=\"174\" font-size=\"10.2\">(fora da BHE → prolactina)</text><path d=\"M919 116.5 L928 116.5\" stroke=\"#64748b\" stroke-width=\"2\" marker-end=\"ur
