<title>UC14 · Farmaco · Guia Completo (SPs + Banco + Vias + Raio-X)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#eef1f4; --panel:#fff; --panel2:#f7f9fb; --line:#dde4ea; --line2:#eaeff3;
  --ink:#16202a; --ink2:#59araraa; --ink2:#59666f; --ink3:#89939d;
  --rail:#1b232c; --rail2:#141b22; --railink:#aebac6; --railink2:#6e7d8b; --railon:#27313c;
  --acc:#0a5f8a; --accink:#fff; --accsoft:#e4eef5;
  --ok:#0f6a46; --okbg:#ecf9f2; --no:#a02a22; --nobg:#fdf0ef;
  --trap:#6f5511; --trapbg:#fdf8ea; --trapline:#e7dcbd;
  --sp1:#0b7f5c; --sp2:#8a5a12; --sp3:#6d3fb5; --sp4:#ae392c; --bandink:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --panel:#181e24; --panel2:#141a20; --line:#28313a; --line2:#212932;
  --ink:#e6ebf0; --ink2:#98a5b2; --ink3:#6f7d8a;
  --rail:#131920; --rail2:#0c1116; --railink:#9fadba; --railink2:#65727f; --railon:#1e2731;
  --acc:#5aa9db; --accink:#08131b; --accsoft:#16242e;
  --ok:#4fbf90; --okbg:#10241d; --no:#e07a6c; --nobg:#2a1715;
  --trap:#d9b86a; --trapbg:#221d10; --trapline:#3d3620;
  --sp1:#1f9f8e; --sp2:#b8822c; --sp3:#9a72d8; --sp4:#d96a5b; --bandink:#0c1215;
}}
:root[data-theme="dark"]{
  --bg:#0f1317; --panel:#181e24; --panel2:#141a20; --line:#28313a; --line2:#212932;
  --ink:#e6ebf0; --ink2:#98a5b2; --ink3:#6f7d8a;
  --rail:#131920; --rail2:#0c1116; --railink:#9fadba; --railink2:#65727f; --railon:#1e2731;
  --acc:#5aa9db; --accink:#08131b; --accsoft:#16242e;
  --ok:#4fbf90; --okbg:#10241d; --no:#e07a6c; --nobg:#2a1715;
  --trap:#d9b86a; --trapbg:#221d10; --trapline:#3d3620;
  --sp1:#1f9f8e; --sp2:#b8822c; --sp3:#9a72d8; --sp4:#d96a5b; --bandink:#0c1215;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;
 -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;min-height:560px}

/* topbar */
.top{background:var(--rail2);color:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:0 16px;padding-top:calc(9px + env(safe-area-inset-top,0px));padding-bottom:9px;flex:0 0 auto}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;letter-spacing:.04em;
  text-transform:uppercase;line-height:1}
.brand em{font-style:normal;color:#65727f;font-weight:500}
.ucs{display:flex;gap:4px}
.ucs button{background:none;border:1px solid transparent;color:#8794a1;border-radius:5px;padding:4px 10px;
  font-size:12.5px;font-weight:500;cursor:pointer;line-height:1.3}
.ucs button:hover:not(:disabled){color:#fff;background:#1d252e}
.ucs button[aria-pressed="true"]{background:#242e39;color:#fff;border-color:#33404d}
.ucs button:disabled{opacity:.38;cursor:not-allowed}
.top .gap{flex:1}
.cd{display:flex;align-items:baseline;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:#7d8a97;white-space:nowrap}
.cd b{color:#f0b429;font-size:14px;letter-spacing:.02em;font-weight:600}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 312px;
  grid-template-rows:minmax(0,1fr)}

/* rail */
/* barra de SPs (entre o topo e as abas) */
.spbar{background:var(--rail);color:var(--railink);border-bottom:1px solid var(--rail2);flex:0 0 auto}
.spb-in{display:flex;align-items:stretch;gap:0;padding:0 16px;overflow-x:auto;scrollbar-width:thin}
.spb-in::-webkit-scrollbar{height:6px}.spb-in::-webkit-scrollbar-thumb{background:#33404d;border-radius:3px}
.spb-id{display:flex;flex-direction:column;justify-content:center;padding:9px 16px 9px 0;margin-right:8px;
  border-right:1px solid var(--railon);flex:0 0 auto}
.spb-id b{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600;color:#fff;letter-spacing:.02em;
  text-transform:uppercase;line-height:1.1;white-space:nowrap}
.spb-id span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--railink2);margin-top:3px;white-space:nowrap}
.spb-lab{display:flex;flex-direction:column;justify-content:center;padding:0 14px 0 12px;flex:0 0 auto;
  font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--railink2);line-height:1.5;white-space:nowrap}
.spb-lab i{font-style:normal;letter-spacing:.06em;text-transform:none;font-size:9.5px;color:#56636f;margin-top:2px}
.spc{display:grid;grid-template-columns:9px auto auto;gap:9px;align-items:center;flex:0 0 auto;
  background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px 7px;cursor:pointer;
  color:var(--railink);text-align:left;line-height:1.25;white-space:nowrap}
.spc:hover{background:var(--railon);color:#fff}
.spc[aria-pressed="true"]{background:var(--railon);color:#fff;border-bottom-color:var(--acc)}
.spc .dot{width:9px;height:9px;border-radius:2px;display:block}
.spc .t{font-size:13px;font-weight:500}
.spc .t em{display:block;font-style:normal;font-size:10px;color:var(--railink2);font-weight:400;margin-top:1px;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.03em}
.spc[aria-pressed="true"] .t em{color:#8fa0b0}
.spc .c{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--railink2);font-variant-numeric:tabular-nums;
  padding-left:4px;align-self:start;margin-top:2px}
.spc[aria-pressed="true"] .c{color:#aebac6}

/* centro */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
.modes{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto;
  overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 13px 10px;cursor:pointer;
  color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px}
.modes button:hover{color:var(--ink)}
.modes button[aria-pressed="true"]{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.modes button i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10px;background:var(--line2);
  color:var(--ink2);border-radius:9px;padding:1px 6px;font-variant-numeric:tabular-nums}
.modes button[aria-pressed="true"] i{background:var(--acc);color:var(--accink)}
.pane{flex:1;min-height:0;overflow-y:auto;padding:16px 24px 34px;position:relative}
.pane[data-m="resumo"]>*{max-width:76ch;margin-left:auto;margin-right:auto}
.pane[data-m="questoes"]>*,.pane[data-m="prova"]>*{max-width:88ch;margin-left:auto;margin-right:auto}

/* barra de ferramentas */
.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{background:none;border:0;border-radius:5px;padding:5px 12px;font-size:12.5px;font-weight:500;
  color:var(--ink2);cursor:pointer;line-height:1.35}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink);font-weight:600}
.srch{flex:1;min-width:150px;max-width:280px;position:relative}
.srch input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:7px 11px 7px 29px;font:inherit;font-size:13px;color:var(--ink)}
.srch input::placeholder{color:var(--ink3)}
.srch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none}
.tnote{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink3);letter-spacing:.04em;margin-left:auto}

/* tabela de fármacos */
.tbwrap{border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.tb{width:100%;border-collapse:collapse;table-layout:fixed}
.tb col.c-nm{width:38%}.tb col.c-ps{width:23%}.tb col.c-us{width:22%}.tb col.c-su{width:9%}.tb col.c-ca{width:8%}
@media (max-width:700px){.tb col.c-nm{width:34%}.tb col.c-ps{width:24%}}
.tb thead th{position:sticky;top:0;z-index:2;background:var(--panel2);text-align:left;padding:8px 11px;
  font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.tb tbody tr.row{border-bottom:1px solid var(--line2);cursor:pointer}
.tb tbody tr.row:last-child{border-bottom:0}
.tb tbody tr.row:hover{background:var(--panel2)}
.tb tbody tr.row.on{background:var(--accsoft)}
.tb td{padding:9px 11px;vertical-align:top;border-left:0}
.tb td.c1{border-left:3px solid var(--cc);min-width:190px}
.tb .spk{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.11em;
  font-weight:600;color:var(--bandink);background:var(--cc);border-radius:3px;padding:1px 5px;
  vertical-align:middle;margin-right:6px}
.tb .nm{font-weight:600;font-size:13.5px;letter-spacing:-.004em}
.tb .sub{color:var(--ink3);font-size:11px;line-height:1.4;margin-top:1px}
.tb .mec{color:var(--ink2);font-size:11.5px;line-height:1.45;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tb code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);
  border-radius:4px;padding:4px 7px;display:block;line-height:1.5;font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;hyphens:auto}
.tb .usr{font-size:12px;color:var(--ink2);line-height:1.45}
.tb .caiu{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb .caiu.z{color:var(--ink3)}
.tb .warn{color:var(--no);font-weight:700}
.sus{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;font-weight:600;white-space:nowrap;
  border:1.5px solid currentColor;border-radius:3px;padding:1px 5px;display:inline-block}
.sus.y{color:var(--ok)}.sus.n{color:var(--no)}.sus.u{color:var(--ink3)}
tr.fic td{background:var(--panel2);border-left:3px solid var(--cc);padding:12px 13px 14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.fgrid div b{display:block;font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.fgrid div p{margin:0;font-size:12.5px;line-height:1.55}
.fgrid div.al p{color:var(--no)}
.fprov{margin-top:11px;padding-top:10px;border-top:1px dotted var(--line);font-size:11.5px;color:var(--ink2);
  line-height:1.6}
.fprov b{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);display:block;margin-bottom:3px}

/* cartas (com virar) */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{perspective:1100px;height:288px;background:none;border:0;padding:0;cursor:pointer;text-align:left;
  display:block;width:100%}
.card .inner{display:block}
.cdz{display:block}
.back .in>span{display:block}
.card .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.15,.2,1);
  transform-style:preserve-3d}
.card[aria-pressed="true"] .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(16,32,48,.07)}
.face.back{transform:rotateY(180deg)}
.band{background:var(--cc);color:var(--bandink);padding:6px 11px;display:flex;justify-content:space-between;gap:8px;
  font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  flex:0 0 auto;align-items:center}
.band em{font-style:normal;opacity:.85;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:62%;text-align:right}
.face .in{padding:10px 11px 11px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cnm{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:600;line-height:1.06;text-transform:uppercase;
  letter-spacing:.008em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.csub{font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cmec{font-size:11.5px;line-height:1.45;color:var(--ink2);margin:7px 0 0;flex:0 0 auto;max-height:50px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cdz{margin-top:auto;padding-top:7px;border-top:1px dashed var(--line)}
.cdz b{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);display:block;margin-bottom:2px}
.cdz p{margin:0;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;line-height:1.4;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cft{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 11px;
  border-top:1px solid var(--line2);font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;flex:0 0 auto;color:var(--ink3)}
.back h5{margin:0 0 2px;font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3)}
.back .in p{margin:0 0 9px;font-size:12px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.back .al p{color:var(--no)}

/* resumo */
.read{max-width:none}
.read .ey{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 4px;display:flex;gap:7px;align-items:center}
.read .ey .dot{width:8px;height:8px;border-radius:2px}
.read h2{font-family:"IBM Plex Serif",Georgia,serif;font-size:27px;font-weight:600;line-height:1.16;margin:0 0 20px;
  letter-spacing:-.012em;text-wrap:balance}
.xs{margin-bottom:26px;scroll-margin-top:10px}
.spblock.sep{margin-top:46px;padding-top:30px;border-top:2px solid var(--line)}
.xs h3{font-family:"IBM Plex Serif",Georgia,serif;font-size:19px;font-weight:600;margin:0 0 10px;line-height:1.3;
  letter-spacing:-.006em;text-wrap:balance}
.xs p{font-family:"IBM Plex Serif",Georgia,serif;font-size:16.5px;line-height:1.72;margin:0 0 13px;color:var(--ink)}
.xs p b{font-weight:600}
.kbox{border-left:3px solid var(--trap);background:var(--trapbg);border-radius:0 6px 6px 0;padding:11px 14px;
  margin:16px 0 18px}
.kbox b{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--trap);margin-bottom:4px}
.kbox p{margin:0;font-size:13.5px;line-height:1.6;color:var(--trap)}
.nsec{margin-bottom:24px;scroll-margin-top:10px;max-width:70ch}
.nsec h3{font-size:16.5px;font-weight:600;margin:0 0 8px;line-height:1.3}
.nsec p{margin:0 0 9px;font-size:14px;line-height:1.66}
.nsec ul{margin:0 0 6px;padding-left:19px}
.nsec li{margin-bottom:6px;font-size:13.5px;line-height:1.6}

/* questões */
.q{border:1px solid var(--line);border-radius:8px;padding:14px 15px;margin-bottom:11px;max-width:80ch}
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.selo{padding:2px 6px;border-radius:3px;font-weight:600;letter-spacing:.09em;color:#fff}
.selo.OF{background:#1f6b4a}.selo.IN{background:#5b6875}.selo.AU{background:#8a5a12}.selo.VE{background:#6d3fb5}
.qt{font-weight:600;color:var(--ink);letter-spacing:.06em}
.q .en{margin:0 0 10px;font-size:14px;line-height:1.6}
.q ol.it{margin:0 0 11px;padding-left:12px;list-style:none;border-left:2px solid var(--line)}
.q ol.it li{font-size:13px;line-height:1.55;margin-bottom:6px;color:var(--ink2)}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:8px 11px;margin-bottom:5px;cursor:pointer;font-size:13.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
.opt.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.q .fb{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--ink2)}
.q .fb b{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:4px;color:var(--ink)}

/* contexto */
.ctx{background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:14px 14px 26px;
  min-width:0;min-height:0}
.cl{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 9px}
.cnow{font-size:13px;font-weight:600;line-height:1.35;margin:0 0 13px;padding-bottom:11px;
  border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.cnow .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;margin-top:4px}
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 12px;margin-bottom:10px}
.cbox h4{margin:0 0 9px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.cbox h4 em{font-style:normal;color:var(--acc);font-weight:600}
.mini{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;padding:7px 0;border:0;
  border-bottom:1px dotted var(--line);width:100%;text-align:left;cursor:pointer;background:none}
.mini:last-of-type{border-bottom:0}
.mini:hover .mn{color:var(--acc)}
.mini .dot{width:8px;height:8px;border-radius:2px;margin-top:4px}
.mini .mn{font-size:12.5px;font-weight:600;line-height:1.3}
.mini .md{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink2);line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rank{display:grid;grid-template-columns:minmax(0,1fr) 58px 20px;gap:9px;align-items:center;padding:6px 0;
  border-bottom:1px dotted var(--line);font-size:12px;width:100%;background:none;border-left:0;border-right:0;
  border-top:0;text-align:left;cursor:pointer}
.rank:last-of-type{border-bottom:0}
.rank:hover .rt{color:var(--acc)}
.rt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.track{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.track.err i{background:var(--no)}

/* versão compacta — folha de consulta */
.czwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:0 26px;align-items:start}
.czgrp{grid-column:1/-1;break-inside:avoid;break-after:avoid;font-family:"IBM Plex Mono",monospace;font-size:9px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--bandink);background:var(--cc);
  border-radius:4px;padding:4px 9px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.czgrp:not(:first-child){margin-top:16px}

  border-left:2px solid var(--cc);padding-left:9px;margin-bottom:2px}

  vertical-align:1px}
.cz .tag.y{color:var(--ok)}.cz .tag.n{color:var(--no)}.cz .tag.u{color:var(--ink3)}
.cz .tag.q{color:var(--acc)}
@media print{
  .czwrap{display:block;columns:2;column-gap:20px}
  .czgrp{break-inside:avoid}
  .top,.rail,.ctx,.modes,.tools{display:none!important}
  .app,.grid,.center,.pane{display:block!important;height:auto!important;overflow:visible!important}
  body{background:#fff}
  .czwrap{columns:2}
  .cz{break-inside:avoid}
}

ronismo 2º), melanose colônica, degeneração neural, cólon preguiçoso, dependência; esteatorreia, hipoalbuminemia, osteomalácia","sus":"—"},{"n":"Ácido ursodesoxicólico (UDCA, Ursacol® 50/150/300 mg)","cls":"","spk":"SP3","spn":"Antieméticos / Hepato","mec":"ácido biliar natural (<5% do pool) → ↓secreção hepática e ↓absorção intestinal de colesterol, dissolve cálculo de colesterol, ↑secreção/fluxo biliar, estabiliza membrana canalicular, ⊣ destruição imune do hepatócito. Absorvido → conjugado com glicina/taurina → bile → recirculação êntero-hepática; t…","dose":"5–10 mg/kg/dia (300–600 mg/dia = 2–4 cp de 150 ou 300 mg 2×/dia); cálculo: 10 mg/kg/dia por 12–24 meses (dissolve até 50% dos cálculos pequenos em quem não pode operar)","usar":"colangites / doenças colestáticas (T11 Q14). Na aula ela focou o cálculo: \"é o excesso de colesterol com cálcio que precipita e forma o cálculo\"; indica para cálculos iniciais no US e principalmente para quem não pode…","cui":"diarreia ou constipação, náusea, vômito, dor abdominal, cefaleia, prurido, ↑transaminases. Não é 1ª linha para cálculo (cirurgia)","sus":"—"},{"n":"Silimarina (cardo mariano, Silybum marianum; Silimalon® 70 mg + racemetionina 100 mg)","cls":"","spk":"SP3","spn":"Antieméticos / Hepato","mec":"mistura de flavonolignanos (silibina, silicristina, silidianina): ↓lesão por toxinas, ↓peroxidação lipídica, depura radicais livres, ↑glutationa e SOD, anti-inflamatório (⊣ NF-κB ativado por TNF-α). \"Silimarina\" é o nome do conjunto de substâncias extraídas do cardo mariano — prescrever \"cardo ma…","dose":"280–420 mg/dia, 2 a 3 tomadas (slide: 3)","usar":"na aula: indicação exclusiva = esteatose hepática — \"vivemos quase uma epidemia em jovens, grau 1–2, por questões alimentares; não é só idoso ou alcoolista\" (a esteatose também pode ser pós-hepatite). Sempre com dieta…","cui":"diarreia, cefaleia, dermatológicas","sus":"—"},{"n":"Coleréticos/colagogos: alcachofra (cinarina), boldo (boldina)","cls":"","spk":"SP3","spn":"Antieméticos / Hepato","mec":"↑produção e secreção de sais biliares → digestão de gorduras","dose":"—","usar":"dispepsia por gordura","cui":"não é hepatoprotetor (distrator T9 Q4). Alcaloides amargos (característica organoléptica) que estimulam a produção e principalmente a secreção de sais biliares; \"difícil de ser prescrito, muito usado como automedicação\" — o \"comi algo gorduroso e estou enjo…","sus":"—"},{"n":"Pancreatina / pancrelipase (Creon®, Pankreoflat® = + simeticona, Proteobil®)","cls":"","spk":"SP3","spn":"Antieméticos / Hepato","mec":"amilase + lipase + proteases em cápsula/drágea entérica; dose em UI/USP de lipase (10.000–25.000 UI/cáps)","dose":"iniciar 3 drágeas/refeição → 1–2; ou 20–30.000 UI (60–90.000 USP) de lipase por refeição; individualizar por peso/gordura da dieta","usar":"insuficiência pancreática exócrina (fibrose cística, pancreatite crônica, ressecção); gases + má digestão (PM 2024). O cenário que ela descreveu: paciente se recuperando de pancreatite aguda por obstrução do cálculo —…","cui":"dose alta: hiperuricemia/hiperuricosúria (purinas → cálculo renal), náusea, diarreia; crônico: ↓ácido fólico. \"Só um detalhe, que eu sei que vai ser cobrado\": a dose não é em miligramas — é em UNIDADES (UI / unidades USP), é outra forma de fazer o cálculo […","sus":"—"},{"n":"Omeprazol (IBP)","cls":"","spk":"SP4","spn":"Dispepsia","mec":"pró-fármaco; cápsula entérica (degrada/ioniza no ácido) → absorve → célula parietal → nos canalículos (H⁺ alto) protona → sulfenamida tetracíclica → ligação covalente irreversível à H⁺/K⁺-ATPase → ↓80–95% independente do estímulo. t½ ~1 h, efeito 2–3 dias","dose":"20–40 mg 1×/dia, 30–60 min antes da refeição (jejum = mais H⁺ nos canalículos = bioativação); \"único supressor da atenção básica (10 e 20 mg)\"; máx ~6 meses","usar":"úlcera, DRGE erosiva/sintomática (1ª linha — T5 QD1), H. pylori (com ATB), profilaxia de úlcera por AINE; hospital IV","cui":"crônico: ↓Ca→PTH→osteoporose · ↓Mg→mialgia (já agudo) · ↓Fe · ↓B12 (↓secreção de fator intrínseco; absorção no íleo) · ↓pepsina (pH<4)→↓triptofano (ansiedade/insônia) · infecções (perde HCl antimicrobiano) · hipergastrinemia → rebote/tumores · CYP2C19 (clopid…","sus":"sim"},{"n":"Esomeprazol","cls":"","spk":"SP4","spn":"Dispepsia","mec":"enantiômero S puro (o mais ativo) → dose menor","dose":"10–40 mg","usar":"= omeprazol","cui":"\"pantoprazol é o mais potente\" = F (T7 QD2, T11 Q3)","sus":"não"},{"n":"Pantoprazol","cls":"","spk":"SP4","spn":"Dispepsia","mec":"IBP com menor interação CYP","dose":"40 mg","usar":"paciente com clopidogrel/polifarmácia","cui":"—","sus":"não"},{"n":"Vonoprazana (PCAB)","cls":"","spk":"SP4","spn":"Dispepsia","mec":"bloqueia a bomba reversivelmente competindo com K⁺; sem bioativação; qualquer horário","dose":"10–20 mg; ≤8 semanas","usar":"úlcera (por AINE), esofagite, H. pylori refratário","cui":"caro; muitas interações CYP; não estimula muco/bicarbonato (T6 Q14-IV F)","sus":"não"},{"n":"Famotidina (anti-H2)","cls":"","spk":"SP4","spn":"Dispepsia","mec":"antagonista competitivo H2 (histamina) na célula parietal → ↓AMPc → ↓secreção basal/noturna >50%","dose":"20 mg à noite (não 10); 20–40 mg","usar":"uso crônico / dispepsia funcional / pirose matutina (T6 QD4, PM Q9); poupa CYP","cui":"não cicatriza úlcera (só 50%); \"ativada pela gastrina\" = F; cimetidina = ginecomastia/CYP","sus":"não"},{"n":"Hidróxido de magnésio","cls":"","spk":"SP4","spn":"Dispepsia","mec":"","dose":"","usar":"","cui":"diarreia","sus":"—"},{"n":"Hidróxido de alumínio","cls":"","spk":"SP4","spn":"Dispepsia","mec":"","dose":"","usar":"","cui":"constipação (T6 Q10); por isso vêm associados","sus":"—"},{"n":"Carbonato de cálcio","cls":"","spk":"SP4","spn":"Dispepsia","mec":"","dose":"","usar":"","cui":"eructação + rebote via células G/gastrina (T11 Q4)","sus":"—"},{"n":"Bicarbonato de sódio","cls":"","spk":"SP4","spn":"Dispepsia","mec":"","dose":"","usar":"","cui":"eructação; alcalose; CI hipertenso/IR (Na⁺) (T5 QD6); rebote por ↑pH rápido (T11 Q5)","sus":"—"},{"n":"Sucralfato","cls":"","spk":"SP4","spn":"Dispepsia","mec":"","dose":"","usar":"","cui":"gastroprotetor ambulatorial associado ao IBP (T7 Q9, T9 Q3); \"hidróxido de cálcio\"/\"neutraliza\"/\"rápida\" = F","sus":"—"},{"n":"Misoprostol","cls":"","spk":"SP4","spn":"Dispepsia","mec":"","dose":"","usar":"","cui":"hospitalar/off-label para úlcera por AINE; abortivo; diarreia/cólica; não existe IV (T11 Q11)","sus":"—"},{"n":"Bismuto","cls":"","spk":"SP4","spn":"Dispepsia","mec":"","dose":"","usar":"","cui":"H. pylori refratário; fezes/língua pretas","sus":"—"},{"n":"Espinheira-santa (chá das folhas) / couve","cls":"","spk":"SP4","spn":"Dispepsia","mec":"","dose":"","usar":"","cui":"gastrite leve/dispepsia; não úlcera nem H. pylori (T7 Q15-I)","sus":"—"}],"qs":[{"id":"T4-Q1","sp":"SP1","prova":"T4 (out/2022) Q1","selo":"OF","tipo":"asserção-razão","tema":"Loperamida","enun":"Sobre a loperamida, avalie as asserções abaixo e a relação proposta entre elas.","itens":["I. A loperamida é um agente antidiarreico usado em casos de distúrbios de motilidade intestinal, cuja dose inicial varia de 2 a 4 mg e sua ação inicia rapidamente, atingindo níveis plasmáticos máximos entre 3 a 5 h após administração oral","PORQUE","II. A loperamida atua bloqueando receptores opiáceos o que promove a redução da motilidade intestinal (receptores µ-2) e da secreção intestinal (receptores δ e µ-2)."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":2,"why":"Loperamida é AGONISTA (não 'bloqueia') de receptores opioides μ2 (motilidade) e δ (secreção). Dose 4 mg → 2 mg/evacuação, máx 16 mg; pico 3–5 h; não cruza BHE. O veterano marcou B e a professora corrigiu para C — a palavra 'bloqueando' é a pegadinha."},{"id":"T4-Q2","sp":"SP1","prova":"T4 (out/2022) Q2","selo":"OF","tipo":"sentenças","tema":"Antidiarreicos","enun":"Sobre os agentes antidiarreicos avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. Fármacos como alosetrona podem ser usados por pacientes com diarreia hipersecretora porque ao bloquearem receptores 5HT3 reduzem a motilidade e aumentam a atividade vagal.","II. A racecadotrila pode ser usada por adultos e crianças, preferencialmente associada com a TRO. Inibe as encefalinases e reduz a hipersecreção intestinal de água e eletrólitos causada por toxinas ou inflamações.","III. A colestiramina é comercializada na forma farmacêutica de pó na concentração de 4,0 g, sendo útil no tratamento da diarreia provocada pelos sais biliares, pois adsorve e combina-se aos ácidos biliares do intestino, formando um complexo insolúvel que é excretado nas fezes.","IV. A policarbofila cálcica pode ser empregada em casos de diarreia osmótica, uma vez que a policarbofila consegue absorver pelo menos 60 vezes do seu peso em água, formando um gel, permitindo assim a formação de fezes na consistência padrão."],"opts":["I, II, III e IV","I e III","II e IV","III e IV","II, III e IV"],"ans":4,"why":"I é falsa por dois motivos: alosetrona é para diarreia da SII (não 'hipersecretora') e o bloqueio 5-HT3 DIMINUI a resposta vagal. II, III e IV batem com os slides (racecadotrila inibe encefalinASES; colestiramina 4 g; policarbofila 60×)."},{"id":"T4-Q3","sp":"SP1","prova":"T4 (out/2022) Q3","selo":"OF","tipo":"asserção-razão","tema":"TRO","enun":"Sobre a terapia de reidratação oral (TRO) analise as afirmativas abaixo e a relação entre elas.","itens":["I. Os sais de reidratação oral (SRO) com baixa osmolaridade são preparados com menores concentrações de sódio e glicose, e visam causar menos náuseas, além de apresentarem baixo risco de causar hipernatremia","PORQUE","II. O uso de sais de reidratação oral é a melhor opção custo-benefício para evitar desidratação em casos de diarreia e vômito, cuja composição consiste na mistura de sódio, potássio, cloreto, citrato e glicose."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":1,"why":"Duas verdades que não se justificam: custo-efetividade e composição (Na, K, Cl, citrato, glicose) não explicam por que a baixa osmolaridade causa menos náusea/hipernatremia. Clássico dela."},{"id":"T4-Q4","sp":"SP1","prova":"T4 (out/2022) Q4","selo":"OF","tipo":"sentenças","tema":"Probióticos/prebióticos","enun":"Sobre probióticos e prebióticos avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. Fibras solúveis digeríveis, como aveia e celulose, retêm água no intestino, e ao serem fermentadas atuam como agentes tróficos para o intestino grosso.","II. As fibras insolúveis são úteis no tratamento da constipação porque dão volume ao bolo fecal, e aumentam a velocidade de trânsito intestinal.","III. As formulações contendo os prebióticos Plantago ovata ou Plantago psyllium são usadas no tratamento da constipação primária associadas a ingesta adequada de água.","IV. Os probióticos são comercializados de forma isolada ou associados, sendo as formulações compostas principalmente por espécies de Lactobacillus, Bifidobacterium e Saccharomyces.","V. Os probióticos podem ser empregados em casos de diarreia ou constipação, porém, somente serão efetivos se ingeridos com fibras solúveis e água, esta última, no caso da constipação."],"opts":["I, II, III, IV e V","II, III, IV e V","I, II e V","I, II, IV e V","III e IV"],"ans":1,"why":"I é falsa: fibras solúveis são NÃO digeríveis e celulose é INsolúvel (não fermenta). O veterano marcou A (tudo) e a professora corrigiu para B. Regra: probiótico + fibra SOLÚVEL (+ água na constipação)."},{"id":"T4-Q5","sp":"SP1","prova":"T4 (out/2022) Q5","selo":"OF","tipo":"sentenças","tema":"5-ASA","enun":"Sobre o tratamento da doença inflamatória intestinal com aminossalicilatos (5-ASA), analise as sentenças abaixo e assinale a alternativa correta.","itens":["I. O fármaco sulfassalazina sofre ação das azoredutases da microbiota intestinal liberando as moléculas mesalazina e sulfapiridina no cólon intestinal, cuja ação farmacológica será decorrente da atividade anti-inflamatória e antimicrobiana, respectivamente.","II. Os aminossalicilatos são efetivos em reduzir a inflamação intestinal, mas dependem de concentrações elevadas no local da doença ativa para a ação biológica, por isso, há a necessidade de formulações que garantam baixa absorção no duodeno.","III. Os efeitos adversos dos 5-ASA estão relacionados com a dose e consistem em náuseas, desconforto gastrintestinal, cefaleias, artralgias, mialgia, entre outros. Eles são contraindicados para pacientes com história de alergia grave ao ácido acetilsalicílico.","IV. O fármaco olsalazina é um pró-fármaco que após sofrer hidrólise mediada pelas azoredutases da microbiota intestinal gera 2 moléculas de mesalazina, as quais inibem as COXs e reduzem a ação de várias citocinas."],"opts":["I, II, III e IV","I, III e IV","III e IV","II e III","I e II"],"ans":0,"why":"Tudo verdadeiro — a questão-modelo do 5-ASA: sulfassalazina = mesalazina (anti-inflamatória) + sulfapiridina (antimicrobiana); ação depende de concentração local (por isso formulações de baixa absorção); CI alergia a salicilato; olsalazina = 2 mesalazinas via azorredutase."},{"id":"T5-Q6","sp":"SP1","prova":"T5 (abr/2023) Q6","selo":"OF","tipo":"asserção-razão","tema":"TRO","enun":"A terapia de reidratação oral (TRO) consiste na administração de soluções apropriadas para evitar ou corrigir a desidratação produzida pela diarreia. Sobre o tema analise a relação entre as sentenças.","itens":["I. Os sais de reidratação oral (SRO) usados na TRO contêm quantidades específicas de sacarose, sódio, magnésio e potássio","PORQUE","II. Estes sais devem ter baixa osmolaridade para reduzir os vômitos e diminuir as evacuações, mas podem causar hiponatremia e hipoglicemia."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":4,"why":"I falsa: SRO = Na, K, Cl, citrato e GLICOSE (não sacarose, não magnésio). II falsa: a vantagem da baixa osmolaridade é MENOR risco de HIPERnatremia; não causa hiponatremia/hipoglicemia (a solução tem glicose)."},{"id":"T5-Q11","sp":"SP1","prova":"T5 (abr/2023) Q11","selo":"OF","tipo":"sentenças","tema":"5-ASA","enun":"Sobre o tratamento da doença inflamatória intestinal, analise as sentenças abaixo e assinale a alternativa correta.","itens":["I. Sulfassalazina é hidrolisada pela microbiota intestinal em mesalazina e sulfapiridina, ambas moléculas com ação anti-inflamatória.","II. Olsalazina é um pró-fármaco que após hidrólise pelas enzimas da microbiota intestinal gera 2 moléculas de mesalazina, as quais inibem as COXs e reduzem a ação de várias citocinas.","III. Cápsulas revestidas para liberação entérica de mesalazina garantem que o fármaco possa atuar localmente no intestino grosso devido à baixa absorção de fármacos nessa região do intestino.","IV. Os aminossalicilatos (5-ASA) são contraindicados para pacientes com história de alergia grave ao ácido salicílico, mesmo que a absorção dos 5-ASA seja mínima."],"opts":["I e III","I e II","III e IV","II e IV","II, III e IV"],"ans":3,"why":"I falsa: sulfapiridina é ANTIMICROBIANA, não anti-inflamatória. III foi considerada falsa pelo gabarito (D = II e IV): a liberação entérica pH-dependente existe para evitar a absorção RÁPIDA no intestino delgado proximal — no cólon a absorção é lenta, não 'baixa absorção de fármacos nessa região' como justificativa. Atenção: na T7 Q7 um item parecido (com complemento sobre concentração local) foi aceito como verdadeiro."},{"id":"T6-Q2","sp":"SP1","prova":"T6 (out/2023) Q2","selo":"OF","tipo":"sentenças","tema":"Diarreia","enun":"Sobre o tratamento da diarreia avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. O carvão ativado, na dose de 250 mg administrado via oral é indicado para tratar quadros de diarreia desencadeados por toxinas presentes na luz do intestino. Atua como agente adsorvente.","II. A colestiramina é útil no tratamento da diarreia provocada pelos sais biliares, administrada até 4 x dia, mas não deve ser usada cronicamente porque pode causar hipovitaminose.","III. As encefalinas atuam como agonistas de receptores opiáceos, reduzindo a atividade secretora das células intestinais e a motilidade. A racecadotrila aumenta a meia-vida das encefalinas e por isso é empregada para tratar quadros de diarreia na dose de 100 mg até 3 x ao dia.","IV. A loperamida é usada em dose inicial de dois comprimidos de 2 mg e atua como agonista de receptores opiáceos presentes no intestino, promovendo a inibição da motilidade intestinal.","V. A loperamida é indicada para quadros agudos de diarreia, desde que não infecciosa, e também, como coadjuvante no tratamento de quase todos os tipos de doença diarreica crônica."],"opts":["I, II, III, IV e V","I, II e V","II, III e IV","I, III e IV","I e V"],"ans":0,"why":"Todas verdadeiras. Repare que aqui a versão CORRETA de cada frase da Atividade B reaparece: encefalinas (não encefalinases), racecadotrila 100 mg 3×, loperamida 2 cp de 2 mg = 4 mg, 'desde que não infecciosa'."},{"id":"T6-Q5","sp":"SP1","prova":"T6 (out/2023) Q5","selo":"OF","tipo":"asserção-razão","tema":"Policarbofila","enun":"Sobre a policarbofila avalie as sentenças abaixo e a relação proposta entre elas.","itens":["I. A policarbofila cálcica atua como agente absorvente de água, dando consistência ao bolo fecal, podendo ser empregada no tratamento da diarreia ou constipação. Em casos de constipação, há necessidade de ingesta aumentada de água","PORQUE","II. A policarbofila é uma fibra sintética, atua como laxante osmótico atraindo moléculas de água para o intestino, e a água livre no intestino provoca a purgação."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":2,"why":"Policarbofila = FORMADOR DE MASSA (retém/adsorve água que já está no lúmen — 60–100× o peso), não osmótico (osmótico ATRAI água). Na diarreia usa-se sem água extra; na constipação, com muita água."},{"id":"T6-Q15","sp":"SP1","prova":"T6 (out/2023) Q15","selo":"IN","tipo":"sentenças","tema":"5-ASA","enun":"Sobre a terapêutica com os aminossalicilatos avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. Os aminossalicilatos constituem a primeira linha de tratamento para quadros inflamatórios no intestino, cujas formulações visam uma ação localizada, com poucos efeitos sistêmicos, mas são contraindicados para pessoas com história de alergia ao ácido salicílico.","II. A sulfassalazina comercializada em cápsulas de liberação entérica pH-dependente visa ação antimicrobiana e anti-inflamatória localizada, pois ao sofrer azorredução pelas enzimas bacterianas origina duas moléculas ativas: mesalazina e sulfapiridina.","III. Os aminossalicilatos atuam inibindo as COXs e a fosfolipase A2, reduzindo assim a secreção e atividade de várias citocinas inflamatórias, além de reduzir a atividade citotóxica de macrófagos e linfócitos.","IV. Os principais efeitos adversos dos aminossalicilatos devem-se aos efeitos sistêmicos das moléculas que após sofrerem azorredução são absorvidas, principalmente quando o intestino está com quadro inflamatório significativo.","V. A olsalazina é um pró-fármaco pouco absorvível, que após sofrer hidrólise pela ação das azorredutases bacterianas gera duas moléculas de mesalazina, as quais exercem ação anti-inflamatória."],"opts":["I, II, III e IV","II e III","I, II, IV e V","I, II e IV","I, II, III e V"],"ans":2,"why":"INFERIDO (quadro do veterano com duas letras C/E). III é falsa: 5-ASA inibe COX e NF-κB — não fosfolipase A2 (isso é corticoide/lipocortina, UC13). O veterano marcou E e foi corrigido."},{"id":"T7-Q7","sp":"SP1","prova":"T7 (abr/2024) Q7","selo":"OF","tipo":"sentenças","tema":"5-ASA","enun":"Sobre o tratamento da doença inflamatória intestinal e o tratamento com aminossalicilatos (5-ASA), analise as sentenças abaixo e assinale a alternativa correta.","itens":["I. As enzimas da microbiota intestinal promovem a reação de azoredução da sulfassalazina e liberam duas moléculas ativas: mesalazina (anti-inflamatória) e sulfapiridina (antimicrobiana). Os efeitos adversos são decorrentes principalmente da ação sistêmica dessas substâncias, ainda que a absorção seja baixa.","II. Olsalazina é um pró-fármaco e após sofrer azoredução pelas enzimas da microbiota intestinal gera 2 moléculas de ácido 5-aminossalicílico, as quais inibem as COXs e a atividade do fator nuclear κB (NF-κB), um importante fator de transcrição das citocinas pró-inflamatórias.","III. Cápsulas revestidas para liberação entérica de mesalazina garantem que o fármaco possa atuar localmente no intestino grosso devido à baixa absorção de fármacos nessa região do intestino, no entanto, a eficácia da terapia com 5-ASA depende da obtenção de concentrações elevadas do fármaco no local da doença ativa.","IV. Os aminossalicilatos são contraindicados para pacientes com história de alergia grave ao ácido salicílico. Os efeitos adversos mais comuns estão relacionados com a dose administrada e a concentração plasmática alcançada e consistem em náuseas, pirose, desconforto gastrintestinal, cefaleia."],"opts":["I e III","I e II","II e IV","I, II, III e IV","II, III e IV"],"ans":3,"why":"Todas verdadeiras — e é a versão 'completa' dos itens que na T5 apareceram truncados. Decore o mecanismo em dupla: COX + NF-κB."},{"id":"T7-Q12","sp":"SP1","prova":"T7 (abr/2024) Q12","selo":"OF","tipo":"sentenças","tema":"Diarreia","enun":"Diarreia é caracterizada por movimentos intestinais aquosos frequentes, acompanhados ou não de cólicas. Sobre o tratamento da diarreia aguda e crônica, avalie as sentenças abaixo.","itens":["I. O carvão ativado pode ser empregado em casos de diarreia desencadeados pela presença de toxinas no lúmen intestinal, pois atua como um agente adsorvente. É contraindicado em casos de suspeita de complicações obstrutivas.","II. A colestiramina é empregada apenas em casos de diarreia causada pela presença excessiva de sais biliares no lúmen intestinal, administrada na dose de 4 g até 4 vezes/dia, por um período de dois a três meses, em função dos efeitos adversos, como hipovitaminoses.","III. Comprimidos de 30 mg de racecadotrila administrados de 12/12h podem ser empregados para o tratamento da diarreia aguda, pois reduzem a secreção intestinal de água e eletrólitos devido a inibição da atividade das encefalinas.","IV. A loperamida é indicada como coadjuvante no tratamento de quase todos os tipos de doença diarreica crônica, pois é muito eficaz em reduzir a motilidade intestinal e apresenta poucos efeitos adversos, mas tem contraindicação absoluta em casos de intoxicação ou infecção intestinal.","V. A loperamida é empregada na dose de 4 mg (dose de ataque) e atua como antagonista de receptores MOR, principalmente δ (delta) reduzindo a motilidade intestinal e em receptores μ2 (mu2) reduzindo a secreção intestinal."],"opts":["I, III e V","I, II e IV","I e IV","I, II, III e IV","II, IV e V"],"ans":1,"why":"III falsa (racecadotrila = 100 mg 8/8 h; sachê 10/30 mg é pediátrico; e inibe encefalinASES). V falsa (AGONISTA; μ2 = motilidade, δ = secreção — invertidos). Três pegadinhas numa questão."},{"id":"T9-Q1","sp":"SP1","prova":"T9 (abr/2025) Q1","selo":"OF","tipo":"sentenças","tema":"5-ASA","enun":"Sobre as formulações que contêm ácido 5-aminossalicílico (5-ASA) avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. Um dos mecanismos de ação do 5-ASA é o bloqueio da síntese de prostaglandinas pela inibição sistêmica da COX2 e redução de prostaglandinas e leucotrienos no duodeno e cólon.","II. O 5-ASA inibe a atividade do fator nuclear κB (NF-κB), um importante fator de transcrição das citocinas pró-inflamatórias, além de inibir as funções celulares das células NK, dos linfócitos da mucosa e dos macrófagos, podendo remover metabólitos reativos do oxigênio.","III. Formulações comerciais que acondicionam 5-ASA de várias maneiras propiciam a liberação do fármaco em diferentes segmentos do intestino delgado ou grosso, cuja liberação é pH dependente, a fim de reduzir a ação sistêmica do fármaco.","IV. A olsalazina apresenta estrutura azo, o que reduz sua absorção no duodeno; quando chega no íleo terminal e no cólon, as bactérias residentes clivam a ligação azo por meio de uma enzima azorredutase, liberando duas moléculas de 5-ASA.","V. Na sulfassalazina, o 5-ASA encontra-se ligado a uma molécula de sulfadiazina, que após sofrer azorredução, libera uma molécula com ação anti-inflamatória e uma com ação antimicrobiana. A sulfassalazina é pouco absorvível e é indicada para tratar doenças inflamatórias e infecções agudas no intestino grosso."],"opts":["I, II, III e IV","II, III e V","II, III e IV","I, III e IV","II e V"],"ans":2,"why":"I falsa: ação TÓPICA (não sistêmica), e o alvo é o cólon/íleo distal (não duodeno). V falsa: é sulfaPIRIDINA (não sulfadiazina) e a indicação é infecção LATENTE/crônica, não aguda (aguda = antibiótico)."},{"id":"T9-Q8","sp":"SP1","prova":"T9 (abr/2025) Q8","selo":"OF","tipo":"sentenças","tema":"Diarreia","enun":"Sobre o tratamento da diarreia, avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. A desidratação é a principal complicação da diarreia aguda, por isso, o tratamento consiste na reidratação e na reposição de perdas, preferencialmente feita por meio da TRO com o uso de soluções hipotônicas, as quais causam menos vômitos, menores perdas fecais, menor duração da doença e menor necessidade de hidratação venosa.","II. Em casos de diarreia aguda, em adultos ou crianças, a TRO deve sempre ser recomendada, preferencialmente associada a manutenção de uma alimentação adequada sem produtos lácteos e fibras solúveis, o uso de antissecretores como racecadotrila na dose de 10 mg 2x ao dia, e suplementação com zinco 100 mcg/dia, por sua ação moduladora do s…","III. A loperamida é um agonista de receptores opioides (μ2), presentes principalmente em nervos colinérgicos, cuja ativação da proteína Gi reduz liberação de acetilcolina e de segundos mensageiros (AMPc), o que resulta em aumento do tempo de trânsito colônico e absorção da água fecal. É administrada em doses de 2 mg, de 1 a 4 vezes ao di…","IV. A colestiramina pode diminuir a diarreia causada pelo excesso de ácidos biliares fecais. É administrada na dose de 4 g, em média de 1 a 3 vezes ao dia antes das refeições. As reações adversas incluem distensão, flatulência, constipação intestinal, hipovitaminose.","V. O bloqueio dos receptores 5-HT3 nas terminações dos neurônios entéricos inibe a motilidade colônica, aumentando o tempo total de trânsito colônico, por isso fármacos, como a alosetrona, podem ser empregados para o tratamento de pacientes com SII grave que apresentam diarreia."],"opts":["I, II, III, IV e V","II, III e V","I, III, IV e V","I, II e IV","I, IV e V"],"ans":2,"why":"Só II é falsa — e por 3 erros: dieta NÃO restringe lácteos (artigo Brandt 2015: restrições são prejudiciais), racecadotrila 100 mg 8/8 h (1,5 mg/kg 3×), zinco 20 mg/dia (não 100 mcg). A veterana marcou E (excluiu a loperamida) e errou: III é verdadeira."},{"id":"T9-Q9","sp":"SP1","prova":"T9 (abr/2025) Q9","selo":"OF","tipo":"asserção-razão","tema":"Probióticos","enun":"Sobre os probióticos e prebióticos avalie as asserções abaixo e a relação proposta entre elas.","itens":["I. A ação dos probióticos no tratamento da diarreia aguda se faz principalmente por meio do antagonismo e exclusão de patógenos, além da imunomodulação e efeitos tróficos que as bactérias exercem sobre o epitélio gastrintestinal, cujos pacientes tratados apresentam redução da duração de episódios diarreicos e internações.","PORQUE","II. Os probióticos mais empregados para o tratamento da diarreia consistem em preparações contendo Saccharomyces boulardii e Lactobacillus reuteri associados com frutooligossacarídeos (FOS), que atuam como substrato fermentável para os microrganismos."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":1,"why":"I é verdadeira (é o texto do artigo Brandt 2015 sobre mecanismo dos probióticos — a veterana marcou como falsa e errou). II verdadeira. Quais são os mais usados não justifica COMO agem → B."},{"id":"T9-Q10","sp":"SP1","prova":"T9 (abr/2025) Q10","selo":"OF","tipo":"direta","tema":"Racecadotrila","enun":"Atua como inibidor de encefalinases, enzimas responsáveis pela degradação das encefalinas produzidas pelo sistema nervoso entérico. As encefalinas com ação mais duradoura, em função da menor atividade das encefalinases, reduzem a secreção intestinal de água e eletrólitos que se encontra aumentada nos quadros de diarreia aguda. Esse mecanismo de ação se refere ao fármaco:","itens":[],"opts":["difenoxilato","racecadotrila","alosetrona","policarbofila","loperamida"],"ans":1,"why":"Texto do slide, verbatim. Racecadotrila (Tiorfan®) 100 mg 8/8 h, sachê 10/30 mg (1,5 mg/kg 3×), máx 400 mg/dia; não tem no SUS."},{"id":"T11-Q13","sp":"SP1","prova":"T11 (abr/2026) Q13","selo":"OF","tipo":"sentenças","tema":"Diarreia","enun":"Sobre o tratamento da diarreia avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. Para quase todos os casos de diarreia aguda em crianças acima de 6 meses é recomendado o uso de zinco na dose de 20 mg/dia, hidratação oral de baixa osmolaridade (cloreto de sódio e de potássio, glicose, citrato de sódio) e manejo da dieta.","II. A policarbofila cálcica pode ser usada no tratamento da diarreia aguda em adultos, pois atua adsorvendo a água fecal livre, formando um gel, permitindo assim a formação de fezes na consistência padrão.","III. Os prebióticos são empregados em casos de diarreia, principalmente induzida por antibióticos, porque inibem o crescimento de patógenos e promovem efeitos tróficos na mucosa intestinal.","IV. Os simbióticos são preparações que combinam diferentes probióticos associados com prebióticos. O principal prebiótico que compõe essas preparações são os frutooligossacarídeos."],"opts":["I, II, III e IV","I e II","I, II e IV","II e III","I, III e IV"],"ans":2,"why":"III troca PRE por PRO: quem inibe patógenos e tem efeito trófico são os PROBIÓTICOS (S. boulardii, L. GG) na diarreia pós-antibiótico; prebióticos são as fibras solúveis/FOS (substrato). Zinco 20 mg (>6 m) confirmado como verdadeiro."},{"id":"T4-Q10","sp":"SP2","prova":"T4 (out/2022) Q10","selo":"OF","tipo":"sentenças","tema":"Laxantes","enun":"Sobre os laxantes, avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. O bisacodil e derivados antracênicos promovem o completo esvaziamento do cólon após induzir um quadro inflamatório agudo na mucosa intestinal, o que aumenta o peristaltismo e causa a purgação.","II. O bisacodil estimula de forma irritativa os enterócitos e neurônios entéricos de modo a promover o acúmulo de água e eletrólitos e a contração do músculo liso, por isso observa-se cólica e risco de desidratação, principalmente em idosos.","III. Os laxantes osmóticos, como macrogol, são substâncias não absorvíveis que mantêm por osmose um volume aumentado de líquido na luz do intestino, amolecendo o bolo fecal e promovendo o peristaltismo com consequente purgação.","IV. A lactulose é um dissacarídeo não absorvível, fermentado pelas bactérias intestinais, cujos produtos formados têm ação osmótica e promovem a purgação, porém, pode causar flatulência e distensão abdominal por causa do processo de fermentação."],"opts":["I, II, III e IV","II, III e IV","I, III e IV","I e II","I e III"],"ans":0,"why":"Todas verdadeiras. Guarde as 4 frases: são o 'texto-base' que ela depois distorce (macrogol 'causa desidratação' — falso; antracênicos 'bloqueiam 5-HT3' — falso)."},{"id":"PM0524-Q5","sp":"SP2","prova":"PM 10/05/2024 Q5 (= T5 Q7 = AVA T11 Q5)","selo":"OF","tipo":"sentenças","tema":"Laxantes","enun":"Sobre os laxantes analise as sentenças abaixo e assinale a opção correta:","itens":["I. O bisacodil estimula terminações nervosas dos enterócitos, induz a um processo inflamatório que culmina em acúmulo de água e eletrólitos e estimula o peristaltismo intestinal.","II. O macrogol atua na luz do intestino retendo água e eletrólitos o que pode desencadear desidratação, e por isso não é recomendado para idosos e crianças.","III. Os derivados antracênicos presentes no sene e cáscara-sagrada causam a purgação ao bloquearem receptores 5HT3 e assim promovem o peristaltismo, mas também causam irritação da mucosa intestinal.","IV. A lactulose é empregada para tratar constipação secundária, porém deve ser iniciada com baixas doses a fim de evitar cólicas induzidas pela fermentação desse dissacarídeo pela microbiota intestinal.","V. Os prebióticos são indicados como monoterapia no tratamento da constipação secundária, mas devem ser associados ao consumo de aproximadamente 3 litros de água por dia, cujo trânsito intestinal normaliza após 2 a 3 dias."],"opts":["I e IV","I, III e V","I, IV e V","I, II e IV","II, III e IV"],"ans":0,"why":"A questão mais reciclada da UC (T5, PM 2024, AVA T11). II falsa: macrogol NÃO desidrata, é recomendado (inclusive gestante/criança). III falsa: antracênicos são irritantes (sem 5-HT3). V falsa: prebiótico é para constipação PRIMÁRIA e nunca 'monoterapia' (associar probiótico/água ~1,5–2 L)."},{"id":"T6-Q4","sp":"SP2","prova":"T6 (out/2023) Q4","selo":"OF","tipo":"direta","tema":"Antracênicos","enun":"O chá das folhas é utilizado para causar purgação, e se usado cronicamente pode causar melanose colônica e síndrome do cólon preguiçoso. Qual das plantas abaixo tem essa característica?","itens":[],"opts":["Cassia senna (sene)","Maytenus ilicifolia (espinheira-santa)","Rhamnus purshiana (cáscara-sagrada)","Plantago psyllium (psyllium)","Plantago indica (plantago)"],"ans":0,"why":"'Chá das FOLHAS' = sene. Cáscara-sagrada também é antracênica, mas usa-se a CASCA — o veterano marcou C e errou. Espinheira-santa = dispepsia; Plantago = formador de massa."},{"id":"T6-Q6","sp":"SP2","prova":"T6 (out/2023) Q6 · Ativ T6 Q3","selo":"OF","tipo":"caso","tema":"Constipação secundária","enun":"J. S., 32 anos, com diagnóstico de constipação secundária ao uso de antidepressivos deve iniciar tratamento com:","itens":[],"opts":["macrogol","policarbofila","bisacodil","colestiramina","sulfato de magnésio"],"ans":0,"why":", alts:["},{"id":"T6-Q7","sp":"SP2","prova":"T6 (out/2023) Q7","selo":"IN","tipo":"sentenças","tema":"Bisacodil","enun":"Sobre o bisacodil avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. O bisacodil irrita o intestino grosso e promove o esvaziamento de todo o cólon, o que desencadeia a síndrome do cólon preguiçoso.","II. O esvaziamento do ramo descendente do cólon é o efeito esperado do uso de bisacodil que pode causar dependência em doses elevadas, pois estimula receptores opiáceos, principalmente μ2.","III. O bisacodil pode desencadear se usado cronicamente síndrome má absortiva e interações medicamentosas por reduzir a absorção de substâncias no duodeno.","IV. O bisacodil deve ser administrado na menor dose eficaz e pelo menor tempo possível para evitar abuso, perdas significativas de água e eletrólitos e danos na mucosa intestinal.","V. O bisacodil induz inflamação no intestino grosso de modo a promover o acúmulo de água e eletrólitos na luz do intestino, além de estimular a motilidade intestinal."],"opts":["I, II, III e IV","I, III e V","I, III, IV e V","II, III e IV","IV e V"],"ans":4,"why":"INFERIDO (quadro E/C, veterano marcou C e foi corrigido). I falsa: o cólon preguiçoso vem da dessensibilização neural, não do esvaziamento (esse é o ciclo de DEPENDÊNCIA). II falsa: sem receptor opioide. III falsa: age no cólon, sem interação por absorção duodenal."},{"id":"T6-Q12","sp":"SP2","prova":"T6 (out/2023) Q12 · Ativ T6 Q2","selo":"OF","tipo":"asserção-razão","tema":"Fibras","enun":"Sobre probióticos e prebióticos analise a relação entre as asserções.","itens":["I. Fibras solúveis não digeríveis, como pectina, devem ser consumidas com muita água, porque elas retêm água no intestino e adsorvem água dando volume ao bolo fecal","PORQUE","II. As fibras solúveis são substratos para os microrganismos presentes no cólon intestinal, e ao serem fermentadas formam ácidos graxos de cadeias curtas, os quais são tróficos para o epitélio intestinal, além de propiciarem o aumento da massa bacteriana e consequentemente do bolo fecal."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":1,"why":"Ambas verdadeiras; fermentação/AGCC não explica por que precisa de água (isso é a hidrofilia). ⚠ Na atividade da T6 a versão 'diferentemente das fibras não fermentáveis…' foi corrigida para A — leia a asserção I com lupa."},{"id":"ATIVT6-Q1","sp":"SP2","prova":"Atividade UC14 (set/2023, T6) Q1","selo":"OF","tipo":"asserção-razão","tema":"Bisacodil","enun":"O bisacodil é um laxante muito empregado em formulações para emagrecimento, e o seu uso irracional pode desencadear vários problemas de saúde. Avalie as sentenças e a relação proposta entre elas.","itens":["I. O bisacodil, ao estimular cronicamente as terminações nervosas mioentéricas do intestino grosso, pode desencadear a síndrome do cólon preguiçoso","PORQUE","II. O bisacodil pode causar a dessensibilização ou até mesmo a degeneração das terminações nervosas mioentéricas."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":0,"why":"Aqui II justifica I (dessensibilização/degeneração É o mecanismo do cólon preguiçoso). Compare com a T6 Q12, onde duas verdades não se justificam."},{"id":"T7-Q4","sp":"SP2","prova":"T7 (abr/2024) Q4","selo":"OF","tipo":"direta","tema":"Gestante","enun":"Qual o laxante mais efetivo e mais seguro para gestantes com constipação?","itens":[],"opts":["lactulose","metilcelulose","macrogol","bisacodil","policarbofila"],"ans":2,"why":"Macrogol/PEG: osmótico inerte, não fermenta (sem cólica que 'imita contração'), não absorvido. Lactulose pode, mas fermenta; bisacodil irrita."},{"id":"T7-Q5","sp":"SP2","prova":"T7 (abr/2024) Q5","selo":"OF","tipo":"direta","tema":"Criança","enun":"Qual o laxante indicado para crianças com idade menor de 10 anos e que apresentem quadro de constipação primária ou secundária?","itens":[],"opts":["lactulose","metilcelulose","macrogol","bisacodil","policarbofila"],"ans":0,"why":"Lactulose: SUS, líquida (15–30 mL), serve para primária E secundária; PEG em criança precisa manipular (sachê é dose de adulto); formadores exigem água/hábito."},{"id":"T7-Q6","sp":"SP2","prova":"T7 (abr/2024) Q6","selo":"OF","tipo":"direta","tema":"Refratária","enun":"Qual o fármaco indicado para o tratamento dos sintomas da constipação intestinal crônica refratários ao tratamento com lactulose?","itens":[],"opts":["lubiprostona","metilcelulose","macrogol","bisacodil","prucaloprida"],"ans":4,"why":"Prucaloprida (agonista 5-HT4, 2 mg 1×/dia) = SÓ para falha de laxantes, nunca inicial; associar ao osmótico. Lubiprostona (ClC-2) fica para SII-C; macrogol é outro osmótico (mesma classe que falhou); bisacodil não se usa cronicamente."},{"id":"T7-Q11","sp":"SP2","prova":"T7 (abr/2024) Q11","selo":"OF","tipo":"asserção-razão","tema":"Formadores de massa","enun":"Sobre os laxantes, avalie as asserções abaixo e a relação proposta entre elas.","itens":["I. Os laxantes são fármacos que aumentam a frequência de defecação ou facilitam a passagem das fezes, por diferentes mecanismos, cuja indicação pode ser baseada no tipo de constipação. Pacientes com quadro de constipação primária são candidatos a fazerem uso de laxantes formadores de bolo fecal como metilcelulose ou psyllium","PORQUE","II. Os laxantes formadores de bolo fecal promovem retenção de água no lúmen intestinal, expandindo e amolecendo as fezes, além de favorecerem a proliferação de bactérias do cólon, o que aumenta ainda mais o volume fecal e consequentemente a estimulação de receptores da mucosa do cólon pelo aumento do volume fecal, promovendo peristaltism…"],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":0,"why":"Quadro da prova: A ✓ (o texto da transcrição dizia C — prevaleceu o quadro + gabarito da veterana). Os 3 mecanismos do slide (hidrofilia, proliferação bacteriana, distensão → peristaltismo) justificam a indicação na primária."},{"id":"T7-Q13","sp":"SP2","prova":"T7 (abr/2024) Q13","selo":"IN","tipo":"sentenças","tema":"Laxantes","enun":"Sobre os laxantes, avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. Pacientes que fazem uso de metilcelulose ou casca de psyllium devem ingerir líquidos a fim de lubrificar o cólon e minimizar o risco de obstrução. Estes medicamentos devem ser evitados se o cólon for atônico ou se houver impactação fecal.","II. Comprimidos de 1 g de policarbofila quando usados para tratar constipação, devem ser ingeridos com adequada ingesta de água, pois a policarbofila atua retendo a água livre dentro do lúmen intestinal, formando um gel, permitindo assim a formação de fezes. Efeitos adversos incluem tonturas, xerostomia, flatulência e cólicas abdominais.","III. A lactulose, disponível na atenção básica, é fermentada pelas bactérias do cólon intestinal formando os ácidos lático e acético, que atuam como importantes moléculas higroscópicas. É recomendado para tratar quadros de constipação primária e secundária em crianças, gestantes e idosos.","IV. Os principais efeitos adversos dos laxantes osmóticos incluem flatulência e cólicas abdominais, e o efeito laxativo ocorre em 2 a 4 horas após a administração. Esses laxantes osmóticos são indicados para constipação secundária ocasionada pelo baixo consumo de fibras e água.","V. O bisacodil atua por mecanismos diversos, incluindo a estimulação irritante dos plexos nervosos mioentéricos no intestino, aumentando a motilidade intestinal e a transferência de água e eletrólitos para o intestino grosso. Causam a purgação após 6 a 12 horas após administração via oral, na dependência da dose administrada e grau de to…"],"opts":["II, III e V","I, III e V","I, II, III e IV","III e IV","I e V"],"ans":1,"why":"INFERIDO (quadro B/C). II falsa: policarbofila = 500 mg, sem xerostomia. IV falsa: osmóticos agem em 24–48 h (não 2–4 h) e 'baixo consumo de fibras/água' é constipação PRIMÁRIA. Tempos: osmótico 24–48 h · formador ≥24 h · bisacodil VO 6–12 h · glicerina retal <1 h · prucaloprida ~2,5 h."},{"id":"T9-Q5","sp":"SP2","prova":"T9 (abr/2025) Q5","selo":"OF","tipo":"asserção-razão","tema":"Formadores de massa","enun":"Sobre os laxantes formadores de bolo fecal, avalie as asserções abaixo e a relação proposta entre elas.","itens":["I. Os laxativos formadores de massa, cujas preparações comuns incluem produtos vegetais naturais (psílio, metilcelulose) e fibras sintéticas (policarbofila), são coloides hidrofílicos não digeríveis que absorvem água, formando um gel emoliente e volumoso, que provoca a distensão do cólon e promove a peristalse, indicados para quadros de…","PORQUE","II. A fermentação das fibras geralmente reduz a quantidade de água das fezes, mas os ácidos graxos de cadeia curta podem exercer um efeito pró-cinético e o aumento da massa de bactérias contribui para a ampliação do volume fecal. Essa digestão bacteriana das fibras vegetais no interior do cólon pode resultar em aumento da distensão e fla…"],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":1,"why":"Ambas são texto do slide (verdadeiras), mas a fermentação não é a razão da indicação na primária (a razão é a hidrofilia/distensão) → B."},{"id":"T9-Q6","sp":"SP2","prova":"T9 (abr/2025) Q6","selo":"OF","tipo":"direta","tema":"Bisacodil","enun":"Atua estimulando diretamente o sistema nervoso entérico e a secreção colônica de eletrólitos e líquido, causando purgação, geralmente acompanhada de cólicas e diarreia. Esse mecanismo de ação refere-se ao fármaco:","itens":[],"opts":["prucaloprida","bisacodil","lactulose","policarbofila","loperamida"],"ans":1,"why":"Descrição de purgativo estimulante (Katzung). A veterana marcou A (prucaloprida = 5-HT4, sem 'secreção colônica/cólicas') e errou."},{"id":"T9-Q7","sp":"SP2","prova":"T9 (abr/2025) Q7","selo":"OF","tipo":"sentenças","tema":"Laxantes","enun":"Sobre os laxantes avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. Os laxativos osmóticos são compostos solúveis, porém não absorvíveis, que resultam em aumento da liquefação das fezes, devido ao aumento obrigatório da água fecal. Esses fármacos podem ser utilizados para o tratamento da constipação aguda ou para a prevenção da constipação crônica, de etiologia primária ou secundária.","II. Os fármacos osmoticamente ativos, quando administrados em altas doses, provocam a purgação dentro de 1 a 3 horas, devido ao rápido movimento de água na porção distal do intestino delgado e do cólon que resulta em um grande volume de fezes líquidas. São exemplos desses fármacos os sais de magnésio e fosfato ácido de sódio.","III. O sorbitol e o polietilenoglicol (PEG) são açúcares não absorvíveis que podem ser utilizados para a prevenção ou tratamento da constipação intestinal crônica, porém, são metabolizados por bactérias colônicas, produzindo intensa flatulência e cólicas, o que os torna contraindicados para uso em crianças e gestantes.","IV. A lubiprostona é indicada para pacientes com síndrome do intestino irritável (SII) com constipação predominante. A sua ação consiste em estimular o canal de cloreto tipo 2 no intestino delgado. Isso aumenta a secreção de líquido rico em cloreto no intestino, o que estimula a motilidade intestinal e diminui o tempo de trânsito intesti…","V. A prucaloprida é um agonista de receptores 5-HT4, cuja ativação aumenta o AMPc, o que facilita a liberação de alguns neurotransmissores, incluindo acetilcolina, desencadeando contrações de propagação (peristálticas) de alta amplitude. É usada para tratar constipação crônica na dose de 2 mg, 1 vez ao dia."],"opts":["I, II, III, IV e V","III, IV e V","I, II, IV e V","I, II e III","I, II e IV"],"ans":2,"why":"III falsa: PEG NÃO é metabolizado (inerte, não fermenta) e é o de ESCOLHA em gestante/criança. II é verdadeira (catárticos salinos em dose alta purgam em 1–3 h — preparo de cólon) e V verdadeira (prucaloprida 2 mg). A veterana riscou II e V e errou (marcou E)."},{"id":"T11-Q9","sp":"SP2","prova":"T11 (abr/2026) Q9","selo":"OF","tipo":"sentenças","tema":"Laxantes (Katzung)","enun":"Sobre os laxantes, avalie as sentenças abaixo e assinale a alternativa correta.","itens":[],"opts":["Os laxantes osmóticos incluem coloides hidrofílicos, como polietilenoglicol. Eles formam géis no intestino grosso, causando a retenção de água e a distensão intestinal, aumentando, assim, a atividade peristáltica.","A lactulose é um dissacarídeo semissintético que alcança o cólon, onde é degradado pelas bactérias em ácidos láctico e acético, os quais aumentam a pressão osmótica, causando acúmulo de líquidos que distende o cólon intestinal, a…","Os catárticos salinos, como hidróxido de magnésio e fosfato de sódio, são sais não absorvíveis que retêm água no intestino por ativação dos canais de cloreto. Isso distende o intestino, aumentando a atividade intestinal e produzi…","Os laxantes osmóticos atuam sobretudo pelo aumento da secreção de eletrólitos e, portanto, de água pela mucosa e pelo aumento do peristaltismo, possivelmente por meio de estimulação dos nervos entéricos."],"ans":1,"why":"Formato T11: 4 alternativas, cada uma um parágrafo do Katzung com UMA troca. A: PEG não é 'coloide hidrofílico que forma gel' (isso é formador de massa). C: sais não ativam canal de cloreto (isso é lubiprostona); retêm água por osmose. D: descreve estimulantes, não osmóticos. B = lactulose, correta."},{"id":"T11-Q10","sp":"SP2","prova":"T11 (abr/2026) Q10","selo":"OF","tipo":"direta","tema":"Prucaloprida","enun":"Qual o fármaco que atua como agonista específico de receptores 5-HT4 e qual a sua indicação clínica?","itens":[],"opts":["prucaloprida – tratamento da constipação crônica quando falha dos demais laxantes.","lubiprostona – tratamento da constipação crônica quando falha dos demais laxantes.","alosetrona – tratamento da diarreia crônica para pacientes com síndrome do intestino irritável.","prucaloprida – tratamento da constipação para pacientes com síndrome do intestino irritável."],"ans":0,"why":"Pegadinha dupla: D acerta o fármaco e erra a indicação (SII-C é lubiprostona/linaclotida); C descreve a alosetrona corretamente mas ela é antagonista 5-HT3 (pergunta pede 5-HT4)."},{"id":"T11-Q12","sp":"SP2","prova":"T11 (abr/2026) Q12","selo":"OF","tipo":"sentenças","tema":"Constipação","enun":"Sobre o tratamento da constipação, avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. Os enemas contendo fosfato de sódio são empregados como medida isolada ou como coadjuvante dos esquemas de preparação intestinal para esvaziar o cólon distal ou o reto do material sólido retido, cuja distensão intestinal estimula o reflexo da evacuação.","II. A glicerina deve ser usada apenas por via retal e é administrada em dose única diária, por meio de supositório retal ou enema (solução). A glicerina atua como um agente higroscópico e lubrificante quando é aplicada por via retal.","III. A prucaloprida possui atividades enterocinéticas, pois estimula os movimentos do intestino, ao ativar canais de cloreto acoplados aos receptores serotoninérgicos. Os efeitos adversos incluem náuseas, cefaleia, diarreia, reações alérgicas e dispneia.","IV. O bisacodil quando usado agudamente causa dor em cólica e diarreia aquosa, podendo levar a distúrbios hidroeletrolíticos, mas pode desencadear síndrome do cólon preguiçoso decorrente da degeneração neural do cólon quando usado cronicamente."],"opts":["I, II, III e IV","II e IV","I e IV","II e III","I, II e IV"],"ans":4,"why":"III mistura prucaloprida (5-HT4 → ACh) com lubiprostona (canal de cloreto). I, II e IV são frases dos slides 2026 quase literais."},{"id":"AVAT11-Q4","sp":"SP2","prova":"Atividade AVA T11 (2026) Q4","selo":"VE","tipo":"sentenças","tema":"Laxantes","enun":"Sobre os laxantes avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. A policarbofila cálcica é indicada para constipação secundária visto que adsorve muita água e promove a purgação.","II. A lactulose após fermentação pela microbiota intestinal tem ação catártica devido a grande quantidade de água que é movida para a luz intestinal.","III. O bisacodil produz significativa ação irritante na mucosa colônica, por isso seu uso deve ser evitado de forma crônica, visto que pode desencadear a síndrome do cólon preguiçoso."],"opts":["III","II","I, II e III","II e III","I e III"],"ans":3,"why":"Marcação da veterana (sem correção visível), coerente com tudo: policarbofila = PRIMÁRIA (I falsa)."},{"id":"T4-Q12","sp":"SP3","prova":"T4 (out/2022) Q12","selo":"IN","tipo":"asserção-razão","tema":"Síndrome extrapiramidal","enun":"A metoclopramida, principalmente quando administrada via intravenosa, pode desencadear a síndrome extrapiramidal. Sobre o tema, avalie as asserções abaixo e a relação proposta entre elas.","itens":["I. Na síndrome extrapiramidal há uma hiperestimulação colinérgica devido a desinibição dopaminérgica, na área nigroestriatal, hipofisária e mesolímbica, responsáveis pelos efeitos neuromusculares, endócrinos e psicológicos, como: galactorreia, agitação, sedação, espasmos, rigidez muscular","PORQUE","II. O tratamento da síndrome extrapiramidal consiste na administração de biperideno, que atua bloqueando de forma competitiva receptores de acetilcolina predominantemente no sistema nervoso central, promovendo o alívio dos sintomas rapidamente."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":3,"why":"INFERIDO (o veterano marcou B e levou X; gabarito de estudo diz D). I é falsa: a SEP é só a desinibição da fibra COLINÉRGICA na área NIGROESTRIATAL; galactorreia é outro sítio (adeno-hipófise) e não faz parte da SEP. II verdadeira: biperideno = antimuscarínico central."},{"id":"T4-Q13","sp":"SP3","prova":"T4 (out/2022) Q13","selo":"OF","tipo":"sentenças","tema":"Êmese","enun":"Sobre o tratamento medicamentoso da êmese avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. O dimenidrinato é o antiemético de escolha para tratar náuseas matinais em gestantes e em pacientes com distúrbios vestibulares, por antagonizar receptores histaminérgicos do tipo 1 e muscarínicos do tipo 1 e 3.","II. O dimenidrinato é usado via oral nas doses de 25 a 100 mg, e os principais efeitos adversos são decorrentes do mecanismo de ação do fármaco como: xerostomia, retenção urinária, constipação, sonolência, etc.","III. Ondansetrona inibe a sensação aferente visceral desagradável ao bloquear de forma competitiva receptores 5HT3 na zona quimiorreceptora e no centro do vômito, sendo indicado para diferentes quadros etiológicos de êmese, exceto os relacionados a distúrbios vestibulares.","IV. Aprepitant é o fármaco de escolha para pacientes com vômitos induzidos por agentes quimioterápicos com alto risco emetogênico, particularmente contra a fase tardia dos vômitos. Atua como antagonista seletivo dos receptores neurocininas (NK1)."],"opts":["I, II, III e IV","II, III e IV","I, II e IV","I e II","I e III"],"ans":0,"why":"Tudo verdadeiro — as 4 frases-modelo dos antieméticos: dimenidrinato (H1 + M1/M3; gestante e vestibular; 25–100 mg), ondansetrona (5-HT3; NÃO vestibular), aprepitanto (NK1; quimio, fase tardia)."},{"id":"T5-Q1","sp":"SP3","prova":"T5 (abr/2023) Q1 · PM 10/05/2024","selo":"OF","tipo":"direta","tema":"Dimenidrinato","enun":"Boca seca, retenção urinária, sonolência, são efeitos colaterais do uso de:","itens":[],"opts":["dimenidrinato","bromoprida","domperidona","omeprazol"],"ans":0,"why":"Perfil anticolinérgico (M1/M3) + sedação (H1 central) = dimenidrinato."},{"id":"T5-Q2","sp":"SP3","prova":"T5 (abr/2023) Q2 · AVA T11 Q3","selo":"OF","tipo":"lacunas","tema":"Síndrome extrapiramidal","enun":"A síndrome extrapiramidal é um efeito esperado do fármaco ______, justificada pelo bloqueio dos receptores ________, os quais são responsáveis pela ________. Assinale a alternativa que completa corretamente as lacunas.","itens":[],"opts":["bromoprida – dopaminérgicos – inibição da liberação de acetilcolina.","domperidona – dopaminérgicos – liberação de acetilcolina.","metoclopramida – dopaminérgicos – inibição da liberação de acetilcolina.","ondansetrona – serotoninérgicos – liberação de acetilcolina.","metoclopramida – dopaminérgicos – liberação de acetilcolina."],"ans":2,"why":"D2 na fibra colinérgica INIBE a liberação de ACh; bloquear D2 → desinibição → ↑ACh → SEP. Metoclopramida é o protótipo (bromoprida também causa, mas a alternativa A está com a letra 'correta' e a E com o mecanismo invertido). Na AVA T11 a mesma lacuna voltou (resposta: metoclopramida – dopaminérgicos – inibição da liberação de acetilcolina)."},{"id":"T5-Q3","sp":"SP3","prova":"T5 (abr/2023) Q3","selo":"OF","tipo":"direta","tema":"Domperidona","enun":"A domperidona é empregada para o tratamento da DRGE (doença do refluxo gastroesofágico) por quê:","itens":[],"o
