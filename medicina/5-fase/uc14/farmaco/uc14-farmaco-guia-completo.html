pts":["bloqueia receptores D2 no tronco encefálico promovendo o peristaltismo.","bloqueia receptores 5HT3 no trato digestivo reduzindo a pressão do esfíncter esofágico inferior e promove peristaltismo.","bloqueia receptores D2 no trato digestivo aumentando a pressão do esfíncter esofágico inferior e promove peristaltismo.","estimula receptores D2 no trato digestivo reduzindo a pressão do esfíncter esofágico inferior e promove peristaltismo."],"ans":2,"why":"Domperidona = antagonista D2 PERIFÉRICO (não cruza BHE): ↑pressão do EEI, ↑esvaziamento gástrico. Dopamina no TGI freia a motilidade."},{"id":"T5-Q4","sp":"SP3","prova":"T5 (abr/2023) Q4 · PM 10/05/2024 Q2 · A…","selo":"OF","tipo":"lacunas","tema":"Galactorreia","enun":"A galactorreia é um efeito adverso esperado pelo uso de ______ e justificado pela ______________. Assinale a alternativa que completa corretamente as lacunas.","itens":[],"opts":["domperidona – inibição de receptores D2 no hipotálamo.","bromoprida – inibição de receptores D2 na adenohipófise.","metoclopramida – estimulação de receptores D2 na adenohipófise.","dimenidrinato – inibição de receptores H1 no hipotálamo.","ondansetrona – inibição de receptores D2 na adenohipófise."],"ans":1,"why":"Dopamina inibe a prolactina na ADENO-HIPÓFISE; bloquear D2 ali → ↑prolactina → galactorreia/ginecomastia. Vale para bromoprida, metoclopramida e domperidona (a domperidona age na hipófise porque ela está fora da BHE). Na PM 2024 a versão correta era 'domperidona – inibição de D2 na adeno-hipófise' (A); na AVA T11, 'bromoprida – inibição de D2 na adeno-hipófise'. O erro é sempre 'hipotálamo' ou 'estimulação'."},{"id":"T5-Q5","sp":"SP3","prova":"T5 (abr/2023) Q5 · PM 10/05/2024 Q3","selo":"OF","tipo":"associação","tema":"Antieméticos","enun":"Assinale a alternativa que relaciona o número ao fármaco cuja descrição torne a sentença verdadeira. 1: mais efetivo para tratar vômitos induzidos por toxinas; 2: efetivo e seguro para tratar vômitos causados por toxinas; 3: pode induzir síndrome extrapiramidal; 4: primeira escolha para tratar náuseas matinais em gestantes.","itens":[],"opts":["1: bromoprida; 2: ondansetrona; 3: bromoprida; 4: ondansetrona","1: metoclopramida; 2: dimenidrinato; 3: metoclopramida; 4: dimenidrinato","1: bromoprida; 2: ondansetrona; 3: metoclopramida; 4: ondansetrona","1: ondansetrona; 2: bromoprida; 3: metoclopramida; 4: ondansetrona","1: bromoprida; 2: ondansetrona; 3: bromoprida; 4: dimenidrinato"],"ans":4,"why":"Mais EFETIVO contra toxina = antagonista D2 (bromoprida/metoclopramida: bloqueiam D2 + 5-HT3 + M); mais SEGURO = ondansetrona (só 5-HT3); SEP = bromoprida/metoclopramida; gestante = dimenidrinato. Questão idêntica na PM 2024."},{"id":"T6-Q1","sp":"SP3","prova":"T6 (out/2023) Q1","selo":"OF","tipo":"asserção-razão","tema":"Síndrome extrapiramidal","enun":"Sobre a síndrome extrapiramidal avalie as asserções abaixo e a relação proposta entre elas.","itens":["I. A metoclopramida ao inibir receptores dopaminérgicos presentes em fibras colinérgicas localizadas principalmente na área nigroestriatal do SNC, pode desencadear a síndrome extrapiramidal, principalmente quando administrado por via intravenosa, ainda que possa ocorrer também pelo uso oral do fármaco","PORQUE","II. A atividade motora é estimulada pelos neurotransmissores dopaminérgicos, e os fármacos antagonistas D2 como metoclopramida, reduzem a atividade da dopamina na área nigroestriatal, causando o bloqueio da resposta colinérgica e desencadeando os sintomas extrapiramidais, caracterizados principalmente por inquietação, agitação psicomotor…"],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":2,"why":"II inverte tudo: a dopamina é INIBITÓRIA sobre a fibra colinérgica; o antagonista D2 causa DESINIBIÇÃO (↑ACh), não 'bloqueio da resposta colinérgica'. Compare com T5 Q12 / PM Q7, onde a II está escrita certa ('excitatórios colinérgicos e inibitórios dopaminérgicos') e a resposta vira A."},{"id":"T5-Q12","sp":"SP3","prova":"T5 (abr/2023) Q12 · PM 10/05/2024 Q7","selo":"OF","tipo":"asserção-razão","tema":"Síndrome extrapiramidal","enun":"Sobre a síndrome extrapiramidal avalie as asserções abaixo e a relação proposta entre elas.","itens":["I. A inibição de receptores dopaminérgicos em fibras colinérgicas mediada pela metoclopramida é a principal causa da síndrome extrapiramidal observada nos pacientes após administração desse fármaco, principalmente quando administrado por via endovenosa, ainda que possa ocorrer também pelo uso oral do fármaco","PORQUE","II. A atividade motora é modulada pelos neurotransmissores excitatórios colinérgicos e inibitórios dopaminérgicos, e os fármacos antagonistas D2 como metoclopramida, reduzem a atividade inibitória da dopamina na área nigroestriatal, causando os sintomas extrapiramidais, caracterizados principalmente por inquietação, agitação psicomotora…"],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":0,"why":"Aqui a II está correta e explica a I → A. Mesma família da T6 Q1 (C) — a diferença é UMA frase: 'reduzem a atividade INIBITÓRIA da dopamina' (certo) × 'causando o BLOQUEIO da resposta colinérgica' (errado)."},{"id":"T6-Q3","sp":"SP3","prova":"T6 (out/2023) Q3","selo":"OF","tipo":"direta","tema":"Escopolamina","enun":"O principal efeito adverso é a xerostomia e o principal emprego terapêutico é como antiespasmódico. Qual o fármaco que apresenta estas características?","itens":[],"opts":["domperidona","dimenidrinato","metoclopramida","escopolamina","CBD/THC"],"ans":3,"why":"Escopolamina (hioscina) = antagonista muscarínico M3: antiespasmódico (Buscopan), cinetose; EA xerostomia, retenção, constipação. Dimenidrinato também dá xerostomia, mas seu uso principal é antiemético."},{"id":"T6-Q8","sp":"SP3","prova":"T6 (out/2023) Q8","selo":"OF","tipo":"sentenças","tema":"Êmese","enun":"Sobre o tratamento medicamentoso da êmese avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. Ondansetrona administrada via sublingual na dose de 4mg é uma opção para tratar quadros de vômitos cuja causa seja o efeito colateral de outros medicamentos ou intoxicação alimentar.","II. O dimenidrinato nas doses de 25 a 100 mg é indicado para tratar náuseas e vômitos relacionados a distúrbios vestibulares, cuja ação é decorrente da inibição de receptores H1 e M1,3.","III. A bromoprida atua como agonista de receptores dopaminérgicos e é empregada na dose de 50 mg para tratar quadros de vômitos agudos induzidos por intoxicações alimentares ou outras substâncias exógenas.","IV. A metoclopramida pode ser empregada como um agente pró-cinético porque facilita o esvaziamento do estômago e intestino, potencializando a ação da dopamina.","V. O aprepitanto é indicado somente para tratar quadros de vômitos em pacientes em uso de quimioterápicos e atua como antagonista seletivo dos receptores de neurocininas (NK1)."],"opts":["I, II e V","III e IV","I, II, III e V","I e V","I, III e IV"],"ans":0,"why":"III: bromoprida é ANTAGONISTA D2 e a dose é 10 mg (não 50). IV: metoclopramida BLOQUEIA a dopamina (não potencializa). Ondansetrona SL 4 mg, dimenidrinato 25–100 mg, aprepitanto NK1 só quimio = verdadeiros."},{"id":"T7-Q2","sp":"SP3","prova":"T7 (abr/2024) Q2","selo":"OF","tipo":"sentenças","tema":"Antieméticos","enun":"Sobre os fármacos empregados nos diferentes tipos de êmese, avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. A escopolamina tem indicação para êmese por cinetose, porém, sua maior indicação clínica é como antiespasmódico. Os principais efeitos adversos são: xerostomia, retenção urinária, constipação.","II. O fármaco nabilona atua como antagonista de receptores opioides CB1, e é indicado para tratar êmese induzida por quimioterápicos. As respostas observadas são: aumento do apetite e da secreção gástrica e diminuição da motilidade intestinal.","III. Os compostos bioativos do gengibre reduzem náuseas e vômitos porque estimulam as secreções orais e gástricas. O provável mecanismo de ação antiemético dos compostos ativos do gengibre é o bloqueio de receptores 5HT3 e NK1.","IV. A síndrome extrapiramidal é mais comum quando bromoprida ou metoclopramida são administradas via intravenosa, ainda que possa ocorrer pelo uso oral. Os pacientes com quadros de distonia ou sintomas parkinsonianos podem ser tratados com biperideno.","V. A ondansetrona é o antiemético mais efetivo para casos de êmese induzida por quimioterápicos e substâncias exógenas, pois inibe predominantemente receptores 5HT3, mas também atua sobre receptores muscarínicos e NK1."],"opts":["II, III, IV e V","I, III, IV e V","I, II, III e V","I, III e IV","I e IV"],"ans":3,"why":"II: nabilona é AGONISTA CB1 (canabinoide). V: ondansetrona só bloqueia 5-HT3 (sem ação muscarínica/NK1). Gengibre (III) e escopolamina (I) são frases da tabela dela."},{"id":"T7-Q3","sp":"SP3","prova":"T7 (abr/2024) Q3","selo":"OF","tipo":"sentenças","tema":"Antieméticos","enun":"Sobre os antieméticos avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. A eficácia dos agentes antieméticos varia de acordo com o fator desencadeante do vômito e consequentemente com o tipo de receptor estimulado, por exemplo, substância P liberada em processos dolorosos intensos, estimula receptores NK1 e causa vômitos.","II. A metoclopramida é considerada um ótimo antiemético porque bloqueia diferentes receptores, essencialmente D2, mas também M3 e 5HT3. Os efeitos adversos consistem em agitação, sonolência, boca seca, tontura e sintomas extrapiramidais leves ou graves.","III. O dimenidrinato causa sedação devido o bloqueio de receptores centrais do tipo H1, e causa xerostomia e retenção urinária em função do bloqueio de receptores periféricos muscarínicos M3.","IV. O dimenidrinato é indicado em doses que variam de 5 a 50 mg para tratar êmese induzida por cinetose e êmese gestacional. Em casos mais graves de êmese gestacional, pode ser empregada ondansetrona na dose de 40 mg, que pode ter como efeitos adversos comuns a xerostomia e constipação.","V. A metoclopramida é utilizada principalmente para reduzir os vômitos induzidos por procedimentos como radioterapia e cirurgias, além de vômitos induzidos por xenobióticos. Apresenta ação antiemética central e periférica ao bloquear predominantemente receptores D2."],"opts":["I, II, III, IV e V","I, III e V","I, II, III e V","II, III e V","I, IV e V"],"ans":2,"why":"IV tem 3 erros: dimenidrinato 25–100 mg (não 5–50), ondansetrona 4–8 mg (não 40) e ondansetrona não causa xerostomia (só 5-HT3)."},{"id":"T7-Q8","sp":"SP3","prova":"T7 (abr/2024) Q8","selo":"OF","tipo":"direta","tema":"Êmese por quimioterapia","enun":"Qual das associações medicamentosas citadas abaixo é mais indicada para paciente com êmese severa desencadeada pela quimioterapia antitumoral?","itens":[],"opts":["prednisolona + ondansetrona","dexametasona + ondansetrona","ondansetrona + metoclopramida","metoclopramida + dexametasona","aprepitant + metoclopramida"],"ans":1,"why":"Quimio grave: antagonista 5-HT3 + DEXAMETASONA (± aprepitanto na fase tardia). O veterano marcou E e errou: aprepitanto entra COM ondansetrona/dexa, não com metoclopramida."},{"id":"T7-Q10","sp":"SP3","prova":"T7 (abr/2024) Q10","selo":"OF","tipo":"direta","tema":"Pró-cinéticos","enun":"Qual antiemético citado abaixo promove esvaziamento do TGI?","itens":[],"opts":["domperidona","ondansetrona","dimenidrinato","bromoprida"],"ans":3,"why":"Pegadinha da lógica dela: domperidona é pró-cinética mas NÃO é considerada antiemética central (só periférica) → o 'antiemético que esvazia' é a bromoprida (D2 central + periférico). Ondansetrona e dimenidrinato REDUZEM peristaltismo."},{"id":"T7-Q14","sp":"SP3","prova":"T7 (abr/2024) Q14","selo":"OF","tipo":"lacunas","tema":"Síndrome extrapiramidal","enun":"A síndrome extrapiramidal é um efeito esperado do fármaco ______, justificada pelo bloqueio dos receptores ______ expressos em fibras ______. O bloqueio de receptores ______ promove a desinibição das fibras ______ e liberação excessiva de ______. Assinale a alternativa que completa corretamente os espaços.","itens":[],"opts":["metoclopramida – dopaminérgicos – colinérgicas – D2 – colinérgicas – acetilcolina","domperidona – dopaminérgicos – colinérgicas – D2 – colinérgicas – acetilcolina","metoclopramida – dopaminérgicos – colinérgicas – D2 – muscarínicas – acetilcolina","bromoprida – colinérgicos – dopaminérgicas – M3 – dopaminérgicas – dopamina","metoclopramida – colinérgicos – dopaminérgicas – M3 – dopaminérgicas – acetilcolina"],"ans":0,"why":"Cadeia completa: metoclopramida → bloqueia D2 → em fibras COLINÉRGICAS → desinibe as colinérgicas → ↑ACh. Domperidona não cruza a BHE (B errada); 'fibras muscarínicas' não existe (C)."},{"id":"PM0524-Q1","sp":"SP3","prova":"PM 10/05/2024 Q1 · PM T4 Q5","selo":"OF","tipo":"sentenças","tema":"Antieméticos","enun":"Sobre os antieméticos, analise as sentenças abaixo e assinale a alternativa correta.","itens":["I. O dimenidrinato é o fármaco de primeira escolha para tratar pacientes com náuseas por cinetose e êmese gravídica. Atua inibindo competitivamente receptores H1 e M1,3 perifericamente e centralmente.","II. Ondansetrona atua como bloqueador competitivo de receptores 5HT3, disponível na atenção básica para tratar quadros de vômitos desencadeados por substâncias químicas diversas, incluindo os quimioterápicos antitumorais.","III. As doses usuais de bromoprida, ondansetrona e dimenidrinato são 10 mg, 4 mg e 50 mg, respectivamente. Esses fármacos têm ação antiemética central e periférica, inibindo distintos receptores no trato digestivo e SNC.","IV. Bromoprida e domperidona apresentam ação pró-cinética, contribuindo para o esvaziamento do trato gastrintestinal, porém, a domperidona é a mais recomendada porque é mais efetiva em inibir de forma seletiva os receptores D2 no SNC quando comparada com a bromoprida."],"opts":["I, II, III e IV","I e II","I, II e III","I e III","II e IV"],"ans":2,"why":"IV: domperidona NÃO é 'mais efetiva' nem age no SNC — ela é periférica (não cruza BHE); mesma dose (10 mg) das duas. Doses do III (10/4/50) = verdadeiras (na PM T4 a mesma frase tinha 'peristaltismo aumentado como EA comum' e virou falsa — leia até o fim)."},{"id":"T9-Q11","sp":"SP3","prova":"T9 (abr/2025) Q11","selo":"OF","tipo":"sentenças","tema":"Antieméticos","enun":"Sobre os antieméticos, avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. O dimenidrinato e a meclizina são antagonistas de receptores histamínicos H1 de primeira geração, que também têm propriedades anticolinérgicas significativas, e são empregados para tratar náuseas e vômitos causados por disfunção do labirinto.","II. O dimenidrinato é o fármaco de escolha para tratar náuseas matinais em gestantes porque reduz a sialorreia ao bloquear receptores muscarínicos, o que também justifica os efeitos sedativos, falta de coordenação motora, retenção urinária e constipação.","III. A metoclopramida bloqueia receptores D2 no TGI, o que explica o efeito pró-cinético, pois a ativação dos receptores D2 inibe a estimulação colinérgica do músculo liso.","IV. A bromoprida pode ser empregada para tratar queixas de regurgitação em pacientes com DRGE pois aumenta o tônus gastroesofágico, eleva a pressão do esfíncter esofágico inferior e acelera o esvaziamento gástrico.","V. Os antagonistas dos receptores 5-HT3 estão entre os principais fármacos usados para a prevenção de náuseas e vômitos induzidos pela quimioterapia, cuja eficácia é aumentada quando associados com dexametasona e/ou bromoprida."],"opts":["I, III, IV e V","I, IV e V","II, III e IV","I, II e IV","I e V"],"ans":0,"why":"II é falsa por UMA palavra: a sedação é do bloqueio H1 central, não muscarínico ('o que também justifica os efeitos sedativos' — errado). O resto (sialorreia/muscarínico) é a explicação dela. V verdadeira (5-HT3 + dexa e/ou D2)."},{"id":"T9-Q12","sp":"SP3","prova":"T9 (abr/2025) Q12","selo":"OF","tipo":"sentenças-alternativas","tema":"Antieméticos","enun":"Sobre o mecanismo de ação dos antieméticos, efeitos adversos e empregos terapêuticos, avalie as sentenças abaixo e assinale a alternativa correta.","itens":[],"opts":["A metoclopramida estimula a liberação de prolactina em lactantes e por isso pode ser empregada off label para promover galactorreia.","A bromoprida em doses de 50 mg é empregada para tratar vômitos induzidos por substâncias químicas, distúrbios de cinetose e agentes citotóxicos.","A domperidona é usada para tratar vômitos causados por agentes citotóxicos e sintomas de DRGE como pirose, regurgitação, empachamento. Não promove galactorreia.","A síndrome extrapiramidal é um evento adverso esperado do bloqueio de receptores D2 pois causa a inibição da fibra colinérgica e é caracterizada por distúrbios de movimentos e sonolência.","A escopolamina é empregada principalmente como antiespasmódico, mas também apresenta ação antiemética, sendo indicada para tratar náuseas em gestantes, pois bloqueia receptores muscarínicos (M1 e M2)."],"ans":0,"why":"A veterana marcou E e errou. A é verdadeira (metoclopramida off-label como galactagogo). B: 10 mg, não 50; cinetose não. C: domperidona PROMOVE galactorreia e não trata quimio. D: 'inibição da fibra colinérgica' é o oposto. E: escopolamina não é indicada em gestante; receptores M3."},{"id":"T11-Q6","sp":"SP3","prova":"T11 (abr/2026) Q6","selo":"OF","tipo":"direta","tema":"Domperidona","enun":"_________ promove o aumento do tônus do esfíncter esofágico inferior e estimula as contrações do antro gástrico e do intestino delgado, mas não tem efeitos clinicamente significativos na motilidade do intestino grosso. Esse mecanismo de ação descreve corretamente a ação de qual fármaco?","itens":[],"opts":["domperidona","ondansetrona","aprepitanto","dimenidrinato"],"ans":0,"why":"Texto do Katzung sobre a domperidona: ↑EEI, ↑antro/delgado, SEM efeito no cólon (por isso 'domperidona tem efeitos significativos na motilidade do TGI baixo' é FALSO na Q8-b)."},{"id":"T11-Q7","sp":"SP3","prova":"T11 (abr/2026) Q7","selo":"OF","tipo":"direta","tema":"Gastroparesia","enun":"Qual dos fármacos abaixo pode ser indicado para quadros de gastroparesia?","itens":[],"opts":["nabilona","ondansetrona","bromoprida","dimenidrinato"],"ans":2,"why":"Gastroparesia pede PRÓ-CINÉTICO (antagonista D2 → ↑ACh → ↑motilidade). Nabilona = agonista CB1; ondansetrona (5-HT3) e dimenidrinato (H1/M) reduzem motilidade."},{"id":"T11-Q8","sp":"SP3","prova":"T11 (abr/2026) Q8","selo":"OF","tipo":"sentenças-alternativas","tema":"Antieméticos e pró-cinéticos","enun":"Sobre a ação de alguns antieméticos e pró-cinéticos, avalie as sentenças abaixo e assinale a alternativa correta.","itens":[],"opts":["Distonias e sintomas parkinsonianos são efeitos adversos que podem ocorrer pela administração via IV de metoclopramida, e são tratados com medicamentos anticolinérgicos como atropina.","A domperidona exerce efeitos nas estruturas do SNC que não possuem barreira hematencefálica, como os centros que controlam o vômito e a secreção de prolactina pelo hipotálamo. A domperidona tem efeitos significativos na motilidad…","A estimulação dos receptores 5-HT4 dos neurônios motores excitatórios aumenta a liberação de ACh na junção neuromuscular, e assim, a prucaloprida que é um agonista específico dos receptores 5-HT4, facilita a neurotransmissão coli…","O dimenidrinato bloqueia de forma competitiva receptores histaminérgicos e muscarínicos, o que desencadeia como efeitos adversos: sonolência, aumento da fome, diminuição das respostas reflexas e motoras, xerostomia, retenção urin…"],"ans":3,"why":"A: biperideno (não atropina). B: prolactina é na ADENO-HIPÓFISE e domperidona não age no cólon. C: a Danielli anotou 'H1 e H3' e ela aceitou D; a professora considerou C errada — provavelmente por 'junção neuromuscular' (é plexo mioentérico) e 'esvaziamento gastrintestinal' via 'estimulação vagal'. D é a descrição-padrão do dimenidrinato."},{"id":"T9-Q4","sp":"SP3","prova":"T9 (abr/2025) Q4","selo":"OF","tipo":"direta","tema":"Hepatoprotetor","enun":"Qual dos medicamentos listados abaixo é empregado como hepatoprotetor, empregado em casos de esteatose hepática alcoólica e não alcoólica?","itens":[],"opts":["Cardo mariano – silimarina","Cardo mariano – ácido ursodesoxicólico","Peumus boldus – silimarina","Peumus boldus – boldina","Ácido ursodesoxicólico"],"ans":0,"why":"Silimarina (flavonolignanos do cardo mariano, Silybum marianum) = hepatoprotetor (↓peroxidação lipídica, ↑glutationa/SOD, ⊣NF-κB); 280–420 mg/dia em 3 doses. Boldo (boldina) = colerético/colagogo, NÃO protege. UDCA = colestase/colangite."},{"id":"T11-Q14","sp":"SP3","prova":"T11 (abr/2026) Q14","selo":"OF","tipo":"direta","tema":"Hepato","enun":"Assinale a alternativa que apresenta de forma sequencial os fármacos de escolha para tratar quadros de colangites e esteatose hepática.","itens":[],"opts":["ácido ursodesoxicólico e silimarina.","silimarina e ácido ursodesoxicólico.","pancreatina e silimarina","pancreatina e ácido ursodesoxicólico"],"ans":0,"why":"Colangite/colestase → UDCA (↓secreção e absorção de colesterol, ↑fluxo biliar; 10 mg/kg/dia; não é 1ª linha para cálculo — cirurgia). Esteatose → silimarina. Pancreatina = insuficiência exócrina."},{"id":"T4-Q6","sp":"SP4","prova":"T4 (out/2022) Q6","selo":"OF","tipo":"sentenças","tema":"IBP crônico","enun":"Sobre as consequências da hipocloridria induzida pelo uso crônico de IBPs analise as sentenças abaixo e assinale a alternativa correta.","itens":["I. A hipomagnesemia e hipocalcemia ocorrem em função da hipocloridria e má absorção destes minerais, os quais estão relacionados com dores musculares e fraturas ósseas, respectivamente.","II. A hipocloridria pode ser a causa da carência de vitamina B12 decorrente da inibição da secreção do fator intrínseco, necessário para absorção desta vitamina.","III. A carência de aminoácidos essenciais pode ser decorrente da má absorção proteica, pois a hipocloridria inativa a pepsina.","IV. A hipergastrinemia induzida pela hipocloridria deve ser monitorada para evitar a secreção ácida rebote e porque pode causar câncer gástrico."],"opts":["I, II e IV","I, II, III e IV","III e IV","I e II","I, II e III"],"ans":1,"why":"Todas verdadeiras no gabarito oficial (o veterano circulou B e acertou). A veterana Letícia contestou III ('a hipocloridria não ativa o pepsinogênio, não inativa a pepsina') e IV — mas a professora aceitou as 4. Para a prova: Mg→mialgia, Ca→fratura (PTH), FI→B12, pepsina pH<4→proteínas/triptofano, gastrina→rebote/câncer."},{"id":"T4-Q7","sp":"SP4","prova":"T4 (out/2022) Q7","selo":"OF","tipo":"sentenças","tema":"Dispepsia","enun":"Sobre o tratamento das dispepsias analise as afirmativas abaixo e assinale a alternativa correta:","itens":["I. A fitoterapia é largamente empregada na terapêutica de distúrbios gástricos, como o chá de espinheira-santa, cujos compostos ativos reduzem a secreção ácida e estimulam a secreção de muco.","II. A famotidina inibe de forma competitiva receptores H2, reduzindo o estímulo mediado pela gastrina. É usado nas doses de 20 mg tomados à noite, e os principais efeitos adversos são: náuseas, diarreia, pirose, epigastralgia, cefaleia.","III. As formulações que contêm hidróxido de magnésio e hidróxido de alumínio normalmente são combinadas com carbonato de cálcio para reduzir os efeitos adversos de diarreia e constipação, além de promover a eructação.","IV. O sucralfato é um sal de sacarose complexado com hidróxido de cálcio, utilizado para estimular a secreção de muco e neutralizar o ácido gástrico, sendo indicado para tratar úlceras e sangramentos gástricos.","V. O bicarbonato de sódio é um antiácido de rápida dissociação, por isso neutraliza o ácido clorídrico rapidamente, causando sensação de alívio de sintomas como azia e queimação, mas é contraindicado para hipertensos porque libera sódio que é absorvido no duodeno."],"opts":["I e V","I, II e V","I, II, III, IV e V","II, III e IV","I, III e V"],"ans":4,"why":"II falsa: famotidina bloqueia o estímulo da HISTAMINA (não da gastrina) e 'pirose/epigastralgia' não são EA típicos. IV falsa: hidróxido de ALUMÍNIO (não cálcio)."},{"id":"T4-Q8","sp":"SP4","prova":"T4 (out/2022) Q8","selo":"OF","tipo":"sentenças","tema":"Supressores ácidos","enun":"Sobre os supressores ácidos, avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. Para melhorar a biodisponibilidade dos IBPs deve-se administrar 1 hora antes das refeições, a fim de bioativar o fármaco na sulfenamida tetracíclica.","II. As formulações que contêm os IBPs são gastrorresistentes, pois estes fármacos sofrem ionização em meio ácido o que reduziria a absorção destes.","III. Os fármacos esomeprazol e dexlansoprazol são os enantiômeros puros e mais potentes do omeprazol e lansoprazol, respectivamente, o que justifica que doses menores já são efetivas.","IV. A vonoprazana inibe a bomba H+/K+-ATPase de forma reversível ao competir com o potássio e não necessita de bioativação endógena para exercer o efeito biológico.","V. IBPs e vonoprazana são indicados para cicatrização de úlceras, pois induzem uma supressão ácida significativa e consequente inibição da ativação da pepsina."],"opts":["I, II, III, IV e V","II, III, IV e V","I, III e V","I, IV e V","II, III e V"],"ans":1,"why":"I falsa: o jejum favorece a BIOATIVAÇÃO nos canalículos (H⁺ → sulfenamida), não a biodisponibilidade — a Vânia quer ação local, não sistêmica. O resto é texto da tabela dela."},{"id":"T4-Q9","sp":"SP4","prova":"T4 (out/2022) Q9","selo":"OF","tipo":"asserção-razão","tema":"Misoprostol","enun":"Sobre o misoprostol avalie as asserções e a relação proposta entre elas.","itens":["I. O misoprostol estimula receptores de prostaglandinas presentes nas células parietais e principais do estômago inibindo a secreção ácida e estimulando a secreção de muco e bicarbonato, porém, pode causar aborto se usado por mulheres grávidas pois estimula a contração de músculos lisos, como útero","PORQUE","II. O misoprostol é a primeira linha de tratamento em ambiente hospitalar para pacientes com sangramentos gástricos pelo uso de AINEs, uma vez que esses medicamentos inibem a síntese de PGE2 e consequentemente reduzem a secreção de muco e bicarbonato."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":2,"why":"Gabarito oficial C (o veterano anotou 'tá falando dos AINEs' e marcou II falsa: misoprostol é off-label/hospitalar para úlcera por AINE, não '1ª linha para sangramento' — 1ª linha é IBP IV). A veterana Letícia achou B; prevalece a correção da prova."},{"id":"T4-Q11","sp":"SP4","prova":"T4 (out/2022) Q11 · T5 Q8","selo":"OF","tipo":"asserção-razão","tema":"IBP × CYP","enun":"Os fármacos omeprazol e esomeprazol inibem diversas enzimas hepáticas (CYPs) e isso implica em interações medicamentosas e efeitos adversos. Sobre o tema analise as asserções e as relações propostas entre elas.","itens":["I. A inibição das enzimas CYP2C19 e CYP3A4 mediada pelo omeprazol e seu enantiômero alteram a meia-vida de diversos fármacos, aumentando a duração de ação desses e de seus metabólitos, podendo causar bioacumulação, o que pode acentuar os efeitos adversos","PORQUE","II. A inibição da CYPC17 provoca acúmulo de progesterona, com consequentes alterações dos hormônios sexuais masculinos e femininos, provocando alterações de libido sexual, ginecomastia e galactorreia."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":1,"why":"Duas verdades independentes (2C19/3A4 → bioacumulação; CYP17 → progesterona → hormônios sexuais). Na T5 Q8 ela inverteu a ordem e trocou uma palavra: 'alteram a meia-vida… o que REDUZ a biodisponibilidade' → falsa → resposta C. Leia a palavra 'biodisponibilidade'."},{"id":"T5-Q9","sp":"SP4","prova":"T5 (abr/2023) Q9 · PM 10/05/2024 Q6 · A…","selo":"OF","tipo":"sentenças","tema":"IBP crônico","enun":"Sobre o uso crônico de IBPs e os efeitos adversos analise as sentenças abaixo e assinale a alternativa correta.","itens":["I. A anemia ferropriva é uma das respostas esperadas pelo uso de IBPs assim como o risco de fraturas ósseas, ambos decorrentes da má absorção de ferro e cálcio, respectivamente, em função da hipocloridria.","II. O comprometimento da digestão, principalmente proteica, está implicada na carência de aminoácidos, como o triptofano. A carência de triptofano pode estar relacionada com quadros de ansiedade, depressão e alterações do sono.","III. Os IBPs podem causar câncer gastroduodenal em função da hipercloridria induzida pela gastrina, e diarreia ou constipação decorrentes da má digestão de proteínas e fermentação destas.","IV. A acloridria e a hiperatividade da pepsina são as principais defesas contra infecções bacterianas e estão inibidas pelo uso de IBPs, e por isso, o uso desses fármacos está relacionado ao risco de infecção por H. pylori."],"opts":["I e II","I, II e IV","I, II e III","II, III e IV","I e III"],"ans":0,"why":"A questão mais reciclada de dispepsia (T5, PM 2024, AVA T11). III: é HIPOcloridria → hipergastrinemia → câncer. IV: a defesa é a HIPERcloridria/acidez (acloridria é a ausência de ácido). Triptofano → serotonina → melatonina (ansiedade, depressão, insônia) = verdadeiro."},{"id":"T5-Q10","sp":"SP4","prova":"T5 (abr/2023) Q10","selo":"OF","tipo":"sentenças","tema":"Dispepsia","enun":"Sobre o tratamento das dispepsias analise as afirmativas abaixo e assinale o que for correto:","itens":["I. Chá de espinheira-santa, tomado três vezes ao dia e suco de couve, tomado uma vez ao dia, reduzem sintomas dispépticos porque diminuem a secreção ácida e estimulam a secreção de muco, além de efeitos antioxidantes.","II. A famotidina na dose de 20 mg deve ser administrada 1 x ao dia no período noturno a fim de se obter a máxima resposta farmacológica pelo bloqueio competitivo de receptores H2, reduzindo em mais de 50% a secreção ácida.","III. A vonoprazana inibe a bomba H+/K+-ATPase de forma reversível ao competir com o potássio e não necessita de bioativação endógena. É indicada para tratar úlceras gástricas devido sua intensa ação supressora sobre a secreção gástrica.","IV. O bicarbonato de sódio reage lentamente com o HCl presente na luz do estômago formando uma base forte, elevando o pH gástrico com consequente inibição da ativação da pepsina.","V. Os antiácidos que contêm carbonato de cálcio associados a hidróxido de magnésio podem causar constipação, e estimulam a secreção ácida rebote via ativação da gastrina. A associação com carbonato de cálcio visa a eructação, dando a sensação de boa digestão."],"opts":["II, IV e V","I, III e V","I, II, III e IV","I, II e III","I e III"],"ans":3,"why":"IV: bicarbonato reage RAPIDAMENTE (base forte de dissociação rápida). V: hidróxido de MAGNÉSIO dá diarreia (é o de alumínio que constipa); o resto de V é verdade (CaCO₃ → gastrina/rebote + eructação)."},{"id":"T6-Q9","sp":"SP4","prova":"T6 (out/2023) Q9 · PM 10/05/2024 Q8","selo":"OF","tipo":"sentenças","tema":"Dispepsia","enun":"O tratamento das dispepsias deve consistir em medidas não farmacológicas e farmacológicas para completa e persistente resolução do quadro dispéptico. Sobre tais condutas avalie as afirmativas abaixo e assinale a alternativa correta.","itens":["I. O uso de AINEs é a principal causa de úlceras gástricas, por isso em pacientes com gastrite e que precisam fazer uso desses fármacos recomenda-se o uso de antiácidos como hidróxido de magnésio, para reduzir os danos na mucosa gástrica.","II. O chá das folhas da espinheira-santa é usado como prevenção e tratamento de gastrites não complicadas, e a principal ação é a redução da secreção ácida e aumento da secreção de muco.","III. Os antiácidos hidróxido de alumínio e hidróxido de magnésio são recomendados para uso agudo e ocasional em casos de sintomas dispépticos. Atuam neutralizando a secreção ácida.","IV. O bicarbonato de sódio é um antiácido de dissociação lenta e aumenta pH gástrico e plasmático, porque há absorção do bicarbonato e do sódio. Também promove eructação e peristaltismo, o que favorece a digestão.","V. O sucralfato é um sal de sacarose complexado com hidróxido de alumínio, que no suco gástrico forma uma pasta viscosa que se adere às paredes da mucosa gástrica, formando um revestimento protetor, além de neutralizar o ácido de forma lenta e gradual."],"opts":["I, II, III, IV e V","II, III e V","I, II e IV","I, II e V","III e V"],"ans":1,"why":"I: antiácido não protege de úlcera por AINE (isso é IBP/misoprostol) e Mg(OH)₂ é de dissociação rápida. IV: bicarbonato = dissociação RÁPIDA; não 'favorece a digestão'. Na PM 2024 a versão tinha 'bicarbonato = base forte de rápida dissociação' (V) e 'antiácidos REDUZEM a secreção' (F — neutralizam) → resposta D (I, II, IV, V)."},{"id":"T6-Q10","sp":"SP4","prova":"T6 (out/2023) Q10","selo":"OF","tipo":"direta","tema":"Antiácidos","enun":"O principal efeito adverso deste antiácido é a constipação:","itens":[],"opts":["hidróxido de magnésio","hidróxido de alumínio","carbonato de cálcio","bicarbonato de sódio","metilcelulose"],"ans":1,"why":"Al(OH)₃ = dissociação lenta → constipação; Mg(OH)₂ = rápida → diarreia (por isso vêm associados); CaCO₃ → eructação + rebote; NaHCO₃ → Na⁺/alcalose. Quadro da prova com duas letras (B/A) — B é o que bate com slides e veterana."},{"id":"T6-Q11","sp":"SP4","prova":"T6 (out/2023) Q11","selo":"OF","tipo":"direta","tema":"Clopidogrel","enun":"Qual dos fármacos abaixo é contraindicado para pacientes que fazem uso de clopidogrel (antitrombótico)?","itens":[],"opts":["famotidina","bicarbonato de sódio","omeprazol","vonoprazana","pantoprazol"],"ans":2,"why":"Clopidogrel é PRÓ-FÁRMACO ativado pela CYP2C19; omeprazol/esomeprazol inibem a 2C19 → clopidogrel não ativa → trombose/IAM. Pantoprazol interage menos; famotidina/vonoprazana são as alternativas."},{"id":"T6-Q13","sp":"SP4","prova":"T6 (out/2023) Q13","selo":"IN","tipo":"sentenças","tema":"IBP crônico","enun":"Sobre o uso crônico de IBPs e os problemas de saúde relacionados com a significativa supressão ácida, avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. A hipomagnesemia e a hipocalcemia são decorrentes da má absorção desses minerais cuja biodisponibilidade é aumentada em pH ácido.","II. A deficiência de vitamina B12 é explicada pelo déficit do fator intrínseco, o qual é fundamental para absorção intestinal dessa vitamina.","III. As infecções oportunistas são mais frequentes em usuários crônicos de IBPs porque a mucosa gástrica atua como uma barreira física contra os microrganismos.","IV. Os déficits proteicos podem ser decorrentes da má digestão de proteínas presentes na dieta devido a inatividade da pepsina que é dependente de pH inferior a 4.","V. A inibição da CYP C17 mediada pelo omeprazol e esomeprazol pode causar alterações hormonais, como redução de estrógeno e testosterona, e aumento de progesterona."],"opts":["I, II, III e IV","II, III e V","I, II, IV e V","I, II e IV","IV e V"],"ans":2,"why":"INFERIDO (quadro C/D). III é a falsa: a defesa é o HCl antimicrobiano (barreira química), não 'barreira física' (isso é o muco). V é verdadeira pela aula (CYP17 → ↓andrógenos/estrógenos, ↑progesterona)."},{"id":"T6-Q14","sp":"SP4","prova":"T6 (out/2023) Q14","selo":"IN","tipo":"sentenças","tema":"IBP / vonoprazana","enun":"Sobre o uso de IBPs, avalie as sentenças abaixo e assinale a alternativa correta.","itens":["I. A administração de IBPs em jejum farmacológico favorece a absorção desses fármacos, visto que são degradados em meio ácido.","II. Os IBPs dependem da protonação (ação do H+) que ocorre nos canalículos das células parietais para que sejam bioativados e possam inibir de forma irreversível a bomba H⁺/K⁺-ATPase.","III. A vonoprazana inibe a bomba H⁺/K⁺-ATPase de forma reversível ao competir com o potássio. É indicada para suprimir a secreção ácida de forma eficiente sem necessidade de ser bioativada.","IV. A vonoprazana inibe a secreção ácida e estimula a secreção de muco e bicarbonato, por isso, é mais efetiva que os IBPs no tratamento de úlceras gástricas.","V. A famotidina em doses únicas de 20 mg/dia inibe de forma competitiva receptores H2, reduzindo a secreção ácida mediada pela histamina, principalmente no período noturno."],"opts":["I, II, III, IV e V","II, III, IV e V","I, II e V","I, III e IV","II, III e V"],"ans":4,"why":"INFERIDO (quadro E/B; veterano marcou B e foi corrigido). I: jejum favorece a bioativação nos canalículos (H⁺ alto), não a absorção. IV: vonoprazana só suprime ácido (não estimula muco) e não é 'mais efetiva' — só dispensa bioativação."},{"id":"T7-Q1","sp":"SP4","prova":"T7 (abr/2024) Q1","selo":"OF","tipo":"asserção-razão","tema":"IBP × interações","enun":"Sobre os IBPs avalie as asserções abaixo e a relação proposta entre elas.","itens":["I. O uso crônico de omeprazol por pacientes em polifarmácia pode precipitar interações farmacológicas farmacocinéticas antagônicas e sinérgicas por diferentes mecanismos, de acordo com o fármaco envolvido.","PORQUE","II. A inibição da CYP2C9 reduz a bioativação do pró-fármaco clopidogrel, o que reduz sua biodisponibilidade, portanto uma interação farmacocinética antagônica. A inibição da CYP3A4 reduz o metabolismo de alguns fármacos, causando bioacumulação (interação farmacocinética sinérgica). A redução da biodisponibilidade do ácido acetilsalicílic…"],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":2,"why":"II falsa por um número: clopidogrel é ativado pela CYP2C19 (não 2C9); e 'bioativação' não é 'biodisponibilidade'. O veterano marcou A e foi corrigido para C ('questão muito fdp', anotou a veterana)."},{"id":"T7-Q9","sp":"SP4","prova":"T7 (abr/2024) Q9 · T9 Q3","selo":"OF","tipo":"direta","tema":"Sucralfato","enun":"Qual o fármaco gastroprotetor comumente associado a IBPs para cicatrização de úlceras? (T9: qual o fármaco de uso AMBULATORIAL que estimula a secreção de prostaglandinas e bicarbonato pela mucosa e é usado para cicatrização de úlceras?)","itens":[],"opts":["misoprostol","sucralfato","bismuto","famotidina","vonoprazana"],"ans":1,"why":"Sucralfato (sacarose-octassulfato + Al(OH)₃): pasta viscosa que adere à úlcera ~6 h + ↑PG, muco e bicarbonato; 1 g 4×/dia em jejum; ambulatorial. Misoprostol também ↑PG/bicarbonato, mas é hospitalar/off-label/abortivo → na T9 a veterana marcou misoprostol e errou (correção: sucralfato)."},{"id":"T7-Q15","sp":"SP4","prova":"T7 (abr/2024) Q15","selo":"OF","tipo":"sentenças","tema":"Dispepsia","enun":"Sobre o tratamento das dispepsias, analise as afirmativas abaixo e assinale o que for correto:","itens":["I. Chá das folhas da planta espinheira-santa, tomado três vezes ao dia, reduz significativamente os sintomas dispépticos em pacientes com gastrite porque diminui a secreção ácida e estimula a secreção de muco, porém não é indicado para tratamento de úlceras gastroduodenais e em casos de tratamento da infecção por H. pylori.","II. A famotidina na dose de 10 mg/noite atua bloqueando de forma competitiva receptores H2, os quais são ativados pela gastrina cujo pico máximo de sua ação ocorre no período noturno. A famotidina reduz em mais de 50% a secreção ácida, e é o fármaco de primeira escolha quando há necessidade de supressão ácida por longos períodos, exceto…","III. A vonoprazana inibe a bomba H⁺/K⁺-ATPase de forma reversível ao competir com o potássio e não necessita de bioativação, podendo ser administrada em qualquer horário do dia independente da ingesta de alimentos. É indicada para tratar úlceras gastroduodenais e em casos de tratamento da infecção por H. pylori devido sua intensa ação su…","IV. Os antiácidos atuam neutralizando a secreção ácida ao reagirem com o HCl, elevando rapidamente o pH do estômago, tal como as preparações contendo bicarbonato de sódio e carbonato de cálcio. Devem ser administrados longe das refeições para alívio dos sintomas como pirose. O uso crônico pode mascarar doenças pépticas graves.","V. O omeprazol é o único supressor ácido disponível na atenção básica nas doses de 10 e 20 mg, e deve ser administrado 1 x ao dia. Atua inibindo de forma irreversível a bomba H⁺/K⁺-ATPase, cuja ação é dependente da presença de H⁺ nos canalículos das células parietais para sua bioativação e formação da sulfenamida tetracíclica."],"opts":["II, IV e V","I, III e V","I, III, IV e V","I, II e III","I, IV e V"],"ans":2,"why":"II falsa: famotidina é 20 mg (não 10) e os H2 são ativados pela HISTAMINA (não gastrina). IV foi aceita como verdadeira ('longe das refeições' = 1 h após). V = a frase-lei do omeprazol no SUS."},{"id":"T9-Q2","sp":"SP4","prova":"T9 (abr/2025) Q2","selo":"OF","tipo":"sentenças","tema":"IBP","enun":"Sobre os IBPs, avalie as afirmativas abaixo e assinale a alternativa correta.","itens":["I. Os IBPs são pró-fármacos que exigem ativação no ambiente ácido do canalículo da célula parietal, e são convertidos em sulfenamidas (forma ativa) que reagem com um resíduo cisteína da H+/K+ ATPase, formando uma ligação dissulfeto covalente.","II. As formulações orais dos IBPs têm revestimento entérico para evitar protonação do fármaco, o que reduz a biodisponibilidade destes. A inibição da bomba de prótons ocorre de forma irreversível, levando à supressão prolongada e intensa da secreção ácida.","III. Os IBPs são efetivos na prevenção de úlceras hemorrágicas recorrentes. A formação de coágulo envolve processos que são afetados em ambiente ácido, e a profunda supressão da secreção ácida gástrica pelos IBPs ajuda a manter a integridade do coágulo no leito da úlcera. Os IBPs também são empregados no tratamento da gastrite induzida p…","IV. Os IBPs são superiores aos antagonistas de receptores H2 na cicatrização de úlceras gástricas e duodenais, pois são capazes de sustentar um aumento constante do pH gástrico, independente do estímulo para a secreção ácida. O uso crônico está implicado em maior risco de infecções intestinais e respiratórias, osteoporose e hipergastrine…","V. Omeprazol e esomeprazol inibem CYPs, causando importantes interações medicamentosas, o que contraindica o uso destes por pacientes que fazem terapia antitrombótica com clopidogrel, pelo risco de sangramentos decorrente da bioacumulação desse fármaco."],"opts":["I, II, III e IV","I, III e V","II, III e IV","I, II e IV","I, II, III, IV e V"],"ans":0,"why":"V é falsa: o risco com clopidogrel é TROMBOSE (pró-fármaco não ativado), não sangramento por bioacumulação. A veterana anotou certo e marcou D (excluiu III) — errou: III é texto do Katzung e verdadeiro."},{"id":"T11-Q1","sp":"SP4","prova":"T11 (abr/2026) Q1","selo":"OF","tipo":"sentenças-alternativas","tema":"IBP (Katzung)","enun":"Sobre os IBPs, avalie as sentenças abaixo e assinale a alternativa correta.","itens":[],"opts":["A meia-vida dos IBPs é de cerca de 1 hora, e uma dose diária única afeta a secreção de ácido por 2 a 3 dias, em parte devido ao acúmulo nos canalículos e, em parte, devido ao fato de que inibem irreversivelmente a bomba H+/K+/ATP…","A supressão ácida induzida por IBPs está associada a um risco aumentado de diarreia por Escherichia coli, particularmente em pacientes imunossuprimidos ou que receberam antibióticos, bem como com queixas de tontura, sonolência, c…","O omeprazol é administrado por via oral; entretanto, em virtude de sua rápida degradação em pH baixo, é administrado em cápsulas contendo grânulos de revestimento entérico. A sua bioativação é dependente da disponibilidade de H+…","Os IBPs diminuem o risco de sangramento das úlceras causadas por AINEs e podem ser usados para prevenção ou tratamento das úlceras induzidas por estes medicamentos, uma vez que inibem a secreção ácida e aumentam a secreção de muc…"],"ans":0,"why":"Katzung-verbatim. B: a diarreia associada é por C. difficile (e a lista de EA é da cimetidina). C: a bioativação é nos CANALÍCULOS da célula parietal, não na luz do estômago. D: IBP não aumenta muco/bicarbonato (isso é misoprostol/sucralfato)."},{"id":"T11-Q2","sp":"SP4","prova":"T11 (abr/2026) Q2","selo":"OF","tipo":"sentenças-alternativas","tema":"IBP crônico (Katzung)","enun":"Sobre os efeitos adversos do uso crônico de IBPs avalie as sentenças abaixo e assinale a alternativa correta.","itens":[],"opts":["Os IBPs podem aumentar o risco de fraturas, porque a supressão ácida inibe a biotivação do carbonato de cálcio, levando a um quadro de hipocalcemia e aumento da reabsorção óssea mediada pela ação do PTH (paratormônio).","A hipocloridria reduz a absorção do Fe³⁺, pois promove a oxidação do sulfato férrico em sulfato ferroso, podendo ser uma das causas de anemia ferropriva.","A carência de vitamina B12 pode ser decorrente da hipocloridria, pois o ácido é necessário para biotivação do fator intrínseco, proteína necessária para a absorção da cobalamina no cólon.","A hipergastrinemia é mais frequente e mais grave com os IBPs do que com os antagonistas dos receptores H2. Essa hipergastrinemia pode predispor à hipersecreção rebote de ácido gástrico com a interrupção do tratamento e também pod…"],"ans":2,"why":"Gabarito oficial C (Danielli acertou). Atenção: C tem imprecisões (fator intrínseco é SECRETADO, não 'bioativado'; B12 é absorvida no ÍLEO) — a Danielli anotou as correções, mas ela considerou C. A: 'bioativação do carbonato de cálcio' (é ABSORÇÃO). B: ácido REDUZ Fe³⁺→Fe²⁺ (não oxida). D: Katzung diz que a hipergastrinemia com IBP é maior, mas 'crescimento de tumores' foi considerado errado. Guarde: fratura = Ca/PTH; anemia = Fe + B12/FI; rebote = gastrina."},{"id":"T11-Q3","sp":"SP4","prova":"T11 (abr/2026) Q3","selo":"IN","tipo":"sentenças-alternativas","tema":"Dispepsia","enun":"Sobre o mecanismo de ação dos fármacos usados no tratamento de dispepsias avalie as sentenças abaixo e assinale a alternativa correta.","itens":[],"opts":["A famotidina na dose de 20 mg/noite é indicada para quadros de gastrite e atua inibindo a produção de ácido ao competir de modo reversível com a histamina pela ligação aos receptores H2 na membrana basolateral das células parieta…","O pantoprazol é o supressor ácido mais potente dos IBPs porque ao ligar-se de forma irreversível a H+/K+-ATPase gástrica (bomba de prótons) diminui a produção diária de ácido em 80-95%.","Dexlansoprazol e esomeprazol são fármacos que inibem de forma seletiva a bomba H+/K+-ATPase, por isso são mais efetivos na supressão da secreção ácida e apresentam menor interação com CYPs.","O sucralfato em pH ácido forma um polímero viscoso e pegajoso, que adere às células epiteliais do estômago, formando uma barreira física e química, devido à rápida dissociação do hidróxido de alumínio presente na formulação. Tamb…"],"ans":0,"why":"INFERIDO: a Danielli marcou D e errou; b e c estão marcadas ✗ na prova dela. B: o mais potente é o ESOMEPRAZOL (enantiômero S). C: são enantiômeros (não 'seletivos') e não têm 'menor interação'. D: a dissociação do Al(OH)₃ é LENTA. Sobra A (famotidina 20 mg/noite, competitiva, basolateral)."},{"id":"T11-Q4","sp":"SP4","prova":"T11 (abr/2026) Q4","selo":"IN","tipo":"direta","tema":"Antiácidos — rebote","enun":"Qual dos antiácidos abaixo apresenta grande possibilidade de induzir secreção ácida rebote devido à estimulação de células G a secretarem gastrina?","itens":[],"opts":["hidróxido de alumínio","hidróxido de magnésio","carbonato de cálcio","bicarbonato de sódio"],"ans":2,"why":"INFERIDO (Danielli marcou D e errou). Cálcio estimula diretamente as células G → gastrina → rebote (Katzung + tabela dela 'CaCO₃… secreção ácida rebote via gastrina'). O bicarbonato dá rebote por ↑pH rápido (é a lógica da Q5), não por células G."},{"id":"T11-Q5","sp":"SP4","prova":"T11 (abr/2026) Q5","selo":"OF","tipo":"sequência","tema":"Antiácidos","enun":"O principal efeito adverso é a diarreia (1); pode causar eructação, náuseas e distensão abdominal (2); secreção ácida rebote devido à elevação do pH gástrico (3). Qual das afirmativas abaixo apresenta de forma sequencial e correta os fármacos que causam os distúrbios enumerados?","itens":[],"opts":["hidróxido de alumínio; bicarbonato de sódio; bicarbonato de sódio.","hidróxido de magnésio; bicarbonato de sódio; bicarbonato de sódio.","hidróxido de magnésio; carbonato de cálcio; hidróxido de alumínio.","trissilicato de magnésio; carbonato de cálcio; carbonato de cálcio."],"ans":1,"why":"Diarreia = Mg; eructação (CO₂) = bicarbonato (ou CaCO₃); rebote 'pela elevação do pH' = bicarbonato (base forte, rápida). Repare no par Q4/Q5: rebote por CÉLULAS G = cálcio; rebote por pH = bicarbonato."},{"id":"T11-Q11","sp":"SP4","prova":"T11 (abr/2026) Q11","selo":"IN","tipo":"caso","tema":"Gastrite erosiva — hospital","enun":"G. S., 57 anos, deu entrada no pronto-atendimento com náuseas, regurgitação e dor intensa no estômago. Diagnóstico: gastrite erosiva e úlcera esofágica. Das propostas terapêuticas para tratamento em ambiente hospitalar, qual a indicada?","itens":[],"opts":["omeprazol IV + misoprostol IV","omeprazol IV + bromoprida IV","vonoprazana IV + misoprostol IV","omeprazol IV + ondansetrona IV"],"ans":1,"why":"INFERIDO (Danielli marcou A e errou). Não existe misoprostol IV (é VO) nem vonoprazana IV. 'Náuseas + regurgitação' pede pró-cinético/antiemético D2 (bromoprida IV); ondansetrona não melhora regurgitação/esvaziamento."},{"id":"T5-Q8","sp":"SP4","prova":"T5 (abr/2023) Q8","selo":"OF","tipo":"asserção-razão","tema":"IBP × CYP","enun":"Os fármacos omeprazol e esomeprazol inibem diversas enzimas hepáticas (CYPs). Sobre o tema analise as asserções e as relações propostas entre elas.","itens":["I. A inibição da CYPC17 pelo uso crônico de omeprazol e esomeprazol provoca o acúmulo de progesterona cujas alterações hormonais podem causar redução da libido, ginecomastia e galactorreia","PORQUE","II. A inibição das enzimas CYP2C19 e CYP3A4 alteram a meia-vida de diversos fármacos, o que reduz a biodisponibilidade destes e pode causar bioacumulação."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"ans":2,"why":"II falsa: inibir CYP AUMENTA a biodisponibilidade/meia-vida (não reduz). Versão-irmã da T4 Q11 (onde a II era verdadeira → B)."},{"id":"SL3-Q1","sp":"SP3","prova":"Slides 2026 (inferida)","selo":"IN","tipo":"sentenças","tema":"Êmese","enun":"Sobre a fisiologia da êmese apresentada em aula, analise as sentenças:","itens":["I. A zona de gatilho quimiorreceptora (ZGQ) responde a dopamina, serotonina, histamina, prostaglandinas e GABA.","II. O centro do vômito recebe estímulos das fibras sensoriais vagais do TGI, dos núcleos vestibulares, do córtex e da ZGQ.","III. A ZGQ situa-se dentro da barreira hematoencefálica, o que impede que toxinas circulantes a estimulem.","IV. A domperidona tem pouca penetração no SNC, mas ainda eleva a prolactina porque a hipófise fica fora da barreira hematoencefálica."],"opts":["I, II e IV","I e III","II, III e IV","Todas"],"ans":0,"why":"III é falsa: a ZGQ (área postrema) fica FORA da BHE — é exatamente por isso que 'prova' o sangue (toxinas, quimio, fármacos). As demais são texto do slide/Katzung."},{"id":"SL3-Q2","sp":"SP3","prova":"Slides 2026 (inferida)","selo":"IN","tipo":"direta","tema":"Ondansetrona","enun":"Sobre a ondansetrona (Vonau®, Ondif®), assinale a alternativa CORRETA de acordo com a aula:","itens":[],"opts":["Bloqueia competitivamente receptores 5-HT3 apenas no sistema nervoso central, sem ação nas fibras aferentes vagais.","A dose máxima é de 8 mg por administração intravenosa e 24 mg/dia por via oral ou sublingual, com metabolismo hepático (CYP1A2, 2D6, 3A4) e excreção renal e biliar.","Seu principal efeito adverso é a síndrome extrapiramidal, tratada com biperideno.","É contraindicada na hiperêmese gestacional e no pós-operatório."],"ans":1,"why":"Slide: bloqueio 5-HT3 periférico (aferentes vagais viscerais) E central (ZGQ); IV 8 mg/dose máx; VO/SL 4–8 mg 8/8 ou 12/12 h, máx 24 mg/dia; t½ 4–9 h; CYP1A2/2D6/3A4; excreção renal e biliar. EA: cefaleia, tontura, constipação, arritmia rara. Indicações: quimio, hiperêmese gestacional, pós-operatório."},{"id":"SL3-Q3","sp":"SP3","prova":"Slides 2026 (inferida)","selo":"IN","tipo":"lacunas","tema":"Pró-cinéticos","enun":"Complete: 'A dopamina presente no TGI tem efeitos ____ na motilidade, incluindo redução da pressão do esfíncter esofágico inferior. Esses efeitos resultam da supressão da liberação de ____ dos neurônios motores mioentéricos, mediada por receptores ____. Por isso, o bloqueio desses receptores por metoclopramida/bromoprida é ____, mas não tem efeito sobre a motilidade do ____.'","itens":[],"opts":["inibitórios – acetilcolina – D2 – pró-cinético – cólon","excitatórios – serotonina – 5-HT4 – antiemético – esôfago","inibitórios – noradrenalina – D1 – pró-cinético – estômago","excitatórios – acetilcolina – M3 – antiespasmódico – cólon"],"ans":0,"why":"Texto literal do slide 'Agentes pró-cinéticos' + 'Antagonistas dopaminérgicos'. Mecanismo completo da metoclopramida: agonismo 5-HT4 + antagonismo 5-HT3 vagal/central + antagonismo D2."},{"id":"SL3-Q4","sp":"SP3","prova":"Slides 2026 (inferida)","selo":"IN","tipo":"caso","tema":"Antieméticos","enun":"Mulher de 28 anos, 9 semanas de gestação, com náuseas matinais e sialorreia. Segundo a aula, o antiemético de escolha e um efeito adverso esperado são:","itens":[],"opts":["Ondansetrona — síndrome extrapiramidal","Dimenidrinato — sedação e aumento de apetite/peso","Escopolamina — galactorreia","Metoclopramida — constipação"],"ans":1,"why":"Anti-H1 (dimenidrinato, meclizina): cinetose, vômito por substância local no estômago, náuseas matinais da gravidez, labirintite. EA: sedação, tontura, ↑apetite, ↑peso (+ antimuscarínicos: xerostomia, retenção). Dramin® 25/50/100 mg."},{"id":"SL3-Q5","sp":"SP3","prova":"Slides 2026 (inferida)","selo":"IN","tipo":"sequência","tema":"Êmese por quimioterapia","enun":"Associe o risco emetogênico do esquema quimioterápico à profilaxia recomendada na aula: (1) alto risco; (2) risco moderado; (3) baixo risco; (4) risco mínimo. ( ) dexametasona apenas ou metoclopramida · ( ) não usar antiemético profilático rotineiramente · ( ) antagonista 5-HT3 + dexametasona + aprepitanto nas primeiras 24 h · ( ) mesmo esquema do alto risco OU antagonista 5-HT3 + dexametasona","itens":[],"opts":["3 – 4 – 1 – 2","1 – 2 – 3 – 4","2 – 4 – 1 – 3","3 – 2 – 1 – 4"],"ans":0,"why":"Slide 'Recomendações para prevenção da êmese'. Aprepitanto (NK1) é o diferencial do alto risco, cobrindo a fase tardia (substância P)."},{"id":"SL3-Q6","sp":"SP3","prova":"Slides 2026 (inferida)","selo":"IN","tipo":"sentenças","tema":"Hepato","enun":"Sobre o ácido ursodesoxicólico (Ursacol®) e a silimarina, analise:","itens":["I. O UDCA reduz a secreção hepática e a absorção intestinal de colesterol, dissolve cálculos de colesterol e melhora o fluxo biliar; sua indicação principal na aula é o tratamento das colangites.","II. Após absorção, o UDCA é conjugado com glicina ou taurina, sofre recirculação êntero-hepática e tem meia-vida de cerca de 100 horas.","III. A silimarina (silibina, silicristina, silidianina) aumenta glutationa e superóxido-dismutase, reduz a peroxidação lipídica e inibe a ativação de NF-κB.","IV. O boldo (boldina) é o hepatoprotetor de escolha na esteatose alcoólica."],"opts":["I, II e III","I e IV","II e III","Todas"],"ans":0,"why":"IV falsa: boldo e alcachofra são coleréticos/colagogos (↑produção/secreção de bile), não hepatoprotetores — a esteatose é indicação da silimarina (280–420 mg/dia em 3 doses)."},{"id":"SL3-Q7","sp":"SP3","prova":"Slides 2026 (inferida)","selo":"IN","tipo":"direta","tema":"Pancreatina","enun":"Sobre os suplementos de enzimas pancreáticas (Creon®, Pankreoflat®), é INCORRETO afirmar:","itens":[],"opts":["Contêm amilase, lipase e proteases e são indicados na insuficiência pancreática exócrina (fibrose cística, pancreatite crônica, ressecção).","O tratamento inicia com 3 drágeas a cada refeição, passando depois para 1 a 2 drágeas às refeições.","Altas doses podem causar hiperuricemia/hiperuricosúria pelo elevado conteúdo de purinas, e o uso prolongado, deficiência de ácido fólico.","Devem ser administrados em jejum, longe das refeições, para evitar inativação pelo alimento."],"ans":3,"why":"São administrados A CADA REFEIÇÃO (agem no lúmen sobre a gordura da dieta); a dose é ajustada por peso, grau de insuficiência e gordura ingerida (20–30.000 UI de lipase por refeição)."},{"id":"AU19-Q1","sp":"SP3","prova":"Aula 19/09/2026","selo":"AU","tipo":"asserção-razão","tema":"Pró-cinéticos","enun":"Avalie as asserções e a relação entre elas, de acordo com o que foi discutido em aula.","itens":["I. O bloqueio dos receptores D2 no trato gastrintestinal por metoclopramida e bromoprida acelera o esvaziamento gástrico.","PORQUE","II. A dopamina atua como um freio sobre o nervo vago: ao se ligar a receptores D2, ela inibe a liberação de acetilcolina pelos neurônios motores mioentéricos."],"opts":["As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é verdadeira, e a II é falsa.","A asserção I é falsa, e a II é verdadeira.","As asserções I e II são falsas."],"ans":0,"why":"Ela repetiu essa frase várias vezes: a serotonina ESTIMULA a resposta vagal (5-HT3/5-HT4 → libera ACh) e a dopamina FREIA (D2 → inibe a liberação de ACh). Bloquear D2 = tirar o freio → ↑ACh → ↑peristalse e esvaziamento gástrico (efeito pró-cinético)."},{"id":"AU19-Q2","sp":"SP3","prova":"Aula 19/09/2026","selo":"AU","tipo":"caso","tema":"Antieméticos — gestante","enun":"Gestante de 10 semanas refere náuseas e vômitos pela manhã, associados a grande produção de saliva que ela engole em jejum. Qual a conduta e a justificativa farmacológica?","itens":[],"opts":["Ondansetrona 8 mg VO 8/8 h, por ser antagonista 5-HT3 e segura na gestação","Dimenidrinato ao deitar, porque o bloqueio muscarínico reduz a produção de saliva e ela acorda de boca seca","Metoclopramida 10 mg VO 8/8 h, por acelerar o esvaziamento gástrico","Escopolamina, por ser antiespasmódico e antiemético de escolha na gestação"],"ans":1,"why":"Ela explicou o mecanismo da náusea matinal: é por SIALORREIA. Por isso o anti-H1 de 1ª geração (dimenidrinato), que também bloqueia muscarínicos da glândula salivar, resolve — e prescrito à noite (ajuda o sono e ela acorda de boca seca). Ondansetrona fica para a HIPERÊMESE gravídica, que ela frisou não ser a mesma coisa."},{"id":"AU19-Q3","sp":"SP3","prova":"Aula 19/09/2026","selo":"AU","tipo":"caso","tema":"Síndrome extrapiramidal","enun":"Paciente relata: \"não posso tomar Plasil, tenho alergia\". Questionado, nega urticária e conta que ficou extremamente inquieto, angustiado, com falta de ar e vontade de sair correndo depois de uma dose intravenosa no pronto-socorro. Assinale a alternativa correta.","itens":[],"opts":["Trata-se de reação anafilactoide; deve-se registrar alergia à metoclopramida em prontuário","Trata-se de acatisia, manifestação da síndrome extrapiramidal; o risco é maior pela via intravenosa e o antídoto é o biperideno","Trata-se de efeito anticolinérgico central esperado, sem necessidade de intervenção","Trata-se de crise de ansiedade sem relação com o fármaco, podendo-se repetir a dose por via oral"],"ans":1,"why":"Aula 19/09: ela imitou exatamente essa fala do paciente. Acatisia (agitação, angústia, 'vontade de sair correndo') é SEP, não alergia. Ordem de gravidade: agitação/irritabilidade/insônia → acatisia → torcicolo + crise oculógira (aí entra o biperideno) → parkinsonismo medicamentoso. O risco é 'disparadamente maior' por via IV."},{"id":"AU19-Q4","sp":"SP3","prova":"Aula 19/09/2026","selo":"AU","tipo":"sentenças","tema":"Interações","enun":"Sobre as interações discutidas em aula, analise:","itens":["I. Os agentes pró-cinéticos aceleram o trânsito no estômago e no início do intestino delgado e, por isso, podem reduzir a absorção de alimentos e de outros fármacos administrados no mesmo período.","II. Os laxantes estimulantes, por atuarem no cólon, reduzem a eficácia de medicamentos de uso oral como os anticoncepcionais.","III. A ondansetrona tem a absorção prejudicada pela presença de alimento, devendo ser tomada em jejum.","IV. A meia-vida da ondansetrona é variável entre indivíduos por polimorfismo enzimático, o que justifica intervalos de 8/8 h ou até 6/6 h."],"opts":["I e IV","I, II e III","II e III","Todas"],"ans":0,"why":"II é falsa e foi dita nominalmente: os estimulantes agem no cólon, DEPOIS do local de absorção — não reduzem a eficácia do anticoncepcional; quem faz isso é o pró-cinético. III é falsa: o alimento até AJUDA a absorção da ondansetrona."},{"id":"AU19-Q5","sp":"SP3","prova":"Aula 19/09/2026","selo":"AU","tipo":"direta","tema":"Domperidona","enun":"Sobre a domperidona, de acordo com a aula, assinale a alternativa CORRETA:","itens":[],"opts":["É um bom antiemético central, por bloquear receptores D2 na zona de gatilho quimiorreceptora","Só tem efeito antiemético quando a substância irritante ainda está no estômago; na prática é prescrita para a doença do refluxo gastroesofágico","Não aumenta a prolactina, pois não atravessa a barreira hematoencefálica","É a primeira escolha para vômitos induzidos por quimioterápicos"],"ans":1,"why":"Ela avisou que o livro classifica a domperidona como antiemética e que isso confunde: a penetração no SNC é baixa, então ela 'praticamente não age no centro do vômito'. Serve se a substância está só no estômago (irritação local). Na prática: DRGE do RN (2–3 meses, até o EEI amadurecer) e agudização no adulto. A prolactina sobe porque a ADENO-HIPÓFISE está fora da BHE."},{"id":"AU19-Q6","sp":"SP3","prova":"Aula 19/09/2026","selo":"AU","tipo":"lacunas","tema":"Síndrome extrapiramidal","enun":"Complete a cadeia da síndrome extrapiramidal como ela descreveu: 'Os receptores ___ estão distribuídos por todo o cérebro. Na área ___ saem as fibras ___ para as placas motoras, que são freadas pela dopamina. Ao bloquear esses receptores, essas fibras ficam superestimuladas e liberam acetilcolina sobre receptores ___ da junção neuromuscular, gerando espasmos.'","itens":[],"opts":["D2 – nigroestriatal – colinérgicas – nicotínicos","D1 – mesolímbica – dopaminérgicas – muscarínicos","D2 – tuberoinfundibular – colinérgicas – muscarínicos","5-HT3 – nigroestriatal – serotoninérgicas – nicotínicos"],"ans":0,"why":"Detalhe da aula que não está no slide: os receptores da placa motora são NICOTÍNICOS. O slide para em 'excessiva resposta colinérgica'. Nas lacunas antigas ela cobrava 'D2 / colinérgicas / acetilcolina'."},{"id":"AU19-Q7","sp":"SP3","prova":"Aula 19/09/2026","selo":"AU","tipo":"sentenças","tema":"Anti-H1","enun":"Sobre os anti-histamínicos usados como antieméticos, analise:","itens":["I. Dimenidrinato, cinarizina, meclizina e hidroxizina são anti-histamínicos de primeira geração e bloqueiam H1 central e receptores muscarínicos.","II. Loratadina, desloratadina, fexofenadina e cetirizina não atravessam a barreira hematoencefálica e, por isso, não têm efeito antiemético nem causam sedação.","III. O aumento do apetite explica a venda de meclizina e buclizina para crianças que não comem.","IV. Ao descrever o mecanismo, o termo correto é 'anticolinérgico', pois inclui os receptores nicotínicos envolvidos no efeito."],"opts":["I, II e III","I e IV","II, III e IV","Todas"],"ans":0,"why":"IV é falsa e ela insistiu nisso: escreva ANTIMUSCARÍNICO. 'Anticolinérgico' generaliza e inclui receptor nicotínico, que não participa desse efeito. (Nos antiespasmódicos, ainda: M3 — bloquear M2 daria parada cardíaca.)"},{"id":"AU19-Q8","sp":"SP3","prova":"Aula 19/09/2026","selo":"AU","tipo":"direta","tema":"Hepato","enun":"Segundo a aula, a indicação da silimarina (cardo mariano) é:","itens":[],"opts":["Colangite e demais doenças colestáticas, por aumentar o fluxo biliar","Esteatose hepática — inclusive em jovens, grau 1–2, por questões alimentares — sempre associada a dieta e abstinência de álcool","Dissolução de cálculos biliares de colesterol em pacientes inoperáveis","Insuficiência pancreática exócrina, por conter enzimas digestivas"],"ans":1,"why":"Ela foi categórica: a indicação da silimarina é a esteatose ('vivemos quase uma epidemia em jovens'). Colangite/colestase e cálculo em inoperável = UDCA. 'Silimarina' é o nome do conjunto de substâncias extraídas do cardo mariano — prescrever um ou outro dá no mesmo."},{"id":"AU19-Q10","sp":"SP3","prova":"Aula 19/09/2026","selo":"AU","tipo":"caso","tema":"Êmese por quimioterapia","enun":"Paciente em quimioterapia com doxorrubicina + ciclofosfamida chega para o 3º ciclo e começa a vomitar ainda durante a hidratação, antes da infusão. Qual a classe indicada e por quê?","itens":[],"opts":["Antagonista NK1 (aprepitanto), porque a substância P está aumentada","Benzodiazepínico (lorazepam/alprazolam), porque se trata de náusea e vômito antecipatórios, de origem ansiosa","Antagonista 5-HT3 em dose dobrada, porque houve falha terapêutica","Dexametasona isolada, por reduzir a resposta inflamatória"],"ans":1,"why":"Aula 19/09: a partir do 2º ciclo o paciente 'vomita só de chegar, às vezes ainda na hidratação, por ansiedade' — é o vômito ANTECIPATÓRIO, condicionado; o benzodiazepínico entra nos dias que antecedem a quimio e faz parte do protocolo. O aprepitanto é para a fase tardia; a dexametasona segue em casa."},{"id":"AU19-Q11","sp":"SP2","prova":"Aula 19/09/2026","selo":"AU","tipo":"sentenças","tema":"Laxantes estimulantes","enun":"Sobre o uso crônico de laxantes estimulantes, conforme discutido em aula, analise:","itens":["I. A perda de eficácia ocorre porque as terminações nervosas se dessensibilizam — uma defesa do neurônio ao estímulo repetido — levando o paciente a aumentar a dose.","II. A melanose colônica é vista na colonoscopia como uma mucosa vermelho-amarronzada e indica processo inflamatório em curso.","III. A síndrome do cólon preguiçoso instala-se em poucos dias de uso.","IV. A intolerância à lactose com diarreia lesiva de repetição pode produzir o mesmo processo inflamatório crônico no intestino."],"opts":["I, II e IV","I e III","II e III","Todas"],"ans":0,"why":"III é falsa: ela falou em 10, 15, 20 meses de transição entre o ciclo vicioso e o cólon preguiçoso — e é nessa janela que aparece a melanose colônica. O item IV é um acréscimo da aula (não está no slide)."},{"id":"AU19-Q12","sp":"SP2","prova":"Aula 19/09/2026","selo":"AU","tipo":"direta","tema":"Prucaloprida","enun":"Sobre a prucaloprida, conforme a aula:","itens":[],"opts":["Agonista 5-HT4 nas fibras colinérgicas do plexo mioentérico, que liberam acetilcolina e contraem o músculo liso; 1–2 mg/dia; não disponível no SUS","Antagonista 5-HT3 no plexo mioentérico, indicada como primeira linha na constipação secundária","Agonista de receptores opioides μ2, com efeito laxante por aumento da secreção","Laxante osmótico de segunda geração, disponível na atenção básica"],"ans":0,"why":"Ela detalhou: a serotonina em 5-HT4 estimula a fibra vagal/colinérgica a liberar ACh → contração. Indicação: falha dos osmóticos. EA: náusea (há 5-HT4 no estômago) e diarreia. Não tem no SUS."}],"res":[{"spk":"SP1","spn":"Diarreia / DII","h":"1. O que é diarreia para ela — e os 4 tipos","p":["Diarreia = desequilíbrio entre absorção e secreção de água/eletrólitos (não é só \"número de evacuações\" — AU 04/09). Mecanismos: ↓absorção de Na⁺ e ↑secreção de Cl⁻; alteração da motilidade; ↑osmolaridade luminal; ↑pressão hidrostática."],"l":[]},{"spk":"SP1","spn":"Diarreia / DII","h":"2. Diarreia aguda: os 3 pilares (TRO · alimentação · zinco)","p":["Indicada em todos os tipos de diarreia (T7 QD3). Custo-efetiva, reduz internação, tem no SUS. Vômito intenso → venosa (SF 0,9%, 20 mL/kg rápida; a \"ultrarrápida\" 60 mL/kg dá mais hipernatremia — artigo).","<6 meses: 10 mg/dia · >6 meses: 20 mg/dia · 1×/dia por 10–14 dias (aula: \"10 a 20 dias\"). Qualquer sal de zinco. Imunomodulador + antissecretor; reduz gravidade e episódios subsequentes em <5 anos. Desnutrido → avaliar vitamina A. Tem no SUS.","AU 04/09: \"Santa Catarina teve nota oficial para todos os hospitais: paciente com suspeita de infecção por rotavírus/norovírus deve ser tratado com zinco — qualquer sal.\" · \"Se for bacteriana não; sendo viral, é a recomendada.\" · Artigo Brandt: em países ricos o benefício é restrito a grupos de risco (<5 a, desnutrição, episódios prévios)."],"l":[]},{"spk":"SP1","spn":"Diarreia / DII","h":"3. Antissecretor: racecadotrila — a pegadinha nº 1 da UC","p":["RACECADOTRILA ⊣ encefalinase → ↑ meia-vida das encefalinas → ↓ secreção Enterócito / músculo liso — receptores opioides μ2 → motilidade ↓ δ → secreção ↓ Encefalinas (poupadas pela racecadotrila) = AGONISTAS endógenos → ↓ secreção de água e eletrólitos (diarreia secretora) Loperamida / difenoxilato = AGONISTAS exógenos (μ periférico) → ↓ motilidade, ↑ absorção, ↑ tônus do esfíncter anal Nunca \"antagonista / bloqueia\" (T4 Q1, T7 Q12-V) Fig. 2 — Racecadotrila inibe a encefalinASE (enzima) → sobram encefalinAS (agonistas μ2/δ) → menos secreção. Loperamida age direto no receptor. Racecadotrila (Tiorfan®/Avide®): 1,5 mg/kg 3×/dia · sachê 10 e 30 mg (pediátrico) · comprimido 100 mg 8/8 h · máx 400…"],"l":[]},{"spk":"SP1","spn":"Diarreia / DII","h":"4. Antimotilidade: loperamida, difenoxilato, alosetrona","p":["Agonista de receptores opioides μ periféricos (μ2 motilidade; δ secreção; absorção μ2 + δ). Não cruza a BHE (segura, sem efeito central). ↑tempo de trânsito, ↑tônus do esfíncter anal; antissecretora contra toxina da cólera/E. coli (Gi → ⊣ adenilato-ciclase). Pico 3–5 h; metabolismo hepático.","4 mg (2 cp de 2 mg) → 2 mg após cada evacuação · máx 16 mg/dia (veterana: \"2 mg de 4/4 h; normalmente 2 cp resolvem\").","Usar: coadjuvante em quase toda diarreia crônica (SII, pós-colecistectomia refratária a colestiramina, \"oscila a pressão\"), diarreia por estresse, aguda leve não infecciosa."],"l":[]},{"spk":"SP1","spn":"Diarreia / DII","h":"6. Microbiota: prebióticos, probióticos, simbióticos","p":["Microrganismos vivos em quantidade adequada. Mecanismo na diarreia aguda (artigo + T9 Q9): antagonismo/exclusão de patógenos + imunomodulação + efeito trófico → ↓duração e internação. Mais estudados: S. boulardii (250–750 mg/dia, 5–7 d) e Lactobacillus GG (≥10¹⁰ UFC/dia); L. reuteri 10⁸–4×10⁸; L. acidophilus LB.","Gêneros: Lactobacillus (pH), Bifidobacterium (AGCC; caros), Saccharomyces (levedura, barato, \"repositor de flora\" do SUS). Marcas: Floratil®/Repoflor® (S. boulardii), Enterogermina® (B. clausii), Beneflora®, 20 Bi®.","Simbiótico = probiótico + prebiótico; o prebiótico típico é FOS (Simbioflora® 5 g, manhã, diário/alternado)."],"l":[]},{"spk":"SP1","spn":"Diarreia / DII","h":"7. Doença inflamatória intestinal — aminossalicilatos (5-ASA)","p":["DII e SII: etiologia pouco conhecida → tratamento por gravidade (pirâmide). AINE comum não serve (dano GI/renal, inflamação persistente) → precisa de anti-inflamatório tópico no cólon. 5-ASA = ácido salicílico + amino na posição 5; 1ª linha na RCU leve/moderada (induz e mantém remissão); no Crohn, 1ª linha na doença leve/moderada de cólon/íleo distal (eficácia não comprovada). Eficácia depende de concentração alta no local → formulações que evitam absorção proximal (80% do 5-ASA livre é absorvido no delgado)."],"l":[]},{"spk":"SP1","spn":"Diarreia / DII","h":"9. Os números que ela dita (cola de véspera)","p":[],"l":["SRO reduzida: Na 75 · K 20 · Cl 65 · citrato 10 · glicose 75 (padrão: 90/20/80/10/111) · 1 sachê/1 L · caseiro 3,5 g sal + 20 g glicose + 1,5 g KCl + 2,9 g citrato.","Zinco 10 mg (<6 m) / 20 mg (>6 m), 10–14 dias.","Racecadotrila 100 mg 8/8 h; 1,5 mg/kg 3×; sachês 10/30 mg; máx 400 mg.","Loperamida 4 mg → 2 mg/evacuação; máx 16 mg; pico 3–5 h; não <2 anos.","Difenoxilato 2,5 mg + atropina; 2 cp → 1 cp 3–4 h; máx 8/dia; SNC em 40–60 mg."]},{"spk":"SP1","spn":"Diarreia / DII","h":"Banco SP1 — todas as questões de diarreia/DII que já caíram (clique na alternativa)","p":["Ordem: da mais simples/antiga à mais recente (T11 = estilo atual). Discursivas têm \"ver resposta esperada\". Em asserção-razão, leia a II perguntando \"isso explica a I?\"."],"l":[]},{"spk":"SP1","spn":"Diarreia / DII","h":"Descritiva integrativa (formato T12 esperado: caso + 3 sub-itens, ~2,0 pts)","p":["Caso. Violeta, 34 anos, colecistectomizada há 5 meses, usa mesalazina e loperamida diariamente há 4 meses desde o diagnóstico de doença inflamatória intestinal. Procura a UBS com diarreia aquosa há 2 dias, febre de 38,5 °C e cólicas, após um churrasco. Está com sede, sem sinais de desidratação grave.","Item 1 (0,6): mesalazina = 5-ASA de liberação entérica pH-dependente → ação tópica no íleo/cólon, ⊣ COX e NF-κB (0,2); indicação: inflamação crônica da DII/manutenção (0,1). Loperamida = agonista opioide μ2 periférico → ↓motilidade/↑absorção; indicação: diarreia crônica de motilidade pós-colecistectomia (sais biliares) refratária a colestiramina (0,2). Riscos: loperamida contínua em DII ativa de cólon → megacólon tóxico; mascara infecção; mesalazina crônica → lesão tubular renal (dose alta), absorção maior com mucosa inflamada (0,1).","Item 2 (0,8): TRO com SRO de baixa osmolaridade (Na 75/glicose 75), 1 sachê em 1 L, fracionado, repor perdas (0,25); manter alimentação (0,05); SUSPENDER a loperamida — diarreia infecciosa/intoxicação alimentar com febre: reter toxina → sepse/megacólon (0,3); opcional: racecadotrila 100 mg 8/8 h como antissecretor adjuvante se secretora profusa (0,1); antibiótico NÃO de rotina (só cólera/shigelose grave) (0,1). Zinco: adulto não é rotina (indicação em <5 anos/desnutrido) — citar corretamente vale, prescrever \"20 mg 10–14 d\" para adulto não tira ponto se justificar como grupo de risco."],"l":["(0,6) Explique como atuam mesalazina e loperamida e qual a indicação de cada um no caso dela. Há risco no uso continuado? Justifique.","(0,8) Qual a conduta farmacológica para o episódio AGUDO de hoje? Cite fármaco(s), dose e posologia, e diga explicitamente um fármaco que ela deve suspender e por quê.","(0,6) Que medidas farmacológicas e não farmacológicas você orienta para recuperar a microbiota após o episódio? Explique o papel de cada uma.","Cite um fármaco contraindicado na diarreia por intoxicação alimentar e justifique. (T11 QD3)","Qual o tratamento indicado para todos os tipos de diarreia aguda? Cite composição e por que a baixa osmolaridade. (T7 QD3 + T5 Q6)"]},{"spk":"SP1","spn":"Diarreia / DII","h":"🎧 Frases-lei da aula de 04/09/2026 (SP1 + início da SP2)","p":[],"l":["[00:00] \"A UC14 é muito mais simples que a UC13; na UC15 o volume pega de novo.\" Antibiótico para infecção intestinal = UC15. Base da DII (biológicos) = 7ª fase.","[04:34] \"A ênfase farmacológica é na diarreia crônica (motilidade: SII, pós-colecistectomia). Aguda = hidratar + microbiota ± adsorvente (toxina) ± antibiótico (infecção).\"","[24:41] \"Tudo isso que eu falei — exceto ZINCO e SRO — não tem no SUS\" (carvão, colestiramina, policarbofila, bismuto, racecadotrila). [48:25] RENAME: probióticos só isolados — lactobacilos, bifidobactérias, Saccharomyces (o mais barato).","[05:49] ✔ Antidiarreico com qualquer hipótese de infecção/intoxicação → sepse, megacólon. \"Só depois de descartar.\"","[06:46] Norovírus/rotavírus: sintomático; nitazoxanida = off-label, sem protocolo. Protocolo existe para zinco e SRO."]},{"spk":"SP2","spn":"Constipação","h":"1. Definição, tipos e diagnóstico","p":["Constipação não é só frequência: esforço, consistência (Bristol) e sensação de evacuação incompleta contam igual. Frequência normal varia de 2×/dia a 1× a cada 2–3 dias. Manobra manual para evacuar já é constipação (AU). Motilidade depende de 3 processos: peristalse coordenada (músculo liso + SNA + hormônios), transporte de água/eletrólitos pela mucosa, reflexos evacuatórios (receptores no canal anal superior/ampola retal + esfíncter interno).","Doenças que a constipação agrava (slide): angina; hemorroidas (sangramento → porta de infecção). Medida não farmacológica é sempre associada, seja qual for o tipo."],"l":["Sem causa orgânica: pouca água, pouca fibra, sedentarismo; mais em mulheres (progesterona antimotilidade).","Tratamento: mudança de hábito (fibra 25–30 g/dia + 1,5–2,5 L de água) ± formadores de massa.","Fármaco (antimuscarínicos: ADT, anti-histamínico; opioides μ2; ferro, Ca, Al) ou doença (hipotireoidismo, DM, Parkinson, tetraplegia).","Hábito não resolve → laxante contínuo, menor dose possível: osmótico (lactulose no SUS; macrogol)."]},{"spk":"SP2","spn":"Constipação","h":"2. Não farmacológico: água + fibras (é o \"tratamento de eleição\")","p":["Água ≥1,5 L/dia (mais no verão): o cólon descendente reabsorve água → fezes duras. Fibras (parte do alimento que resiste às enzimas e chega inalterada ao cólon), inseridas progressivamente (inchaço, flatulência). Efeitos da fermentação: (1) AGCC tróficos para o epitélio; (2) ↑massa bacteriana (⅓ do peso fecal é bactéria). Fermentação reduz a água das fezes, mas AGCC são pró-cinéticos e a massa bacteriana amplia o volume. Fibras insolúveis/pouco fermentáveis (lignina) são as mais eficazes em ↑volume e ↑velocidade de trânsito."],"l":[]},{"spk":"SP2","spn":"Constipação","h":"3. Classes de laxantes — o quadro que cai inteiro","p":["Laxantes agem por: ↑retenção de líquido (hidrofílico/osmótico) · ↓absorção de líquido (transporte) · ↑motilidade propulsora / ↓segmentar."],"l":[]},{"spk":"SP2","spn":"Constipação","h":"🎧 O que ela FALOU na aula 1 (04/09, minutos 67–90)","p":[],"l":["[69:17] ✔ \"Na constipação secundária não importa o que o paciente faça — a paciente com amitriptilina vai usar laxante; só escolhemos o tipo.\"","[70:00] ✔ Roma IV/Bristol: \"tipo 4 é o ideal, 3 e 5 oscilam, 6–7 diarreia, 1–2 constipado\"; tenha a folha de Bristol impressa na UBS; ensine o paciente a olhar as fezes.","[71:40] ✔ Dois pacientes \"quase obrigatórios\" para laxante: angina (esforço) e plexo hemorroidário inflamado (dor → segura → endurece → ciclo).","[74:18] ✔ Fibra insolúvel arrasta a água que já tem dentro; solúvel pega água do meio → garantir que beba água; introdução lenta e gradual (gases). ⚠ \"~50% do bolo fecal = bactérias mortas\".","[77:57] ✔ Formadores (psyllium, metilcelulose, Plantago — sachê/geleia) = \"para quem bebe água mas não com
