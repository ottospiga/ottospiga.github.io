a receptores opioides\"","v":"AGONISTA μ2 (motilidade) e δ (secreção); não cruza BHE; pico 3–5 h; 4 mg → 2 mg/evacuação, máx 16 mg/dia; ↑tônus do esfíncter anal","e":"OF T4 Q1 (C: I V, II F) · T7 Q12-V falsa"},{"p":"Loperamida em diarreia aguda \"de intoxicação alimentar\"","v":"CONTRAINDICADA em infecção/intoxicação (retém toxina → sepse, megacólon tóxico) e em <2 anos. Usar: crônica (SII, pós-colecistectomia refratária a colestiramina, estresse), coadjuvante.","e":"OF T11 QD3 (aceita) · T5 QD5 (correção \"loperamida\") · T7 QD1 ✓"},{"p":"Alosetrona \"aumenta a atividade vagal\"","v":"Antagonista 5-HT3 → ↓ resposta vagal, ↓ reflexos peristálticos, ↓ trânsito colônico; só SII com diarreia; 1 mg/dia (máx 2×); EA constipação","e":"VE T4 Q2-I falsa · T9 Q8-V verdadeira · OF T11 Q10 (alosetrona = diarreia SII)"},{"p":"Zinco \"100 mcg/dia\"; \"só se bacteriana\"","v":"10 mg (<6 m) / 20 mg (>6 m), 1×/dia, 10–14 dias; imunomodulador + antissecretor; SC: nota oficial p/ tratar suspeita viral com zinco","e":"OF T11 Q13-I verdadeira · VE T9 Q8-II falsa · AU 04/09"},{"p":"SRO \"contém sacarose, magnésio\"; \"baixa osmolaridade causa hipernatremia/hipoglicemia\"","v":"Composição: Na, K, Cl, citrato, glicose. Baixa osmolaridade (Na 75, glicose 75, ~245 mOsm): menos vômito, menos evacuação, menos hipernatremia, menos TRV. Indicada em TODA diarreia.","e":"OF T5 Q6 (E: ambas falsas) · VE T4 Q3 (B) · T9 Q8-I V"},{"p":"\"Fibras solúveis digeríveis como celulose\"","v":"Solúveis = não digeríveis, fermentáveis (pectina, aveia, psyllium, FOS) = prebióticos; insolúveis (celulose, lignina) não fermentam, só dão volume","e":"VE T4 Q4-I falsa · OF T6 Q12 (B)"},{"p":"Probióticos \"com fibras insolúveis\"","v":"Probiótico + fibra SOLÚVEL (+ água, se constipação). Mais estudados: S. boulardii, L. GG, L. reuteri. Simbiótico = pro + pre (FOS).","e":"OF Ativ T5 (F) · T11 Q13-IV V"},{"p":"Sulfassalazina libera \"duas moléculas anti-inflamatórias\"","v":"Azorredutase → mesalazina (anti-inflamatória) + sulfapiridina (ANTIMICROBIANA). Indicação-alvo dela: DII com colonização bacteriana/infecção latente (T11 QD2). EA sistêmicos vêm da sulfapiridina.","e":"OF T11 QD2 ✓ · T5 Q11 (D) · VE T9 Q1-V falsa (\"infecções agudas\")"},{"p":"Mesalazina \"hidrolisada por azorredutase\"","v":"Mesalazina = cápsula de liberação entérica pH-dependente (7–8). Azorredutase só para compostos azo: sulfassalazina, olsalazina (→ 2 mesalazinas), balsalazida. SUS: mesalazina.","e":"VE PM T4 Q3 (I F) · AU veterana"},{"p":"5-ASA \"inibe PLA2\" / \"inibe COX-2 sistemicamente\"","v":"Ação tópica: inibe COX (PG) + NF-κB + funções de linfócitos/macrófagos; contraindicado se alergia grave a salicilato","e":"OF T6 Q15 (III F) · VE T9 Q1-I F"},{"p":"Colestiramina \"inibe secreção de água\"; \"esteatorreia\"","v":"Sequestra sais biliares (resina); 4 g até 4×/dia, ≤2–3 meses (hipovitaminose A/D/E/K, adsorve outros fármacos); refratário → loperamida","e":"OF Ativ T5 (F) · T7 Q12-II V"},{"p":"Carvão ativado em \"infecção alimentar\"","v":"Adsorvente 250 mg: intoxicação (toxina no lúmen), não infecção; CI se suspeita de obstrução","e":"OF T6 Q2-I V · T7 Q12-I V · AU"},{"p":"Bisacodil \"causa dependência por receptor opioide\"; cólon preguiçoso \"pelo esvaziamento\"","v":"Irritante → inflamação crônica → dessensibilização/degeneração das terminações mioentéricas (cólon preguiçoso, melanose). Ciclo vicioso: esvazia TODO o cólon → demora a encher → paciente \"se acha constipado\" → repete. Menor dose, menor tempo.","e":"OF T11 QD1 · T6 QD1 · Ativ T6 Q1 (A) · T6 Q7"},{"p":"Macrogol \"causa desidratação, não usar em idosos/crianças\"","v":"Falso. PEG/macrogol = inerte, não fermenta (sem cólica), escolha em gestante e constipação refratária; crianças (manipular). Não tem no SUS.","e":"OF T5 Q7-II F (\"é recomendado!\") · T7 Q4 (C macrogol) · AVA T11 Q5"},{"p":"Antracênicos \"bloqueiam 5-HT3\"","v":"Sene/cáscara = irritantes (PG/AMPc, NO/GMPc). \"Chá das FOLHAS\" = sene (cáscara-sagrada = casca). Melanose colônica.","e":"OF T5 Q7-III F · T6 Q4 (A sene)"},{"p":"Lactulose \"contraindicada em gestante/idoso\"; \"age em 2–4 h\"","v":"Lactulose (SUS, 15–30 mL até 4×) = 1ª linha na constipação SECUNDÁRIA, crianças <10 a, idosos, gestantes (dose baixa: flatulência confunde com contração); osmóticos agem em 24–48 h; fermenta → gases/cólica; útil na encefalopatia hepática","e":"OF T7 Q5 (A) · T7 Q13-IV F · Ativ T5 (V) · VE PM T4 Q7-V F"},{"p":"Formadores de massa \"para constipação secundária\"","v":"Psyllium/metilcelulose/policarbofila = PRIMÁRIA (corrigir hábito) + ÁGUA obrigatória; ≥24 h para agir; evitar em cólon atônico/impactação. Sem eficácia na secundária (T6 QD3).","e":"OF T6 QD3 · T8 QD3 · T7 Q11 (A) · AVA T11 Q4-I F"},{"p":"Prucaloprida \"ativa canais de cloreto\"; \"para SII\"","v":"Prucaloprida = agonista 5-HT4 → ↑ACh → peristalse; 2 mg 1×/dia; SÓ constipação crônica refratária a laxantes (nunca inicial). Lubiprostona = ativa ClC-2 (secretor), SII-C/crônica.","e":"OF T11 Q10 (A) · T11 Q12 (III F) · T7 Q6 (E) · VE T9 Q7"},{"p":"Constipação por antidepressivo/opioide → \"policarbofila\"","v":"Secundária → osmótico (macrogol/lactulose); mecanismo do ADT = bloqueio muscarínico (não 5-HT3); SUS → lactulose","e":"OF T6 Q6 (A macrogol) · Ativ T6 Q3 (lactulose ✓; \"bloqueia receptor muscarínico\")"},{"p":"Glicerina \"via oral\"; enemas \"de rotina\"","v":"Glicerina = só retal (supositório 2–3 g / enema 5–15 mL 80%), <1 h, dose única/dia; enemas de fosfato = coadjuvante de preparo/impactação; repetidos → hipoCa, hiperP, hiperNa, hipoK","e":"OF T11 Q12 (I, II V)"},{"p":"Óleo mineral","v":"Emoliente; CI <12 a, acamado, DRGE, disfagia (pneumonia lipídica)","e":"AU slides 2026"},{"p":"SEP \"por bloqueio da resposta colinérgica\" / \"hiperestimulação colinérgica na hipófise e mesolímbica\"","v":"Metoclopramida bloqueia D2 em fibras COLINÉRGICAS nigroestriatais → desinibição → ↑ACh → distonia/rigidez/inquietação; IV > VO; tratamento = biperideno (não atropina). Galactorreia é outro sítio (adeno-hipófise).","e":"OF T6 Q1 (C) · T5 Q12 (A) · T7 Q14 (A) · T11 Q8a (atropina→biperideno) · VE T4 Q12 (B?) — ver divergências"},{"p":"Galactorreia \"no hipotálamo\"","v":"Bloqueio D2 na ADENO-HIPÓFISE → ↑prolactina. Domperidona/bromoprida/metoclopramida (metoclopramida off-label p/ lactação — T9 Q12).","e":"OF T5 Q4 (B) · PM Q2 (A) · T9 Q12 (A)"},{"p":"Domperidona \"mais efetiva que bromoprida porque seletiva no SNC\"","v":"Domperidona = periférica (não cruza BHE) → pró-cinética: ↑pressão do EEI, esvaziamento gástrico; sem ação no cólon; DRGE (lactente 6–8 m; adulto na agudização/regurgitação, associada ao IBP). EA: galactorreia, ginecomastia, ↓peso (lactente). Bromoprida = central + periférica (10 mg; SEP).","e":"OF T11 Q6 (A) · T11 QD4 (IBP + domperidona) · T5 Q3 (C) · PM Q1-IV F · PM Q12"},{"p":"Dimenidrinato \"5–50 mg\"; ondansetrona \"40 mg\"","v":"Dimenidrinato 25–100 mg; 1ª escolha gestante (sialorreia/antimuscarínico) e vestibular; H1 + M1/M3 → sonolência, xerostomia, retenção urinária, constipação, ↑apetite. Ondansetrona 4–8 mg.","e":"OF T7 Q3-IV F · T6 QD5 · T5 QD2"},{"p":"Ondansetrona \"também bloqueia muscarínico/NK1\"; \"para vestibular\"","v":"Só 5-HT3 (sem xerostomia); toxinas/quimio/pós-op; atenção básica; NÃO serve p/ vestibular; crônica → constipação. Quimio grave: dexametasona + ondansetrona.","e":"OF T7 Q2-V F · T6 QD2 · T7 Q8 (B) · VE T4 Q13"},{"p":"Bromoprida \"50 mg\"; \"agonista D2\"","v":"Bromoprida 10 mg (não 50); antagonista D2 (+5-HT3, M); mais efetiva para toxinas; SEP (IV). Associação 1–4: 1 bromoprida · 2 ondansetrona · 3 bromoprida/metoclopramida · 4 dimenidrinato.","e":"OF T6 Q8-III F · T5 Q5 (E) · PM Q3 (E) · VE T9 Q12-b F"},{"p":"Aprepitanto \"para qualquer êmese\"","v":"Antagonista NK1 (substância P); só quimio altamente emetogênica, fase tardia; 125 mg","e":"OF T9 QD2 · T6 Q8-V · T4 Q13-IV"},{"p":"Nabilona \"antagonista de receptores opioides CB1\"","v":"Agonista CB1 (canabinoide) — antiemético + orexígeno","e":"OF T7 Q2-II F · T11 Q7a"},{"p":"Escopolamina \"para gestante\"","v":"Antagonista M3: antiespasmódico (uso principal), cinetose; EA xerostomia, retenção, constipação","e":"OF T6 Q3 (D) · T7 Q2-I V"},{"p":"Gengibre","v":"Estimula secreções orais/gástricas; provável bloqueio 5-HT3 e NK1","e":"OF T7 Q2-III V"},{"p":"IBP \"1 h antes para melhorar a biodisponibilidade\"","v":"Jejum (30–60 min antes da refeição) favorece a bioativação nos canalículos (H⁺ → sulfenamida tetracíclica → ligação covalente irreversível à H⁺/K⁺-ATPase), não a biodisponibilidade. Cápsula entérica porque o fármaco se degrada/ioniza no ácido. Meia-vida ~1 h, efeito 2–3 dias. Omeprazol 20–40 mg 1×/…","e":"OF T11 Q1 (C) · T6 Q14 · T7 Q15-V V · VE T4 Q8-I F"},{"p":"\"Pantoprazol é o mais potente\"","v":"Esomeprazol = enantiômero S puro → mesma resposta com dose menor (dexlansoprazol idem p/ lansoprazol)","e":"OF T7 QD2 (X em pantoprazol) · T11 Q3-b F"},{"p":"Omeprazol + clopidogrel \"risco de sangramento\"; \"inibe CYP2C9\"","v":"Omeprazol/esomeprazol inibem CYP2C19 → clopidogrel (pró-fármaco) não ativa → trombose/IAM; CYP3A4 → bioacumulação; CYP17 → ↑progesterona → libido↓, ginecomastia, galactorreia; ↑pH ↓ absorção do AAS. Pantoprazol/famotidina/vonoprazana são alternativas.","e":"OF T6 Q11 (C) · T7 Q1 (C: 2C9 F) · T8 QD2 · VE T9 Q2-V F · T5 Q8 (C)"},{"p":"IBP crônico: \"hipercloridria induzida pela gastrina\"; \"barreira física\"; \"B12 absorvida no cólon\"","v":"Hipocloridria → ↓Ca (→PTH→osteoporose), ↓Mg (mialgia), ↓Fe, ↓B12 (↓secreção de fator intrínseco; absorção no íleo), ↓pepsina (pH<4) → ↓triptofano (ansiedade/insônia), ↓HCl antimicrobiano (infecções, diarreia), hipergastrinemia (rebote, tumores). Agudo já dá mialgia (Mg).","e":"OF T11 Q2 (C) · T5 Q9 (A) · T7 QD5/6 · T9 QD4 · VE T6 Q13"},{"p":"Famotidina \"10 mg\"; \"ativada pela gastrina\"; \"para gastrite/úlcera\"","v":"20 mg à noite, antagonista competitivo H2 (histamina), ↓>50% da secreção; escolha para uso crônico / dispepsia funcional / pirose matutina (poupa CYP); não cicatriza úlcera","e":"OF T6 QD4 · PM Q9 · T7 Q15-II F · T11 Q3"},{"p":"Vonoprazana \"estimula muco e bicarbonato\"","v":"PCAB: inibe reversivelmente competindo com K⁺, sem bioativação, qualquer horário; úlcera/H. pylori; cara; muitas interações CYP","e":"OF T6 Q14-IV F · T7 Q15-III V · VE T4 Q8-IV V"},{"p":"Antiácidos trocados","v":"Mg(OH)₂ rápido → diarreia · Al(OH)₃ lento → constipação · CaCO₃ eructação + rebote via células G/gastrina · NaHCO₃ base forte, rápido, alcalose, CI hipertenso/IR, rebote por ↑pH. Tomar 1 h APÓS a refeição. Uso agudo/ocasional.","e":"OF T11 Q5 (B) · T6 Q10 · T5 QD6 · T9 QD1 (correção: CaCO₃ e NaHCO₃) · IN T11 Q4 = C"},{"p":"Sucralfato \"hidróxido de cálcio\"; \"neutraliza o ácido\"; \"rápida dissociação\"","v":"Sacarose-octassulfato + Al(OH)₃; em pH ácido forma pasta viscosa (lenta) que adere à úlcera ~6 h; estimula PG, muco e bicarbonato; 1 g 4×/dia em jejum; gastroprotetor ambulatorial associado ao IBP","e":"OF T7 Q9 (B) · T9 Q3 (C — \"ambulatorial\" exclui misoprostol) · T11 Q3-d"},{"p":"Misoprostol \"1ª linha ambulatorial\"","v":"Análogo de PGE1: ↓ácido + ↑muco/bicarbonato; hospitalar/off-label para úlcera por AINE; abortivo; diarreia/cólica","e":"OF T4 Q9 (C) · T9 Q3"},{"p":"Espinheira-santa \"trata úlcera/H. pylori\"","v":"Chá das folhas: ↓secreção ácida + ↑muco/bicarbonato; gastrite leve/dispepsia; não úlcera nem H. pylori. Couve: muco.","e":"OF T7 Q15-I V · T6 Q9"},{"p":"Hospital: gastrite erosiva + regurgitação","v":"Omeprazol IV + bromoprida IV (misoprostol IV não existe; ondansetrona não é pró-cinética)","e":"IN T11 Q11 (Danielli marcou A e errou → B)"},{"p":"\"Boldo é hepatoprotetor\"; \"UDCA para esteatose\"","v":"UDCA (ácido ursodesoxicólico) = colangites/colestase, dissolve cálculo de colesterol (não é 1ª linha — cirurgia), 10 mg/kg/dia · Silimarina (cardo mariano) = hepatoprotetor: esteatose alcoólica/não alcoólica, hepatites, toxinas · Boldo (boldina) = colerético/colagogo, NÃO protege · Pancreatina = in…","e":"OF T9 Q4 (A) · PM Q11 (UDCA + pancreatina) · VE T11 Q14 (A: colangite = UDCA; esteatose = silimarina)"}],"divergencias":[{"onde":"T5 QD3 × T7 Q4 — laxante em gestante","prob":"Na T5 a resposta \"policarbofila cálcica\" foi aceita (C); na T7 o gabarito foi macrogol; o slide diz PEG/macrogol \"de escolha para grávidas\". O gabarito da veterana diz \"macrogol ou PEG\".","como":"Responder macrogol/PEG (osmótico não fermentável, sem cólica). Citar policarbofila só como alternativa formadora de massa (constipação primária)."},{"onde":"T4 Q12 — SEP asserção-razão","prob":"O aluno marcou B e o quadro mostra \"B ✗ / D circulado\"; a veterana Letícia conclui D (I falsa: desinibição só nigroestriatal; galactorreia não é SEP).","como":"Adotar D como INFERIDO. A lição: SEP ≠ galactorreia (sítios diferentes)."},{"onde":"T6 Q13 (C/D), Q14 (E/B), Q15 (C/E), Q10 (B/A), Q7 (E/C)","prob":"Quadro com duas letras (resposta do aluno + correção em vermelho) e a transcrição não separa com segurança qual é qual.","como":"Usei slides+veterana para inferir: Q7 = E (IV e V) · Q10 = B (Al = constipação) · Q13 = C ou D (item V \"CYP17 → ↑progesterona\" é verdadeiro pela aula → C) · Q14 = E (IV falsa) · Q15 = C (III falsa: PLA2). Todos marcados IN no banco."},{"onde":"T7 Q11 / Q12 / Q13","prob":"Texto da transcrição contradiz o quadro. Quadro: Q11 = A ✓, Q12 = B ✓, Q13 = B/C.","como":"Q11 = A (formadores de massa: ambas V e II justifica) · Q12 = B (I, II, IV) · Q13 = B (I, III, V) IN."},{"onde":"T11 Q3, Q4, Q11","prob":"Danielli errou (D, D, A). Gabarito correto não está escrito.","como":"Q3 = A (famotidina 20 mg/noite; b: pantoprazol ✗; c: seletiva ✗; d: \"rápida\" ✗) · Q4 = C carbonato de cálcio (células G/gastrina) · Q11 = B omeprazol IV + bromoprida IV — todos IN."},{"onde":"T9 Q7 e Q11","prob":"A aluna riscou itens que o gabarito considera verdadeiros (Q7-II \"purgação em 1–3 h em altas doses de sais de Mg\" e Q7-V prucaloprida 2 mg; Q11-V \"5-HT3 + dexametasona e/ou bromoprida\").","como":"Confie no gabarito da professora (Q7 = C; Q11 = A), não na marcação da veterana."},{"onde":"T11 Q8","prob":"Gabarito D (dimenidrinato bloqueia H1 e muscarínico → sonolência, ↑fome, xerostomia, retenção, constipação). O item C (prucaloprida 5-HT4 → ACh) também parece correto pelo slide.","como":"Ela considerou D. Possível pegadinha em C: \"estimulação vagal promove esvaziamento gastrintestinal\" / \"junção neuromuscular\". Anotar como OF D e discutir em aula se puder."},{"onde":"Veterana Letícia (gabarito de estudo)","prob":"Boa maioria coincide com os gabaritos oficiais, mas há erros dela: T6 Q4 ela marcou cáscara (gabarito: sene); T4 Q2 diz que alosetrona \"aumenta vagal\" é falso (correto, mas o gabarito da prova aceitou E = II, III, IV).","como":"Selos: o que bate com correção da professora = OF; o que é só dela = VE."},{"onde":"Ordem das aulas × roteiro da UC","prob":"O caderno da UC diz: SP1 laxantes/coleréticos · SP2 antidiarreicos/DII · SP3 antieméticos/hepato/pancreáticas · SP4 dispepsia. A Vânia deu diarreia primeiro (04/09) e já entrou em constipação.","como":"Nomeei os guias pelo TEMA (Diarreia+DII; Constipação; Antieméticos+Hepato; Dispepsia). Você me diz a ordem real das próximas aulas."}],"aulas":[{"a":"04/09","t":"00:00","g":"Avisos gerais / de prova","x":"\"A UC14 é muito mais simples que a UC13 — é uma folga, porque na UC15 o negócio pega de novo (volume de medicamentos).\""},{"a":"04/09","t":"01:33","g":"Avisos gerais / de prova","x":"Infecção intestinal + antibiótico \"não vamos aprender agora, fica para a UC15\"."},{"a":"04/09","t":"04:20","g":"Avisos gerais / de prova","x":"\"Vocês vão discutir bastante isso na tutoria\" (avaliação da desidratação) — ela não cobra a escala clínica; cobra a farmacologia."},{"a":"04/09","t":"04:34","g":"Avisos gerais / de prova","x":"\"Na abordagem farmacológica a gente dá mais ênfase à diarreia crônica (distúrbio de motilidade: SII, pós-colecistectomia). A aguda é manejo de hidratação + microbiota ± adsorvente (toxina) ± antibiótico (infecção).\""},{"a":"04/09","t":"24:41","g":"Avisos gerais / de prova","x":"\"Tudo isso que eu falei — exceto ZINCO e SRO — não tem no SUS.\" (carvão, colestiramina, policarbofila, bismuto, racecadotrila) · \"Na RENAME os probióticos são só isolados: lactobacilos, bifidobactérias e Saccharomyces (o mais barato).\""},{"a":"04/09","t":"52:49","g":"Avisos gerais / de prova","x":"Tratamento de base da DII (biológicos/imunossupressores) = 7ª fase; \"nós estudamos a base da pirâmide: aminossalicilatos\"."},{"a":"04/09","t":"05:49","g":"SP1 — Diarreia","x":"✔ \"Antidiarreicos não podem ser usados com qualquer hipótese de infecção ou intoxicação — parar o peristaltismo e deixar toxina/bactéria acumular → sepse, megacólon. Só depois de descartar.\""},{"a":"04/09","t":"06:46","g":"SP1 — Diarreia","x":"Norovírus/rotavírus 2024–26: tratamento sintomático; \"alguns médicos prescrevem nitazoxanida em casos severos — off-label, não tem protocolo\". O que TEM protocolo: zinco e SRO."},{"a":"04/09","t":"08:21","g":"SP1 — Diarreia","x":"⚠ Zinco: \"maiores de 6 meses e adultos 20 mg/dia por 10 a 20 dias — não é só o período da diarreia, começa e segue\" (slide: 10–14 dias). Mecanismo: modula resposta imune + antissecretor. A DIVE/SC recomenda vitamina A para criança pequena (já faz parte do programa de acompanhamento). \"Se for bacteriana não; sendo viral, é recomendado.\""},{"a":"04/09","t":"10:17","g":"SP1 — Diarreia","x":"✔ SRO de osmolaridade reduzida: \"o soro concentrado em sal e açúcar dava náusea e vômito\"; oferecer aos goles, contínuo, respeitando palatabilidade/temperatura. \"TRO indicada para todos os tipos de diarreia; se não conseguir, venosa.\""},{"a":"04/09","t":"11:31","g":"SP1 — Diarreia","x":"Carvão ativado: \"SC é um estado onde culturalmente se prescreve muito\"; \"1–2 comprimidos com bastante água\", \"o mesmo carvão da intoxicação por medicamentos\"; \"muito efetivo — avisar que as fezes ficam escuras\"; só intoxicação alimentar (toxina no lúmen)."},{"a":"04/09","t":"13:32","g":"SP1 — Diarreia","x":"Colestiramina \"também adsorve toxina, mas o carvão é mais barato\"; uso real = diarreia por sais biliares pós-colecistectomia. Esquema de desmame: 3–4×/dia → após 2–3 semanas 3×/dia → após 2–3 semanas 2×/dia → total 3–4 meses; \"não posso usar contínuo: sequestra vitaminas lipossolúveis e outros medicamentos\"; \"1ª linha para diarreia por sais biliares — processo de dessensibilização\". \"Se retiro e a diarreia volta…"},{"a":"04/09","t":"18:47","g":"SP1 — Diarreia","x":"Policarbofila cálcica (Muvinor): \"gelatina em pó que vai ficando grudenta\"; diarreia osmótica líquida (\"chacoalha água no toque\"), depois de descartar toxina/infecção; na diarreia não toma água extra, na constipação toma muita. \"Relativamente cara → alternativa alimentar: aveia, pectina (parte branca da laranja, maçã) — fibras solúveis gelificam igual.\""},{"a":"04/09","t":"21:47","g":"SP1 — Diarreia","x":"✔ Bismuto: diarreia do viajante (variantes de E. coli), antissecretor + antibacteriano; H. pylori; suspensão 30 mL; \"2–3 dias e as fezes ficam escuras, gosto ruim, pouca adesão\"; comprado como suplemento, automedicação, \"sem precisar de antibiótico porque é só desequilíbrio da microbiota\"."},{"a":"04/09","t":"25:00","g":"SP1 — Diarreia","x":"✔ Racecadotrila: \"inibidor das encefalinases — enzimas que degradam as encefalinas\"; receptores δ (secreção) e μ2 (motilidade); \"não posso dizer que é antimotilidade — mexe pouco em μ2; reduz água/secreção\". Uso em agudas, \"relativamente cara, diarreia muito específica\"."},{"a":"04/09","t":"29:16","g":"SP1 — Diarreia","x":"Difenoxilato: \"receita controlada, vem associado (atropina), dose excessiva → SNC; praticamente não se vê\". \"Mesmo mecanismo da loperamida; cruza a BHE, mas na dose antidiarreica a penetração é pequena\"; atropina = antiespasmódico (M3) → para diarreia com cólica."},{"a":"04/09","t":"29:41","g":"SP1 — Diarreia","x":"✔ Loperamida: \"livre, baratíssima, muita automedicação\"; \"agonista predominante de μ2\"; indicações: ansiedade/prova (\"2 comprimidos de 2 mg em dose única e passou\") e pós-colecistectomia crônica (6–7 evacuações/dia; \"alguns chegam a 3 comprimidos de Imosec\"); crônico 2–3 cp/dia conforme resposta. ✔ CI: intoxicação/infecção → sepse/megacólon."},{"a":"04/09","t":"35:02","g":"SP1 — Diarreia","x":"✔ Simeticona: \"detergente\" que rompe bolhas; neonato a geriatria; não absorvível → automedicação sem problema; \"não adianta para o gás da cirurgia por vídeo — está na cavidade, não no intestino → fisioterapia/deambular\"; adulto 100–150 mg."},{"a":"04/09","t":"38:41","g":"SP1 — Diarreia","x":"Alosetrona: \"específica para a diarreia da SII; antimotilidade específica anti-5-HT3\"."},{"a":"04/09","t":"47:43","g":"SP1 — Diarreia","x":"✔ \"Probiótico vem junto com fibra solúvel — normalmente FOS — ou pela dieta, ou prescreve o simbiótico\"; \"quanto mais espécies, mais caro: R$ 180–250 a caixa\"; eixo intestino-cérebro: AGCC usados por neurônios; disbiose × depressão."},{"a":"04/09","t":"53:12","g":"SP1 — Diarreia","x":"✔ DII: \"paciente sintomático (febre leve persistente, dor, diarreia) precisa tratar a queixa → aminossalicilatos = base da pirâmide\"; \"anti-inflamatório que fique agindo localmente — como passar pomada no braço, só que no intestino\"; \"mesalazina = 5-ASA = 5-aminossalicilato (sinônimos)\"; \"tem que estar em cápsula de liberação entérica pH-dependente: estômago pH 1–4 → íntegra\"."},{"a":"04/09","t":"58:51","g":"SP1 — Diarreia","x":"⚠ Olsalazina: \"molécula maior, pouco absorvida — ~30% absorve, o resto vai embora\" (slide: <1% nativa); azorredução → 2 mesalazinas."},{"a":"04/09","t":"62:21","g":"SP1 — Diarreia","x":"A lógica da sulfassalazina: \"infecção latente = bactéria multiplicando devagar; antibiótico normal por 7 dias só pega algumas; precisaria oferecer antibiótico todo dia por 60 dias sem dose alta → sulfassalazina (cápsula comum, mais barata que a revestida; absorve 15–20%); no cólon a azorredutase corta a ligação azo → sulfapiridina (antibiótico) + anti-inflamatório\". \"A indicação não é só DII: é DII acompanhada de…"},{"a":"04/09","t":"65:28","g":"SP1 — Diarreia","x":"Sulfassalazina contraindicada em alérgicos a sulfa (\"o pouco que absorve basta para hipersensibilidade\")."},{"a":"04/09","t":"67:58","g":"SP2 — Constipação (parte final da aula)","x":"✔ Roma IV + Bristol: \"tipo 4 é o ideal; 3 e 5 oscilam (menos água/mais fibra); 6–7 diarreia; 1–2 constipado\"; \"tenha a folha de Bristol impressa na UBS\"; \"ensinar o paciente a olhar as fezes\"."},{"a":"04/09","t":"69:17","g":"SP2 — Constipação (parte final da aula)","x":"✔ \"Na secundária não importa o que o paciente faça — voltando à paciente da dor neuropática com amitriptilina → constipação secundária → vai usar laxante, só vamos escolher o tipo.\""},{"a":"04/09","t":"71:40","g":"SP2 — Constipação (parte final da aula)","x":"✔ Dois pacientes \"quase obrigatórios\" para laxante: angina (esforço evacuatório) e plexo hemorroidário inflamado (dor → segura → fezes mais duras → ciclo)."},{"a":"04/09","t":"74:18","g":"SP2 — Constipação (parte final da aula)","x":"✔ Fibra insolúvel \"arrasta a água que já tem dentro dela\"; solúvel \"pega água do meio → garantir que beba água\"; introdução lenta e gradual (gases até a microbiota se adaptar)."},{"a":"04/09","t":"76:35","g":"SP2 — Constipação (parte final da aula)","x":"⚠ \"No bolo fecal, ~50% deveria ser bactérias mortas\" (veterana anotou ⅓)."},{"a":"04/09","t":"77:57","g":"SP2 — Constipação (parte final da aula)","x":"✔ Formadores de bolo fecal: \"para quem bebe água mas não come fruta/verdura\" — psyllium, metilcelulose, Plantago (sachês/geleia); \"exclusivamente para tratar constipação\"."},{"a":"04/09","t":"80:48","g":"SP2 — Constipação (parte final da aula)","x":"✔ Laxante osmótico = 1ª linha da constipação secundária, para angina/hemorroida, e para preparo de colonoscopia; \"única classe eficaz e segura para uso crônico\"."},{"a":"04/09","t":"82:52","g":"SP2 — Constipação (parte final da aula)","x":"✔ Lactulose: dissacarídeo não absorvido → bactérias → ácido lático + acético (osmóticos) → gases/cólica dose-dependente; começar baixo para não abandonar; cuidado na gestante (gás × contração); pode ser crônica."},{"a":"04/09","t":"86:39","g":"SP2 — Constipação (parte final da aula)","x":"✔ Osmóticos não fermentáveis (sem cólica): PEG 4000, sorbitol, macrogol — \"as pessoas têm que comprar\". Sulfato/hidróxido de magnésio: \"também laxantes, mas neutralizam o pH do estômago → rebote ácido → nunca recomendo; os idosos usam leite de magnésia — vocês vão ver na SP4\". Sachê dissolvido em água, com sabor, \"sem cólica, evacuação natural\"."},{"a":"04/09","t":"89:07","g":"SP2 — Constipação (parte final da aula)","x":"✔ \"PEG/macrogol/lactulose = os melhores para crianças, gestantes e idosos pela segurança\"; \"Muvinlax não tem dose pediátrica → manipular; lactulose tem (solução)\". Leite de magnésia/sal amargo = \"os avós conhecem\"."},{"a":"04/09","t":"90:23","g":"SP2 — Constipação (parte final da aula)","x":"Fim: \"resto na próxima aula\" (bisacodil/estimulantes, prucaloprida, lubiprostona, enemas ficaram para a próxima)."},{"a":"19/09","t":"07:23","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"Prucaloprida: indicada para quem não responde ao osmótico; estimula 5-HT4 nas fibras colinérgicas do plexo mioentérico → o vago libera acetilcolina → contração do músculo liso. Só na farmácia comercial, não tem no SUS; 1–2 mg."},{"a":"19/09","t":"09:37","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"Distribuição dos receptores: 5-HT3 e 5-HT4 são abundantes no TGI; D2 é pouco no TGI (estômago/duodeno) e mais central. Por isso o EA da prucaloprida é náusea (5-HT4 no estômago) e diarreia (efeito exagerado)."},{"a":"19/09","t":"10:48","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"Estimulantes na vida real = automedicação. Lactopulga (bisacodil) — a propaganda vende \"desintoxicar o intestino\", o que é mentira; funciona 4–5 h depois. Picossulfato de sódio = o mais usado no preparo de colonoscopia. Docusato também."},{"a":"19/09","t":"13:53","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"Mecanismo dos irritantes: ação direta na mucosa e nos receptores do músculo liso → (1) contração/peristalse e (2) irritação → processo inflamatório → secreção de muco e água (\"lavar o intestino\") → o paciente evacua, mas com cólica e diarreia aquosa — não é evacuação normal (Bristol 3–5)."},{"a":"19/09","t":"15:38","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"Indicação correta: preparo de exame e constipação aguda/pontual (viajou, ficou sem banheiro, 4 dias sem evacuar). Uso pontual, agudo, em situação determinada."},{"a":"19/09","t":"16:40","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"Dependência: o irritante esvazia TODO o cólon (o normal esvazia só o descendente) → demora muito mais para encher → na terça (4º dia) ela \"se acha constipada\" e toma de novo = ciclo vicioso."},{"a":"19/09","t":"19:15","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"Dano 1 — dessensibilização das terminações nervosas: \"elas param de responder, que é uma defesa para não morrerem\" → perde eficácia → o paciente aumenta a dose ou passa a usar todo dia."},{"a":"19/09","t":"19:57","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"Dano 2 — irritação repetida → inflamação crônica (agente lesivo presente + reparo ao mesmo tempo) → fibroblastos → epitélio de mucosa substituído por tecido fibroso → perda de função."},{"a":"19/09","t":"21:43","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"= síndrome do cólon preguiçoso: o bolo fecal toca a parede e não deflagra mais o reflexo (a terminação vagal está lá, mas não responde ao estiramento). Só acontece com os estimulantes (bisacodil, sene, cáscara-sagrada, picossulfato)."},{"a":"19/09","t":"23:13","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"Entre o ciclo vicioso e o cólon preguiçoso há uma transição de 10, 15, 20 meses — e nela aparece a melanose colônica: na colonoscopia a mucosa deixa de ser rosa e fica vermelho-amarronzada/escura (infiltrado inflamatório + tecido substituído) = processo inflamatório em curso."},{"a":"19/09","t":"24:27","g":"Fechamento da constipação — estimulantes e prucaloprida (SP2 parte 2)","x":"Não é só laxante: quem tem intolerância à lactose e faz diarreia lesiva de repetição também produz esse processo inflamatório crônico no intestino."},{"a":"19/09","t":"26:24","g":"Fisiologia da êmese — o que ela quer que você entenda antes dos fármacos","x":"O vômito é resposta de defesa: tirar do estômago a substância irritante antes de ser absorvida. Mas a substância pode já estar na circulação e deflagrar direto no SNC — daí a ação periférica não resolve."},{"a":"19/09","t":"27:20","g":"Fisiologia da êmese — o que ela quer que você entenda antes dos fármacos","x":"Zona do gatilho: resposta quase incontrolável — ver alguém vomitando ou sentir o cheiro já dispara em outra pessoa."},{"a":"19/09","t":"27:55","g":"Fisiologia da êmese — o que ela quer que você entenda antes dos fármacos","x":"A ZGQ é a mais difícil de controlar com medicamento porque recebe aferências de muitos locais e tem muitos tipos de receptor. Os antieméticos agem predominantemente sobre o centro do vômito — por isso o paciente medicado ainda pode vomitar."},{"a":"19/09","t":"29:05","g":"Fisiologia da êmese — o que ela quer que você entenda antes dos fármacos","x":"Dois mecanismos pelos quais a toxina ativa o centro do vômito: (1) ela é parecida com o neurotransmissor e age como agonista direto do receptor; (2) ela estimula o neurônio a liberar o neurotransmissor. Pode ser as duas coisas."},{"a":"19/09","t":"30:40","g":"Fisiologia da êmese — o que ela quer que você entenda antes dos fármacos","x":"Consequência prática: dependendo do que causou, é preciso 2–3 antieméticos diferentes — cada um bloqueia um tipo de receptor. No oncológico o protocolo já tem 2–4 quimioterápicos, cada um estimulando vias diferentes."},{"a":"19/09","t":"32:03","g":"Fisiologia da êmese — o que ela quer que você entenda antes dos fármacos","x":"Os neurotransmissores: serotonina (predomina 5-HT3, também 5-HT4; estômago + ZGQ + CV) · dopamina (D2) · cininas (substância P, bradicinina — liberadas pela necrose que a quimio causa e pela dor intensa) · muscarínicos e histaminérgicos (chegam pelo sistema vestibular → cerebelo → CV = cinetose/labirintite)."},{"a":"19/09","t":"36:15","g":"Fisiologia da êmese — o que ela quer que você entenda antes dos fármacos","x":"Escolha pelo fator desencadeante: \"não adianta tratar labirintite com bloqueador de 5-HT3, assim como não adianta tomar Dramin numa intoxicação alimentar\"."},{"a":"19/09","t":"37:19","g":"Fisiologia da êmese — o que ela quer que você entenda antes dos fármacos","x":"Náusea matinal da gestante é por SIALORREIA: ela produz muita saliva, engole em jejum e isso deflagra a náusea/vômito. Logo, o tratamento é o fármaco que reduz a produção de saliva."},{"a":"19/09","t":"38:19","g":"Fisiologia da êmese — o que ela quer que você entenda antes dos fármacos","x":"Não farmacológico (oncológico): não ser ele a preparar o alimento, não comer na cozinha (aroma deflagra), alimento que ele goste, frio em vez de quente, ácido, leve, menor teor de gordura."},{"a":"19/09","t":"39:34","g":"Fisiologia da êmese — o que ela quer que você entenda antes dos fármacos","x":"Gengibre: os compostos bioativos são inibidores competitivos de 5-HT3 e de neurocininas — \"fazem algo parecido com os fármacos\". Também estimula a secreção ácida (ajuda a digestão) → por isso é maléfico em gastrite/azia: acentua o problema."},{"a":"19/09","t":"41:15","g":"Antagonistas 5-HT3 — ondansetrona","x":"Ondansetrona (Vonau) é a do SUS/atenção básica: boa efetividade e extremamente segura (\"praticamente não desenvolve reação adversa grave\") → é a preferida no PS."},{"a":"19/09","t":"42:54","g":"Antagonistas 5-HT3 — ondansetrona","x":"Mecanismo por extenso: a serotonina se liga a 5-HT3/5-HT4 no nervo vago → o vago libera acetilcolina → receptores muscarínicos no músculo liso → peristalse/purgação. Bloquear 5-HT3 reduz essa excitabilidade."},{"a":"19/09","t":"44:06","g":"Antagonistas 5-HT3 — ondansetrona","x":"Por que o esvaziamento gástrico muda pouco: a densidade de 5-HT3/5-HT4 é maior no intestino que no estômago. É daí que vem o EA constipação — relevante no oncológico de uso diário (a alosetrona na SII com diarreia usa justamente esse efeito)."},{"a":"19/09","t":"46:26","g":"Antagonistas 5-HT3 — ondansetrona","x":"Dose: 4 ou 8 mg VO/SL, 8/8 h ou 12/12 h (salvo exceções, intervalo menor)."},{"a":"19/09","t":"46:48","g":"Antagonistas 5-HT3 — ondansetrona","x":"Apresentações: comprimido (quase ninguém usa), sublingual (segurar 20 s debaixo da língua) e o filme orodispersível — \"a sensação entre as mães\", porque funciona mesmo com a criança chorando e vomitando; IV no hospital."},{"a":"19/09","t":"48:41","g":"Antagonistas 5-HT3 — ondansetrona","x":"Farmacocinética: o alimento até ajuda a absorção; meia-vida muito variável por polimorfismo (por isso às vezes 8/8 h, às vezes 6/6 h); metabolismo hepático, excreção renal e predominantemente biliar."},{"a":"19/09","t":"48:23","g":"Antagonistas 5-HT3 — ondansetrona","x":"Granisetrona, dolasetrona, palonosetrona: IV, só em clínica oncológica; a vantagem deles é a posologia. A ondansetrona é mais barata e é a que se usa."},{"a":"19/09","t":"50:04","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Os três do Brasil: metoclopramida (Plasil), bromoprida (Digesan/Plamet) e domperidona (Motilium)."},{"a":"19/09","t":"50:29","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Metoclopramida e bromoprida agem central e perifericamente; a domperidona tem baixa penetração no SNC → praticamente não age no centro do vômito."},{"a":"19/09","t":"51:50","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Pegadinha do livro: a domperidona é listada como antiemética — mas para qual vômito? Só serve se a substância ainda está no estômago (irritação local). \"Na prática clínica vocês não vão ver médico prescrevendo domperidona para vômito — vão ver para DRGE.\""},{"a":"19/09","t":"53:47","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"A dopamina é o FREIO do nervo vago — o oposto da serotonina. D2 no vago → o vago relaxa e não libera acetilcolina → menos movimento. Bloquear D2 = tirar o freio → ↑peristalse → esvaziamento gástrico = efeito pró-cinético."},{"a":"19/09","t":"55:15","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Interação medicamentosa: o pró-cinético acelera estômago e duodeno, que é onde se absorve → reduz a absorção de alimentos e de fármacos (nas 6–7 h de efeito). Os laxantes estimulantes NÃO fazem isso — agem no cólon, então não reduzem a eficácia de um anticoncepcional."},{"a":"19/09","t":"56:52","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Além de D2, fazem antagonismo 5-HT3 expressivo (o agonismo 5-HT4 é pouco relevante) → são inegavelmente mais eficazes que a ondansetrona no vômito por toxina, quimioterapia, medicamento e pós-cirúrgico. Por isso o hospital prefere: mais eficácia, mais barato, risco controlável e com antídoto."},{"a":"19/09","t":"58:17","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"SEP, mecanismo completo: os D2 estão por todo o cérebro; na área nigroestriatal saem as fibras colinérgicas para as placas motoras, freadas pela dopamina. Bloquear D2 → as fibras colinérgicas ficam superestimuladas → ACh nos receptores nicotínicos neuromusculares → espasmos."},{"a":"19/09","t":"60:06","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Pode evoluir para parkinsonismo medicamentoso (rigidez, para de fazer movimento, fica numa posição única) — mesmo mecanismo dos antipsicóticos (UC16, próximo semestre)."},{"a":"19/09","t":"60:49","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Como o paciente conta: \"doutor, eu tenho alergia ao Plasil\" — mas não teve urticária: \"parecia que eu ia me arrepiar, não conseguia ficar quieto, faltava ar, dava vontade de sair correndo, sensação de que ia morrer\" = acatisia."},{"a":"19/09","t":"61:32","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Sinal de alerta que exige antídoto: torcicolo (o pescoço cai para o lado) + crise oculógira (os olhos ficam revirando) → biperideno, anticolinérgico de ação central."},{"a":"19/09","t":"64:25","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"O risco de SEP é disparadamente maior por via INTRAVENOSA (muita droga no SNC em pouco tempo); IM também é rápido; VO sobe lentamente e é bem menos significativo. Quem já usou antes sem SEP dificilmente vai desenvolver."},{"a":"19/09","t":"65:04","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Servem para quase todos os tipos de vômito — exceto distúrbios de movimento/cinetose. Doses: 10 mg (comprimido) e as formas injetáveis."},{"a":"19/09","t":"65:33","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Domperidona = DRGE, dois públicos: (1) RN de 2–3 meses com DRGE — o esfíncter amadurece com o crescimento, mas até lá é preciso esvaziar o estômago rápido para diminuir a pressão sobre ele (solução 2–3×/dia, tratamento até 3–6–9 meses, às vezes quase 1 ano); (2) adulto na agudização (comeu demais, estresse, bebida gasosa)."},{"a":"19/09","t":"68:19","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Na DRGE o risco grave é a broncoaspiração ao deitar — \"inclusive de morte\". Quem tem a doença precisa respeitar 2–3 h entre comer e deitar; no dia em que jantou às 21 h e vai deitar às 22 h, a domperidona resolve. O tratamento de base é o IBP (aula que vem)."},{"a":"19/09","t":"69:21","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"Galactorreia: a dopamina do hipotálamo inibe a adeno-hipófise; a adeno-hipófise não é protegida pela BHE → a domperidona chega lá → ↑prolactina → ginecomastia e galactorreia; em bebê em uso contínuo aparece \"brotinho\" mamário."},{"a":"19/09","t":"71:16","g":"Antagonistas D2 — metoclopramida, bromoprida e domperidona","x":"O mesmo efeito vira recurso terapêutico: lactante que reduziu a produção de leite — \"com dois, três dias a mama já enche\"."},{"a":"19/09","t":"73:04","g":"Anti-H1 e antimuscarínicos","x":"Como as pessoas compram: hidroxizina → alergia · cinarizina → crise de labirintite · dimenidrinato (Dramin) → enjoo de viagem (e muita gente usa só para dormir)."},{"a":"19/09","t":"73:46","g":"Anti-H1 e antimuscarínicos","x":"Todos são anti-histamínicos de 1ª geração: bloqueiam H1 central (por isso o sono) e receptores muscarínicos."},{"a":"19/09","t":"75:26","g":"Anti-H1 e antimuscarínicos","x":"O fecho da gestante: os muscarínicos também estão na glândula salivar — por isso a prescrição é dimenidrinato ao deitar: \"ela vai acordar de boca seca\", sem a sialorreia que causava a náusea matinal."},{"a":"19/09","t":"76:26","g":"Anti-H1 e antimuscarínicos","x":"Terminologia que ela cobra: na hora de escrever o mecanismo, escreva antimuscarínico — \"anticolinérgico\" é generalizar, porque inclui os receptores nicotínicos, que não estão envolvidos aqui."},{"a":"19/09","t":"77:09","g":"Anti-H1 e antimuscarínicos","x":"EA: sonolência, boca seca, constipação, retenção urinária. Dramin: 25, 50 e 100 mg."},{"a":"19/09","t":"78:03","g":"Anti-H1 e antimuscarínicos","x":"Meclizina e buclizina são vendidas nas farmácias para criança que não come (o bloqueio H1 aumenta o apetite)."},{"a":"19/09","t":"78:27","g":"Anti-H1 e antimuscarínicos","x":"2ª geração (loratadina, desloratadina, fexofenadina, cetirizina) não atravessa a BHE → não tem efeito antiemético e não causa sedação. É essa a diferença entre 1ª e 2ª geração."},{"a":"19/09","t":"78:57","g":"Anti-H1 e antimuscarínicos","x":"Antimuscarínicos (escopolamina/hioscina, hiosciamina, homatropina — as três substâncias do Brasil): quase não permeiam a BHE → maus antieméticos; na prática são antiespasmódicos — cólica renal, uterina, intestinal e de vesícula. Seletivos para M3: \"se bloqueasse M2 daria parada cardíaca\"."},{"a":"19/09","t":"81:19","g":"NK1, canabinoides, corticoide e benzodiazepínico (protocolo da quimio)","x":"Aprepitanto: uso exclusivamente hospitalar / clínica oncológica, intravenoso; bloqueia receptores de neurocininas (substância P), liberadas pela morte celular induzida pela quimioterapia."},{"a":"19/09","t":"82:50","g":"NK1, canabinoides, corticoide e benzodiazepínico (protocolo da quimio)","x":"Todo paciente em quimioterapia usa no mínimo uma ondansetrona — o aprepitanto é acrescentado, não substitui."},{"a":"19/09","t":"83:19","g":"NK1, canabinoides, corticoide e benzodiazepínico (protocolo da quimio)","x":"Canabinoides (nabilona, dronabinol): liberados no Brasil só em janeiro deste ano — antes as pessoas entravam na justiça para importar. Agonistas CB1, e além do antiemético estimulam o apetite → oncológico e caquexia grave (AIDS). Ainda caros e sem protocolo firmado."},{"a":"19/09","t":"85:50","g":"NK1, canabinoides, corticoide e benzodiazepínico (protocolo da quimio)","x":"Dexametasona entra em praticamente todo protocolo antiemético (↓ a resposta inflamatória da morte celular): dose mínima 4 mg, faixa 4–20 mg. O aprepitanto IV fica na clínica (2–3 dias de quimio) e a dexametasona continua em casa."},{"a":"19/09","t":"86:42","g":"NK1, canabinoides, corticoide e benzodiazepínico (protocolo da quimio)","x":"Lorazepam/alprazolam para a náusea e vômito antecipatórios: a partir do 2º ciclo o paciente vomita só de chegar — às vezes ainda na hidratação, por ansiedade. O benzodiazepínico entra nos dias que antecedem a quimio."},{"a":"19/09","t":"88:23","g":"NK1, canabinoides, corticoide e benzodiazepínico (protocolo da quimio)","x":"O médico monta o protocolo pela tabela de risco emetogênico do esquema — ex.: doxorrubicina + ciclofosfamida = alto risco → \"o protocolo tem que ser com tais e tais medicamentos\"."},{"a":"19/09","t":"89:45","g":"Hepatoprotetores, enzimas pancreáticas e coleréticos","x":"Ácido ursodesoxicólico: semelhante aos ácidos biliares que nós produzimos. Papel: dissolver os cálculos da vesícula, desobstruir e ↓ a secreção de colesterol para a bile — \"é o excesso de colesterol com cálcio que precipita e forma o cálculo\"."},{"a":"19/09","t":"90:28","g":"Hepatoprotetores, enzimas pancreáticas e coleréticos","x":"Para quem: paciente com cálculos iniciais vistos no ultrassom e, principalmente, quem não pode operar naquele momento (ex.: precisa resolver antes uma complicação cardíaca). \"Vocês vão prescrever bem pouco, mas precisam saber que existe.\""},{"a":"19/09","t":"91:46","g":"Hepatoprotetores, enzimas pancreáticas e coleréticos","x":"Silimarina / cardo mariano: indicação exclusiva = esteatose hepática. \"Vivemos quase uma epidemia de esteatose em jovens — não estamos falando de idoso nem de alcoolista — grau 1, grau 2, por questões alimentares, que já precisam de intervenção medicamentosa.\""},{"a":"19/09","t":"92:39","g":"Hepatoprotetores, enzimas pancreáticas e coleréticos","x":"Silimarina é o nome do conjunto de substâncias extraídas do cardo mariano (alguns laboratórios isolam esse conjunto). Prescrever \"cardo mariano\" ou \"silimarina\" dá no mesmo — as substâncias ativas são as mesmas: antioxidantes e anti-inflamatórias, que ↓ a peroxidação do colesterol e dos ácidos graxos para o fígado se recuperar."},{"a":"19/09","t":"93:47","g":"Hepatoprotetores, enzimas pancreáticas e coleréticos","x":"Posologia: 2 a 3 vezes ao dia, chegando a 280–420 mg/dia (calculado pelas substâncias ativas). Sempre junto de dieta e zero álcool; a esteatose também pode ser consequência de hepatite."},{"a":"19/09","t":"94:54","g":"Hepatoprotetores, enzimas pancreáticas e coleréticos","x":"Pancreatina: o cenário típico é o paciente se recuperando de pancreatite aguda desencadeada pela obstrução por cálculo — está em dieta severa, mas ainda precisa digerir, e o pâncreas está se recuperando. Solução: cápsula a cada refeição com as três classes de enzimas (lipase, amilase, protease). Também no câncer/ressecção da porção exócrina."},{"a":"19/09","t":"96:24","g":"Hepatoprotetores, enzimas pancreáticas e coleréticos","x":"\"Só um detalhe, que eu sei que vai ser cobrado\": a dose das enzimas não é em miligramas — é em unidades (UI ou unidades USP). É uma forma diferente de fazer o cálculo."},{"a":"19/09","t":"96:49","g":"Hepatoprotetores, enzimas pancreáticas e coleréticos","x":"Coleréticos e colagogos: alcaloides amargos (característica organoléptica) que estimulam a produção e principalmente a secreção de sais biliares. O mais famoso é a boldina (boldo). \"Muito difícil de ser prescrito, mas muito usado como automedicação\" — para \"comi uma coisa gordurosa e estou enjoado\"; \"tem uma resposta bem boa\"."},{"a":"19/09","t":"98:26","g":"Hepatoprotetores, enzimas pancreáticas e coleréticos","x":"Próxima aula: tratamento da dispepsia / doença ácido-péptica (SP4 — IBP e companhia)."}]};</script>
<script>
(function(){
"use strict";
var U=window.UC14, D=U.drugs, Q=U.qs, R=U.res, X=window.EXPL||{}, EX=window.EXTRA||{};
var VIAS=EX.vias||[], PEG=EX.pegadinhas||[], FAM=EX.familias||[], FMT=EX.formato||[],
    DIV=EX.divergencias||[], AULAS=EX.aulas||[], KPI=EX.kpi||[];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rich(s){return esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>")
  .replace(/&lt;i&gt;/g,"<i>").replace(/&lt;\/i&gt;/g,"</i>")}
var SPS=[{k:"SP1",n:"Diarreia / DII"},{k:"SP2",n:"Constipação"},{k:"SP3",n:"Antieméticos / Hepato"},{k:"SP4",n:"Dispepsia"}];
function spc(k){return "var(--"+k.toLowerCase()+")"}
function susK(s){s=(s||"").toLowerCase();return /(^|\s)(sim|rename|tem)/.test(s)?"y":/n[ãa]o/.test(s)?"n":"u"}
function susT(s){var k=susK(s);return k==="y"?"SUS ✓":k==="n"?"SUS ✗":"SUS ?"}
function bn(n){return n.replace(/\(.*?\)/g,"").replace(/[®™]/g,"").split(/[\/,;]/)[0].trim()}
function cut(t,n){t=(t||"").trim();if(t.length<=n)return t;
  var c=t.slice(0,n), k=Math.max(c.lastIndexOf("; "),c.lastIndexOf(", "),c.lastIndexOf(" ("));
  return (k>n*0.55?c.slice(0,k):c.replace(/\s+\S*$/,""))+"…"}
function dT(d){return d.cls?d.cls:bn(d.n)}
function dS(d){var t=dT(d);if(d.cls)return d.n;return d.n!==t?d.n.replace(t,"").replace(/^[\s,]+/,""):""}
function dK(d){return (d.cls+" "+d.n).toLowerCase().replace(/[()®™]/g," ").split(/[\s,;\/]+/)
  .filter(function(w){return w.length>4})}

/* quantas vezes cada fármaco já caiu nas provas dela */
D.forEach(function(d){
  var ks=dK(d);
  d._q=Q.filter(function(q){var h=(q.tema+" "+q.enun+" "+q.why).toLowerCase();
    return ks.some(function(w){return h.indexOf(w)>-1})});
  d._c=d._q.length;
  var best=null,bn=0;
  VIAS.forEach(function(v){
    if(v.sp!==d.spk)return;
    var n=ks.filter(function(w){return v.hay.indexOf(w)>-1}).length;
    if(n>bn){bn=n;best=v}
  });
  d._via=best;
  d._fala=AULAS.filter(function(f){var h=f.x.toLowerCase();

      '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" '+
      'style="color:var(--ink3)"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg>'+
      '<input id="pqi" type="search" placeholder="filtrar pegadinha…" value="'+esc(S.pq)+'"></div>'+
      '<span class="tnote">'+pgs.length+' de '+PEG.length+'</span></div>'+
    (pgs.length?pgs.map(function(x){return '<div class="pg"><div class="pgp">✗ '+esc(x.p)+'</div>'+
      '<div class="pgv">'+esc(x.v)+'</div>'+(x.e?'<div class="pge">'+esc(x.e)+'</div>':'')+'</div>'}).join("")
      :'<p class="empty"><b>Nada com esse termo.</b></p>')+'</section>'+

  '<section class="psec" id="pv5"><h3>Divergências</h3>'+
    '<p class="psub">Onde a fonte briga com a fonte — e como tratar isso no estudo, em vez de fingir que não existe.</p>'+
    DIV.map(function(d){return '<div class="dv"><b>'+esc(d.onde)+'</b><p>'+esc(d.prob)+'</p>'+
      (d.como?'<p>→ '+esc(d.como)+'</p>':'')+'</div>'}).join("")+'</section>'+

  '<section class="psec" id="pv6"><h3>Frases-lei das aulas</h3>'+
    '<p class="psub">'+AULAS.length+' falas verificadas nas gravações, com o minuto. O que ela diz em aula e não está no slide é onde mora a pegadinha.</p>'+
    '<div class="tools"><div class="seg">'+
      ["todas","04/09","19/09"].map(function(a){return '<button data-a="'+a+'" aria-pressed="'+(S.aula===a)+'">'+
        (a==="todas"?"As duas aulas":a)+' ('+(a==="todas"?AULAS.length:AULAS.filter(function(f){return f.a===a}).length)+')</button>'}).join("")+
      '</div></div>'+frHtml+'</section>';

  var pi=document.getElementById("pqi");
  if(pi)pi.oninput=function(){S.pq=pi.value;var sc=p.scrollTop;pProva(p);p.scrollTop=sc;
    var n=document.getElementById("pqi");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
  p.querySelectorAll(".seg button[data-a]").forEach(function(b){b.onclick=function(){
    S.aula=b.dataset.a;var sc=p.scrollTop;pProva(p);p.scrollTop=sc}});
  p.onscroll=function(){var top=p.scrollTop+56,best=0;
    PSECS.forEach(function(x,i){var n=document.getElementById(x[0]);if(n&&n.offsetTop<=top)best=i});
    if(best!==S.psec){S.psec=best;ctxProva()}};
  ctxProva();
}
function ctxProva(){
  var W=pesosSP();
  var counts=[KPI.length,W.length,FMT.length,FAM.length,PEG.length,DIV.length,AULAS.length];
  cset('<p class="cl">O raio-X da prova</p>'+
    '<div class="cbox" style="padding:6px 4px">'+PSECS.map(function(x,i){
      return '<button class="cidx'+(i===S.psec?" on":"")+'" data-g="'+x[0]+'"><span>'+esc(x[1])+
      '</span><em>'+counts[i]+'</em></button>'}).join("")+'</div>'+
    '<div class="trap"><b>Como usar</b>Leia o veredito e o peso por SP antes de abrir qualquer resumo — decide onde vale gastar o fim de semana. O radar de pegadinhas é a última leitura na véspera.</div>');
  document.getElementById("ctx").querySelectorAll(".cidx").forEach(function(b){
    b.onclick=function(){var n=document.getElementById(b.dataset.g), p=document.getElementById("pane");
      if(n)p.scrollTop=n.offsetTop-8}});
}

/* ---- ÍNDICE DO RESUMO (painel direito) ---- */
function ctxIndex(items){
  var multi=items.some(function(x){return x.k!==items[0].k}), last="", h='<p class="cl">Neste resumo</p><div class="cbox toc" style="padding:6px 4px">';
  items.forEach(function(x,i){
    if(multi&&x.k!==last){last=x.k;
      var sn=(SPS.filter(function(s){return s.k===x.k})[0]||{}).n||"";
      h+='<p class="cgrp"><span class="dot" style="background:'+spc(x.k)+'"></span>'+x.k+' · '+esc(sn)+'</p>'}
    h+='<button class="cidx'+(i===0?" on":"")+'" data-i="'+i+'">'+esc(x.h.replace(/^\d+\.\s*/,""))+'</button>';
  });
  cset(h+'</div>');
  var ctx=document.getElementById("ctx");
  ctx.querySelectorAll(".cidx").forEach(function(b){b.onclick=function(){
    var n=document.getElementById(items[+b.dataset.i].id), p=document.getElementById("pane");
    if(n)p.scrollTop=n.offsetTop-8}});
}
function ctxIndexOn(i){
  var ctx=document.getElementById("ctx"), bs=ctx.querySelectorAll(".toc .cidx");
  bs.forEach(function(b,k){b.classList.toggle("on",k===i)});
  var el=bs[i]; if(!el)return;
  var r=el.getBoundingClientRect(), c=ctx.getBoundingClientRect();
  if(r.top<c.top+48)ctx.scrollTop-=(c.top+48-r.top);
  else if(r.bottom>c.bottom-24)ctx.scrollTop+=(r.bottom-(c.bottom-24));
}

/* ---- CONTEXTO ---- */
function cset(h){document.getElementById("ctx").innerHTML=h}
function ctxEmpty(){cset('<p class="cl">Contexto</p><p class="empty"><b>Nada selecionado.</b></p>')}
function miniList(ds){return ds.slice(0,5).map(function(d){var i=D.indexOf(d);
  return '<button class="mini" data-d="'+i+'"><span class="dot" style="background:'+spc(d.spk)+'"></span>'+
  '<span><span class="mn">'+esc(dT(d))+'</span><span class="md">'+esc(d.dose||d.mec||"—")+'</span></span></button>'}).join("")}
function wireMini(){document.getElementById("ctx").querySelectorAll(".mini").forEach(function(b){
  b.onclick=function(){var d=D[+b.dataset.d];S.sp=d.spk;S.mode="farmacos";S.view="tabela";S.open=d.n;
    rail();modes();pane()}})}
function ctxRank(){
  var L=dr().filter(function(d){return d._c>0}).sort(function(a,b){return b._c-a._c}).slice(0,7);
  var mx=L.length?L[0]._c:1, all=dr();
  var y=all.filter(function(d){return susK(d.sus)==="y"}).length,
      n=all.filter(function(d){return susK(d.sus)==="n"}).length, tot=all.length||1;
  cset('<p class="cl">O que ela mais cobra</p>'+
    (L.length?'<div class="cbox"><h4>Aparições nas provas dela <em>'+
      all.reduce(function(a,d){return a+d._c},0)+'</em></h4>'+
      L.map(function(d){var i=D.indexOf(d);
        return '<button class="rank" data-d="'+i+'"><span class="rt">'+esc(dT(d))+'</span>'+
        '<span class="track"><i style="width:'+Math.round(d._c/mx*100)+'%"></i></span>'+
        '<span class="rn">'+d._c+'×</span></button>'}).join("")+
      '</div>':'<p class="empty"><b>Sem histórico nesta seleção.</b></p>')+
    '<div class="cbox"><h4>Acesso no SUS <em>'+tot+'</em></h4>'+
      '<div class="rank" style="cursor:default"><span class="rt">tem</span><span class="track">'+
        '<i style="width:'+Math.round(y/tot*100)+'%;background:var(--ok)"></i></span><span class="rn">'+y+'</span></div>'+
      '<div class="rank" style="cursor:default"><span class="rt">não tem</span><span class="track">'+
        '<i style="width:'+Math.round(n/tot*100)+'%;background:var(--no)"></i></span><span class="rn">'+n+'</span></div>'+
      '<div class="rank" style="cursor:default;border-bottom:0"><span class="rt">não consta</span><span class="track">'+
        '<i style="width:'+Math.round((tot-y-n)/tot*100)+'%;background:var(--ink3)"></i></span>'+
        '<span class="rn">'+(tot-y-n)+'</span></div></div>'+
    '<div class="trap"><b>O eixo dela</b>eficácia + segurança + ACESSO. Na dúvida entre duas alternativas certas, a que existe na atenção básica costuma ser a resposta.</div>');
  document.getElementById("ctx").querySelectorAll(".rank[data-d]").forEach(function(b){
    b.onclick=function(){var d=D[+b.dataset.d];S.view="tabela";S.open=d.n;pane()}});
}
function ctxScore(last){
  var L=qr(), done=L.filter(function(q){return S.ans[q.id]!=null});
  var ok=done.filter(function(q){return S.ans[q.id]===q.ans}).length, err=done.length-ok;
  var byT={};done.forEach(function(q){if(S.ans[q.id]!==q.ans)byT[q.tema]=(byT[q.tema]||0)+1});
  var ks=Object.keys(byT).sort(function(a,b){return byT[b]-byT[a]}).slice(0,6), mx=ks.length?byT[ks[0]]:1;
  cset('<p class="cl">Seu desempenho</p>'+
    '<div class="score"><div class="sc g"><b>'+ok+'</b><span>acertos</span></div>'+
    '<div class="sc r"><b>'+err+'</b><span>erros</span></div>'+
    '<div class="sc"><b>'+(done.length?Math.round(ok/done.length*100):0)+'%</b><span>de '+done.length+'</span></div></div>'+
    (ks.length?'<div class="cbox"><h4>Erros por tema <em>'+err+'</em></h4>'+
      ks.map(function(k){return '<div class="rank" style="cursor:default"><span class="rt">'+esc(k)+'</span>'+
      '<span class="track err"><i style="width:'+Math.round(byT[k]/mx*100)+'%"></i></span>'+
      '<span class="rn">'+byT[k]+'</span></div>'}).join("")+'</div>'
     :'<p class="empty"><b>Responda pra alimentar isto.</b>Cada erro entra aqui agrupado por tema — o seu registro por família, automático.</p>')+
    (last&&S.ans[last.id]!==last.ans?'<div class="trap"><b>Acabou de errar</b>'+esc(last.tema)+' — '+esc(last.why)+'</div>':''));
}
rail();modes();pane();
})();
</script>
