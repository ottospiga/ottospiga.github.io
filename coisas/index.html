<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coisas · Otto Spigariol</title>
  <style>
    :root{
      --bg:#0f1720; --card:#161f2b; --line:#2a3a4d;
      --ink:#e8eef5; --mut:#9fb2c6; --tealo:#12d3b0; --blue:#4c8dff;
      --shadow:0 6px 24px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      padding:24px; display:flex; justify-content:center;
    }
    main{width:100%; max-width:680px}
    nav{margin-bottom:22px; font-size:14px}
    nav a{color:var(--blue); text-decoration:none}
    nav a:hover{text-decoration:underline}
    .kicker{color:var(--blue); font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
    h1{font-size:clamp(26px,6vw,36px); margin:6px 0 22px}
    .cards{display:grid; gap:14px}
    .card{
      display:block; background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:18px 20px; text-decoration:none; color:var(--ink); box-shadow:var(--shadow);
      transition:transform .12s ease, border-color .12s ease;
    }
    .card:hover{transform:translateY(-2px); border-color:var(--mut)}
    .card h2{font-size:19px; margin-bottom:4px}
    .card p{color:var(--mut); font-size:14px; line-height:1.5}
    .abrir{color:var(--tealo); font-weight:600; font-size:14px; margin-top:10px; display:inline-block}
  </style>
</head>
<body>
  <script>
    // porteira simples: segura curioso, não é segurança de verdade
    (function () {
      var SENHA = atob('cGx1dG9uaW8zMjE=');
      var ok = false;
      try { ok = sessionStorage.getItem('coisas-ok') === '1'; } catch (e) {}
      if (!ok) {
        var s = null;
        try { s = prompt('Senha:'); } catch (e) {}
        if (s === SENHA) {
          try { sessionStorage.setItem('coisas-ok', '1'); } catch (e) {}
        } else {
          if (s !== null) alert('Senha incorreta.');
          document.documentElement.style.visibility = 'hidden';
          location.replace('../index.html');
        }
      }
    })();
  </script>
  <main>
    <nav><a href="../index.html">← Início</a></nav>
    <p class="kicker">ottospiga.github.io</p>
    <h1>Coisas</h1>
    <div class="cards">
      <a class="card" href="cv/index.html">
        <h2>Currículo (CV)</h2>
        <p>Curriculum Vitae — página original.</p>
        <span class="abrir">abrir →</span>
      </a>
    </div>
  </main>
</body>
</html>
