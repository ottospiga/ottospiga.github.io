<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otto Spigariol</title>
  <style>
    :root{
      --bg:#0f1720; --card:#161f2b; --line:#2a3a4d;
      --ink:#e8eef5; --mut:#9fb2c6; --tealo:#12d3b0; --blue:#4c8dff;
      --shadow:0 6px 24px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    }
    main{width:100%; max-width:680px}
    .kicker{color:var(--tealo); font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
    h1{font-size:clamp(28px,6vw,40px); margin:6px 0 28px}
    .doors{display:grid; gap:16px}
    @media(min-width:560px){.doors{grid-template-columns:1fr 1fr}}
    .door{
      display:block; background:var(--card); border:1px solid var(--line); border-radius:16px;
      padding:26px 22px; text-decoration:none; color:var(--ink); box-shadow:var(--shadow);
      transition:transform .12s ease, border-color .12s ease;
    }
    .door:hover{transform:translateY(-2px); border-color:var(--mut)}
    .door:hover .arrow{transform:translateX(4px)}
    .door.coisas{border-top:3px solid var(--blue)}
    .door.medicina{border-top:3px solid var(--tealo)}
    .door h2{font-size:24px; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:10px}
    .arrow{color:var(--mut); transition:transform .12s ease}
    .door p{color:var(--mut); font-size:14px; line-height:1.5}
  </style>
</head>
<body>
  <main>
    <p class="kicker">ottospiga.github.io</p>
    <h1>Otto Spigariol</h1>
    <nav class="doors">
      <a class="door coisas" href="coisas/index.html">
        <h2>Coisas <span class="arrow">→</span></h2>
        <p>Currículo (CV) e afins.</p>
      </a>
      <a class="door medicina" href="medicina/index.html">
        <h2>Medicina <span class="arrow">→</span></h2>
        <p>Guias de estudo · UNIFEBE · 5º período.</p>
      </a>
    </nav>
  </main>
</body>
</html>
